      a_fixed: 1
      allow_negative: true
      sol_hi: 9
      b_hi: 9
    target_s: 6
    limit_s: 15
misconceptions:
- id: wrong-inverse
  description: Multiplying when division is required, or vice versa.
- id: one-side-only
  description: Applying the inverse operation to only one side of the equation.
- id: rejects-negative-solution
  description: Assuming a negative solution must be wrong.
- id: premature-rounding
  description: Rounding a fractional or decimal answer before finishing.
- id: divided-instead-of-multiplied
  description: Dividing by the coefficient under x/a instead of multiplying both sides by it, the
    opposite undo-operation from every other one-step shape.
