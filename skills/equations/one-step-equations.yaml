id: one-step-equations
name: Solve one-step linear equations
domain: equations
description: Solve equations that need a single inverse operation, with integer, signed, fractional or
  decimal coefficients.
status: active
prerequisites:
- arithmetic-properties
- integer-arithmetic
- fraction-arithmetic
- decimal-arithmetic
answer: number
sources:
- topic: linear_equation
  params:
    a_fixed: 1
  difficulty: easy
  stages:
  - 0
  - 1
  - 2
- topic: linear_equation
  params:
    b_zero: true
  difficulty: easy
  stages:
  - 0
  - 1
  - 2
- topic: linear_equation
  params:
    allow_negative: true
  difficulty: medium
  stages:
  - 3
  - 4
- topic: linear_equation
  params:
    kind: division_form
    allow_negative: true
    coef_hi: 15
    sol_hi: 15
  difficulty: hard
  stages:
  - 5
  - 6
  - maintenance
mental:
  levels:
  - topic: linear_equation
    params:
      a_fixed: 1
      sol_hi: 9
      b_hi: 9
    target_s: 4
    limit_s: 10
  - topic: linear_equation
    params:
      b_zero: true
      coef_hi: 9
      sol_hi: 9
    target_s: 5
    limit_s: 12
  - topic: linear_equation
