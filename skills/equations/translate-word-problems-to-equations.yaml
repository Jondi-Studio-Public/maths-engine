id: translate-word-problems-to-equations
name: Translate word problems into equations
domain: equations
description: Represent a relationship in a short story as the left-hand side of a linear equation in one variable,
  with the total already on the right. Easy is one step (a rate, a gain, a loss or a share). Medium is two steps
  (a fixed charge plus a rate, a rate less a voucher, or a share less an amount). Hard writes a second quantity
  in terms of the first, so a bracket or a repeated variable is needed.
status: active
placement_eligible: false
prerequisites:
- define-variables
- write-expressions-from-words
- variable-concept
answer: expression
