id: meaning-of-equality
name: Understand equality as a relationship
domain: equations
year_level:
- '7'
- '8'
description: 'Interpret the equals sign as a statement that two expressions have the same value: decide whether a number
  sentence is true, find the missing number that balances it, and say what keeps a balance true.'
