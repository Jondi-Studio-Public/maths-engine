misconceptions:
- id: misconception-1
  description: Reporting the variable value without interpreting it
- id: misconception-2
  description: Accepting a mathematically valid but contextually impossible value
- id: misconception-3
  description: Undoing a bracketed "increased by, then multiplied by" word problem
    in the same order it was built (dividing, then adding the increase back)
    instead of the reverse order the bracket requires (dividing first, then
    subtracting)
