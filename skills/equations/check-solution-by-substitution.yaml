id: check-solution-by-substitution
name: Check equation solutions by substitution
domain: equations
year_level:
- '7'
- '8'
description: Verify a proposed solution by substituting it into the original equation, working out each side correctly,
  including negative values and brackets, and drawing the right conclusion.
status: active
placement_eligible: false
prerequisites:
- solution-and-solution-set
- apply-a-rule-to-inputs
answer: mcq
