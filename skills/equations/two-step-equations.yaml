misconceptions:
- id: misconception-1
  description: Undoing operations in the wrong structural order
- id: misconception-2
  description: Combining unrelated terms across the equals sign
- id: divided-instead-of-multiplied-final-step
  description: Dividing by the coefficient under x/a instead of multiplying both sides by it at the
    final step, the opposite undo-operation from the standard a*x + b = c shape.
- id: added-instead-of-subtracted-first-step
  description: Adding the constant term instead of subtracting it as the first step of a two-step
    equation, a sign error before the second (multiply/divide) step is even reached.
