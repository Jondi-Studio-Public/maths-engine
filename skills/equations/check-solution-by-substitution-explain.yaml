misconceptions:
- id: checks-by-solving-again
  description: Checks an answer by repeating the same working instead of substituting into the original equation.
- id: substitutes-into-one-side-only
  description: Substitutes into one side and never compares it with the other.
- id: subtracts-where-addition-needed
  description: Subtracts a term from both sides where it should be added when undoing a subtraction.
