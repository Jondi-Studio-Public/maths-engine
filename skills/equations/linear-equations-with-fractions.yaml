misconceptions:
- id: multiply-one-side-by-lcd
  description: Clears the denominator on one term or one side of the equation but forgets to multiply the other term/side by the same factor.
- id: added-denominators
  description: Treats x/p + x/q as x/(p + q) (or x/p - x/q as x/(p - q)), combining the denominators instead of finding a common denominator.
- id: mishandled-binomial-numerator
  description: When the numerator is a binomial, drops or mis-signs the constant term while clearing the denominator, or forgets that term is also divided by the denominator.
