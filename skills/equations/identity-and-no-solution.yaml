id: identity-and-no-solution
name: Recognise identities and equations with no solution
domain: equations
year_level:
- '8'
description: Decide whether an equation has exactly one solution, no solution or every number as a solution, from the form
  it simplifies to or from the way its sides are built.
status: active
placement_eligible: false
prerequisites:
- variables-on-both-sides
- recognise-equivalent-expressions
answer: mcq
