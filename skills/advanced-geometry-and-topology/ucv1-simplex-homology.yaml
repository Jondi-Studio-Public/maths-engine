misconceptions:
- id: drops-b0
  description: Reports 0 for b0 (the number of connected components), forgetting that a nonempty complex always has at least one connected component.
- id: off_by_one_b1
  description: Reports b1 one too high or one too low, from an arithmetic slip in (edges - rank(d1)) - rank(d2) rather than recomputing the ranks.
- id: thinks_a_face_creates_a_2_dim_hole
  description: Reports b2 = 1 (or b1 unreduced) for the filled triangle, treating the single 2-face as if it were a hollow shell rather than a filled-in disc, missing that the face's boundary exactly kills the 1-dimensional cycle.
- id: miscounts_components_from_the_matrix
  description: On the matrix tiers, misreads rank(d1) from the relabelled or reoriented matrix (rather than actually computing it), producing a b0 that does not match the true number of connected components.
