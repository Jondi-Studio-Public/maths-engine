misconceptions:
- id: sign-drop
  description: Reports multiplication by |n| instead of n, dropping the sign of a negative-degree circle map.
- id: assumes-every-self-map-is-degree-one
  description: Reports "multiplication by 1" for every circle self-map regardless of its actual exponent, treating S^1 -> S^1 as automatically the identity on pi_1.
- id: adds-instead-of-multiplies-degrees
  description: On the exam tier's composition, adds the two exponents (a + b) instead of multiplying them (a * b) to get the composite's induced map.
- id: forgets-contractible-implies-zero
  description: Assigns a nonzero multiplication map to a map that factors through a contractible space (an interval), missing that pi_1 of a point is trivial and so the induced map must be zero regardless of the two factor maps involved.
