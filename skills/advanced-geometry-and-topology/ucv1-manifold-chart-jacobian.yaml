misconceptions:
- id: origin-substitution
  description: Differentiates correctly but substitutes the origin instead of the stated point.
- id: entry-off-by-one
  description: One matrix entry is off by one, so the reported determinant does not match the reported entries.
- id: transposed-jacobian
  description: Reports du/dx, dv/dx, du/dy, dv/dy -- the two middle entries swapped -- instead of the stated row-major order.
- id: swapped-rows
  description: Reports the second row's entries before the first row's, and the determinant's sign flipped to match.
