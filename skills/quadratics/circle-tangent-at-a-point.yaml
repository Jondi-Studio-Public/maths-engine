id: circle-tangent-at-a-point
name: Find the tangent to a circle at a point
domain: quadratics
year_level:
- '10'
- '11'
description: Use the perpendicular radius to find the gradient of the tangent to a circle at a point, then the intercepts
  of the tangent with the axes.
status: active
placement_eligible: false
prerequisites:
- circle-equation-centre-radius-form
- gradient-from-graph
answer: number
sources:
