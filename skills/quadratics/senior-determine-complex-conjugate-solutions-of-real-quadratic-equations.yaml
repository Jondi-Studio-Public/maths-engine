id: senior-determine-complex-conjugate-solutions-of-real-quadratic-equations
name: Determine complex conjugate solutions of real quadratic equations
domain: quadratics
description: Given a real quadratic equation with a negative discriminant, state the complex-valued solution with the positive imaginary part, in p + qi form. At the hard tier, one complex root and the equation's b coefficient are given, c is withheld, and the learner reasons via the conjugate-root theorem and Vieta's product relation to find the value of c. Complement to senior-consider-conjugate-roots-for-polynomials-with-real-coefficients, which always gives both coefficients and asks for the (always real) sum or product of the roots -- this skill's hard tier runs the reverse direction, root given, coefficient sought.
status: active
placement_eligible: false
prerequisites:
- quadratic-vertex
answer: expression
