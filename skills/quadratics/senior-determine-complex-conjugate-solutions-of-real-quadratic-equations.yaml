misconceptions:
- id: sign-error-real-part
  description: Stated -p + qi instead of p + qi (sign error on the real part).
- id: sign-error-imaginary-part
  description: Stated p - qi instead of p + qi -- the other genuine root of the equation, offered because the question asks for the specific one with positive imaginary part.
- id: forgot-to-divide-by-2a
  description: Divided by 2 instead of 2a when the leading coefficient is not 1.
- id: swapped-real-and-imaginary
  description: Reported q + pi instead of p + qi.
- id: forgot-i-squared-negative
  description: 'Hard tier: computed p^2 - q^2 (as if for a real difference of squares) instead of p^2 + q^2, forgetting that squaring qi introduces a sign flip.'
- id: forgot-imaginary-part-contribution
  description: 'Hard tier: used only p^2 for c, forgetting to add the imaginary part''s square.'
- id: forgot-real-part-contribution
  description: 'Hard tier: used only q^2 for c, forgetting to add the real part''s square.'
- id: confused-b-and-c
  description: 'Hard tier: reported the value of b instead of computing c.'
