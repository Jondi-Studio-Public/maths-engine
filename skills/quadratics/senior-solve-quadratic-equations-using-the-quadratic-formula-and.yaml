id: senior-solve-quadratic-equations-using-the-quadratic-formula-and
name: Solve quadratic equations using the quadratic formula and by completing the square
domain: quadratics
description: Solve non-factorable quadratic equations using the quadratic formula, expressing the roots exactly in surd form. This skill demonstrates the mathematical equivalence of the quadratic formula method and the completing-the-square method, both of which yield exact algebraic solutions required in senior Mathematical Methods.
status: active
placement_eligible: false
prerequisites:
- quadratic-vertex
answer: expression
