  - 6
  - maintenance
misconceptions:
- id: wrong-sign-b
  description: Using +b instead of -b in the numerator of the quadratic formula.
- id: forgot-double-a
  description: Forgetting to double a in the denominator of the quadratic formula.
- id: half-divided-surd
  description: Dividing the -b term by 2a but forgetting to also divide the sqrt(D) term by 2a.
