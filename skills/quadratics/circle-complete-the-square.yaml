id: circle-complete-the-square
name: Find the centre and radius of a circle by completing the square
domain: quadratics
year_level:
- '10'
- '11'
description: Complete the square on x^2 + y^2 + Dx + Ey + F = 0 to read off the centre and radius, including half-integer
  centres, terms on both sides and a common factor, and expand a circle back to D, E and F.
status: active
placement_eligible: false
prerequisites:
- circle-equation-centre-radius-form
- completing-square-and-discriminant
answer: ordered_list
sources:
- topic: w5_circle_complete_square
  params: {}
  difficulty: easy
  stages:
  - 0
  - 1
  - 2
- topic: w5_circle_complete_square
  params: {}
  difficulty: medium
  stages:
  - 3
  - 4
- topic: w5_circle_complete_square
  params: {}
