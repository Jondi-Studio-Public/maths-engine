id: circle-find-unknown-constant
name: Find an unknown coordinate or constant of a circle
domain: quadratics
year_level:
- '10'
- '11'
description: Use the equation of a circle to find the missing coordinate of a point on it, the constant F of x^2 + y^2 +
  Dx + Ey + F = 0 for a stated radius or point, the greatest whole F that still gives a circle, or F when the circle touches
  an axis.
status: active
placement_eligible: false
prerequisites:
- circle-complete-the-square
answer: number
