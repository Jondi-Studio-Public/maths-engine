id: circle-equation-centre-radius-form
name: Write and read the equation of a circle
domain: quadratics
year_level:
- '10'
- '11'
description: Read the centre and radius from (x - h)^2 + (y - k)^2 = r^2, and write the equation of a circle from its centre
  and radius, a translation, a point on it, the ends of a diameter, or a tangency condition, with the sign change and the
  squaring both required.
