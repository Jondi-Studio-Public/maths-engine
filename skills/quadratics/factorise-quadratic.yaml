id: factorise-quadratic
name: Factorise a quadratic trinomial
domain: quadratics
description: Factorise a quadratic ax^2 + bx + c, with integer coefficients, as a product of two integer
  binomial factors -- both when the leading coefficient is 1 and when it is not. Distinct from
  solve-quadratics-factorable, which asks for the roots of a monic quadratic; this skill asks for the
  factorisation itself and is the only place a non-monic leading coefficient is factorised.
