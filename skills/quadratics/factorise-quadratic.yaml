misconceptions:
- id: sign-flip-one-factor
  description: Flips the sign of one bracket's constant term alone, e.g. (px - q)(rx + s) instead of the
    correct (px + q)(rx + s).
- id: sign-flip-both-factors
  description: Flips the sign of both brackets' constant terms, landing on (px - q)(rx - s) instead of the
    correct (px + q)(rx + s).
- id: swapped-cross-terms
  description: On a non-monic quadratic, swaps which bracket carries which leading coefficient -- offers
    (rx + q)(px + s) instead of the correct (px + q)(rx + s). Only exercisable when p != r.
