id: senior-examine-examples-of-quadratically-related-variables
name: Examine examples of quadratically related variables
domain: quadratics
description: Examine examples of quadratically related variables. Given a stated relation y = kx^2 and one data point, compute a new dependent value, solve for a new positive independent value, or find the scale factor a named quadratic law (such as kinetic energy) applies to a scaled input.
