misconceptions:
- id: as-if-direct
  description: Treating the quadratic relation as if it were direct proportion (exponent 1) instead of quadratic (exponent 2).
- id: as-if-inverse
  description: Treating the quadratic relation as if it were inverse proportion (exponent -1) instead of quadratic (exponent 2).
- id: no-change
  description: Assuming the dependent (or independent) quantity does not change at all, forgetting the quadratic scaling should apply.
- id: forgot-to-square
  description: Answering with the scale factor itself rather than its square, forgetting that a quadratically related quantity scales with the square of the input.
- id: cubic-confusion
  description: Answering with the scale factor cubed, over-applying the exponent by one more power than the relation states.
- id: generic-doubling
  description: A generic doubling of the scale factor, unrelated to the quadratic relation stated in the question.
