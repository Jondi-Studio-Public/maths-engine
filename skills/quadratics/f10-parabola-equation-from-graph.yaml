id: f10-parabola-equation-from-graph
name: Write the equation of a drawn parabola in vertex form
domain: quadratics
naplan_domain: [algebra]
year_level: ['9']
description: 'Write y = a(x - h)^2 + k for a parabola drawn on a grid: a of 1 or -1 from the vertex, a of 2, -2, 3 or -3 from
  a marked point, and a fraction such as 1/2 or -1/3 from a marked point further from the vertex. The exam chain finds h,
  k and a and then writes the equation.'
