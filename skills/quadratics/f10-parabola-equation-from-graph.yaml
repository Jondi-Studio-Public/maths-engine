difficulty_progression:
  easy:
    steps: 2
    demand: Read the vertex for h and k and the way it opens for the sign of a.
  medium:
    steps: 3
    demand: Read the vertex, then use a marked point to find a.
  hard:
    steps: 4
    demand: Read the vertex, use a point two or three squares away, and divide by the squared distance to get a fractional
      a.
  exam:
    steps: 4
    demand: Read h and k, find a from the marked point, then write the equation.
misconceptions:
- id: fr2c-horizontal-shift-sign-reversed
  description: Writing the opposite sign inside the bracket for the horizontal position of the vertex.
- id: fr2c-vertical-shift-sign-reversed
  description: Writing the opposite sign for the vertical position of the vertex.
- id: fr2c-reflection-missed
  description: Missing that a negative a turns the parabola upside down, or giving a positive a to a parabola that opens downwards.
- id: fr2c-vertex-coordinates-swapped
  description: Giving the y-coordinate of the vertex where the x-coordinate was asked for, or the reverse.
- id: fr2c-point-read-for-vertex
  description: Reading a coordinate of the marked point instead of the same coordinate of the vertex.
- id: fr2c-a-taken-as-the-rise
  description: Using the rise from the vertex to a marked point as a without dividing by the square of the horizontal distance.
- id: fr2c-distance-not-squared
  description: Dividing the rise from the vertex by the horizontal distance and not by its square.
- id: fr2c-vertex-height-ignored
  description: Dividing the height of the marked point by the squared distance without taking away the height of the vertex.
