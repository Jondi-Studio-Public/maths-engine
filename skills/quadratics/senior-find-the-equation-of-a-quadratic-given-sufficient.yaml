misconceptions:
- id: forgot-negate-h
  description: Forgetting to negate h when expanding from vertex form.
- id: sign-error-k
  description: A sign error on the vertex y-coordinate only.
- id: sign-error-a
  description: A sign error on the leading coefficient.
- id: sign-error-one-root
  description: A sign error on one of the roots only.
- id: sign-error-both-roots
  description: A sign error on both roots.
- id: dropped-constant
  description: Omitting the constant term.
- id: sign-error-b
  description: A sign error on the linear coefficient only.
- id: off-by-one-constant
  description: Adding or subtracting 1 from the constant term.
