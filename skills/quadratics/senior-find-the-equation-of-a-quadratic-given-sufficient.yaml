id: senior-find-the-equation-of-a-quadratic-given-sufficient
name: Find the equation of a quadratic given sufficient information
domain: quadratics
description: Find the equation of a quadratic given sufficient information. Given a turning point and one further point, or two roots and one further point, or three points, construct the expanded standard form ax^2 + bx + c.
