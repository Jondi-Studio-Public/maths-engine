misconceptions:
- id: added-not-multiplied-constant
  description: Added the two constants instead of multiplying them for the constant term.
- id: multiplied-not-added-linear
  description: Multiplied the two constants instead of adding them for the linear coefficient.
- id: sign-error-one-factor
  description: Treated a "minus" factor as a "plus" factor, dropping a sign.
- id: dropped-middle-term
  description: Omitted the FOIL cross-terms, producing a binomial instead of a trinomial.
- id: forgot-to-double
  description: On a perfect-square product, wrote the middle term as ax instead of 2ax.
- id: assumed-nonzero-middle-term
  description: On a difference-of-squares product, wrongly included a nonzero middle term.
