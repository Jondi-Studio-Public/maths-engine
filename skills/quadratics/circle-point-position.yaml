id: circle-point-position
name: Decide whether a point is inside, on or outside a circle
domain: quadratics
year_level:
- '10'
- '11'
description: Choose, from five points, the one that lies inside, on or outside a circle given in centre-radius or expanded
  form, by comparing its squared distance from the centre with the radius squared.
status: active
placement_eligible: false
prerequisites:
- circle-equation-centre-radius-form
answer: mcq
