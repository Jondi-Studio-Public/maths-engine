misconceptions:
- id: w5c-centre-sign-flipped
  description: Uses a centre with the signs reversed when deciding where a point lies.
- id: w5c-ignores-centre
  description: Measures the distance from the origin instead of from the centre of the circle.
- id: w5c-compares-squared-distance-with-radius
  description: Compares the squared distance with the radius instead of the radius squared.
- id: w5c-adds-offsets-without-squaring
  description: Adds the horizontal and vertical offsets instead of finding the distance, and compares the sum with the radius.
- id: w5c-near-miss-treated-as-on
  description: Treats a point that is close to the circle as being on it.
- id: w5c-boundary-misjudged
  description: Misjudges which side of the circle a point close to it lies on.
- id: w5c-forgets-square-root
  description: Gives the squared distance where the distance was asked.
- id: w5c-distance-by-adding-offsets
  description: Finds a distance by adding the horizontal and vertical offsets instead of using Pythagoras.
- id: w5c-uses-centre-sign-in-distance
  description: Measures the distance from the point to the centre with the signs of the centre reversed.
- id: w5c-adds-radius-for-gap
  description: Adds the radius to the distance to the centre where the shortest distance to the circle was needed.
- id: w5c-distance-to-centre-not-circle
  description: Gives the distance from the point to the centre where the distance to the circle itself was asked.
- id: w5c-uses-squared-distances
  description: Subtracts squared distances where the distances themselves should be subtracted.
- id: w5c-radius-for-gap
  description: Gives the radius where the distance from the point to the circle was asked.
- id: w5c-subtracts-radius-for-farthest
  description: Subtracts the radius where the farthest point needs it added.
- id: w5c-adds-squared-radius
  description: Adds the radius squared to the distance.
- id: w5c-doubles-the-distance
  description: Doubles the greatest distance.
difficulty_progression:
  easy:
    steps: 2
    demand: Compare x^2 + y^2 for each point with r^2 for a circle centred at the origin.
  medium:
    steps: 3
    demand: Measure each point from a centre that is not the origin, keeping the signs of the centre right.
  hard:
    steps: 4
    demand: Start from the expanded equation, so the centre and radius squared must be found by completing the square before
      the points are compared.
  exam:
    steps: 5
    demand: Chain the distance from a point to the centre, a point on one side of the circle, and the nearest and farthest
      distances to the circle.
