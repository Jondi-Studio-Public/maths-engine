misconceptions:
- id: sign-error-forgot-minus
  description: Computes b^2 + 4ac instead of b^2 - 4ac (forgets the discriminant's own minus sign in front of 4ac).
- id: forgot-to-square-b
  description: Computes b - 4ac instead of b^2 - 4ac (uses b directly instead of b squared).
- id: sign-error-on-b-squared
  description: Computes -b^2 - 4ac instead of b^2 - 4ac (a sign error on the b^2 term itself).
- id: right-discriminant-wrong-count
  description: Reports the correct discriminant value but the wrong zero count for it -- most often offering 2 for a discriminant of exactly 0, or 1 for a negative discriminant.
- id: swapped-discriminant-and-count
  description: Reports the zero count in the discriminant's slot and the discriminant value in the count's slot.
