id: senior-find-turning-points-and-zeros-of-quadratics-and
name: Find turning points and zeros of quadratics and understand the role of the discriminant
domain: quadratics
description: Given a quadratic in the form ax^2+bx+c with a, b, c stated integers, compute its discriminant b^2-4ac and state the number of real zeros (0, 1 or 2) it implies. Never asks for the turning point or the zeros themselves -- that content already belongs to quadratic-vertex (this skill's own prerequisite) and to solve-quadratics-formula / factorise-quadratic. The quadratic is always presented literally as ax^2+bx+c, in that term order; never rearranged, never in vertex form.
status: active
placement_eligible: false
prerequisites:
- quadratic-vertex
answer: pair
