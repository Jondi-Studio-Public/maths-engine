id: f10-quadratic-parameter-effects
name: Explain what the parameters do to a parabola
domain: quadratics
naplan_domain: [algebra]
year_level: ['9']
description: 'Say how the graph of y = a(x - h)^2 + k is related to the graph of y = x^2: which equation gives a drawn move
  of y = x^2, what a, h and k do in words, and how the shifted graph of y = f(x) is written. The exam chain goes from a description
  to the vertex, the least or greatest value and the y-intercept.'
