id: line-meets-parabola-circle
name: Where a line meets a parabola or a circle
domain: quadratics
year_level:
- '10'
- '11'
description: Substitute a line into a parabola or a circle to find the intersection points, count them with the discriminant,
  and use a zero discriminant to find the intercept, gradient or point of contact of a tangent.
status: active
placement_eligible: false
prerequisites:
- solve-quadratics-formula
answer: number
