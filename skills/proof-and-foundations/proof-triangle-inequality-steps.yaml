misconceptions:
- id: tri-abs-squared-not-squared
  description: Treats |a|^2 as |a|, or the cross term 2|a||b| as 2ab.
- id: tri-cross-term-sign
  description: Adds the cross term where it should be subtracted.
- id: tri-cross-term-dropped
  description: Drops the cross term, or its factor 2, when expanding the square of a sum.
difficulty_progression:
  easy:
    steps: 2
    demand: Expand the square of a sum of absolute values and use |a|^2 = a^2.
  medium:
    steps: 3
    demand: Expand two squares and subtract; the squared terms cancel.
  hard:
    steps: 4
    demand: Apply the same idea to the distance between two points through a third.
