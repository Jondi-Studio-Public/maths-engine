misconceptions:
- id: confuses-domain-with-active-domain
  description: Answers with the set of elements that actually appear as a first coordinate in R, instead of the stated ambient domain A.
- id: confuses-domain-and-codomain
  description: Swaps the domain and codomain sets when asked for one of them.
- id: treats-shared-output-as-non-function
  description: Believes two different inputs mapping to the same output makes a relation fail to be a function -- that is an injectivity property, never a function-ness property, and is offered every draw as a guaranteed-wrong option.
- id: assumes-single-witness-not-needed-for-both
  description: Believes 'only statement (ii) is true' is a coherent possibility -- (ii) [a single b works for every a] logically FORCES (i) [every a has some witness b], so that option is offered every draw and is never the key.
