id: ucv1-proof-by-induction
name: Work the steps of a proof by induction
domain: proof-and-foundations
description: For a sum identity or a divisibility statement, supply one typed step of
  its proof by induction -- the base-case value, the next term, the right-hand side the
  inductive step must reach, the factored sum of k + 1 terms, or the rearrangement
  f(k + 1) = a f(k) + m. The answers are numbers and expressions, never a choice of
  which line of a proof is wrong.
status: active
placement_eligible: false
prerequisites: [factorise-quadratic]
answer: expression
