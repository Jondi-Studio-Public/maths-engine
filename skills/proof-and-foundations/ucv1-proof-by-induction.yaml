misconceptions:
- id: base-case-evaluated-at-wrong-n
  description: Checks the base case at n = 0 or n = 2 instead of at the first value
    the statement covers.
- id: term-index-not-shifted
  description: Writes the kth term where the (k + 1)th term is needed.
- id: target-uses-k-not-k-plus-1
  description: Writes the closed form at n = k instead of replacing n by k + 1.
- id: substitutes-k-plus-1-in-one-place-only
  description: Replaces n by k + 1 in some places of the formula but not in all of
    them.
- id: adds-kth-term-not-next
  description: Adds the kth term to the sum of k terms instead of the (k + 1)th.
- id: forgot-to-add-the-term
  description: Stops at the assumed sum of k terms without adding the next term.
- id: remainder-sign-reversed
  description: Gets the sign of the leftover term wrong when rearranging f(k + 1)
    into a f(k) plus a remainder.
- id: remainder-drops-the-constant
  description: Forgets one of the constant terms when rearranging f(k + 1) into
    a f(k) plus a remainder.
