misconceptions:
- id: parity-odd-square-forgets-cross-term
  description: Squares 2k + c without the middle term.
- id: parity-square-of-sum-termwise
  description: Squares or cubes a sum term by term.
- id: parity-odd-form-off-by-one
  description: Ends with a form that does not equal the expression being rewritten.
- id: parity-factor-not-taken-out-fully
  description: Takes a factor of 2 out of some terms but not all.
- id: parity-product-misses-cross-term
  description: Multiplies two brackets with fewer than four products.
difficulty_progression:
  easy:
    steps: 2
    demand: Expand the square or the sum of an odd number and write it as 2(...) + 1.
  medium:
    steps: 3
    demand: Expand a product of two odd numbers, or a square minus one, and factorise.
  hard:
    steps: 4
    demand: Expand a quadratic or cubic in 2k + 1 or 2k, collect like terms and take out the factor of 2.
