misconceptions:
- id: amgm-cross-term-sign
  description: Writes the square of a sum where the square of a difference is needed.
- id: amgm-difference-of-squares
  description: Writes (a - b)(a + b) where (a - b)^2 is needed.
- id: amgm-cross-term-halved
  description: Expands or factorises a square with -ab instead of -2ab.
- id: amgm-drops-denominator
  description: Combines fractions with the wrong common denominator.
difficulty_progression:
  easy:
    steps: 2
    demand: Expand and collect to see a^2 + b^2 - 2ab is (a - b)^2.
  medium:
    steps: 3
    demand: Do the same with coefficients, or from a square of a sum minus 4cd times the product.
  hard:
    steps: 4
    demand: Combine fractions or square roots first, then recognise the square of a difference.
