id: uc2-one-way-anova-table
name: One-way ANOVA table
domain: statistics
year_level:
- university
description: "Build the pieces of a one-way analysis of variance table from group sizes, means and standard deviations or\
  \ from raw observations: sums of squares, mean squares, the F statistic, the proportion explained, and a pooled confidence\
  \ interval for a difference of group means."
status: active
placement_eligible: false
prerequisites:
- ucv1-one-sample-t-test
- finite-distribution-variance
answer: number
