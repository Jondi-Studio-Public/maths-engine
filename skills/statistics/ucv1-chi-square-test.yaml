misconceptions:
- id: chi-divides-by-observed
  description: Divides each squared difference by the observed count instead of the
    expected count.
- id: chi-no-square
  description: Adds the differences (O - E)/E without squaring them.
- id: chi-no-division-by-expected
  description: Adds the squared differences without dividing each by its expected
    count.
- id: expected-assumes-equal-split
  description: Shares the total equally between the categories although the
    hypothesis gives unequal proportions (or between all cells of a table).
- id: expected-ignores-grand-total
  description: Multiplies the row total by the column total and never divides by the
    grand total.
- id: expected-from-one-total-only
  description: Builds an expected count from a column total (or row total) alone.
- id: df-cells-minus-one
  description: Uses cells minus one as the degrees of freedom of a table, instead of
    (r - 1)(c - 1).
- id: df-adds-dimensions
  description: Adds the table's dimensions, r + c - 2, instead of multiplying.
- id: df-ignores-estimated-parameter
  description: Uses categories minus one although parameters were estimated from
    the data.
near_misses:
- id: expected-probability-not-count
  description: Gives the probability of the category where the expected count was asked for.
