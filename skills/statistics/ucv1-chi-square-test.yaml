id: ucv1-chi-square-test
name: Compute the pieces of a chi-square test
domain: statistics
description: For a goodness-of-fit test (equal split, stated percentages or a stated
  ratio) or a test of independence on a printed 2 x 2 or 2 x 3 table, find an
  expected count, the chi-square statistic and the degrees of freedom. Critical values
  are always printed in the question, every expected count is at least 5, and a
  conclusion is only ever a one-mark last part of the exam chain.
