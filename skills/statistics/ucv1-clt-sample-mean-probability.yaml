id: ucv1-clt-sample-mean-probability
name: 'Central limit theorem: sample means and totals'
domain: statistics
year_level:
- university
description: Use the central limit theorem to find probabilities for a sample mean or a sample total from a population of
  unknown shape, and the sample size needed to guarantee a stated precision.
status: active
placement_eligible: false
prerequisites:
- z-score
answer: number
