id: uc2-regression-slope-inference
name: Inference for a regression slope
domain: statistics
year_level:
- university
description: "Fit a simple linear regression from summary totals or raw pairs and make inferences about its slope: the estimate,\
  \ residual variance, standard error, t statistic (against zero or a claimed value), confidence limits, and a confidence\
  \ interval for the mean response."
status: active
placement_eligible: false
prerequisites:
- ucv1-regression-residual-diagnostic
- ucv1-one-sample-t-test
answer: number
