misconceptions:
- id: reversed-sign-reading
  description: Reads the residual's sign backwards, calling a point that is above the
    line "below the line" (or vice versa).
- id: on-mistaken-for-off
  description: Treats a point that lies exactly on the line (residual zero) as though
    it were above or below it, or treats an off-line point as though it were exactly
    on the line.
- id: wrong-named-point
  description: Computes the residual for the point the question did NOT name, reading
    the other point's coordinates instead. Only exercisable at the hard tier, which is
    the only tier naming one of two listed points.
