id: ucv1-proportion-confidence-interval
name: Recover a sample from a proportion confidence interval
domain: statistics
description: Given a stated normal-approximation confidence interval for a Bernoulli
  proportion (and, from medium on, its critical value z), recover the sample that
  produced it -- the centre and half-width, the sample size and success count, or
  the sample size a tighter target margin would need. The forward direction (build
  the interval from n and k) is the shipping neighbour
  senior-use-the-approximate-confidence-interval-left-widehat-p (ACMMM178); this
  skill never asks for that, and no tier's answer is ever an interval bound.
status: active
placement_eligible: false
prerequisites: [bernoulli-mle]
answer: pair
