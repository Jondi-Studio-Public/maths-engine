misconceptions:
- id: sd-used-as-standard-error
  description: Divides the difference of means by the population standard deviation itself, forgetting that the
    standard error of the sample mean is sigma over root n.
- id: se-divides-by-n
  description: Divides sigma by n instead of the square root of n when forming the standard error.
- id: se-multiplies-by-root-n
  description: Multiplies sigma by root n instead of dividing, so the standard error comes out far too large.
- id: variance-used-as-sd
  description: Uses the known variance where the standard deviation belongs, so the square root is never taken.
- id: z-sign-reversed
  description: Subtracts in the wrong order, so z has the wrong sign.
- id: doubled-for-one-tail
  description: Doubles the tail probability for a one-sided test, as for a two-sided one.
- id: gave-cumulative-for-tail
  description: Reports the table value Phi(z) itself as the p-value instead of the tail probability beyond z.
- id: uses-area-from-the-mean
  description: Reports the area between the mean and z (the table value minus one half) as the p-value.
- id: rounds-down-instead-of-up
  description: Rounds the least sample size down, so the sample is one too small to reach significance.
- id: sample-size-not-squared
  description: Reports z*·sigma over the difference as the sample size, forgetting that it equals the square root of n.
- id: gave-power-for-type-two-error
  description: Gives the probability of rejecting a false null hypothesis (the power) where the probability of a type
    II error was asked for.
- id: two-sided-p-not-halved
  description: Reads a two-sided p-value back through the table as a single tail, without halving it first.
near_misses:
- id: one-tail-for-two-tails
  description: Gives the probability in one tail where a two-sided p-value was asked for.
- id: gave-complement-of-tail
  description: Gives one minus the p-value, the probability of the opposite outcome.
difficulty_progression: Easy asks for the z statistic from n, the known sigma (or the known variance), the sample mean
  and the hypothesised mean, so the standard error has to be formed first. Medium asks for the p-value read from a
  printed table excerpt for an upper-tail, lower-tail or two-sided test, where the tail follows from H1 and the sign
  of z, so a sample on the wrong side of the null gives a p-value above one half. Hard turns the test round, asking for
  the smallest sample size that makes a result significant (an inequality in the square root of n, rounded up), the
  probability of a type II error at a stated true mean (a boundary on the sample mean, then a probability under the
  alternative), or the sample mean behind a reported two-sided p-value (the table read backwards). The exam chain
  finds z, follows through to the p-value, recovers the standard error from z to find the sample mean on the boundary
  of the rejection region, and states the conclusion.
