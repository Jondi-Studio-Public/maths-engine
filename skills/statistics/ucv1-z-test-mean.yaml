id: ucv1-z-test-mean
name: Test a mean when the population standard deviation is known (z-test)
domain: statistics
year_level: [university]
description: Carry out the arithmetic of a one-sample z-test for a population mean with known standard deviation
  (or known variance) - the z statistic, the p-value read from a printed standard normal table for an upper-tail,
  lower-tail or two-sided test, the smallest sample size that makes a result significant, the probability of a type II
  error at a stated true mean, and the sample mean behind a reported two-sided p-value. The standard normal table
  excerpt is always printed in the question, and a conclusion is only ever the one-mark last part of the exam chain.
status: active
placement_eligible: false
prerequisites: [standard-deviation-from-data, z-score]
answer: number
