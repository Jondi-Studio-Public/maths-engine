id: ucv1-two-sample-and-paired-t-test
name: Compute the pieces of a two-sample or paired t test
domain: statistics
description: >-
  From summary data, or a short list of paired differences, find the standard error of a
  difference of two sample means, the unequal-variance and pooled t statistics, the pooled
  variance, the paired t statistic and a confidence-interval limit for the difference of two
  means given the critical value. Critical values are always printed in the question. A
  conclusion appears only as the one-mark last part of the four-part exam chain, which goes from
  the pooled variance through the standard error and the t statistic to the decision.
status: active
placement_eligible: false
prerequisites: [standard-deviation-from-data, z-score]
answer: number
sources:
- topic: fy1ms_t_test_two_sample
  params: {}
  difficulty: easy
  stages: [0, 1, 2]
- topic: fy1ms_t_test_two_sample
