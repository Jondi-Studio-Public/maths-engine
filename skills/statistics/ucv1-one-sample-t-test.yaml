misconceptions:
- id: se-divides-by-n
  description: Divides the sample standard deviation by n instead of the square root of n
    when forming the standard error.
- id: se-uses-n-minus-1
  description: Divides by the square root of the degrees of freedom, n - 1, instead of
    the square root of n.
- id: sd-used-as-standard-error
  description: Divides the difference of means (or scales the critical value) by s
    itself, forgetting that the standard error of the mean is s over root n.
- id: variance-used-as-sd
  description: Uses the sample variance where the standard deviation belongs, so the
    square root is never taken.
- id: t-sign-reversed
  description: Subtracts in the wrong order, so the t statistic or the difference
    behind it carries the wrong sign.
- id: sample-sd-divides-by-n
  description: Finds the standard deviation of a paired sample with divisor n rather
    than n - 1.
- id: ci-margin-as-bound
  description: Reports the margin of error as the confidence limit instead of adding
    it to, or subtracting it from, the sample mean.
- id: critical-value-wrong-df
  description: Reads the critical value from the row for n degrees of freedom instead
    of n - 1 (exam tier).
near_misses:
- id: ci-wrong-bound
  description: Finds the other end of the confidence interval from the one asked for.
