id: uc2-mle-method-of-moments
name: Maximum likelihood and method of moments estimators
domain: statistics
year_level:
- university
description: >-
  Find maximum likelihood and method of moments estimates and estimators: from a data summary, by
  differentiating the log-likelihood for a one-parameter density, for a uniform sample where the likelihood has
  no stationary point, and for a function of the parameter by invariance.
status: active
placement_eligible: false
prerequisites:
- bernoulli-mle
- ucv1-one-sample-t-test
answer: expression
