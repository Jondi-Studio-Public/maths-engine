id: uc2-cramer-rao-lower-bound
name: Cramér–Rao lower bound
domain: statistics
year_level:
- university
description: "Find the Fisher information of a model and the Cramér–Rao lower bound for the variance of an unbiased estimator\
  \ of a parameter or of a function of it, and judge an estimator by its efficiency."
status: active
placement_eligible: false
prerequisites:
- bernoulli-mle
- ucv1-poisson-count-probability
answer: fraction
