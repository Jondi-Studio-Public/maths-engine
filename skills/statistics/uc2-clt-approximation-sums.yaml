id: uc2-clt-approximation-sums
name: Normal approximation to sums of counts
domain: statistics
year_level:
- university
description: "Approximate probabilities for the total of many independent whole-number counts (a table of probabilities or\
  \ a Poisson count) with the central limit theorem and a continuity correction, and solve the inverse problems: the smallest\
  \ cut-off for a stated tail, and the largest number of items that keeps a total under a limit."
status: active
placement_eligible: false
prerequisites:
- z-score
- finite-distribution-variance
- ucv1-poisson-count-probability
answer: number
