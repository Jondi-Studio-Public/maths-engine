id: uc2-estimator-bias-and-mse
name: Bias and mean squared error of estimators
domain: statistics
year_level:
- university
description: "Find the bias, variance and mean squared error of point estimators from their definitions: scaled and weighted\
  \ sample means, divide-by-n variance estimators, the maximum of a uniform sample, and shrinkage estimators."
status: active
