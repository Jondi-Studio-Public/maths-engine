id: ucv1-proportion-z-test
name: Compute the pieces of a one-sample z test for a proportion
domain: statistics
description: >-
  Test a claimed population proportion with a large sample: find the standard error under the
  null hypothesis, the z statistic, the p-value for a two-sided or one-sided alternative, and
  the sample proportion or count at the edge of the 5% rejection region. The standard error
  always uses the claimed proportion, not the sample proportion. A conclusion appears only as
  the one-mark last part of the four-part exam chain. Confidence intervals for a proportion are
  taught by the neighbouring interval skills.
status: active
placement_eligible: false
prerequisites: [bernoulli-mle, z-score]
answer: number
