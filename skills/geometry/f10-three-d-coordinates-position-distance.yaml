id: f10-three-d-coordinates-position-distance
name: Find position, midpoint and distance in a drawn box
domain: geometry
year_level: ['8']
naplan_domain: [space]
description: Given a box drawn in oblique view with its corner at the origin (or on a survey grid) and three edge lengths, write the coordinates of a corner, the midpoint of the line joining two corners, or the straight-line distance between two corners.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: [f10-three-dimensional-coordinates]
answer: pair
sources:
