misconceptions:
- id: adds-instead-of-using-pythagoras
  description: "Adding the two shorter sides of a right-angled triangle (or the components of a displacement) instead of using Pythagoras' theorem."
- id: forgets-the-square-root
  description: Stopping at the sum of the squares of the components without taking the square root for the distance.
- id: fr2a-box-corner-all-lengths
  description: Giving all three lengths of the box as the coordinates of a corner that is not the far top corner.
- id: fr2a-box-length-left-out
  description: Putting 0 for one of the coordinates of a corner when it should be the length of that edge.
- id: fr2a-distance-one-dimension-left-out
  description: Leaving one of the three differences out of the distance between two points in three dimensions.
- id: fr2a-height-not-squared
  description: Squaring the floor diagonal but not the height when finding the diagonal of the box.
- id: fr2a-midpoint-difference-halved
  description: Halving the difference of the coordinates of the two ends instead of their sum to find the midpoint.
- id: fr2a-midpoint-is-an-endpoint
  description: Giving one end of the line as its midpoint.
- id: fr2a-midpoint-not-halved
  description: Adding the coordinates of the two ends of a line without halving to find the midpoint.
- id: fr2a-midpoint-one-coordinate-halved
  description: Halving one coordinate of a midpoint but adding the other two.
- id: fr2a-wrong-face-diagonal
  description: Using the wrong two edges for the diagonal of a face of the box.
- id: swapped-coordinates
  description: Giving the y value where the x value was asked, or the reverse.
