misconceptions:
- id: swapped-column-row
  description: Reports the row number as the column and the column number as the row (or, in the inverse question, swaps the two counts).
- id: vertical-direction-reversed
  description: Moves the wrong way along the rows, for example treating up as increasing the row number when row 1 is at the top.
- id: horizontal-direction-reversed
  description: Moves left for right (or west for east) when changing column.
- id: drops-a-leg
  description: Leaves out the last move of the pathway and reports the square before it.
- id: start-square-counted
  description: Counts the square already stood on as one of the squares moved, so the last move goes one square too far (or an inverse count is one too large).
- id: letter-numbered-from-zero
  description: Numbers the columns from A = 0 instead of A = 1, so the column number is one too small.
- id: reports-finish-not-difference
  description: In the inverse question, gives a column or row number of the finishing square instead of the number of squares travelled.
