misconceptions:
- id: w9-translate-direction
  description: 'Moves the shape the wrong way along one direction: right for left, or up for down.'
- id: w9-translate-components-swapped
  description: Swaps the across and up parts of the translation.
- id: w9-translate-one-component
  description: Applies only the across part or only the up part of the translation.
- id: w9-translate-negated
  description: Moves the shape by the opposite vector, undoing the translation.
- id: w9-reflect-wrong-axis
  description: Reflects in the other axis, or the other mirror line, instead of the one named.
- id: w9-reflect-distance-not-doubled
  description: Moves each point only as far as the mirror line instead of through it, so the image lands on the line.
- id: w9-reflect-line-value-not-doubled
  description: Writes k - x instead of 2k - x for the image of a point in the line x = k (or k - y for y = k).
- id: w9-reflect-adds-instead
  description: Moves each point the distance to the mirror line in the same direction, which translates the shape instead
    of reflecting it.
- id: w9-reflect-diagonal-as-swap-sign
  description: Reflects in y = -x by swapping the coordinates but forgetting to change both signs (or the reverse for y =
    x).
- id: w9-rotate-direction
  description: 'Turns the shape the wrong way round: clockwise for anticlockwise or the reverse.'
- id: w9-rotate-angle
  description: Turns the shape through a half turn when a quarter turn was asked, or the reverse.
- id: w9-rotate-about-origin
  description: Turns the shape about the origin instead of about the marked centre.
- id: w9-rotate-as-reflection
  description: Swaps the coordinates, which reflects the shape in y = x instead of turning it.
- id: w9-rotate-sign-slip
  description: Swaps the coordinates in a quarter turn but gives both the wrong sign.
- id: w9-image-vertices-misordered
  description: Puts the image vertices in the wrong order, so A' is not where A went.
- id: w9-composite-order-reversed
  description: Does the two transformations in the wrong order.
- id: w9-composite-first-only
  description: Applies only the first of the two transformations.
- id: w9-composite-second-only
  description: Applies only the second of the two transformations to the original shape.
- id: w9-area-changes-with-image
  description: Thinks the area changes under a reflection, translation or rotation, and recalculates it wrongly or doubles
    it.
- id: w9-area-no-half
  description: Gives the area of the box round the triangle, forgetting to halve it.
- id: w9-area-base-times-side
  description: Multiplies two sides of the triangle instead of using base times height over two.
difficulty_progression:
  easy:
    steps: 2
    demand: Translate a shape, or reflect it in an axis.
  medium:
    steps: 3
    demand: Reflect in a line x = k, y = k, y = x or y = -x, or rotate about the origin.
  hard:
    steps: 5
    demand: Rotate about another centre, or combine two transformations.
  exam:
    steps: 6
    demand: 'A multi-part question: find what the drawing needs by calculation, make the drawing, then use it for a follow-up
      number.'
