id: f10-pick-the-matching-view
name: Match a plan view with its front and side elevations
domain: geometry
year_level: ['7']
naplan_domain: [space]
description: Given the plan view of a structure of identical cubes, choose the front or right-side elevation from four drawings, or, given both elevations, choose the plan view that produces them.
status: active
