id: f10-grid-map-familiar-place
name: Read a grid map of a familiar place
domain: geometry
year_level: ['3', '5']
naplan_domain: [space]
description: Given a map of a school, park, zoo or town centre on a lettered-column, numbered-row grid with north at the top, give the grid reference of a landmark, the square reached after two moves from a landmark, and the net movement across a walk through three landmarks.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: [f10-position-location-language]
answer: pair
sources:
- topic: fr2a_grid_map
  params: {}
  difficulty: easy
  stages: [0, 1, 2]
- topic: fr2a_grid_map
  params: {}
  difficulty: medium
  stages: [3, 4]
- topic: fr2a_grid_map
  params: {}
  difficulty: hard
  stages: [5, 6, maintenance]
misconceptions:
- id: fr2a-grid-reference-off-by-one
  description: Giving the square next to the right one by miscounting a column or row by one.
- id: fr2a-map-first-leg-ignored
  description: Giving only the second leg of a two-leg walk as the whole movement.
- id: fr2a-map-leg-dropped
  description: Leaving out the last move of a walk on a map and giving the square before it.
- id: fr2a-map-legs-added-not-netted
  description: Adding the squares walked in each direction without taking off the squares walked back the other way.
- id: fr2a-map-second-leg-ignored
  description: Giving only the first leg of a two-leg walk as the whole movement.
- id: fr2a-map-start-square-counted
  description: Counting the square already stood on as one of the squares moved, so the walk ends a square too far.
- id: fr2a-row-counted-from-top
  description: Counting the rows of a map from the top when they are numbered from the bottom.
- id: horizontal-direction-reversed
  description: Moving left for right (or west for east) when changing column.
- id: letter-numbered-from-zero
  description: Numbering the columns from A = 0 instead of A = 1.
- id: swapped-column-row
  description: Reporting the row number as the column and the column number as the row.
- id: vertical-direction-reversed
  description: Moving the wrong way along the rows, for example treating north as increasing the row number when row 1 is in the north.
