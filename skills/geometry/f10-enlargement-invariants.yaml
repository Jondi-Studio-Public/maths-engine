id: f10-enlargement-invariants
name: Identify what an enlargement changes and keeps
domain: geometry
year_level: ['9']
description: Given a shape enlarged from a centre of enlargement by a stated scale factor, find the image's length, angle, area, perimeter or distance from the centre, using the fact that lengths scale by the factor, areas by its square and angles not at all. One source draws a triangle or rectangle on a square grid with its centre of enlargement and asks for a length of the image and then the coordinates of its vertices.
