id: f10-enlargement-invariants
name: Identify what an enlargement changes and keeps
domain: geometry
description: Given a shape enlarged from a centre of enlargement by a stated scale factor, find the image's length, angle, area, perimeter or distance from the centre, using the fact that lengths scale by the factor, areas by its square and angles not at all.
status: active
placement_eligible: false
prerequisites: [f10-transformations-invariants]
answer: number
sources:
- topic: enlargement_invariants
  params: {}
  difficulty: easy
  stages: [0, 1, 2]
- topic: enlargement_invariants
  params: {}
  difficulty: medium
  stages: [3, 4]
- topic: enlargement_invariants
  params: {}
  difficulty: hard
  stages: [5, 6, maintenance]
