id: f10-transform-image-coordinates
name: Find the image of a shape after a translation, reflection or rotation
domain: geometry
year_level: ['5', '7']
naplan_domain: [space]
description: Given a triangle drawn on a coordinate grid and a stated translation, reflection (in an axis or a line x = k or y = k), half turn or quarter turn, or two such moves in order, write the coordinates of the image of a named corner.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: [f10-transformations-invariants, f10-coordinate-movement]
answer: pair
sources:
- topic: fr2a_transform_image
  params: {}
  difficulty: easy
  stages: [0, 1, 2]
- topic: fr2a_transform_image
  params: {}
  difficulty: medium
  stages: [3, 4]
- topic: fr2a_transform_image
  params: {}
  difficulty: hard
  stages: [5, 6, maintenance]
