misconceptions:
- id: fr2e-spatial-two-steps-swapped
  description: Swapping two neighbouring steps of a construction, so a step uses something not yet drawn.
- id: fr2e-spatial-angle-not-between-the-sides
  description: Treating two equal sides and an angle that is not between them as enough to show triangles congruent.
- id: fr2e-spatial-fact-completes-a-different-test
  description: Choosing a fact that would prove the triangles congruent by a different test from the one asked for.
- id: fr2e-spatial-leg-given-for-hypotenuse
  description: Offering the other leg of a right-angled triangle where the hypotenuse is needed.
difficulty_progression: 'Easy chooses the correct order for the four steps of a short construction, each of which uses what
  the one before drew. Medium does the same for five-step constructions that carry measurements, such as a triangle from
  two sides and the angle between them or a regular hexagon in a circle. Hard names a congruence test (SAS or RHS)
  and two facts already known, and asks which one extra fact completes it, where the tempting wrong facts give an angle
  that is not between the sides or complete a different test. The exam chain works one right-angled triangle: its hypotenuse,
  the extra fact for the RHS test, the perimeter of the matching triangle, and the steps for constructing it.'
