misconceptions:
- id: omits-translation
  description: Applies only the linear part, M*(x0, y0), and forgets to add the stated
    translation (tx, ty) entirely.
- id: translates-before-linear
  description: Computes M*((x0, y0) + (tx, ty)) instead of M*(x0, y0) + (tx, ty) -- applies
    the translation before the linear part instead of after. Only exercisable when this
    genuinely differs from the correct answer on the drawn values (the linear part is
    never the identity, but can still coincide with the correct order for some individual
    draws, e.g. a reflection whose axis contains the translation vector).
- id: wrong-sign-translation
  description: Subtracts the stated translation (tx, ty) instead of adding it.
- id: inverts-linear-part-only
  description: (exam tier only) Applies the inverse linear map to the image point without
    first subtracting the translation.
- id: subtracts-translation-after-inverting
  description: (exam tier only) Applies the inverse linear map to the image point first,
    then subtracts the untransformed translation vector -- the wrong order for the inverse
    direction.
tags: [university-core-v1, geometry, p14c_coordinate_transformation]
