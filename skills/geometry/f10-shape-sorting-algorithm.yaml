misconceptions:
- id: skips-a-test
  description: Jumps straight to a bin from the shape's familiar geometric name instead of following the stated tests in order.
- id: misreads-a-branch
  description: Follows the wrong branch (yes instead of no, or vice versa) at one test, landing in a neighbouring bin.
- id: stops-at-wrong-test
  description: Stops tracing at an earlier test's bin without continuing to the next test the procedure sends it to.
