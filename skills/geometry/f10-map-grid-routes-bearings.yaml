misconceptions:
- id: map-squares-not-scaled
  description: Counts the grid squares between places and gives that count as the distance, without multiplying by the length of a square.
- id: map-off-by-one-square
  description: Counts the square a place sits in as well as the squares between, or misses one, so the distance is a square out.
- id: map-scale-added
  description: Adds the length of a grid square to the number of squares instead of multiplying.
- id: map-wrong-place-read
  description: Reads the position of the wrong place on the map, such as a nearby place with a different name.
- id: map-route-one-leg
  description: Gives the length of one leg of a walk as the length of the whole walk.
- id: map-legs-subtracted
  description: Subtracts the lengths of two legs of a walk instead of adding them.
- id: map-bearing-not-reversed
  description: Gives the bearing of the way there when the bearing of the way back was asked for.
- id: map-bearing-anticlockwise
  description: Measures a bearing anticlockwise from north instead of clockwise.
- id: map-bearing-from-east
  description: Measures a bearing from east, as an angle on a graph, instead of clockwise from north.
- id: map-bearing-reversed-wrong
  description: Tries to reverse a bearing by adding the wrong angle, for example 90 degrees instead of 180.
