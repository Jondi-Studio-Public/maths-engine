id: f10-map-grid-routes-bearings
name: Use a grid map to find distances, routes and bearings
domain: geometry
description: Given a map drawn on a numbered grid with north at the top and a stated length for each grid square, find the distance between two places in line (one of them possibly given by grid reference), the length of a two-leg route along the grid, and, for a walk through three places, the bearing of the start from the finish. The exam chain finds each leg, the whole walk and the bearing back.
