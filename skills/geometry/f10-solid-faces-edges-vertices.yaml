misconceptions:
- id: solid-hidden-faces-missed
  description: Counts only the faces that can be seen in the drawing and misses the ones hidden at the back or underneath.
- id: solid-hidden-edges-missed
  description: Counts only the solid lines and leaves out the dashed (hidden) edges.
- id: solid-hidden-vertices-missed
  description: Counts only the corners that can be seen and misses those hidden at the back.
- id: solid-ends-forgotten
  description: Counts the side faces of a prism or pyramid and forgets its base and top.
- id: solid-faces-edges-vertices-mixed
  description: Mixes up faces, edges and vertices and gives the count of one where another was asked.
- id: solid-net-corners-counted
  description: Counts the corners drawn on the net instead of the corners of the solid it folds into.
- id: solid-net-lines-counted
  description: Counts the lines drawn on the net instead of the edges of the solid it folds into.
- id: solid-edges-counted-twice
  description: Adds up the sides of every face and gives that total as the number of edges, though each edge is shared by two faces.
- id: solid-euler-sign
  description: Gets the signs or the 2 wrong in Euler's formula, V - E + F = 2, when solving for the vertices.
