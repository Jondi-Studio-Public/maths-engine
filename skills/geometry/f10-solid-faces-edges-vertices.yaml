id: f10-solid-faces-edges-vertices
name: Count the faces, edges and vertices of a solid
domain: geometry
naplan_domain: [space]
year_level: ['5']
description: Given a drawn prism or pyramid, count its faces, edges or vertices, including the ones hidden at the back, and, from a drawn net, find the vertices of the folded solid by counting faces and edges and applying Euler's formula V - E + F = 2.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites:
- name-basic-shapes
answer: number
