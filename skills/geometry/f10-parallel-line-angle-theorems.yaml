misconceptions:
- id: applies-supplementary-to-equal-type
  description: Applies the co-interior (180-minus) rule to a corresponding or alternate (equal-type) pair -- only exercisable/checkable on corresponding/alternate seeds.
- id: applies-equal-to-co-interior
  description: Applies the corresponding/alternate (equal) rule to a co-interior pair -- only exercisable/checkable on co-interior seeds.
- id: reports-x-not-angle
  description: (Hard tier only) Solves the equation correctly for x but reports x itself instead of substituting it back into the angle expression.
