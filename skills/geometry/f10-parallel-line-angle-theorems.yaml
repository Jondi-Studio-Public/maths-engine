id: f10-parallel-line-angle-theorems
name: Apply transversal angle relationships
domain: geometry
description: Given a stated angle and a named relationship (corresponding, alternate or co-interior) formed by two parallel lines cut by a transversal, determine the unknown angle in degrees.
