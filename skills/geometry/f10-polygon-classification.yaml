misconceptions:
- id: partial-property-match
  description: Picks a class satisfying only part of the stated properties (e.g. calls a shape with all sides equal but no stated right angles a "square" instead of "rhombus" -- ignores the missing angle fact).
- id: confuses-parallel-with-equal
  description: Confuses "opposite sides parallel" with "opposite sides equal" (picks parallelogram when only equal-length is stated, or vice versa).
- id: less-specific-class-despite-support
  description: (Exam tier only) Picks the less-specific class when a more-specific one is fully supported by the stated facts (e.g. rhombus instead of square when right angles are also stated).
