misconceptions:
- id: swapped-coordinates
  description: Reports the change in coordinates cyclically permuted -- states dz as the change in x, dx as the change in y, and dy as the change in z.
- id: wrong-direction
  description: Reports the negated change; subtracts the end point from the start point instead, giving (start - end) instead of (end - start).
- id: ignores-first-leg
  description: (hard tier only) Tracks only the second movement and ignores the first; reports the change from the intermediate point B to the end C instead of the total change from A to C.
