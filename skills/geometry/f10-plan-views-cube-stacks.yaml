id: f10-plan-views-cube-stacks
name: Read plan views and elevations of stacked cubes
domain: geometry
naplan_domain: [space]
year_level: ['7']
description: Given the plan view of a structure built from identical cubes, with the number of cubes stacked in each square, find the total number of cubes, the number of squares in the front or right-side elevation (the tallest stack in each column or row shows), and, working back from an elevation, the unknown stack marked on the plan.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites:
