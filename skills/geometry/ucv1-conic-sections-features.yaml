id: ucv1-conic-sections-features
name: Features of ellipses, hyperbolas and parabolas
domain: geometry
year_level:
- university
description: Find the centre, foci, eccentricity, latus rectum and directrix of an ellipse, hyperbola or parabola from its
  equation, completing the square when the equation is in general form.
