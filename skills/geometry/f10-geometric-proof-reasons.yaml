misconceptions:
- id: parallel-line-angle-reasons-confused
  description: Gives corresponding, alternate or co-interior angles as the reason when a different one of the three applies.
- id: congruence-tests-confused
  description: Names the wrong congruence test (SSS, SAS, ASA or RHS) for the equal parts that are known.
- id: congruence-test-confused-with-matching-parts
  description: Gives a congruence test as the reason for equal matching parts, or the reverse.
