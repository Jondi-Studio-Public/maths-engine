description: A short proof of an angle or congruence fact is set out step by step, and the learner gives the reason for each step from a numbered list of eight (alternate, corresponding and co-interior angles, angles on a line, the angle sum of a triangle, the congruence tests, matching parts of congruent triangles and others).
