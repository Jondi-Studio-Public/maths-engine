misconceptions:
- id: bezout-cofactor-is-the-inverse
  description: >-
    Giving the inverse itself where the cofactor of p in the Bezout identity was asked.
- id: bezout-cofactor-sign-slip
  description: >-
    Giving the cofactor of p in the Bezout identity with the wrong sign.
- id: field-adds-numerators-and-denominators
  description: >-
    Adding fractions by adding numerators and denominators separately.
- id: field-discriminant-sign-slip
  description: >-
    Adding 4ac to b squared instead of subtracting it.
- id: field-discriminant-wrong-multiplier
  description: >-
    Subtracting 2ac instead of 4ac from b squared.
- id: field-integer-division-for-inverse
  description: >-
    Dividing as integers, or using the whole-number quotient, where the inverse modulo p is
    needed.
- id: field-inverse-sign-slip
  description: >-
    Using p minus the inverse, the inverse of the negative, where the inverse itself is needed.
- id: field-moves-constant-with-wrong-sign
  description: >-
    Adding the constant to the right side where it should be subtracted.
- id: field-multiplies-by-a-instead-of-its-inverse
  description: >-
    Multiplying by a where the inverse of a modulo p is needed.
- id: field-multiplies-by-denominator-instead-of-inverse
  description: >-
    Multiplying by the denominator where the inverse of the denominator modulo p is needed.
- id: field-negative-of-the-solution
  description: >-
    Giving the additive inverse of the solution, p minus the solution.
- id: field-subtraction-sign-slip
  description: >-
    Adding a term that should have been subtracted.
- id: quadratic-formula-divides-by-a-not-2a
  description: >-
    Dividing by a instead of by 2a in the quadratic formula.
- id: quadratic-formula-ignores-leading-coefficient
  description: >-
    Dividing by 2 instead of by 2a in the quadratic formula.
- id: quadratic-formula-sign-slip-on-b
  description: >-
    Using b where the quadratic formula has -b.
- id: quadratic-formula-without-the-square-root
  description: >-
    Giving only -b divided by 2a, the midpoint of the roots, and leaving out the square root of
    the discriminant.
- id: quadratic-larger-root-given
  description: >-
    Giving the larger root where the smaller was asked.
