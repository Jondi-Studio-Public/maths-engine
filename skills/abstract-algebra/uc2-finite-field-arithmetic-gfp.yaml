id: uc2-finite-field-arithmetic-gfp
name: Do arithmetic and solve equations in the field GF(p)
domain: abstract-algebra
year_level: [university]
description: >-
  Do arithmetic in the finite field GF(p) for a prime p: solve a linear equation, evaluate a sum
  of fractions that needs two modular inverses, and solve a quadratic whose leading coefficient is
  not 1, which needs the discriminant and a square root modulo p. The exam chain finds an inverse,
  a discriminant, a Bezout cofactor and the roots of a quadratic.
status: active
placement_eligible: false
