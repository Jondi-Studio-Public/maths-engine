id: uc2-lagranges-theorem-applications
name: Apply Lagrange's theorem to subgroup orders and indices
domain: abstract-algebra
year_level: [university]
description: >-
  Use Lagrange's theorem and the index of a chain of subgroups with no group given in full: the
  order from a tower of indices, the orders it rules out, the size of a product set, and the
  possible orders of an intersection. The exam chain follows indices through a chain of subgroups to
  the largest subgroup above one of them.
status: active
placement_eligible: false
prerequisites:
- ucv1-finite-subgroup-test
- cyclic-group-element-order
answer: number
