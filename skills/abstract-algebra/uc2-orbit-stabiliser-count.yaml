id: uc2-orbit-stabiliser-count
name: Count orbits and stabilisers of a group action
domain: abstract-algebra
year_level: [university]
description: >-
  Use |G| = |orbit| x |stabiliser|: the stabiliser of a point under a cyclic group of permutations,
  and the orbit of a colouring of an n-gon's vertices under the dihedral group, including three-
  colour patterns from a repeating block. The exam chain finds a stabiliser, an orbit, how many
  symmetries send one colouring to another and a stabiliser from an orbit size.
status: active
placement_eligible: false
prerequisites:
- permutation-composition
- cyclic-group-element-order
answer: number
