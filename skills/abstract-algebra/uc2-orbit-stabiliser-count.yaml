misconceptions:
- id: orbit-size-as-stabiliser-order
  description: >-
    Giving the order of the stabiliser where the size of the orbit was asked.
- id: orbit-size-ignores-reflections-in-stabiliser
  description: >-
    Counting only the rotations that fix the colouring in the stabiliser, and so overstating the
    orbit size.
- id: orbit-size-rotations-only
  description: >-
    Finding the orbit under the rotations alone, leaving out the reflections.
- id: orbit-size-uses-n-not-2n
  description: >-
    Dividing n instead of the order 2n of the dihedral group by the stabiliser order to find the
    orbit size.
- id: orbit-size-whole-group
  description: >-
    Taking the orbit to have as many elements as the group, which is true only when the stabiliser
    is trivial.
- id: preimage-count-assumes-one-to-one
  description: >-
    Counting one preimage for each element, as if the homomorphism were one-to-one.
- id: stabiliser-order-as-group-order
  description: >-
    Giving the order of the whole group as the order of the stabiliser.
- id: stabiliser-order-as-orbit-size
  description: >-
    Giving the size of the orbit where the order of the stabiliser was asked.
- id: stabiliser-order-subtracts-orbit
  description: >-
    Subtracting the orbit size from the group order instead of dividing, to find the stabiliser
    order.
- id: stabiliser-order-trivial-assumed
  description: >-
    Taking the stabiliser to be trivial, as if no non-identity element fixed the point or colouring.
- id: stabiliser-order-uses-n-not-2n
  description: >-
    Dividing n instead of the order 2n of the dihedral group by the orbit size to find the
    stabiliser order.
