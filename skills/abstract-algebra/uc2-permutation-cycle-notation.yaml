misconceptions:
- id: copies-one-permutation
  description: >-
    Reporting one of the two given permutations instead of composing them.
- id: cycle-factor-left-out
  description: >-
    Leaving one of the cycles out of a product of cycles when tracing the points.
- id: cycle-fixed-point-listed
  description: >-
    Listing a fixed point as a one-entry cycle although the convention leaves fixed points out.
- id: cycle-merged-into-one
  description: >-
    Joining two disjoint cycles into one longer cycle instead of keeping them as separate cycles.
- id: cycle-notation-direction-reversed
  description: >-
    Writing each cycle in the opposite direction, which is the cycle notation of the inverse
    permutation.
- id: cycle-one-line-read-as-one-cycle
  description: >-
    Reading the list of images as a single cycle instead of following each point until it returns.
- id: exponent-reduced-by-wrong-modulus
  description: >-
    Reducing the exponent of a permutation power modulo the number of points instead of modulo the
    order of the permutation.
- id: order-as-longest-cycle
  description: >-
    Taking the order of a permutation to be its longest cycle length instead of the least common
    multiple of all of them.
- id: order-as-number-of-cycles
  description: >-
    Taking the order of a permutation to be the number of cycles in it.
- id: order-as-sum-of-cycle-lengths
  description: >-
    Taking the order of a permutation to be the sum of its cycle lengths instead of their least
    common multiple.
- id: reverses-composition-order
  description: >-
    Applying the first-named permutation first when the composite is defined to apply the second one
    first.
