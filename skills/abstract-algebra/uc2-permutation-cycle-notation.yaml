id: uc2-permutation-cycle-notation
name: Write a permutation in disjoint cycle notation
domain: abstract-algebra
year_level: [university]
description: >-
  Write a permutation as a product of disjoint cycles, each starting at its smallest entry with
  fixed points left out: from a list of images, from a product of two permutations, and from a
  product of overlapping cycles composed right to left. The exam chain finds the cycles of a product
  of four cycles, then its order, a reduced power and an image under a high power.
status: active
placement_eligible: false
prerequisites:
- permutation-composition
answer: set
