misconceptions:
- id: ignores-size-mismatch
  description: Compares element-order profiles without first checking |G| = |H|, potentially retaining a claim between groups of different sizes.
- id: assumes-same-size-means-isomorphic
  description: Retains the claim as soon as |G| = |H|, without checking whether the element-order counts actually agree.
- id: mistallies-a-supplied-list
  description: At the hard/exam tiers, mistallies the unsorted element-order list (miscounts how many elements have a given order), leading to the wrong retain/reject decision.
