misconceptions:
- id: dihedral-count-elements-not-subgroups
  description: >-
    Reporting the number of reflections or elements instead of the number of subgroups.
- id: dihedral-count-forgets-reflection-type
  description: >-
    Counting only the rotation subgroup of the given order and forgetting the subgroups that
    contain reflections.
- id: dihedral-count-forgets-rotation-subgroup
  description: >-
    Counting only the dihedral subgroups of the given order and forgetting the rotation subgroup
    of that order.
- id: dihedral-count-sigma-for-tau
  description: >-
    Using the sum of the divisors where the number of divisors counts the rotation subgroups.
- id: dihedral-count-tau-for-sigma
  description: >-
    Using the number of divisors where the sum of the divisors counts the dihedral subgroups.
- id: lattice-contains-contained-swapped
  description: >-
    Counting the subgroups contained in the given subgroup where the ones that contain it were
    asked for.
- id: lattice-counts-all-subgroups
  description: >-
    Counting every subgroup of the group instead of only those that contain the given subgroup.
- id: lattice-excludes-the-subgroup-itself
  description: >-
    Leaving the given subgroup out of the count of subgroups that contain it.
- id: lattice-uses-generator-not-gcd
  description: >-
    Counting divisors of the generator itself instead of the gcd of the generator and the group
    order.
- id: normal-count-every-subgroup
  description: >-
    Treating every subgroup of a dihedral group as normal.
- id: normal-count-only-rotations
  description: >-
    Counting only the subgroups of the rotation subgroup as normal and missing the normal dihedral
    subgroups.
- id: normal-count-parity-swapped
  description: >-
    Counting the index-2 dihedral subgroups for odd n, or missing them for even n.
- id: subgroup-count-assumes-product-subgroups
  description: >-
    Taking every subgroup of a direct product to be a product of subgroups, so multiplying the
    divisor counts.
- id: subgroup-count-cyclic-only
  description: >-
    Counting only the cyclic subgroups of a direct product of cyclic groups.
- id: subgroup-count-divisors-of-order
  description: >-
    Counting the divisors of the group order as if each divisor gave exactly one subgroup.
