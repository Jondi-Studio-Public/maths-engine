id: uc2-subgroup-lattice-count
name: Count the subgroups of a group from its lattice
domain: abstract-algebra
year_level: [university]
description: >-
  Count subgroups from the shape of the subgroup lattice: the subgroups of Z_n that contain a
  given one, the subgroups of a dihedral group of a given order, and all subgroups of a product of
  two cyclic groups. The exam chain counts the subgroups of a dihedral group inside and outside
  its rotation subgroup, in total, and the normal ones.
status: active
placement_eligible: false
prerequisites:
- cyclic-group-element-order
- ucv1-finite-subgroup-test
answer: number
