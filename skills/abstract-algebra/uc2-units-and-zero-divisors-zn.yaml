id: uc2-units-and-zero-divisors-zn
name: Find units, zero divisors and idempotents in Z_n
domain: abstract-algebra
year_level: [university]
description: >-
  Describe the units, zero divisors, nilpotent and idempotent elements of the ring Z_n, and solve
  congruences ax = b (mod n) when a and n share a factor. The exam chain counts the units, zero
  divisors and nilpotent elements of Z_n and lists its idempotents.
status: active
placement_eligible: false
prerequisites:
- modular-arithmetic-congruence
- euclidean-algorithm-gcd
answer: set
