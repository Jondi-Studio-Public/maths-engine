id: uc2-symmetric-group-conjugacy
name: Count conjugacy classes and centralisers in S_n
domain: abstract-algebra
year_level: [university]
description: >-
  Use cycle types to count in the symmetric group: the size of the conjugacy class of a
  permutation, the order of its centraliser, and how many elements have a given order. The exam
  chain finds the order of a permutation, its class size, its centraliser order and the cycle type
  of one of its powers.
status: active
placement_eligible: false
prerequisites:
- permutation-composition
- cyclic-group-element-order
answer: number
