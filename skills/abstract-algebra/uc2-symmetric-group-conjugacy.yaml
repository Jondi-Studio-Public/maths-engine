misconceptions:
- id: centraliser-forgets-repeated-cycle-symmetry
  description: >-
    Leaving out the m! ways of swapping m cycles of the same length when finding the centraliser.
- id: centraliser-order-is-class-size
  description: >-
    Giving the size of the conjugacy class where the order of the centraliser was asked.
- id: centraliser-order-is-element-order
  description: >-
    Giving the order of the permutation as the order of its centraliser.
- id: centraliser-order-is-product-of-cycle-lengths
  description: >-
    Taking the order of the centraliser to be the product of the cycle lengths, forgetting that
    equal cycles can be swapped.
- id: class-size-counts-cycles
  description: >-
    Giving the number of cycles of the permutation as the number of conjugates.
- id: class-size-forgets-cycle-rotations
  description: >-
    Leaving out the factor for the different starting points of each cycle, which counts each
    permutation more than once.
- id: class-size-forgets-repeated-cycle-symmetry
  description: >-
    Leaving out the factor for interchanging cycles of the same length, which counts each
    permutation more than once.
- id: class-size-is-centraliser-order
  description: >-
    Giving the order of the centraliser where the size of the conjugacy class was asked.
- id: element-count-misses-a-cycle-type
  description: >-
    Leaving one of the cycle types with the right least common multiple out of the sum.
- id: element-count-order-divides-instead-of-equals
  description: >-
    Counting permutations whose order divides k instead of those whose order is exactly k.
- id: element-count-single-cycle-type
  description: >-
    Counting only the largest cycle type with the right order.
- id: element-count-types-not-elements
  description: >-
    Giving the number of cycle types instead of the number of permutations.
- id: perm-order-is-product-of-cycle-lengths
  description: >-
    Taking the order of a permutation to be the product of its cycle lengths instead of their
    least common multiple.
- id: power-cycle-lengths-without-splitting
  description: >-
    Shortening each cycle by the gcd but forgetting that it splits into that many cycles.
- id: power-exponent-off-by-one
  description: >-
    Finding the cycle type of the permutation raised to a neighbouring power.
- id: power-keeps-cycle-type
  description: >-
    Giving the cycle type of the permutation itself as the cycle type of one of its powers.
