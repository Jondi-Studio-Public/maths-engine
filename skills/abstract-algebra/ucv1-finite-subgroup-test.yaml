misconceptions:
- id: skips-identity-check
  description: Concludes S is a subgroup (or reports a different failure) without noticing the identity element is missing from S.
- id: assumes-closure-implies-nothing-else
  description: Treats a closure failure as if it were an identity failure, or vice versa, rather than reporting the FIRST failure in the stated identity/closure/inverses order.
- id: believes-finite-closed-subset-can-lack-inverses
  description: Picks the 'fails inverses' option, which is mathematically impossible for a finite subset that already has an identity and is closed (the finite subgroup test theorem forces inverses too) -- offered as a guaranteed-wrong distractor every draw.
