id: ucv1-finite-subgroup-test
name: Test a finite subset for subgroup closure
domain: abstract-algebra
year_level: [university]
description: >-
  Decide whether an explicitly listed subset of a finite group is a subgroup by checking identity,
  closure and inverses in that order, reporting the first condition that fails. The exam tier works
  in the group of units modulo n, finding the order of the group, the order of the subgroup
  generated by an element, its index and the number of elements outside it.
status: active
placement_eligible: false
prerequisites:
- finite-set-operations
answer: mcq
