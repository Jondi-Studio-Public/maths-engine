id: uc2-sylow-counting
name: Count Sylow subgroups and the elements they account for
domain: abstract-algebra
year_level: [university]
description: >-
  Apply Sylow's theorems to a finite group of stated order n: the order of a Sylow p-subgroup, the possible values of n_p (1 mod p and dividing the
  part of n that p does not divide), how many values are allowed, how many elements have order p when n_p is given, and the elements left over
  once the prime-order Sylow subgroups of two primes are counted (for orders such as 12, 15, 21, 30), together with the least number of fixed points
  of a p-group acting on a set of N points. The exam chain finds the set of possible n_q, the elements of order q and the elements left over.
status: active
placement_eligible: false
