id: uc2-dihedral-group-compositions
name: Multiply elements of a dihedral group
domain: abstract-algebra
year_level: [university]
description: >-
  Multiply elements r^i s^j of the dihedral group D_n using s r = r^(-1) s, giving the product as
  the pair (i, j): two elements, a word of five or six factors, a conjugate and a commutator. The
  exam chain multiplies two reflections and follows through to the order of the product, the index
  of the subgroup it generates and the order of a commutator.
status: active
placement_eligible: false
