id: uc2-cosets-and-index
name: List cosets and find the index of a subgroup
domain: abstract-algebra
year_level: [university]
description: >-
  List the elements of a coset: in Z_n for a subgroup given by a non-minimal generator, in the group
  of units modulo n, and a left coset in S_4 where the right coset is a different set. The exam
  chain finds the order and index of a subgroup of Z_N and a coset of it.
status: active
placement_eligible: false
prerequisites:
- ucv1-finite-subgroup-test
- cyclic-group-element-order
answer: set
