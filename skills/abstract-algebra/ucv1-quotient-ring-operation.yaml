misconceptions:
- id: subtracts-instead-of-adds
  description: Subtracts the two polynomials instead of adding them (easy tier only).
- id: mismatched-degree-addition
  description: Adds each coefficient to the wrong degree of the other polynomial (easy tier only).
- id: drops-second-polynomial
  description: Reports the first polynomial alone, dropping the second entirely (easy tier only).
- id: forgets-to-reduce
  description: Reports the unreduced sum or product without applying the modulus at all.
- id: sign-error-in-reduction
  description: Substitutes the modulus relation with the wrong sign while reducing.
- id: drops-a-term-of-modulus
  description: Applies the reduction substitution but omits the modulus's constant term.
- id: coefficient-transposition
  description: Reports the reduced remainder with its coefficients in the wrong order.
- id: forgets-mod-p-reduction
  description: Reduces modulo the polynomial correctly but leaves coefficients unreduced modulo p (exam tier only).
- id: forgets-to-reduce-mod-m
  description: Reduces coefficients modulo p but skips the polynomial reduction modulo m(x) (exam tier only).
