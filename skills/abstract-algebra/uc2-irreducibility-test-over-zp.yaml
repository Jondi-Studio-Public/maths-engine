id: uc2-irreducibility-test-over-zp
name: Factor a polynomial over Z_p and test irreducibility
domain: abstract-algebra
year_level: [university]
description: >-
  Factor a polynomial over Z_p into irreducibles and report the degrees of the factors. A root
  test settles degrees 2 and 3, but from degree 4 a polynomial with no root can still have a
  quadratic or cubic factor. The exam chain counts the linear factors, the degree left, the
  degrees of all factors and the number of maximal ideals of the quotient ring.
status: active
placement_eligible: false
prerequisites:
- integer-polynomial-quotient-remainder
- ucv1-quotient-ring-operation
answer: ordered_list
