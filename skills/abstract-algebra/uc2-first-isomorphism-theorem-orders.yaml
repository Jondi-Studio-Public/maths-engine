id: uc2-first-isomorphism-theorem-orders
name: Find kernel and image orders by the first isomorphism theorem
domain: abstract-algebra
year_level: [university]
description: >-
  Use the first isomorphism theorem to find an order when the others are not given: the kernel of
  a map Z_m to Z_n or of a map from Z_m x Z_n to Z_k, and the size of the image of a power map on
  the unit group of Z_n, where the group is often not cyclic. The exam chain finds the image
  order, the kernel order, the order of a coset in the quotient by the kernel and the size of a
  fibre.
status: active
placement_eligible: false
