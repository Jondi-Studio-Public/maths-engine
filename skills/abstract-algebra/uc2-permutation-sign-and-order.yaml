id: uc2-permutation-sign-and-order
name: Find the order, parity and powers of a permutation
domain: abstract-algebra
year_level: [university]
description: >-
  Find the order of a permutation from its cycle lengths, count the even permutations in a list, and
  find the order of a power of a permutation. The exam chain finds the order, the least number of
  transpositions, the order of a power and how many powers are even.
status: active
placement_eligible: false
prerequisites:
- permutation-composition
- cyclic-group-element-order
answer: number
