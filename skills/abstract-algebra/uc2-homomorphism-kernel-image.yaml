id: uc2-homomorphism-kernel-image
name: Find the kernel and image of a homomorphism
domain: abstract-algebra
year_level: [university]
description: >-
  Find the order of the kernel or image of an explicit homomorphism between small abelian groups: x
  to kx between cyclic groups, the power map on the units modulo n, and a map from a product of
  cyclic groups that is not onto. The exam chain finds the image, kernel and fibre sizes and the
  least preimage of an element.
status: active
placement_eligible: false
prerequisites:
- ucv1-finite-subgroup-test
- cyclic-group-element-order
answer: number
