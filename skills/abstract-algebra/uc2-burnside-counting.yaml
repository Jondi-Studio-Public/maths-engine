id: uc2-burnside-counting
name: Count arrangements up to symmetry with Burnside's lemma
domain: abstract-algebra
year_level: [university]
description: >-
  Count necklaces and bracelets by averaging the colourings fixed by each symmetry: all colours
  allowed, then reflections included, then exactly m beads of one colour. The exam chain finds two
  fixed-colouring counts and uses them to count bracelets and necklaces.
status: active
placement_eligible: false
