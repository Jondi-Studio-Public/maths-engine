misconceptions:
- id: coset-order-ignores-the-subgroup
  description: >-
    Giving the order of the representative in the big group as the order of its coset in the
    quotient.
- id: coset-order-is-exponent
  description: >-
    Giving the exponent of the quotient as the order of one particular coset.
- id: elements-killed-by-k-taken-as-k
  description: >-
    Taking the number of elements with kg = 0 to be k itself, as in a cyclic group where k divides
    the order.
- id: invariant-factors-order-swapped
  description: >-
    Listing the invariant factors with the larger one first, so that the smaller does not divide
    the larger.
- id: pair-order-taken-as-product-of-component-orders
  description: >-
    Taking the order of a pair to be the product of the orders of its components instead of their
    least common multiple.
- id: quotient-assumed-cyclic
  description: >-
    Writing the quotient as a single cyclic group Z_1 x Z_N without checking whether it splits.
- id: quotient-element-order-in-the-big-group
  description: >-
    Giving the order of the representative in the original group as its order in the quotient.
- id: quotient-element-order-is-group-order
  description: >-
    Giving the order of the quotient group as the order of the element in it.
- id: quotient-element-order-is-subgroup-order
  description: >-
    Giving the order of the subgroup that was divided out as the order of an element of the
    quotient.
- id: quotient-factorwise-instead-of-by-lattice
  description: >-
    Taking the quotient of each coordinate by its own component of the generator, which ignores
    that the generator ties the coordinates together.
- id: quotient-order-forgets-the-subgroup
  description: >-
    Giving the order of the whole group as the order of the quotient.
- id: quotient-order-is-subgroup-order
  description: >-
    Giving the order of the subgroup generated as the order of the quotient group.
- id: quotient-solutions-from-largest-factor-only
  description: >-
    Counting solutions of kg = 0 in the larger cyclic factor only and ignoring the smaller one.
- id: solution-counts-added-not-multiplied
  description: >-
    Adding the numbers of solutions in the two factors of a direct product instead of multiplying
    them.
