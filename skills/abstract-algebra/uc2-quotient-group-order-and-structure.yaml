id: uc2-quotient-group-order-and-structure
name: Find the order and structure of a quotient group
domain: abstract-algebra
year_level: [university]
description: >-
  Find the order of an element and of the whole quotient group of an abelian group, and read off
  its structure: the order of a coset in Z_n/⟨k⟩, the order of (Z_m × Z_n)/⟨(a, b)⟩, and how many
  elements of the quotient are killed by a given integer, which needs the invariant factors. The
  exam chain finds the order of a generator, the order of the quotient, the order of a coset and
  the invariant factors.
status: active
placement_eligible: false
