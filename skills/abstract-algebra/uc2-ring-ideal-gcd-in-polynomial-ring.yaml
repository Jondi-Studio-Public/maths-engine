id: uc2-ring-ideal-gcd-in-polynomial-ring
name: Find the generator of an ideal in a polynomial ring
domain: abstract-algebra
year_level: [university]
description: >-
  Find the generator of an ideal in a polynomial ring over a field. The ideal generated by two
  polynomials is generated by their monic gcd, found by Euclid's algorithm in Q[x] and in Z_p[x],
  and the intersection of two principal ideals is generated by the monic lcm. The exam chain does
  one division step, finds the gcd, and then the dimension and size of the quotient ring.
status: active
placement_eligible: false
prerequisites:
- integer-polynomial-quotient-remainder
- ucv1-quotient-ring-operation
answer: expression
