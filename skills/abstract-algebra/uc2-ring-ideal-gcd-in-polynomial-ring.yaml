misconceptions:
- id: division-sign-slip
  description: >-
    Giving the negative of the remainder, which is the remainder of the division of the opposite
    polynomial.
- id: division-step-incomplete
  description: >-
    Subtracting g from f once without matching the leading term, and calling that the remainder.
- id: ideal-generator-is-lcm
  description: >-
    Giving the lcm of the two polynomials as the generator of the ideal they generate, instead of
    the gcd.
- id: ideal-generator-is-one-of-the-polynomials
  description: >-
    Taking one of the two generators, up to a scalar, as the generator of the ideal.
- id: ideal-generator-misses-a-common-factor
  description: >-
    Finding only one of the common factors, so that the generator has too low a degree.
- id: ideal-generator-not-monic
  description: >-
    Giving a scalar multiple of the gcd as the generator of the ideal, so that the generator is
    not the monic one.
- id: ideal-generator-root-sign-slip
  description: >-
    Writing the factor x + r where the common root r gives the factor x - r.
- id: ideal-generator-stopped-at-first-remainder
  description: >-
    Stopping Euclid's algorithm at the first remainder instead of continuing to the last non-zero
    one.
- id: intersection-confused-with-sum
  description: >-
    Giving the gcd, the generator of the sum of the ideals, as the generator of the intersection.
- id: intersection-generated-by-the-product
  description: >-
    Taking the product fg as the generator of the intersection, which counts the common factor
    twice.
- id: lcm-drops-the-common-factor
  description: >-
    Multiplying only the parts that are not shared and leaving the common factor out of the lcm.
- id: quotient-dimension-counts-the-constant-term-twice
  description: >-
    Giving one more than the degree as the dimension, counting the constant term as an extra basis
    element.
- id: quotient-dimension-is-degree-of-f
  description: >-
    Taking the dimension of the quotient ring to be the degree of f instead of the degree of the
    gcd.
- id: remainder-confused-with-quotient
  description: >-
    Giving the quotient of the division where the remainder was asked.
- id: remainder-made-monic
  description: >-
    Scaling the remainder to be monic, although a remainder is not normalised.
- id: ring-size-is-dimension
  description: >-
    Giving the dimension of the quotient ring as its number of elements.
- id: ring-size-is-dimension-times-p
  description: >-
    Multiplying the dimension by p where the number of elements is p to the power of the
    dimension.
