misconceptions:
- id: conjugate-count-all-reflections
  description: >-
    Giving the number of reflections as the number of conjugates of a dihedral subgroup.
- id: conjugate-count-assumes-normal
  description: >-
    Taking the subgroup to be normal and so reporting a single conjugate.
- id: conjugate-count-elements-not-subgroups
  description: >-
    Counting the permutations that are conjugate to a generator where the conjugate subgroups were
    asked for.
- id: conjugate-count-is-index
  description: >-
    Giving the index of the subgroup as the number of its conjugates, which overcounts when pairs
    of reflections give the same conjugate.
- id: conjugate-count-is-normaliser-order
  description: >-
    Giving the order of the normaliser where the number of conjugates, its index, was asked.
- id: conjugate-count-is-order
  description: >-
    Giving the order of the subgroup as the number of its conjugates.
- id: normaliser-order-is-centraliser
  description: >-
    Giving the order of the centraliser of a generator as the order of the normaliser of the
    subgroup.
- id: normaliser-order-is-conjugate-count
  description: >-
    Giving the number of conjugates of the subgroup as the order of its normaliser.
- id: normaliser-order-is-subgroup-order
  description: >-
    Taking the normaliser to be the subgroup itself.
- id: normaliser-order-is-whole-group
  description: >-
    Giving the order of the whole group as the order of the normaliser, which is true only for a
    normal subgroup.
- id: subgroup-order-is-generator-order
  description: >-
    Giving the order of one generator as the order of the subgroup the generators produce.
- id: subgroup-order-is-index
  description: >-
    Giving the index of the subgroup where its order was asked.
