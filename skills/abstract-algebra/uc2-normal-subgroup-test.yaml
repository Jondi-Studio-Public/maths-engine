id: uc2-normal-subgroup-test
name: Test normality by counting conjugates of a subgroup
domain: abstract-algebra
year_level: [university]
description: >-
  Count the distinct conjugates of a subgroup, which is 1 exactly when it is normal, and use the
  count to find the order of its normaliser. The conjugates of a dihedral subgroup, of subgroups
  of S_4, and the normaliser of a two-generator subgroup of S_5 are all counted from the
  generators. The exam chain finds the order of a subgroup of S_5, the order of its normaliser and
  the number of its conjugates.
status: active
placement_eligible: false
prerequisites:
- cyclic-group-element-order
- ucv1-finite-subgroup-test
- permutation-composition
answer: number
