misconceptions:
- id: assumes-well-formed-because-evaluable
  description: Tries to evaluate a malformed string by guessing at a plausible parse, and reports true/false instead of recognising it is not a formula at all.
- id: assumes-derivable-means-true
  description: Sees premises and a modus-ponens derivation and reports the derivable-but-false option automatically, without checking the interpretation -- missing that the same derivation context also appears attached to draws where the conclusion is actually true.
- id: evaluates-the-premises-instead-of-the-conclusion
  description: Checks whether the stated premises are true under the interpretation (irrelevant to syntactic derivability) instead of checking the derived conclusion's own truth value.
- id: misreads-negation-scope
  description: Applies a leading negation to only the first atom of a longer subformula instead of the whole parenthesised group it prefixes.
