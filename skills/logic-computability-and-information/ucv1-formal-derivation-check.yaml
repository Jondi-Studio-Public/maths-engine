  params: {tier: exam}
  difficulty: exam
  stages: [exam]
misconceptions:
- id: confuses-mp-output
  description: Applies Modus Ponens but reports the antecedent again instead of the consequent.
- id: wrong-conjunct
  description: Applies Conjunction Elimination but names the opposite conjunct from the one the rule licenses.
- id: stops-checking-early
  description: Finds one valid line and stops, missing a later line that actually fails (or reports a failure among lines that are all valid).
