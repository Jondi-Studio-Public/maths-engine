id: uc2-error-correcting-codes
name: 'Error-correcting codes: distance, syndromes and bounds'
domain: logic-computability-and-information
year_level:
- university
description: 'Work with binary and small linear codes: Hamming distance, the number of codewords q^k and the rate k/n, the
  minimum distance of a code from its words, its generator matrix or its parity-check matrix, the errors it detects (d − 1)
  and corrects (⌊(d − 1)/2⌋), syndrome decoding of the [7, 4] Hamming code and of a systematic code, and the sphere-packing
  bound.'
