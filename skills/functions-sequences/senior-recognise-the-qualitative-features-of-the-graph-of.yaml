- topic: pv1e_exp_asymptote
  params: {tier: exam}
  difficulty: exam
  stages: [exam]
misconceptions:
- id: y-intercept
  description: 'Gives y = k + 1, the height where the curve crosses the y-axis, instead of the height it levels off at.'
- id: x-axis
  description: 'Gives y = 0, taking the x-axis as the asymptote because the curve seems to run along it or crosses it.'
- id: sign-flipped
  description: 'Gives y = -k, reading the level height on the wrong side of the x-axis.'
- id: off-by-one
  description: 'Gives y = k - 1, reading the level end one square away from the gridline it runs along.'
- id: off-by-two
  description: 'Gives y = k + 2, reading the level end two squares from the gridline it runs along.'
- id: squares-not-units
  description: 'Counts squares up instead of using the vertical scale, giving y = k/2 when one square is 2 units.'
