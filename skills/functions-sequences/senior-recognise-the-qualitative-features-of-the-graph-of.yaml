id: senior-recognise-the-qualitative-features-of-the-graph-of
name: 'Read the horizontal asymptote of y = a^x + k off its graph'
domain: functions-sequences
description: 'Given the graph of y = a^x + k (a > 0, a not 1) on a labelled integer grid with k an integer and no asymptote drawn, state the equation of its horizontal asymptote, y = k, by reading the height the level end of the curve runs along. The values of a and k are never printed.'
status: deferred
deferred_reason: visual
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites:
- f10-exponential-relations-equations
- senior-review-indices-including-fractional-indices-and-the-index
answer: pair
sources:
- topic: pv1e_exp_asymptote
  params: {tier: easy}
  difficulty: easy
  stages: [0, 1, 2]
- topic: pv1e_exp_asymptote
  params: {tier: medium}
  difficulty: medium
  stages: [3, 4]
- topic: pv1e_exp_asymptote
  params: {tier: hard}
  difficulty: hard
