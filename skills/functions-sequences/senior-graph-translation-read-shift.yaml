id: senior-graph-translation-read-shift
name: 'Read the shifts of a translated graph: y = f(x) + a and y = f(x + b)'
domain: functions-sequences
year_level: ['11']
description: Given the graphs of y = f(x) and a translated graph y = g(x) on one integer grid, read the translation
  from the picture. Easy reads the vertical shift a in g(x) = f(x) + a, medium reads the horizontal shift b in g(x)
  = f(x + b) (where a positive b moves the graph left), hard picks the equation g(x) = f(x + b) + a that matches
  both shifts, and the exam chain reads b, then a, then follows the marked point P on f to its image on g. Every
  vertex and point sits on a grid crossing, and the shifts are never printed.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: [function-notation]
answer: mcq
