misconceptions:
- {id: vertical-shift-sign-reversed, description: 'Reports the size of the vertical shift with the wrong sign, for
    example calling a graph that moved down a positive shift.'}
- {id: vertex-height-as-shift, description: Reports the height of a vertex (of f or of g) on the grid instead of
    how far the graph moved.}
- {id: horizontal-sign-reversed, description: 'Takes f(x + b) as a move to the right by b, so b is given with the
    wrong sign: adding inside the brackets moves the graph left.'}
- {id: vertex-x-as-shift, description: Reports the x-coordinate of a vertex instead of how far the vertex moved.}
- {id: shifts-swapped, description: Writes the horizontal shift in the vertical position of the equation and the
    vertical shift in the horizontal position.}
- {id: one-sign-flipped, description: Gets one of the two shifts in the equation right and the other with the wrong
    sign.}
- {id: image-x-sign-reversed, description: 'Moves the x-coordinate of the marked point the wrong way, adding b to
    it instead of subtracting b.'}
- {id: image-keeps-x, description: Leaves the x-coordinate of the marked point unchanged after a horizontal translation.}
difficulty_progression:
  easy: {steps: 2, demand: "'Compare the vertex heights of f and g and find the vertical shift a, including its sign.'"}
  medium: {steps: 3, demand: 'Compare the vertex positions along the x-axis, then turn the move into b in f(x +
      b), reversing the sign.'}
  hard: {steps: 4, demand: Read both the horizontal and the vertical move of the vertex and write both into g(x)
      = f(x + b) + a with the right signs.}
  exam: {steps: 5, demand: 'Read b, then a, then use them to move a marked point of f to the matching point of g,
      one coordinate at a time.'}
