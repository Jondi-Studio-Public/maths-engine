misconceptions:
- id: forgot-to-subtract-the-constant
  description: Solves 10^(y/a) (or e^(y/a)) instead of subtracting b from y first.
- id: divides-after-exponentiating
  description: Computes base^(y - b) and then divides the whole result by a, instead of dividing the exponent (y - b) by a before exponentiating.
- id: wrong-base
  description: Uses base e where the model states base 10, or base 10 where the model states base e.
- id: forgot-the-input-shift
  description: Solves for the un-shifted value 10^((y-b)/a) instead of subtracting the stated shift c (hard tier).
- id: reports-one-level-instead-of-the-gap
  description: States the input at one of the two target levels instead of the gap between them (exam tier).
