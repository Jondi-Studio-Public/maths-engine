  stages: [3, 4]
- topic: additive_multiplicative_patterns
  params: {tier: hard}
  difficulty: hard
  stages: [5, 6, maintenance]
misconceptions:
- id: wrong-direction
  description: Applies the opposite sign of the true difference (adds when it should subtract, or vice versa).
- id: off-by-one-position
  description: Computes the value one step too early or too late (uses the constant difference but at the wrong position relative to the gap).
- id: repeats-a-neighbour
  description: States one of the two terms immediately flanking the gap, unchanged, instead of computing the true missing value.
