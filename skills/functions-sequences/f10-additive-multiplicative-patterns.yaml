id: f10-additive-multiplicative-patterns
name: Complete constant-difference sequences with missing terms
domain: functions-sequences
description: Given a sequence of numbers that increases or decreases by a constant amount, with one or more terms missing at the end or within the sequence, state the value of the missing term(s).
status: active
placement_eligible: false
prerequisites:
- common-difference
- generate-sequence-from-rule
answer: ordered_list
sources:
- topic: additive_multiplicative_patterns
  params: {tier: easy}
  difficulty: easy
