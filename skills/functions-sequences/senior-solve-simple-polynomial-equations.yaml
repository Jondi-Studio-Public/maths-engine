misconceptions:
- id: states-conjugate-root
  description: States the conjugate root (negative imaginary part) instead of the root with positive imaginary part.
- id: sign-error-on-real-part
  description: Flips the sign of the real part of the root.
- id: forgets-real-shift
  description: States only the imaginary part, forgetting the real shift p (medium/hard, where p != 0).
- id: off-by-one-imaginary-part
  description: States an imaginary part one unit away from the correct value.
