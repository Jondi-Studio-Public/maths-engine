id: f10-algebra-conjecture-algorithm
name: Test conjectures and vary formula inputs
domain: functions-sequences
year_level: ['7', '8', '10']
naplan_domain: [algebra]
description: Find how a formula's output changes when its inputs change, find the smallest whole number that defeats a conjecture,
  and find which entry of a quadratic or exponential table breaks one.
