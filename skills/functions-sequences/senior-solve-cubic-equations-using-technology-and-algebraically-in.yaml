misconceptions:
- id: names-a-smaller-root
  description: States one of the other real roots instead of the largest one (easy/medium/hard tiers).
- id: misapplied-rational-root-theorem
  description: Tests only integer divisors of the constant term, ignoring the leading coefficient, and reports that integer as the root (medium tier).
- id: negated-root
  description: States the negation of the correct real root (medium tier).
- id: transcribed-sign-error
  description: Recomputes the root of a cubic with one coefficient's sign flipped (hard tier, single-real-root draws).
- id: ignores-the-stated-domain
  description: Reports a mathematically valid root of the cubic that lies outside the stated physical domain (exam tier).
