misconceptions:
- id: multiplied-not-powered
  description: Multiplies the base and the log value (b*k) instead of raising the base to that power (b^k).
- id: power-wrong-way
  description: Swaps the base and the log value, raising k to the power b instead of b to the power k.
- id: forgot-c
  description: Divides the target power by the coefficient without subtracting the constant term first.
- id: sign-of-c
  description: Adds the constant term instead of subtracting it when rearranging.
- id: forgot-to-exponentiate
  description: Treats the log's stated value k as if it were the argument's own value, never exponentiating at all.
- id: off-by-one-exponent
  description: Uses one more than the correct exponent when converting to exponential form.
- id: did-not-isolate
  description: (medium tier) Treats the equation's un-isolated constant as if it were already the isolated log value.
- id: law-wrong-way
  description: (hard tier) Applies the product law where the quotient law is needed, or vice versa, or combines the extra log term additively instead of multiplicatively.
- id: quotient-inverted
  description: (exam tier) Solves with the two linear arguments' roles swapped.
- id: ignores-second-log
  description: (exam tier) Solves as if the second logarithm were not present at all.
