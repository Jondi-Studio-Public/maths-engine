id: senior-define-the-natural-logarithm-ln-x-log-ex
name: Define the natural logarithm (ln x = log e x)
domain: functions-sequences
description: Given bounded, fully specified inputs, define the natural logarithm \(\ln x=\log_ex\). Return the resulting value, expression, relation, or classification.
status: active
placement_eligible: false
prerequisites:
- function-notation
answer: number
sources:
- topic: natural_logarithm_define
  params: {variant: ln_of_e_power}
  difficulty: easy
  stages: [6]
- topic: natural_logarithm_define
  params: {variant: ln_general}
  difficulty: medium
  stages: [6]
- topic: natural_logarithm_define
  params: {variant: e_to_the_k}
  difficulty: hard
