misconceptions:
- id: treats-e-to-the-k-as-the-answer
  description: Forgets to apply ln, states the numeric value of e^k itself (easy tier only).
- id: states-eulers-number-regardless-of-k
  description: Confuses e's own value with the answer, returns a constant 2.718 (easy tier only).
- id: uses-log-base-10-instead-of-e
  description: Confuses natural log with common log, computes log base 10 instead of base e (medium tier only).
- id: off-by-a-sign
  description: Negates the result (medium tier only).
- id: uses-k-directly-ignoring-the-exponentiation
  description: States the given ln(x) value as if it were x itself (hard tier only).
- id: multiplies-e-by-k-instead-of-exponentiating
  description: Treats a power as a product, computes e*k instead of e^k (hard tier only).
