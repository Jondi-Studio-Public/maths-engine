misconceptions:
- id: ignores-gs-own-domain-restriction
  description: Selects "Defined for all real x", ignoring that g(x) = sqrt(x - a) already restricts the domain to x >= a.
- id: flips-the-inequality-direction
  description: States the domain restriction as x <= a instead of x >= a.
- id: applies-the-exclusion-formula-regardless-of-sign
  description: Excludes x = a + k^2 even when k is negative, forgetting that sqrt(x - a) (always >= 0) can never equal a negative k.
- id: sign-error-solving-for-x
  description: Solves sqrt(x - a) = k with a sign error, excluding x = a - k^2 instead of the correct x = a + k^2.
