id: senior-recognise-features-of-the-graphs-of-y-x
name: 'Recognise features of the graphs of \(y=x^2\), \(y=a{(x-b)}^2+c\), and \(y=a\left(x-b\right)\left(x-c\right)\) including their parabolic nature, turning points, axes of symmetry and intercepts'
domain: functions-sequences
year_level: ['11']
description: Given a parabola drawn on an integer grid, write the equation x = b of its axis of symmetry, by reading a marked turning point, locating an unmarked one, or using the midpoint of two marked points at the same height. Never asks for the vertex pair or any intercept.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites:
- quadratic-vertex
- factorise-quadratic
answer: pair
sources:
- topic: pv1d_parabola_axis_x
  difficulty: easy
  stages: [0, 1, 2]
- topic: pv1d_parabola_axis_x
  difficulty: medium
  stages: [3, 4]
- topic: pv1d_parabola_axis_x
  difficulty: hard
  stages: [5, 6, maintenance]
- topic: pv1d_parabola_axis_x
  difficulty: exam
  stages: [exam]
misconceptions:
- id: sign-of-b
  description: Reads the axis as x = -b, reporting the horizontal shift with the opposite sign.
- id: vertex-height-as-axis
  description: Takes the height of the turning point (its y-coordinate) as the x-value of the axis.
- id: y-axis-as-axis
  description: Gives x = 0, taking the y-axis for the axis of symmetry.
- id: one-point-as-axis
  description: Gives the x-value of a single marked point or root instead of the line midway between a matching pair.
- id: height-of-points-as-axis
  description: Gives the common height of the two matching points as the x-value of the axis.
- id: wrong-pair-midpoint
  description: Takes the midpoint of two marked points that are not at the same height.
