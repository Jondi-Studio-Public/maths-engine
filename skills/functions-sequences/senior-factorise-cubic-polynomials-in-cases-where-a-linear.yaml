misconceptions:
- id: sign-error-on-linear-factor
  description: States (x + p) instead of (x - p) in the linear factor.
- id: swapped-quadratic-coefficients
  description: Swaps the linear and constant coefficients within the quadratic factor.
- id: wrong-constant-in-quadratic
  description: States a quadratic-factor constant one unit away from the correct value.
- id: scalar-factor-omitted
  description: Drops the leading scalar a entirely (hard, non-monic tier only).
