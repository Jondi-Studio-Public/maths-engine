misconceptions:
- id: uses-natural-log-not-log10
  description: Uses the natural logarithm (ln) in place of log10 (decibels, Richter, pH) or log2 (octaves), which are all base-specific formulas.
- id: drops-the-decibel-factor-of-ten
  description: Computes log10(I / I0) without multiplying by the leading factor of 10 in the decibel formula L = 10 log10(I / I0).
- id: sign-error-on-ph
  description: Computes log10[H+] directly, forgetting the negative sign in pH = -log10[H+], and reports a negative pH for a normal aqueous solution.
- id: inverts-the-ratio
  description: Computes log(reference / input) instead of log(input / reference), giving the negative of the correct scale value.
- id: forgets-to-form-the-ratio-first
  description: Plugs the stated multiplier or raw quantity directly into the formula without first dividing by the stated reference value (hard tier).
- id: reports-the-ratio-not-the-log-difference
  description: Reports the ratio between the two stated inputs (or their raw values) instead of computing the actual difference in scale value via a logarithm (exam tier).
