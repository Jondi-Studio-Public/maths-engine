misconceptions:
- id: forgot-additive-constant
  description: Takes the logarithm of the RHS directly, without first subtracting the additive constant (easy/medium tiers).
- id: forgot-leading-coefficient
  description: Takes the logarithm of the RHS-minus-constant directly, without first dividing by the leading coefficient (easy/medium tiers).
- id: sign-error-on-exponent-coefficient
  description: Solves with the sign of the exponent's own coefficient flipped (easy tier).
- id: ignores-linear-exponent-shift
  description: Solves ignoring the constant shift inside the exponent entirely (medium tier).
- id: treats-hidden-quadratic-as-linear
  description: Solves the hidden quadratic in e^x as if it were linear, ignoring the squared term (hard tier).
- id: reports-smaller-solution
  description: States the smaller of the two valid solutions for x instead of the larger one (hard tier).
- id: ignores-linear-term-in-transcendental-equation
  description: Solves e^x = a, ignoring the linear term in x entirely (exam tier).
- id: uses-small-x-linear-approximation
  description: Approximates e^x by 1 + x rather than solving numerically (exam tier).
