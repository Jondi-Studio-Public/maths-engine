id: power-function-graph-features
name: Read the features of power-function graphs
domain: functions-sequences
year_level: ['12']
description: Odd, even or neither for a x^(p/q) and a x^(-n); the quadrants a power-function graph lies in from the sign of
  a and the parity of p and q; both asymptotes of a(x - h)^(-n) + k; the image quadrants after a reflection; every point
  where a x^(p/q) meets y = x; the y-coordinate on a dilated and reflected image; the x-intercepts of a translated
  reciprocal power; and an exam chain on y = a x^(-n) through a point.
status: active
placement_eligible: false
prerequisites: [power-functions-rational-index]
answer: ordered_list
sources:
- topic: vm_power_graph_features
  params: {tier: easy}
  difficulty: easy
  stages: [0, 1, 2]
- topic: vm_power_graph_features
  params: {tier: medium}
  difficulty: medium
  stages: [3, 4]
- topic: vm_power_graph_features
  params: {tier: hard}
  difficulty: hard
  stages: [5, 6, maintenance]
- topic: vm_power_graph_features_exam
  params: {tier: exam}
  difficulty: exam
  stages: [exam]
misconceptions:
- {id: vm-pf-a-divides, description: "Dividing the y-value by u^n as well, so that the constant a comes out as v divided by u^n instead of v times u^n."}
- {id: vm-pf-a-forgets-power, description: "Reading the y-coordinate of the given point as the constant a, without undoing the power of x."}
- {id: vm-pf-a-index-ignored, description: "Treating x^(-n) as if the index were 1, multiplying by x instead of dividing by x^n."}
- {id: vm-pf-asymptote-axes-swapped, description: "Giving the vertical asymptote as the shift in y, or the horizontal asymptote as the shift in x."}
- {id: vm-pf-asymptote-reads-zero, description: "Giving 0 as the asymptote of a translated graph, as if x = 0 and y = 0 never moved."}
- {id: vm-pf-asymptote-sign-of-shift, description: "Reading the horizontal shift in (x - h) or the vertical shift k with the opposite sign."}
- {id: vm-pf-asymptote-takes-dilation, description: "Adding the dilation factor a into the equation of the horizontal asymptote."}
- {id: vm-pf-dilation-applied-to-x, description: "Applying the dilation factor to x inside the function instead of multiplying the y-value by it."}
- {id: vm-pf-dilation-forgotten, description: "Leaving out the dilation factor and reporting the y-value of the unstretched graph."}
- {id: vm-pf-index-inverted, description: "Inverting the root of an intercept, giving m divided by u where u divided by m is required."}
- {id: vm-pf-intercept-shift-forgotten, description: "Ignoring the translation when finding an intercept, so the intercept is not moved."}
- {id: vm-pf-intercept-other-root, description: "Giving the left-most x-intercept when the right-most was asked, taking the negative root of the shifted graph."}
- {id: vm-pf-intercept-sign-of-shift, description: "Moving an x-intercept by the horizontal shift in the wrong direction."}
- {id: vm-pf-intersection-index-not-undone, description: "Giving the factor in a as the intersection, without raising it to the power that undoes the index."}
- {id: vm-pf-intersection-misses-negative-root, description: "Missing the intersection at negative x on an odd function, although the graph is symmetric about the origin."}
- {id: vm-pf-intersection-symmetry-assumed, description: "Assuming a mirror intersection at negative x when the function is even, neither, or its sign of a rules it out."}
- {id: vm-pf-intersection-unit-assumed, description: "Assuming the graph meets y = x only at 0 and 1, whatever the constant a."}
- {id: vm-pf-neither-for-defined-function, description: "Calling a function neither odd nor even although its root is odd and so it is defined for negative x."}
- {id: vm-pf-odd-even-swapped, description: "Swapping odd and even: calling the function odd when the power is even, or even when the power is odd."}
- {id: vm-pf-parity-from-numerator-only, description: "Deciding odd or even from the numerator of the index alone, ignoring that an even root limits the domain."}
- {id: vm-pf-parity-guess, description: "Choosing odd, even or neither without using the parity of the root and the power."}
- {id: vm-pf-quadrant-ignores-even-root-domain, description: "Placing a graph in the left-hand quadrants when an even root means it exists only for x > 0."}
- {id: vm-pf-quadrant-ignores-sign-of-a, description: "Ignoring that a negative constant a turns the graph upside down."}
- {id: vm-pf-quadrant-parity-swapped, description: "Swapping the quadrants of an odd function with those of an even function."}
- {id: vm-pf-quadrant-sign-of-a-reversed, description: "Using the quadrants for the opposite sign of a."}
- {id: vm-pf-reflection-forgotten, description: "Leaving out the reflection and reporting the original graph."}
- {id: vm-pf-reflection-sign-lost, description: "Losing the minus sign of a reflection, or putting one in where there is none."}
- {id: vm-pf-reflection-wrong-axis, description: "Reflecting in the other axis, or in both, so that the quadrants or values are those of a different reflection."}
- {id: vm-pf-root-not-taken, description: "Stopping at the power of x and not taking the root to find the intercept."}
- {id: vm-pf-symmetry-doubled, description: "Doubling the y-value instead of using the symmetry of the graph."}
- {id: vm-pf-symmetry-sign-wrong, description: "Using the symmetry of the wrong kind: negating the y-value of an even function, or keeping the sign for an odd one."}
- {id: vm-pf-a-sign-lost, description: "Losing the sign of a when it is found from the given point."}
- {id: vm-pf-intercept-reads-given-point, description: "Giving the x-coordinate of the given point as the intercept of the translated graph."}
- {id: vm-pf-intercept-scaled-wrong-way, description: "Multiplying the given x-coordinate by the scale factor of the intercept instead of dividing by it."}
- {id: vm-pf-a-extra-power, description: "Multiplying the y-coordinate by one power of the x-coordinate too many when finding a."}
- {id: vm-pf-quadrant-right-branch-only, description: "Giving only the quadrant to the right of the y-axis and leaving out the branch for x < 0."}
- {id: near-miss-value, description: "Gives a value a little way from the right one: out by one or two in a count or a reading, with no single method behind the slip."}
difficulty_progression:
  easy: {steps: 2, demand: 'Decide odd, even or neither from the parity of the root and the power, use that symmetry for a value at -x, or read an asymptote of a translated reciprocal power.'}
  medium: {steps: 3, demand: 'Combine the sign of a with the parity of p and q to place the graph in its quadrants, read both asymptotes of a translated graph, or send the quadrants through a reflection.'}
  hard: {steps: 5, demand: 'Solve a x^(p/q) = x over the integers including the origin and the mirror root, carry a dilation and a reflection through to a coordinate, or solve for every x-intercept of a translated reciprocal power.'}
  exam: {steps: 7, demand: 'Find a from a point, use symmetry for the value at -u (following through), place the graph in its quadrants, then find the intercept of the translated graph (following through).'}
tags: [vce-methods, functions, power-functions, symmetry, asymptote, graph]
