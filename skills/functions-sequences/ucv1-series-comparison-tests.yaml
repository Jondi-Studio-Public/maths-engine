id: ucv1-series-comparison-tests
name: Decide convergence by p-series, comparison, integral and alternating series tests
domain: functions-sequences
description: Decide whether a series converges using the p-series test, direct and limit comparison, and the integral test,
  and classify an alternating series as absolutely convergent, conditionally convergent or divergent.
status: active
placement_eligible: false
