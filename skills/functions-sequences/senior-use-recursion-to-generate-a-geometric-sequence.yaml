misconceptions:
- id: adds-instead-of-multiplying
  description: Treats the common ratio as a common difference (arithmetic operation instead of geometric).
- id: off-by-one-shift-includes-t1
  description: Accidentally includes t1 itself as the first generated term, shifting the whole window back by one position.
- id: reverses-the-order
  description: Returns the correct terms in reversed order instead of the correct sequence.
- id: treats-the-ratio-as-a-multiplier-not-a-divisor
  description: For fractional decay, forgets this is decay and uses the denominator as a multiplier (grows instead of shrinking).
