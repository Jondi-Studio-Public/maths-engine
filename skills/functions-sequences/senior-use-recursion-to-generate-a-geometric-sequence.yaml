id: senior-use-recursion-to-generate-a-geometric-sequence
name: Use recursion to generate a geometric sequence
domain: functions-sequences
description: Generate the next k terms of a geometric sequence by iteratively applying the recursive rule t(n+1) = t(n) * r from a stated first term. The graded answer is exactly the k terms AFTER t1, never including t1 itself. This skill covers three qualitatively different multiplicative behaviours (integer growth, signed/alternating ratios, and fractional decay), aligned with the curriculum topic "Growth and decay in sequences". Generating terms from a recursive rule is a plain list deliverable (a sequence of symbolic/numeric values), not a rendered or constructed artefact. This skill is distinguished from the existing active catalog skill "senior-use-the-formula-t-n-r-n-1" which generates from a CLOSED-FORM rule by direct substitution; this skill generates by applying a RECURSIVE rule iteratively from a stated first term, a genuinely different mechanism.
