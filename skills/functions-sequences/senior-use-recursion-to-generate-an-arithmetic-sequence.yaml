misconceptions:
- id: repeats-the-first-step-constant
  description: States the same single step repeated, never accumulating the common difference.
- id: off-by-one-shift-includes-t1
  description: Accidentally includes t1 itself as the first generated term, shifting the whole window back by one position.
- id: reverses-the-order
  description: Returns the correct terms in reversed order instead of the correct sequence.
