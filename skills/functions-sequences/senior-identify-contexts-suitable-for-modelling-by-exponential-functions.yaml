misconceptions:
- id: uses-simple-not-compound-growth
  description: Applies a linear (simple-interest-style) growth/decay formula A0(1 + rt) instead of compounding A0(1 + r)^t.
- id: off-by-one-exponent
  description: Uses t - 1 or t + 1 periods instead of the stated number of periods.
- id: flips-growth-and-decay
  description: Applies growth where the context decays, or decay where the context grows.
- id: unit-not-converted
  description: Uses the stated elapsed time directly as the exponent without converting it to the rate's own period (medium tier).
- id: sign-error-on-continuous-rate
  description: Uses the wrong sign on the continuous rate constant k in Q0 e^(kt) (hard tier).
- id: confuses-half-life-and-doubling
  description: Applies a doubling-time formula where a half-life was stated, or vice versa (hard tier).
- id: forgot-to-divide-by-the-stated-period
  description: Uses the raw elapsed time as the exponent instead of dividing it by the stated half-life/doubling-time (hard tier).
- id: uses-only-one-phase-rate
  description: Applies only one phase's rate to the entire elapsed time instead of chaining both phases (exam tier).
- id: adds-phases-instead-of-chaining
  description: Adds the two phases' percentage changes instead of compounding them successively (exam tier).
- id: reports-an-endpoint-instead-of-the-change
  description: States the modelled quantity at one of the two stated times instead of the requested increase/decrease between them (exam tier).
