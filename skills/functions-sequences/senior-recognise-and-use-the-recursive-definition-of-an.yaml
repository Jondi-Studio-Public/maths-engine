misconceptions:
- id: off-by-one-first-term
  description: Reports the second given term as if it were the first term, shifting the whole window forward by one position.
- id: adds-instead-of-subtracts
  description: Sums the first two given terms instead of subtracting them to find the common difference.
- id: uses-magnitude-only-d
  description: Reports the common difference's magnitude, dropping the sign, missing that the sequence is decreasing.
