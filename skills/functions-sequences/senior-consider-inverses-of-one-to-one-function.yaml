misconceptions:
- id: unchanged-function
  description: States the original function f(x) unchanged, never inverting at all.
- id: sign-error-on-shift
  description: Flips the sign of an additive constant when rearranging (e.g., (x + b)/a instead of (x - b)/a).
- id: forgot-the-coefficient
  description: Drops the division by the leading coefficient when inverting a linear function.
- id: forgot-the-shift
  description: Omits the additive translation term in a reciprocal inverse function (hard tier only).
