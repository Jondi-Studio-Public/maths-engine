misconceptions:
- id: x-intercept
  description: 'Gives x = -c + 1, the x-intercept one square to the right of the asymptote, instead of the line the curve runs down along.'
- id: sign-flipped
  description: 'Gives x = c, writing the asymptote on the wrong side of the y-axis (the sign slip of reading log_a(x + c)).'
- id: y-axis
  description: 'Gives x = 0, taking the y-axis as the asymptote of a curve that runs down along another gridline.'
- id: off-by-one
  description: 'Gives x = -c - 1, reading the asymptote one square to the left of its gridline.'
- id: off-by-two
  description: 'Gives x = -c + 2, reading the asymptote two squares to the right of its gridline.'
- id: squares-not-units
  description: 'Counts squares across instead of using the horizontal scale, giving x = -c/2 when one square is 2 units.'
