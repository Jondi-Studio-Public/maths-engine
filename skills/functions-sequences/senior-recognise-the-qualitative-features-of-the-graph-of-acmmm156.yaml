id: senior-recognise-the-qualitative-features-of-the-graph-of-acmmm156
name: 'Read the vertical asymptote of y = log_a(x + c) off its graph'
domain: functions-sequences
description: 'Given the graph of y = log_a(x + c) (a > 1) on a labelled integer grid with c an integer and no asymptote drawn, state the equation of its vertical asymptote, x = -c, by reading the gridline the curve runs down along. The values of a and c are never printed.'
status: deferred
deferred_reason: visual
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites:
- senior-define-logarithms-as-indices-a-x-b-is
- logarithm-laws
answer: pair
