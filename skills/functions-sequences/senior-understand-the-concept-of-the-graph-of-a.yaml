id: senior-understand-the-concept-of-the-graph-of-a
name: Understand the concept of the graph of a function
domain: functions-sequences
description: Given a relation drawn on an integer grid, pick the one correct statement. Every option pairs a verdict (it is, or is not, the graph of a function) with a witness vertical line x = a that meets the graph once or more than once. Never asks for a rule, a domain or a range.
status: deferred
deferred_reason: visual
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites:
- function-notation
- coordinate-plane-readiness
answer: mcq
sources:
- topic: pv1f_graph_is_function
  difficulty: easy
  stages: [0, 1, 2]
- topic: pv1f_graph_is_function
  difficulty: medium
  stages: [3, 4]
- topic: pv1f_graph_is_function
  difficulty: hard
  stages: [5, 6, maintenance]
- topic: pv1f_graph_is_function
  difficulty: exam
  stages: [exam]
misconceptions:
- id: curve-means-not-function
  description: Believes any curved graph, or any graph that turns back on itself in height, cannot be the graph of a function.
- id: straight-means-function
  description: Believes any straight or smooth-looking graph must be the graph of a function without testing a vertical line.
- id: tangent-counts-twice
  description: Counts a vertical line that only touches the graph at its edge as meeting it twice.
- id: jump-always-fails
  description: Treats a jump in the graph as failing the vertical line test even when one of the two facing end dots is open.
- id: open-dot-counts
  description: Counts an open dot as a point of the graph.
- id: stray-dot-ignored
  description: Ignores a separate filled dot above or below the graph when applying the vertical line test.
- id: witness-not-checked
  description: Chooses the correct verdict without checking that the stated vertical line meets the graph as claimed.
