id: senior-recognise-features-of-the-graphs-of-y-frac1x
name: 'Read the asymptotes of y = 1/(x - h) + k off its graph'
domain: functions-sequences
description: 'Given the graph of y = 1/(x - h) + k on a labelled integer grid with h and k integers and no asymptote drawn, state its two asymptote equations in the form x = h, y = k by reading where the branches break and where they level off. The values of h and k are never printed.'
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: []
answer: pair
sources:
- topic: pv1e_hyperbola_asymptotes
  params: {tier: easy}
  difficulty: easy
  stages: [0, 1, 2]
- topic: pv1e_hyperbola_asymptotes
  params: {tier: medium}
  difficulty: medium
  stages: [3, 4]
- topic: pv1e_hyperbola_asymptotes
  params: {tier: hard}
