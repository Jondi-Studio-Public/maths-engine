- topic: pv1e_hyperbola_asymptotes
  params: {tier: exam}
  difficulty: exam
  stages: [exam]
misconceptions:
- id: swapped
  description: 'Gives x = k, y = h, reading the horizontal asymptote''s value as the vertical one (or the other way round).'
- id: sign-h
  description: 'Gives x = -h, y = k, writing the vertical asymptote on the wrong side of the y-axis (the sign slip of reading 1/(x + h)).'
- id: sign-k
  description: 'Gives x = h, y = -k, writing the horizontal asymptote on the wrong side of the x-axis.'
- id: branch-point
  description: 'Gives x = h + 1, y = k + 1, the coordinates of the point one square along the branch, instead of the lines the branches approach.'
- id: axis-next-to
  description: 'Gives an asymptote one square beside the axis it actually lies along (x = 1 for x = 0), missing that an axis can be an asymptote.'
- id: squares-not-units
  description: 'Counts squares up instead of using the vertical scale, giving y = k/2 when one square is 2 units.'
