id: senior-determine-the-coordinates-of-the-midpoint-of-two
name: Determine the coordinates of the midpoint of two points
domain: functions-sequences
description: 'Given bounded, fully specified inputs, determine the coordinates of the midpoint of two points. Return the resulting value, expression, relation, or classification. Specifically: state one named coordinate (x or y) of the midpoint of two supplied points, or solve for the corresponding coordinate of a missing endpoint given the midpoint and the other endpoint. Excludes stating the full ordered-pair midpoint (the existing AC9M9A03 skill midpoint-two-points already covers that) and excludes any geometric proof, gradient or distance content.'
