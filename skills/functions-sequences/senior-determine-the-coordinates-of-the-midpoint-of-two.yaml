misconceptions:
- id: misconception-1
  description: Forgot to halve when computing the average (states p1 + p2 instead of (p1 + p2)/2)
- id: misconception-2
  description: Used only one endpoint, ignoring the other point entirely
- id: misconception-3
  description: Subtracted instead of averaged the two coordinates
- id: misconception-4
  description: (hard tier) States the same endpoint again instead of solving for the other
- id: misconception-5
  description: (hard tier) Forgot to double when solving for the other endpoint (states m - x1 instead of 2*m - x1)
