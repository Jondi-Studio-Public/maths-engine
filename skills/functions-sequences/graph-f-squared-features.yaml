id: graph-f-squared-features
name: Find the turning point and meeting points of y = f(x)^2 from the graph or rule of f
domain: functions-sequences
year_level: ['12']
description: State, as typed coordinates, the turning point of y = (f(x))^2 from a drawn straight line (at the zero of f)
  or a drawn parabola (the local maximum between two zeros, or the single turning point of a parabola that misses the
  axis, with the height squared), from an expanded quadratic, or the point where the square meets a line away from the
  axis; the exam chain follows the least value of f through to the local maximum of the square and counts the turning
  points and the solutions of (f(x))^2 = c.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: [function-notation, senior-graph-reciprocal-abs-compare]
answer: pair
