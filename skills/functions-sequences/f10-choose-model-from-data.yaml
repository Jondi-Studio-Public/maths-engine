id: f10-choose-model-from-data
name: Choose a model from a table of values
domain: functions-sequences
year_level: ['9', '10']
naplan_domain: [algebra]
description: Decide whether a table of values follows a linear, quadratic or exponential model by its first differences,
  second differences or ratios, then write the rule, predict, and find where the model stops being sensible.
