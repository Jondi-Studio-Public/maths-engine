id: senior-interpret-the-point-of-intersection-and-other-important
name: Interpret the point of intersection and other important features of given graphs of two linear functions
  drawn from practical contexts; for example
domain: functions-sequences
description: 'Two straight lines, labelled A and B, are drawn on one labelled grid and the learner types the
  ordered pair (x, y) where they meet. No equation, coordinate or rate is ever printed, and the crossing is
  a grid intersection that is not one of the points each line is drawn through, so it is found, not read off
  a marked point. Tier ladder by decision: easy puts the crossing in quadrant I with both axes drawn and
  equal scales, so the decision is finding the one point both lines share; medium puts a negative or zero
  coordinate in the crossing, or draws one line horizontal, so the decision is reading signs and a constant
  y correctly; hard uses unequal axis scales (2 or 5 real units per grid step on one axis), so the decision
  is carrying the axis scale into the coordinates rather than counting squares; exam sets the lines in a
  context (two hire, class, phone, saving or printing plans) with axis labels and units and asks where the
  two plans agree, so the decision is mapping each coordinate to the quantity on its own axis. This skill
  reads the crossing off two drawn lines with no equations; the algebraic find-the-break-even skill is
  senior-solve-practical-problems-that-involve-finding-the-point.'
status: deferred
deferred_reason: visual
