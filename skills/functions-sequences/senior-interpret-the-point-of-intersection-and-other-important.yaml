misconceptions:
- id: swapped-coordinates
  description: Writes the coordinates in the wrong order, (y, x) instead of (x, y).
- id: y-intercept-of-a-line
  description: Gives the point where one of the lines meets the y-axis instead of where the two lines meet each other.
- id: x-intercept-of-a-line
  description: Gives the point where one of the lines meets the x-axis instead of where the two lines meet each other.
- id: neighbouring-grid-point
  description: Reads the crossing one grid line off, giving a neighbouring grid intersection instead of the crossing itself.
- id: a-point-one-line-passes-through
  description: Gives a grid point that one line passes through, taking it for the crossing without checking the other line.
- id: grid-squares-not-axis-units
  description: Counts grid squares from the origin instead of reading the numbers on the axes when the two axes do not use the same scale.
