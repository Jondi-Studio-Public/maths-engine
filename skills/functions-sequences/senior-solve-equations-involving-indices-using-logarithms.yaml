misconceptions:
- id: swaps-base-and-argument
  description: Computes log_target(a) instead of log_a(target), i.e. swaps which number is the base.
- id: treats-index-as-linear-division
  description: Treats a^x = target as meaning x = target/a (confuses exponentiation with division).
- id: forgets-the-coefficient-adjustment
  description: Solves as if the coefficient c were not there (medium tier only).
- id: forgets-the-linear-adjustment
  description: Solves for the logarithm but forgets to subtract the linear term (hard tier only).
