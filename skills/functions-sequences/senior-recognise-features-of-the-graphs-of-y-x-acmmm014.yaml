id: senior-recognise-features-of-the-graphs-of-y-x-acmmm014
name: 'Read the end behaviour of y = x^n off its graph'
domain: functions-sequences
description: 'A curve y = x^n, with n a positive whole number, n = -1 or n = 1/2 and never printed, is drawn on a labelled integer grid, and the learner picks what y does in the direction the question names: as x tends to infinity, as x tends to negative infinity or, for the hyperbola n = -1 from medium up, as x tends to 0 from the right or from the left. The options are always increases without bound, decreases without bound or approaches a fixed value. The class is drawn first, about a third each, then an (n, direction) of that class (n = 1/2 is asked at the right end only), so the hyperbola can have any of the three answers: it levels off at the far ends, rises beside the y-axis on the right and falls beside it on the left.'
difficulty_progression: 'Easy draws n = 1, 2, 3 or -1 in a centred window with both ends in view, asked at either infinity, so the decision is reading the named end, and an odd power at the left end is the one that decreases. Medium adds n = 4, 5 and n = 1/2, whose bend looks like levelling off while it keeps rising, and asks the hyperbola near x = 0 as well, where the level far end is the wrong place to look and the side of the y-axis decides rise or fall. Hard draws only the half of the curve on the named side of the y-axis, so there is no mirror half to compare with: an even power at the left end falls toward the origin read left to right yet increases as x tends to negative infinity, and a near-zero question shows a single branch to be read against the y-axis. Exam moves the half-curve a unit or two off the y-axis so no y-axis is drawn and the curve is a fragment read against the numbers on the grid edges; the near-zero question cannot be moved off the axis, so it keeps the axis on the window edge and is read from the edge numbers.'
