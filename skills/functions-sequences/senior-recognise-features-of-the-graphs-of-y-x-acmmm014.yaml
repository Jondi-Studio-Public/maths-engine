misconceptions:
- id: reads-the-other-end
  description: 'Reads the behaviour at the opposite end of the curve, for example the falling lower-left arm of an odd power when asked about x tending to infinity.'
- id: reads-left-to-right-at-the-left-end
  description: 'Reads the curve left to right at the left end, so an even power that falls toward the origin looks like it decreases, when as x tends to negative infinity it increases without bound.'
- id: reads-a-bend-as-levelling-off
  description: 'Takes a curve that bends or flattens (a square root, or any power far from the origin) as approaching a fixed value, when it keeps increasing or decreasing without bound.'
- id: reads-approach-as-falling
  description: 'Takes the branch of y = 1/x creeping toward the x-axis as heading down without bound, instead of approaching the fixed value 0.'
- id: reads-the-branch-beside-the-axis-as-the-end
  description: 'Takes the branch of y = 1/x rising beside the y-axis as the end behaviour, instead of reading the far end where it levels off.'
- id: reads-the-far-end-instead-of-the-axis
  description: 'Asked about x tending to 0, reads the level far end of y = 1/x and says it approaches a fixed value, when beside the y-axis the branch runs off without bound.'
- id: reads-the-other-side-of-the-axis
  description: 'Asked about x tending to 0 from one side, gives the behaviour of the branch on the other side of the y-axis: rising where the curve falls, or falling where it rises.'
