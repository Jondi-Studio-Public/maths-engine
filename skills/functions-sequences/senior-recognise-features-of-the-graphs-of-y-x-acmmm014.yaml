id: senior-recognise-features-of-the-graphs-of-y-x-acmmm014
name: 'Read the end behaviour of y = x^n off its graph'
domain: functions-sequences
description: 'A curve y = x^n, with n a positive whole number, n = -1 or n = 1/2 and never printed, is drawn on a labelled integer grid, and the learner picks what y does as x tends to infinity or as x tends to negative infinity, whichever the question names: increases without bound, decreases without bound or approaches a fixed value. The class is drawn first, about a third each, then an (n, end) of that class (n = 1/2 is asked at the right end only). Tier ladder by decision: easy draws n = 1, 2, 3 or -1 in a centred window with both ends in view, so the decision is reading the named end, and an odd power at the left end is the one that decreases; medium adds n = 4, 5 and n = 1/2, whose bend looks like levelling off while it keeps rising; hard draws only the half of the curve on the named side of the y-axis, so there is no mirror half to compare with and an even power at the left end falls toward the origin read left to right yet increases as x tends to negative infinity; exam moves that half-curve a unit or two off the y-axis so no y-axis is drawn and the curve is a fragment read against the numbers on the grid edges.'
status: deferred
deferred_reason: visual
