misconceptions:
- id: off-by-one-first-term
  description: Reports the second given term as if it were the first term, shifting the whole window forward by one position.
- id: adds-instead-of-multiplies
  description: Treats the ratio between the first two given terms as if it were a common difference rather than a common ratio.
- id: uses-magnitude-only-r
  description: Reports the common ratio's magnitude, dropping the sign, missing that the sequence alternates.
