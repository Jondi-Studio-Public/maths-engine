misconceptions:
- id: centre-height-as-intercept
  description: Reads the height of the middle of the S-bend (the point of inflection) instead of where the curve crosses the y-axis.
- id: root-as-intercept
  description: Gives one of the x-intercepts, where the curve meets the x-axis, when asked for the y-intercept.
- id: sign-slip
  description: Reads the correct height but writes it with the wrong sign.
- id: off-axis-reading
  description: Reads the curve one grid square to the left or right of the y-axis instead of at x = 0.
- id: line-intercept
  description: Gives the height at which the extra horizontal line L crosses the y-axis instead of the cubic's.
- id: other-curve
  description: Reads the y-intercept of the other cubic in the picture instead of the one through the named point.
