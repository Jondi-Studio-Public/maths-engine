id: senior-recognise-features-of-the-graphs-of-y-x-acmmm017
name: 'Recognise features of the graphs of \(y=x^3\), \(y=a{(x-b)}^3+c\) and \(y=k(x-a)(x-b)(x-c)\), including shape, intercepts and behaviour as \(x\rightarrow\infty\) and \(x\rightarrow-\infty\)'
domain: functions-sequences
description: Given a cubic y = a(x - b)^3 + c or y = k(x - a)(x - b)(x - c) drawn on an integer grid, type its y-intercept, the value of y where the curve crosses the y-axis (an integer on a grid line). Never asks for an x-intercept, the shape, a turning point or the end behaviour.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites:
- senior-factorise-cubic-polynomials-in-cases-where-a-linear
- function-notation
answer: number
sources:
- topic: pv1f_cubic_y_intercept
  difficulty: easy
  stages: [0, 1, 2]
- topic: pv1f_cubic_y_intercept
  difficulty: medium
  stages: [3, 4]
- topic: pv1f_cubic_y_intercept
