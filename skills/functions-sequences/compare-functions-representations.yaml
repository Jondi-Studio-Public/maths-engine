  params: {tier: easy}
  difficulty: easy
  stages: [0, 1, 2]
- topic: fg1_compare_functions
  params: {tier: medium}
  difficulty: medium
  stages: [3, 4]
- topic: fg1_compare_functions
  params: {tier: hard}
