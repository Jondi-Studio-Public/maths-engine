  stages: [5, 6, maintenance]
- topic: exd_x_w12c_compare_functions
  params: {tier: exam}
  difficulty: exam
  stages: [exam]
misconceptions:
- id: compares-starting-values-only
  description: Compares the two functions at x = 0 (their starting values) instead of at the stated input.
- id: compares-the-x-coordinates-of-the-turning-points
  description: Compares where the turning points are, not how high they are.
- id: treats-the-functions-as-equal
  description: Says the functions give the same result because one value was checked or they look alike.
- id: picks-by-the-look-of-the-graph
  description: Picks the function by how the graph looks, not by the values read from it.
