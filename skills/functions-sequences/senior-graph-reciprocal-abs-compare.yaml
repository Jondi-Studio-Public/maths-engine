id: senior-graph-reciprocal-abs-compare
name: Compare y = |f(x)|, y = -f(x), y = f(|x|) and y = 1/f(x) with the graph of y = f(x)
domain: functions-sequences
year_level: ['12']
description: Given the graph of y = f(x), a line or a parabola with whole-number zeros, relate it to the graphs
  of y = |f(x)|, y = -f(x), y = f(|x|) and y = 1/f(x). Easy and medium pick which equation gives a drawn graph g,
  hard reads a value of g at a point using the graph of f alone (including f(|x|) at a negative x and 1/f at a point
  where f is 1 or 2 in size), and the exam chain finds the two vertical asymptotes of 1/f from the zeros of f, their
  distance apart and the value halfway between them.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: [function-notation]
answer: mcq
