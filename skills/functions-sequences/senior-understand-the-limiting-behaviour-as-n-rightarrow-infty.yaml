misconceptions:
- id: assumes-ratio-bounded-converges
  description: Assumes any common ratio near 1 in magnitude converges to 0 without checking whether |r| < 1, overestimating which sequences converge.
- id: ignores-sign-of-ratio
  description: Focuses on the magnitude of r only, missing that r <= -1 makes the sequence oscillate in sign rather than diverge to +infinity the way a positive ratio of the same magnitude would.
- id: treats-oscillation-as-neither
  description: Sees terms alternating in sign and assumes the sequence has no clear trend, misclassifying a shrinking oscillation (|r| < 1 with r negative, e.g. r = -0.9) as "neither" instead of recognising it still converges to 0.
