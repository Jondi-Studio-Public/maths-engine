id: senior-graph-dilation-read-factor
name: Read the dilation factor from the graphs of y = c f(x) and y = f(kx)
domain: functions-sequences
year_level: ['11']
description: Given the graphs of y = f(x) and a dilated graph y = g(x) on one integer grid, read the dilation from
  the picture. Easy reads the vertical factor c in g(x) = c f(x) from the y-intercepts, medium reads the horizontal
  factor k in g(x) = f(kx) from the x-intercepts (where f(kx) divides the x-coordinates by k), hard picks the equation
  that matches a vertical or a horizontal dilation, and the exam chain reads k, then c, then follows the marked
  point P on f to its image on g under y = c f(kx). Every intercept and point sits on a grid crossing, and the factors
  are never printed.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: [function-notation]
