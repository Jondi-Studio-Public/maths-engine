id: senior-recognise-features-of-the-graph-of-y-mx
name: 'Recognise features of the graph of \(y=mx+c\)'
domain: functions-sequences
description: 'A straight line is drawn on a labelled grid with no equation, coordinate or rate printed,
  and the learner picks whether its gradient is positive, negative or zero. The class is drawn first,
  about a third each, and a zero gradient is a horizontal line through two grid intersections. Tier
  ladder by decision: easy centres the window with the y-axis drawn and shows a clearly rising, falling
  or flat line, so the decision is the direction of the line read left to right; medium draws the
  y-axis but lets the line meet it on the side that CONTRADICTS the gradient (a rising line meets it
  below the origin, a falling line above), so the decision is ignoring the intercept and using the
  direction; hard moves the window away from x = 0 so the y-axis and the intercept are not visible, and
  the decision is direction alone; exam gives the axes different scales and makes the steepness of the
  picture independent of the sign (a rising line may look nearly flat, a falling one steep), so the
  decision is that the sign still comes from the direction, not from how steep the line looks. This
  skill asks the qualitative sign only; the numeric pair (m, c) is the neighbour
  senior-determine-the-slope-and-intercepts-of-a-straight.'
