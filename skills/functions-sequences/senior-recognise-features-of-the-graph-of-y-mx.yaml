misconceptions:
- id: reads-rising-line-as-falling
  description: Calls the gradient negative for a line that rises from left to right.
- id: reads-falling-line-as-rising
  description: Calls the gradient positive for a line that falls from left to right.
- id: reads-shallow-line-as-flat
  description: Calls the gradient zero for a line that rises or falls gently, because it looks nearly flat.
- id: sign-of-intercept-as-sign-of-gradient
  description: Takes the side of the origin where the line meets the y-axis as the sign of the gradient, so a rising line that meets the axis below the origin is called negative.
- id: reads-height-above-axis-as-positive-gradient
  description: Calls a horizontal line above the x-axis positive, taking its height as its gradient.
- id: reads-height-below-axis-as-negative-gradient
  description: Calls a horizontal line below the x-axis negative, taking its height as its gradient.
