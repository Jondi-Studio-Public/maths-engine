id: function-concept
name: Understand the function concept
domain: functions-sequences
year_level:
- '9'
- '10'
description: 'Decide whether a set of ordered pairs, an equation, a table or a mapping defines a function: each permitted
  input must have exactly one output, while different inputs may share an output.'
