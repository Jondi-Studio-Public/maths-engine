id: f10-growing-visual-patterns
name: Continue a growing pattern of matchstick figures and find a rule
domain: functions-sequences
year_level:
- '6'
naplan_domain:
- algebra
description: 'Figures 1 to 3 of a pattern built from matchsticks are drawn: find the number of matchsticks in a later figure,
  find the largest figure a stated number of matchsticks will make, and, in the exam chain, write the rule in n and use it
  twice.'
status: active
capability_gates:
- figure_stimulus
needs_figure: true
placement_eligible: false
prerequisites:
- common-difference
- generate-sequence-from-rule
answer: number
