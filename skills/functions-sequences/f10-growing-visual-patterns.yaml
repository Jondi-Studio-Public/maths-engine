difficulty_progression:
  easy:
    steps: 1
    demand: See how many sticks each figure adds and carry on to the next figure.
  medium:
    steps: 2
    demand: Build the rule from the three figures and use it for a figure too far away to draw.
  hard:
    steps: 3
    demand: Build the rule, then work backwards from the number of sticks, allowing for the sticks left over.
  exam:
    steps: 4
    demand: Extend, write the rule, use it forwards and use it backwards.
misconceptions:
- id: fr2c-added-one-each-time
  description: Adding 1 to the count each time instead of the number of sticks that each figure really adds.
- id: fr2c-multiplied-the-first-figure
  description: Multiplying the count in Figure 1 by the figure number, as if the pattern started from nothing.
- id: fr2c-rule-without-constant
  description: Using only the number added each time as the rule, and leaving out what is needed to match Figure 1.
- id: fr2c-added-the-first-figure-again
  description: Adding the count in Figure 1 to the count in Figure 3 instead of the amount added each time.
- id: fr2c-figure-number-off-by-one
  description: Using the figure number one more or one fewer than the one asked for.
- id: fr2c-leftover-rounded-up
  description: Rounding up when the sticks that are left over are not enough to make the next figure.
- id: fr2c-rule-constant-taken-as-first-figure
  description: Adding the count in Figure 1 to the rule instead of the constant that makes the rule fit Figure 1.
