id: model-relationships-with-functions
name: Model relationships with functions
domain: functions-sequences
description: Choose and write the function rule that describes a practical relationship given as a table of values.
  Easy writes the rule of a proportional relationship. Medium writes the rule of a linear relationship with a fixed
  amount, from a table whose inputs skip values. Hard decides between an inverse, a squared and a falling linear
  relationship before writing the rule.
status: active
placement_eligible: false
prerequisites:
- compare-functions-representations
- linear-models
answer: expression
