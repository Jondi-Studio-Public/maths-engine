misconceptions:
- id: forgot-to-divide-by-h
  description: Reports the numerator f(x+h)-f(x) alone, without dividing by h.
- id: sign-error
  description: Negates the difference quotient, as if computing (f(x)-f(x+h))/h instead of (f(x+h)-f(x))/h.
- id: used-h-as-if-limit-were-taken
  description: Reports 2*A*p+B, the h->0 limiting value, instead of the actual stated-h quotient 2*A*p+B+A*h.
