misconceptions:
- id: states-b-instead-of-x
  description: States the computed power instead of the exponent.
- id: off-by-one-exponent
  description: The exponent is off by one unit.
- id: swaps-a-and-x-roles
  description: Raises x to the power a instead of a to the power x.
- id: treats-the-exponent-as-a-multiplier
  description: Confuses exponentiation with multiplication (a^x interpreted as a*x).
- id: ignores-the-negative-sign
  description: States the magnitude but drops the negative sign.
