misconceptions:
- id: forgets-to-divide
  description: Reports f(x2) - f(x1), the total change in y, as if it were the rate of change, without dividing by the width of the interval.
- id: sign-flip
  description: Reports the negative of the correct rate, as if x1 and x2 had been swapped in only the numerator, not the denominator too.
- id: endpoint-value-confusion
  description: Reports f(x2) itself, confusing the function's value at the right endpoint with its rate of change over the interval.
