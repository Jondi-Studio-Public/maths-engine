misconceptions:
- id: rational-index-ignores-power
  description: Takes only the q-th root for x^(p/q) and leaves out the power p.
- id: rational-index-ignores-root
  description: Raises to the power p for x^(p/q) and leaves out the q-th root.
- id: rational-index-divides-instead-of-roots
  description: Reads the index p/q as dividing x^p by q instead of taking a q-th root.
- id: rational-index-domain-range-confused
  description: Gives the vertical shift as the least x in the domain, or the horizontal shift as the least value.
- id: rational-index-ignores-the-index
  description: Divides out the multiplier but does not undo the index, so x = c/a.
- id: rational-index-not-inverted
  description: Raises both sides to the power p/q when q/p was needed.
- id: rational-index-domain-root-parity
  description: Gives x ≥ 0 when the root is odd, or all real numbers when it is even.
