misconceptions:
- id: hybrid-wrong-rule
  description: Uses the rule for a different interval than the one the input belongs to.
- id: hybrid-boundary-point-in-wrong-piece
  description: Uses the rule on the other side of a join when the input equals the join, ignoring whether the inequality is strict.
- id: continuity-sign-error
  description: Makes a sign slip when equating the two rules at the join.
- id: continuity-matches-derivatives
  description: Equates the gradients of the two rules at the join instead of their values.
- id: continuity-collects-k-one-side-only
  description: Collects the unknown constant on one side only when it appears in both rules.
- id: hybrid-range-vertex-misplaced
  description: Takes the lowest value of a parabola piece to be at its vertex when the vertex lies outside that piece's interval, or the reverse.
