id: domain-and-range-intro
name: Identify domain and range in simple contexts
domain: functions-sequences
year_level:
- '9'
- '10'
description: List the domain and range of a function given as ordered pairs, a rule with a stated set of inputs or a practical
  situation, and find the inputs a restriction allows or forbids.
status: active
placement_eligible: false
prerequisites:
- function-concept
- inequality-symbols
answer: list
