misconceptions:
- id: as-if-inverse
  description: 'Treats the relation as inversely proportional, dividing by the scale factor instead of multiplying (easy: y2 = y1/t; medium: x2 = x1/t; hard: divides the stated force by the combined scale factor t1*t2 instead of multiplying, F1/(t1*t2)).'
- id: as-if-quadratic
  description: 'Treats the relation as quadratically related, applying the square of the scale factor instead of the scale factor itself (easy/medium: an extra factor of t; hard: applies the square of the combined scale factor, F1*(t1*t2)^2).'
- id: no-change
  description: 'Forgets the value changes and answers the stated "before" value unchanged (easy: y1; medium: x1; hard: F1, the stated force, ignoring both scaling steps).'
