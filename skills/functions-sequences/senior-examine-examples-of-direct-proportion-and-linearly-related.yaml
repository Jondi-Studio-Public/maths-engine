id: senior-examine-examples-of-direct-proportion-and-linearly-related
name: Examine examples of direct proportion and linearly related variables
domain: functions-sequences
description: 'Given bounded, fully specified inputs, examine examples of direct proportion and linearly related variables. Return the resulting value, expression, relation, or classification. Specifically: given a stated relation y = kx and one data point, compute a second value for a new input, the new input for a second value, or (named-law framing) the resulting value after the input is scaled twice in succession, inferring that the output multiplies (rather than divides) from the stated relation itself. Excludes classifying an unlabelled table of values as direct, inverse or quadratic from the data alone; the relation type and its formula are always stated. Excludes a general linear relation with a nonzero y-intercept (y = mx + c, c != 0), which belongs to the existing linear-relations domain skills.'
