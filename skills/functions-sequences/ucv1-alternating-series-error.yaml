misconceptions:
- id: alt-error-halved
  description: Halving the first dropped term to get the alternating-series error bound.
- id: alt-error-last-term-used
  description: Bounding the alternating-series error by the last term kept, b_N, instead of the first term dropped, b_(N+1).
- id: alt-error-term-after-next
  description: Bounding the alternating-series error by b_(N+2), skipping the first dropped term.
- id: alt-error-two-terms-added
  description: Adding the next two terms, b_(N+1) + b_(N+2), as the error bound.
- id: alt-interval-bound-not-applied
  description: Reporting the partial sum as the end of the interval without applying the bound.
- id: alt-interval-bound-subtracted-the-wrong-way
  description: Applying the error bound in the wrong direction when bracketing the sum.
- id: alt-interval-wrong-end
  description: Taking the partial sum plus the bound as the lower end of the interval.
- id: alt-partial-sum-sign-pattern
  description: Using the wrong sign pattern when forming an alternating partial sum.
- id: alt-partial-sum-wrong-count
  description: Summing the wrong number of terms of the alternating series.
- id: alt-terms-off-by-one
  description: Counting the terms needed one too many for the tolerance.
- id: alt-terms-uses-last-term
  description: Requiring b_N below the tolerance rather than b_(N+1), so one term too few.
- id: alt-tolerance-misread
  description: Misreading the tolerance as a different power of ten when finding the number of terms.
