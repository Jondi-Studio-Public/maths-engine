id: ucv1-sequence-limits-squeeze-monotone
name: 'Limits of sequences: dominant terms, squeeze and monotone recursion'
domain: functions-sequences
year_level:
- university
description: Find the limit of a sequence by dividing through by the dominant term, rationalising a difference of square
  roots, squeezing a bounded oscillation, or solving L = f(L) for a monotone bounded recursive sequence and choosing the
  correct root.
