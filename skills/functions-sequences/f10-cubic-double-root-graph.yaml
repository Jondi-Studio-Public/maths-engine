id: f10-cubic-double-root-graph
name: Write the equation of a cubic that touches the axis once
domain: functions-sequences
year_level:
- '10'
description: 'Write y = k(x - p)(x - q)^2 for a drawn cubic that crosses the x-axis once and touches it once, with k of 1,
  then 1 or -1 from the end behaviour, then another value found from a marked point. The exam chain starts from the equation:
  x-intercepts, the y-intercept and the turning point that is not on the x-axis.'
status: active
capability_gates:
- figure_stimulus
needs_figure: true
placement_eligible: false
prerequisites:
- zero-product-property
- f10-parabola-equation-from-graph
answer: expression
