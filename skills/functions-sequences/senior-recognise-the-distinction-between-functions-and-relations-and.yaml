misconceptions:
- id: assumes-repeated-y-breaks-function
  description: Believes any repeated y-value across different x-values makes a relation "not a function", missing that the vertical line test cares only about repeated x-values, not repeated y-values.
- id: assumes-duplicate-listing-breaks-function
  description: Sees the same ordered pair listed twice in a set and treats it as a genuine x-value collision, missing that a duplicate of an IDENTICAL pair contributes no second y-value at that x.
- id: misses-tangent-single-point
  description: Assumes every vertical line through a circle meets it twice, missing that the two tangent lines (at x = +-r) meet the circle at exactly one point each.
- id: treats-restricted-branch-as-whole-curve
  description: Ignores a stated domain restriction (e.g. "y >= 0" on a circle, or "the upper semicircle") and classifies the relation as if the whole unrestricted curve were being tested.
