id: senior-examine-examples-of-inverse-proportion
name: Examine examples of inverse proportion
domain: functions-sequences
description: 'Given bounded, fully specified inputs, examine examples of inverse proportion. Return the resulting value, expression, relation, or classification. Specifically: given a stated relation y = k/x and one data point, compute a second value for a new input, the new input for a second value, or (named-law framing) the resulting value after the input is scaled twice in succession, inferring that the output divides (rather than multiplies) from the stated relation itself. Excludes classifying an unlabelled table of values as direct, inverse or quadratic from the data alone; the relation type and its formula are always stated.'
