misconceptions:
- id: as-if-direct
  description: 'Treats the relation as directly proportional, multiplying by the scale factor instead of applying the inverse relationship (easy: y2 = y1*t; medium: x2 = x1*y2/y1; hard: multiplies the stated pressure by the combined scale factor t1*t2 instead of dividing, P1*(t1*t2)).'
- id: as-if-quadratic
  description: 'Treats the relation as quadratically related, applying the square of the scale factor instead of the inverse relationship (easy/medium: an extra factor of t; hard: applies the square of the combined scale factor, P1*(t1*t2)^2).'
- id: no-change
  description: 'Forgets the value changes and answers the stated "before" value unchanged (easy: y1; medium: x1; hard: P1, the stated pressure, ignoring both scaling steps).'
