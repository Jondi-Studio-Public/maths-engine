misconceptions:
- id: unswapped
  description: Reads the marked point itself as the corresponding point, forgetting that reflection in y = x interchanges the coordinates.
- id: negated-swap
  description: Swaps the coordinates and also negates both, (-b, -a) for P = (a, b), treating the reflection as a half-turn about the origin.
- id: sign-flipped-second
  description: Swaps the coordinates but flips the sign of the new second coordinate, giving (b, -a) for P = (a, b).
- id: sign-flipped-first
  description: Swaps the coordinates but flips the sign of the new first coordinate, giving (-b, a) for P = (a, b).
- id: reflected-in-axis
  description: Reflects P in the x-axis, (a, -b), instead of in the line y = x.
