id: interpret-slope-in-context
name: Interpret the slope of a straight-line graph as a rate of change
domain: functions-sequences
description: Read the rate of change from a straight-line cost graph, use it to find extra costs, extra quantities and totals
  beyond the graph, and compare the rates and the break-even point of two plans.
status: active
placement_eligible: false
needs_figure: true
capability_gates:
- figure_stimulus
prerequisites:
- rate-of-change
answer: number
