misconceptions:
- id: multiplies-instead-of-adding
  description: Multiplying exponents instead of adding them in the product law.
- id: subtracts-instead-of-adding
  description: Subtracting the second exponent from the first instead of adding.
- id: ignores-the-division
  description: Forgetting to apply the quotient law; omitting the division step.
- id: treats-division-as-another-multiplication
  description: Adding the divisor's exponent instead of subtracting it.
- id: power-of-power-adds-instead-of-multiplies
  description: Adding exponents in the power-of-a-power law instead of multiplying.
- id: quotient-sign-flip
  description: Adding the divisor's exponent instead of subtracting when combining laws.
- id: reads-fractional-exponent-as-a-coefficient
  description: Treating x**p as "multiply by p" rather than "raise to the power p".
- id: exam-exponent-subtraction-direction
  description: Subtracted the algebraic fraction's exponents the wrong way round
    (denominator's exponent minus numerator's, instead of numerator minus
    denominator) before applying the fractional power.
- id: exam-power-applied-to-coefficient-only
  description: Applied the fractional power to the numeric coefficient but left
    the combined x exponent as the raw, unreduced fraction-simplification
    result, never multiplying it by the fractional index.
- id: exam-power-applied-to-exponent-only
  description: Applied the fractional power to the x exponent but left the
    numeric coefficient as the raw, unreduced ratio from before the power was
    applied.
- id: exam-wrong-root-index
  description: Took the numeric coefficient's square root regardless of what
    root the fractional index actually calls for (e.g. a fourth root treated
    as a square root).
