misconceptions:
- id: first-congruence-only
  description: Reports the least residue satisfying only the first congruence, ignoring the second entirely.
- id: second-congruence-only
  description: Reports the least residue satisfying only the second congruence, ignoring the first entirely.
- id: adds-remainders
  description: Adds the two given remainders together modulo the product of the moduli instead of solving the system.
- id: sign-flip
  description: Reads a negative remainder's digits as if they were positive instead of first reducing it to its least non-negative residue.
