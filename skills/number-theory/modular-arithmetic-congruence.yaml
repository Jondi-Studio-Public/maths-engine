misconceptions:
- id: unreduced-representative
  description: Returning the original integer instead of a least non-negative residue.
- id: negative-remainder
  description: Reporting a negative remainder for a negative representative.
- id: wrong-modulus
  description: Reducing by a nearby number rather than the stated modulus.
- id: reduced-addends-separately
  description: Reduced each addend modulo the modulus separately, then added the two residues without re-reducing the sum.
- id: one-addend-left-unreduced
  description: Reduced only one of the two addends and added the other unreduced.
- id: dropped-second-addend
  description: Reduced only the first addend and never added the second one at all.
