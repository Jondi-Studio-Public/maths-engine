misconceptions:
- id: forgets-exponent-reduction
  description: Forgets to reduce the exponent through the supplied factorisation at all, and reports m^e0 mod n for a truncated substitute exponent instead.
- id: uses-modulus-not-totient
  description: Reduces the exponent modulo n itself instead of modulo phi(n) computed from the supplied factorisation, confusing the modulus with the totient.
- id: drops-power-correction-term
  description: For a repeated-prime-factor modulus, uses the two-factor totient formula (p-1)(q-1) instead of the correct prime-power formula p(p-1)(q-1), dropping the power-based correction term.
- id: applies-euler-shortcut-when-not-coprime
  description: Applies the Euler exponent-reduction shortcut even though the base is not coprime to the modulus, instead of recognising the shortcut is invalid and falling back to a direct CRT computation.
