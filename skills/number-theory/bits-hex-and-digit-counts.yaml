id: bits-hex-and-digit-counts
name: Bits, hexadecimal and digit counts
domain: number-theory
year_level:
- '10'
- '11'
- '12'
description: Find how many bits a number needs, the largest value and the number of different values that n bits can hold,
  and write numbers in hexadecimal as typed text (letters in either case, leading zeros kept when a width is stated), including
  six-digit colour codes and the largest n-bit number in hexadecimal.
status: active
placement_eligible: false
prerequisites:
- number-bases-primes-and-divisors
answer: mcq
