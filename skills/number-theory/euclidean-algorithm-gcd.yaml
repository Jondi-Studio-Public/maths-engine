misconceptions:
- id: stops-at-first-remainder
  description: Stops before the final non-zero remainder in the Euclidean algorithm.
- id: chooses-larger-number
  description: Reports one of the inputs instead of their greatest common divisor.
- id: gcd-of-first-two-only
  description: Computes gcd(first, second) and stops, ignoring the third number -- one Euclidean-algorithm pass short.
- id: gcd-of-last-two-only
  description: Computes gcd(second, third) and ignores the first number entirely.
- id: reuses-one-input-or-sum
  description: Offers one of the three numbers themselves, or their sum, instead of their greatest common divisor.
