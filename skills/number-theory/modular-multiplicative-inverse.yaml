misconceptions:
- id: uses-additive-inverse
  description: Finds a value whose sum with the input is 0 modulo m instead of a multiplicative inverse.
- id: ignores-modulus
  description: Returns an ordinary reciprocal or a value that does not satisfy the congruence.
- id: forgets-to-multiply-by-b
  description: Correctly finds the inverse of the coefficient but reports it directly, forgetting to multiply by b to solve ax ≡ b (mod m).
- id: multiplies-by-coefficient-not-inverse
  description: Multiplies the coefficient by b directly instead of multiplying the coefficient's inverse by b.
- id: wrong-residue-for-b
  description: Reduces b incorrectly (e.g. by one too many or too few) before multiplying by the inverse.
