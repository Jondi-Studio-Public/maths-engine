misconceptions:
- id: forgets-overlap
  description: Adds the two set sizes directly, double-counting the intersection.
- id: double-subtracts-overlap
  description: Subtracts the overlap twice, as if computing the symmetric difference instead of the union.
- id: swaps-union-and-intersection
  description: Given the union size, reports it back unchanged as if it were the intersection size.
- id: ignores-neither
  description: Substitutes the total population directly for the union size instead of first subtracting the count in neither set.
