id: uc2-linear-recurrence-closed-form
name: Closed form of a linear recurrence
domain: discrete-mathematics
year_level:
- university
description: Solve a second-order linear recurrence with two initial terms for a closed form in n, with distinct roots,
  a repeated root, or a constant term. The exam chain finds the characteristic roots, the constant particular solution,
  the closed form and one term from it.
