misconceptions:
- id: off-by-one-index
  description: Returns the wrong term -- the immediately preceding term instead of the requested one (forward), or the later given term instead of the earlier one being solved for (inverse).
- id: swaps-coefficients
  description: Swaps which coefficient multiplies which preceding term, computing q*a_(n-1) + p*a_(n-2) instead of p*a_(n-1) + q*a_(n-2) (or the analogous swap when solving the inverse).
- id: drops-one-term
  description: Computes p*a_(n-1) only, ignoring the q*a_(n-2) contribution entirely.
- id: sign-flip
  description: Forgets that q is negative and applies the wrong sign in the recurrence -- only exercisable when the drawn q is negative.
- id: uses-wrong-pair
  description: At the exam tier, applies the (p, q) pair that is NOT consistent with the three given terms, instead of first checking which pair is consistent.
