id: uc2-generating-function-partition-counting
name: Counting partitions with generating functions
domain: discrete-mathematics
year_level:
- university
description: 'Count the ways to write a total as an unordered sum under restrictions on the parts, which is a coefficient
  of a product of generating-function factors: allowed part sizes, different parts, and limited supplies of coins and notes.
  The exam chain splits a count by how many 1-point items are used and adds the cases.'
status: active
placement_eligible: false
