id: uc2-nonhomogeneous-recurrence-polynomial-or-exponential-forcing
name: Recurrences with polynomial or exponential forcing
domain: discrete-mathematics
year_level:
- university
description: Solve a linear recurrence whose forcing term varies with n, a polynomial or an exponential, for a closed form
  in n, including the resonant case where the forcing matches a characteristic root. The exam chain finds the roots, the particular
  solution, the closed form and a later term.
status: active
placement_eligible: false
