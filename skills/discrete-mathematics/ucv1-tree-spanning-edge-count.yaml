misconceptions:
- id: uses-n-not-n-minus-1
  description: Reports n itself as the edge count instead of n - 1 (the single most natural off-by-one error for this invariant).
- id: uses-n-plus-1
  description: Reports n + 1 instead of n - 1 -- the reverse off-by-one.
- id: forgets-to-halve-degree-sum
  description: Sums the stated degree sequence and reports the raw sum (2(n-1)) directly instead of dividing by 2 first.
- id: wrong-vertex-count-formula
  description: Mistakes the internal-node count (L - 1, for a full binary tree with L leaves) for the edge count itself, instead of computing n = L + (L - 1) and then n - 1.
- id: reports-given-edges-directly
  description: At the exam tier, reports the stated total edge count directly instead of subtracting the n - 1 spanning-tree baseline to find the extra edges.
