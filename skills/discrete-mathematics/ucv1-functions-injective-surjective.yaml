id: ucv1-functions-injective-surjective
name: One-to-one, onto and bijective functions
domain: discrete-mathematics
year_level:
- university
description: Count the one-to-one, onto and non-injective functions between small finite sets, and decide for a quadratic
  rule on the real line where it is injective, which codomain makes it onto, and what its inverse gives.
