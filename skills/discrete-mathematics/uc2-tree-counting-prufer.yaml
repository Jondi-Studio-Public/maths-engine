id: uc2-tree-counting-prufer
name: Prüfer codes and counting labelled trees
domain: discrete-mathematics
year_level:
- university
description: 'Move between a labelled tree and its Prüfer code, written as an ordered list: encode a tree, rebuild a tree
  from a code to read a vertex''s neighbours, and read a path between two vertices. The exam chain finds the leaves and a
  degree from a code and counts labelled trees with a vertex as a leaf or not.'
