id: uc2-dijkstra-trace
name: Tracing Dijkstra's algorithm
domain: discrete-mathematics
year_level:
- university
description: Run Dijkstra's algorithm by hand on a small weighted graph and list the vertices in the order they are finalised,
  with a stated alphabetical tie rule. The exam chain also finds a shortest distance, the unique shortest route and a cost
  at a rate per kilometre.
