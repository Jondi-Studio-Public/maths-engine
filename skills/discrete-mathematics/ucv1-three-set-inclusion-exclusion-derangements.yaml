id: ucv1-three-set-inclusion-exclusion-derangements
name: Three-set inclusion-exclusion and derangements
domain: discrete-mathematics
year_level:
- university
description: Use inclusion-exclusion for three sets, including finding a missing overlap, the number in none or in exactly
  two of the sets, divisibility counts and derangements, with and without forbidden positions.
