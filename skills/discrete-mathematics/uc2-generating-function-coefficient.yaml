id: uc2-generating-function-coefficient
name: Coefficient of a generating function
domain: discrete-mathematics
year_level:
- university
description: 'Extract a coefficient from a generating function written in closed form: a product of geometric series, a shifted
  and scaled negative binomial series, or a bounded count with a numerator that cuts the series. The exam chain shares tickets
  among three people with two caps, using the unrestricted count, the two counts that break a cap and inclusion and exclusion.'
