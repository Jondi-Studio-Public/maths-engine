id: uc2-dynamic-programming-tables
name: Dynamic programming tables for routes, coins, knapsack and subsequences
domain: discrete-mathematics
year_level:
- university
description: 'Fill in the table of a dynamic programme by hand and read the answer from it: the cheapest staircase climb,
  the cheapest route through a staged network, the fewest coins for an amount, the best value of a 0/1 knapsack, the number
  of ways to make change and the length of a longest common subsequence. Most problems are ones where the obvious greedy choice
  is not the best, and every answer is a whole number.'
status: active
placement_eligible: false
prerequisites:
- uc2-dijkstra-trace
answer: number
