id: uc2-chromatic-polynomial-bipartite-hall
name: Chromatic polynomials and Hall's condition
domain: discrete-mathematics
year_level:
- university
description: Count proper colourings of a small graph through its chromatic polynomial, and find the largest matching in
  a bipartite graph when Hall's condition fails. The exam chain either finds a chromatic polynomial, a colouring count and
  the chromatic number, or finds the set violating Hall's condition, the deficiency and the largest matching.
