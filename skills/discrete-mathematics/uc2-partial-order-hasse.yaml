id: uc2-partial-order-hasse
name: Reading a divisibility poset
domain: discrete-mathematics
year_level:
- university
description: 'Read the structure of a finite set of integers ordered by divisibility without a diagram: minimal or maximal
  elements, the elements an element covers, and the elements on a longest chain. The exam chain finds the maximal elements,
  the longest chain size, the largest antichain size and the fewest covering chains.'
status: active
placement_eligible: false
