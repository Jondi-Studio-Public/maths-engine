id: pigeonhole-and-binomial-identities
name: The pigeonhole principle and binomial identities
domain: discrete-mathematics
year_level: ['11']
description: >-
  Use the pigeonhole principle to find the least number in a box or the number of items that forces a
  repeat, and simplify binomial and factorial expressions using Pascal's identity.
