misconceptions:
- id: divides-instead-of-multiplies
  description: Applies a forward scale by dividing the map distance by the scale value instead of multiplying.
- id: multiplies-instead-of-divides
  description: Applies a reverse (real-world-to-map) scale by multiplying instead of dividing.
- id: forgets-unit-conversion
  description: Reports the ratio-scaled centimetre figure, or an intermediate metre figure, without completing the remaining conversion to the requested unit -- off by a factor of 100 or 1000.
- id: misreads-ratio-direction
  description: 'Treats a ratio scale "1 : n" as "n : 1", inverting which side of the ratio is the map and which is the real world.'
