id: senior-expand-x-y-n-for-small-positive-integers-n
name: Expand (x + y)^n for small positive integers n
domain: senior-mathematics
description: Expand a power of a binomial for a small positive integer n, using the row of Pascal's triangle for the
  coefficients, in letters, with a number as the second term, and with a coefficient on the first term as well.
status: active
placement_eligible: false
prerequisites:
- senior-use-pascal-s-triangle-and-its-properties
answer: expression
