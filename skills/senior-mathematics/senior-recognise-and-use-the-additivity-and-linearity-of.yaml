misconceptions:
- id: wrong-combining-rule
  description: Applies the wrong operation for the additivity design -- adds when the
    question needs subtraction (the inverse direction), or subtracts when it needs addition.
- id: dropped-scalar-multiplier
  description: Reports I_f + I_g instead of k*I_f + m*I_g, dropping one or both scalar
    multipliers the linearity design states.
- id: swapped-interval-order
  description: Reports I_ab - I_bc instead of I_ab + I_bc in an additivity chain, a sign
    confusion over which interval's value is subtracted.
