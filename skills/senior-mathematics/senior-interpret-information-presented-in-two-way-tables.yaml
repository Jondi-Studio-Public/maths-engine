id: senior-interpret-information-presented-in-two-way-tables
name: Interpret information presented in two-way tables
domain: senior-mathematics
description: 'Given a stated two-way frequency table, rendered as plain text (a Rows: line, a Columns: line, and every cell as "{row}/{col}: value"), compute a specified cell value, row total, column total, or proportion. A proportion is always a named cell or margin divided by a named total (the row total, the column total, or the grand total) and is graded as a percentage to exactly 1 decimal place; a cell or total is graded as an exact integer. This is NOT the neighbouring senior-complete-a-five-number-summary-for-different-datasets or standard-deviation-from-data, both of which operate on a single numerical dataset (a list of values), never a two-way categorical cross-tabulation. Four tiers: easy is a fully-given 2x2 table, asked for one cell or one row/column total; medium is a 2x3 table where one row''s total is stated directly and one of its three cells is left for the learner to derive by subtraction; hard is a fully-given table asking for a proportion, where the learner must decide which of the row total, column total, or grand total is the correct denominator (construct-to-target so all three occur across draws, and the wrong-denominator distractor is checked every seed to never accidentally equal the right answer); exam is a 2x2 table with one cell not recorded, recovered from the stated grand total, then used in two row percentages and their difference in percentage points.'
