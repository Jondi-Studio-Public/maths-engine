misconceptions:
- id: uses-wrong-denominator-for-a-proportion
  description: Divides by the grand total (or a margin from the wrong axis) when the question asks for a row- or column-conditional proportion, or vice versa, missing that the denominator must match exactly which group the question is a proportion OF.
- id: forgets-to-subtract-when-a-cell-is-derived
  description: Reads off the stated row total itself, or the sum of the row's other given cells, instead of subtracting the given cells from the stated total to find the missing cell.
- id: mixes-up-rows-and-columns
  description: Reads a cell, row total, or column total from the wrong axis (e.g. reporting a column total when a row total was asked for) because the two category lists were not matched carefully against the question wording.
