id: senior-use-implication-converse-equivalence-negation-contrapositive
name: Use implication, converse, equivalence, negation, contrapositive
domain: senior-mathematics
description: Given bounded, fully specified inputs, use implication, converse, equivalence, negation, contrapositive. Return the resulting value, expression, relation, or classification.
status: active
placement_eligible: false
