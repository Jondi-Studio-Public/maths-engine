misconceptions:
- id: confuses-converse-and-contrapositive
  description: Offers the contrapositive (swap and negate both clauses) when the converse (swap only) is asked for.
- id: assumes-converse-is-equivalent
  description: Believes the converse or the negation is always logically equivalent to the original implication, when only the contrapositive is.
- id: treats-original-as-its-own-converse
  description: Picks the original implication itself when asked for its converse, not noticing that the hypothesis and conclusion were never swapped.
