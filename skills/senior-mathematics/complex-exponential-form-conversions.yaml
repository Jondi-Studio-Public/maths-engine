id: complex-exponential-form-conversions
name: Convert between Cartesian, polar and exponential form and use Euler's formula
domain: senior-mathematics
year_level:
- '12'
description: Convert between a + bi, r(cos θ + i sin θ) and r e^(iθ), evaluate expressions from Euler's identity, and multiply,
  divide and raise to powers in exponential form, typing each real or imaginary part as an exact value.
status: active
placement_eligible: false
