id: senior-interpret-complex-timetables-such-as-tide-charts-sunrise
name: Interpret complex timetables, such as tide charts, sunrise charts and moon
  phases
domain: senior-mathematics
description: >-
  Given a stated tide, sunrise/sunset or moon-phase table for several days, choose from offered
  entries the day or time that meets a stated condition (for example the highest high tide, the
  latest sunrise, or the first full moon after a stated date). The exam tier reads one day of a tide
  chart and works out the time and rise between a low and high tide, the rate of rise and the time
  to reach a stated height.
status: active
placement_eligible: false
