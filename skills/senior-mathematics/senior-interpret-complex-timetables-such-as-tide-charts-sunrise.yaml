misconceptions:
- id: wrong-direction
  description: Picks the day with the opposite superlative reading (lowest instead
    of highest, earliest instead of latest).
- id: full-moon-before-date
  description: On the hard tier, picks the most recent full moon before the stated
    date instead of the first one after it.
- id: satisfies-only-one-clause
  description: On the exam tier, picks the day that is the extreme value overall
    but fails the stated second condition (falls on a weekend, or on or before the
    stated date).
