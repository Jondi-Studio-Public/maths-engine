misconceptions:
- id: combines-before-factorialising
  description: At the easy tier, computes (a + b)!, (a - b)! or (a x b)! instead of a! + b!, a! - b! or a! x b! -- combines the two operands first, then applies a single factorial to the combination, instead of factorialising each operand separately (only offered when the combined value stays under 1000; withheld, never clamped, otherwise).
- id: wrong-operator
  description: At the easy tier, applies the wrong operator to the two already-correct factorial values -- most often + swapped for x or vice versa.
- id: forgets-one-factorial
  description: At the easy tier, forgets to apply the factorial to one of the two operands, combining a! with a bare b (or a bare a with b!). At medium/hard, offers the ratio's smaller/single remaining factor alone, forgetting one factor at the edge of the product.
- id: adds-extra-factor
  description: Multiplies in one extra consecutive factor at the hard tier -- the opposite edge error to forgets-one-factorial's edge-dropping.
- id: ratio-as-factorial
  description: Treats n!/m! as (n/m)!, evaluating the factorial of the quotient instead of telescoping the ratio (only a coherent numeric mistake at the medium tier when n/m is a whole number -- one (n, k) pair in 24).
- id: no-cancellation
  description: Reports n! outright at the medium tier, or the ratio's own denominator factorial term unchanged at the hard tier, applying no cancellation at all.
