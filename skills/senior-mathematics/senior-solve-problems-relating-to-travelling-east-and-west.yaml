id: senior-solve-problems-relating-to-travelling-east-and-west
name: Solve problems relating to travelling east and west, incorporating time zone changes
domain: senior-mathematics
description: Given a travel journey's departure and arrival local clock times, its direction (east/west), flight duration and an explicit calendar-day label, find the magnitude of the time-zone difference between the two places.
status: active
placement_eligible: false
