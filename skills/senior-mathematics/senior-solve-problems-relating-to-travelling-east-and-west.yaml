misconceptions:
- id: omits-day-adjustment
  description: Reconstructs the offset from the two clock times without accounting for the stated calendar-day label at all, as if the arrival were always on the same day as departure.
- id: reports-duration-not-offset
  description: States the flight duration, in hours, as if it were the time-zone difference.
- id: off-by-rounding
  description: Rounds a half-hour time-zone difference to the nearest whole hour.
- id: day-term-sign-flip
  description: Applies the calendar-day adjustment with the opposite sign, as if the day before were the day after or vice versa.
- id: off-by-one-hour
  description: Miscounts the reconstructed difference by a whole hour, over or under the correct value.
