id: implication-converse-contrapositive-counts
name: Converse, contrapositive, negation and equivalence of a conditional, by counting counterexamples
domain: senior-mathematics
year_level:
- '11'
description: For an if-then statement about whole numbers or finite sets, find how many values (or which smallest value)
  make its converse, contrapositive, inverse, negation or biconditional fail, typing the count rather than choosing a wording.
status: active
placement_eligible: false
