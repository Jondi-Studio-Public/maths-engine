misconceptions:
- id: assumes-technology-means-random
  description: Assumes any method involving a computer, list, or number is automatically random, missing that a step (e.g. skipping already-surveyed names) still excludes part of the population.
- id: mistakes-large-turnout-for-randomness
  description: Judges a self-selected or convenience sample valid because many people responded, confusing sample size with selection fairness.
- id: mistakes-systematic-order-for-randomness
  description: Judges a systematic, fixed-order selection (e.g. every 7th name on the original unshuffled register) as valid because it "looks random" or evenly spread, missing that it lacks a genuine random start.
