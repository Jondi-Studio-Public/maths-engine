id: senior-understand-the-concept-of-a-random-sample
name: Understand the concept of a random sample
domain: senior-mathematics
description: 'Given a described method for selecting individuals from a stated population, judge whether that method constitutes a valid random sample -- every member of the stated population has an equal, independent chance of selection. The mcq always offers exactly one "valid" option and three distinct named-flaw "not valid" options (convenience sample, self-selection/volunteer bias, systematic selection with no genuine random start, or exclusion of part of the population), never a bare "not valid". This is NOT the neighbouring senior-simulate-repeated-random-sampling-from-a-variety-of (ACMMM176), which simulates FROM an already-valid random sample and never judges whether a selection method itself is valid; and it is NOT the co-built senior-identify-the-target-population-to-be-surveyed (ACMEM132), which judges WHAT the population description should be, never whether a selection method from an already-identified population is valid. Four tiers: easy presents a single, clearly-one-flaw-or-clearly-valid method; medium buries a plausible-sounding step around the actual flaw, or presents a superficially suspicious but genuinely valid stratified method; hard names candidate flaws through the full option set and includes the systematic-looking-but-valid "every kth name on a freshly shuffled list" case alongside its genuinely-systematic "unshuffled" twin; exam is a numeric chain on a stratified random sample taken in proportion to group size: the sampling fraction, then the number selected from each group, finishing with the last group''s share from the stated sample size.'
