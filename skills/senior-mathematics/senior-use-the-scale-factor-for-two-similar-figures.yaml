id: senior-use-the-scale-factor-for-two-similar-figures
name: Use the scale factor for two similar figures to solve linear scaling problems
domain: senior-mathematics
description: Given bounded, fully specified inputs, use the scale factor for two similar figures to solve linear scaling problems. Return the resulting value, expression, relation, or classification.
