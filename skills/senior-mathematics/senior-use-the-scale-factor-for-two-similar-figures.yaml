misconceptions:
- id: uses-squared-factor
  description: Applies k^2 instead of k to a length or perimeter -- the signature trap given the neighbouring area/volume scale-factor skills, especially live on the hard/perimeter tier where a learner who has just been taught k^2/k^3 scaling applies the wrong exponent to a linear quantity.
- id: swaps-p-and-q
  description: Applies the reciprocal of the scale factor instead of the scale factor itself.
- id: forgets-to-scale
  description: Reports Figure A's own stated value (the given side, second side, or perimeter) unchanged, as if it already were Figure B's value.
