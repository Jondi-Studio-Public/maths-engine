misconceptions:
- id: ts-adds-readings
  description: Adds the two values read from the graph instead of finding how much higher one is than the other.
- id: ts-neighbour-read
  description: Reads the value at the time point next to the one named, so the difference is for the wrong pair of times.
- id: ts-gridline-slip
  description: Reads a value one gridline too high or too low on the vertical axis.
- id: ts-one-reading
  description: Gives one of the two values read from the graph where the difference between them was asked for.
- id: ts-no-trend-added
  description: Predicts the value in the same season of the last cycle and does not add the change of level from one cycle to the next.
- id: ts-ignores-season
  description: Adds the change of level to the latest value instead of the value in the same season one cycle ago, ignoring the seasonal pattern.
- id: ts-trend-twice
  description: Adds the change of level for two cycles when the prediction is only one cycle on from the value used.
