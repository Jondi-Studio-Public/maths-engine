- topic: timezone_call_window_overlap
  params: {}
  difficulty: hard
  stages: [5, 6, maintenance]
misconceptions:
- id: ignores-dst-or-abbreviation
  description: Uses a place's standard offset without applying its daylight-saving allowance, or without resolving its stated zone abbreviation, before shifting its window into the other place's clock frame.
- id: uses-wrong-window-length
  description: Applies the same window length to both places when they genuinely differ (14 hours for a place whose stated window is actually the narrower 12-hour one), only reachable once the two windows are of different lengths.
- id: adds-instead-of-intersects
  description: Reports the sum of the two window lengths instead of the length of their overlap once one window is shifted into the other's clock frame.
