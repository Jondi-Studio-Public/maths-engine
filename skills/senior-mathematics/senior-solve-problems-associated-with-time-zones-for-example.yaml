id: senior-solve-problems-associated-with-time-zones-for-example
name: Solve problems associated with time zones; for example, internet and phone usage
domain: senior-mathematics
description: Given two named places, each with its own stated "reasonable hours to call" window in its own local time and a UTC offset (stated directly, derived via a daylight-saving allowance, or looked up from a stated zone-abbreviation key), work out the length of the daily window during which both places' reasonable-hours-to-call windows overlap.
status: active
placement_eligible: false
prerequisites: []
answer: number
