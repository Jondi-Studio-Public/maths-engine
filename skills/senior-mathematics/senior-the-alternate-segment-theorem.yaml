misconceptions:
- id: assumes-supplementary
  description: Believes the tangent-chord angle and the inscribed angle in the alternate segment are supplementary (180 - x) instead of equal.
- id: assumes-complementary
  description: Believes the tangent-chord angle and the inscribed angle in the alternate segment are complementary (90 - x), confusing this theorem with the unrelated right-angle-in-a-semicircle theorem.
- id: swaps-requested-angle
  description: On the medium tier, reports one of the two given triangle angles (QTP or TPQ) instead of the derived tangent-chord angle.
- id: sign-error-in-algebra
  description: On the hard tier, isolates x from the equality of the two linear expressions with a sign error, giving a different, still-plausible numeric angle.
