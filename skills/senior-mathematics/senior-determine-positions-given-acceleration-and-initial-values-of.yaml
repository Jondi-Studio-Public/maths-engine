misconceptions:
- id: forgot-second-constant
  description: Uses the correctly-built velocity function to form the second antiderivative, but never solves for/adds the second constant of integration.
- id: forgot-first-constant
  description: Antidifferentiates a(t) a second time without ever adding the first constant of integration, as if the initial velocity were zero.
- id: sign-error-on-second-constant
  description: Isolates the second constant of integration with the sign flipped (hard tier only, where the stated instant is nonzero so this is a genuinely different value from the true answer).
- id: sign-error-on-first-constant
  description: Isolates the first constant of integration with the sign flipped, then correctly carries that wrong velocity function through the second integration (hard tier only, for the same reason as sign-error-on-second-constant).
