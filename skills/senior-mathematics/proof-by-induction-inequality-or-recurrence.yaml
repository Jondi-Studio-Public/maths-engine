id: proof-by-induction-inequality-or-recurrence
name: "Work the steps of an induction proof of an inequality or a recurrence"
domain: senior-mathematics
year_level: ['12']
description: "For an inequality such as 2^n > n^2, or a recurrence u(n + 1) = a u(n) + c1 n + c0 with a claimed closed form, supply one typed step of its proof by induction -- the smallest n from which the statement holds, the smallest k from which the key inequality of the inductive step holds, or the constant that makes the closed form's inductive step close. The answers are numbers, never free-text reasoning."
status: active
placement_eligible: false
prerequisites:
- ucv1-proof-by-induction
- senior-use-recursion-to-generate-a-geometric-sequence
answer: number
