misconceptions:
- id: forgot-to-divide
  description: Reports δy = f(p+δx)-f(p) alone, without dividing by δx.
- id: reciprocal-error
  description: Reports δx/δy, the reciprocal of the difference quotient, instead of δy/δx.
- id: sign-error
  description: Computes (f(p)-f(p+δx))/δx, the numerator order reversed.
- id: ignored-delta-x-sign
  description: Uses the magnitude |δx| instead of the stated negative δx, losing the sign of the change.
