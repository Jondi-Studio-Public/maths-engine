misconceptions:
- id: ignores-restriction
  description: Ignores the restriction entirely and reports the plain n! (or n!/repeat! at the hard tier).
- id: wrong-method-for-restriction
  description: Applies the together (block) method when the restriction is apart, or the apart (total minus together) method when the restriction is together (not offered at the hard tier, where at n = 6 it numerically equals forgets-repeated-object-division, 240).
- id: omits-block-order-factor
  description: Omits (or double-applies) the internal k! block-ordering factor for the two objects that must stand together.
- id: forgets-repeated-object-division
  description: At the hard tier, forgets to divide by the repeated object's own factorial, treating every object as distinct.
