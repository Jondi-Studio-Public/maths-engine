id: longitude-local-clock-time
name: Find the local clock time at a place from its longitude
domain: senior-mathematics
year_level: ['12']
description: Convert clock times between places using longitude, with 15 degrees of longitude as 1 hour. Easy finds the local
  time at a port on the same side of the prime meridian. Medium does the same across the prime meridian. Hard finds the local
  arrival time of a flight. The exam chain finds the longitude difference, the time difference, the local time and a distance
  along a meridian.
status: active
placement_eligible: false
