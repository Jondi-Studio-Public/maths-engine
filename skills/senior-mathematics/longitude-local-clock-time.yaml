misconceptions:
- id: r4g-east-west-direction-reversed
  description: Making the clock later for a place to the west, or earlier for a place to the east.
- id: r4g-no-time-shift
  description: Giving the same clock time for both places, or ignoring the change of time zone.
- id: r4g-half-the-hours
  description: Dividing the longitude difference by 30 instead of 15 to get the hours.
- id: r4g-longitudes-added-same-side
  description: Adding the two longitudes although both ports are on the same side of the prime meridian, so they should be
    subtracted.
- id: r4g-longitudes-subtracted-opposite-sides
  description: Subtracting the two longitudes although the ports are on opposite sides of the prime meridian, so they should
    be added.
- id: r4g-flight-time-left-out
  description: Applying the time difference but leaving out the flight time.
- id: r4g-time-zone-off-by-one-hour
  description: Getting the time difference right except for being one hour out, by miscounting the 15 degree steps.
- id: r4g-flight-time-subtracted
  description: Subtracting the flight time from the departure time instead of adding it.
- id: r4g-degrees-left-as-hours
  description: Giving the difference in degrees as the number of hours without dividing by 15.
- id: r4g-latitude-for-longitude
  description: Using the difference in latitude where the difference in longitude was asked for.
- id: r4g-one-longitude-not-the-difference
  description: Giving one of the two longitudes instead of the difference between them.
- id: r4g-multiplied-by-15
  description: Multiplying the degrees by 15 instead of dividing by 15 to get hours.
- id: r4g-ten-degrees-per-hour
  description: Using 10 degrees of longitude for each hour instead of 15.
- id: wrong-hemisphere-rule
  description: Subtracting the two latitudes when they are in opposite hemispheres (the magnitudes are added), or adding them
    when they are in the same hemisphere (they are subtracted).
- id: r4g-degrees-given-as-km
  description: Giving the difference in degrees as the distance in kilometres.
- id: r4g-nautical-miles-given-as-km
  description: Using 60 nautical miles per degree and reporting it as kilometres.
- id: r4g-longitude-rule-wrong-side
  description: Adding the longitudes when both are on the same side of the prime meridian, or subtracting them when they are
    on opposite sides.
