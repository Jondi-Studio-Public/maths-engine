id: senior-review-cartesian-form
name: Review Cartesian form
domain: senior-mathematics
description: |
  Given bounded, fully specified inputs, review Cartesian form. Return the resulting value,
  expression, relation, or classification. Built as equating real and imaginary parts:
  z = x + yi (the unknowns are the two real numbers x and y) satisfies a stated complex
  equation, and the learner separates it into its real and imaginary components (two
  simultaneous real equations) and solves. Boundary: not extraction
  (complex-real-part/complex-imaginary-part), not arithmetic-for-its-own-sake
  (add-complex-numbers/multiply-complex-numbers), not plotting
  (senior-consider-complex-numbers-as-points-in-a-plane), and not conversion
  (senior-convert-between-cartesian-and-polar-form). Every equation stays in the z, z-bar
  (conjugate), Re(z), Im(z) family -- never a complex number multiplying z, which is
  ACMSM070's separate, unbuilt arithmetic-division row.
status: active
placement_eligible: false
prerequisites:
- senior-define-the-imaginary-number-i-as-a-root
answer: pair
sources:
  - topic: p11c_cartesian_form_equating
    params: {mode: easy}
    difficulty: easy
    stages: [0, 1, 2]
  - topic: p11c_cartesian_form_equating
    params: {mode: medium}
    difficulty: medium
    stages: [3, 4]
  - topic: p11c_cartesian_form_equating
    params: {mode: hard}
    difficulty: hard
