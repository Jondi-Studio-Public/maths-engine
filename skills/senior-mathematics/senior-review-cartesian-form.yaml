misconceptions:
  - id: drops-sign-across-equals
    description: Drops or flips the imaginary unit's sign when moving a term across the equals sign while separating real and imaginary parts.
  - id: forgets-conjugate-sign-flip
    description: 'Hard tier: treats the conjugate z-bar as x + yi (i.e. as z again) instead of x - yi, so the imaginary-part equation uses the wrong coefficient.'
  - id: copies-one-solution-into-both
    description: Solves only one of the two simultaneous real equations and reports that same value for both x and y.
  - id: swaps-x-and-y
    description: Swaps which solved value is x and which is y.
