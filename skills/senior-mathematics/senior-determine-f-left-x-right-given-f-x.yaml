misconceptions:
- id: forgot-constant
  description: Reports G(x), the antiderivative without solving for the constant of integration (equivalent to using C = 0).
- id: power-rule-no-divide
  description: Raises each term's power without dividing by the new power, then still correctly solves its own constant against the same initial condition.
- id: sign-error-on-constant
  description: Isolates the constant of integration with the sign flipped (not offered at the easy tier, where the initial-condition point a = 0 makes G(a) = 0 identically and the sign-flipped candidate collapses onto the true answer, never a distinct wrong value).
- id: ignored-negative-base-sign
  description: Substitutes the magnitude of the negative initial-condition point in place of its actual (negative) value when solving for the constant (hard tier only, exploiting the forced-negative a).
