misconceptions:
- id: swapped-times
  description: Reports mode 1's computed time for mode 2 and vice versa.
- id: inverted-division
  description: Divides speed by distance instead of distance by speed.
- id: forgot-unit-conversion
  description: At hard/exam tiers, uses the raw stated number for a mismatched-unit speed without converting it, treating (say) a value stated in m/s as if it were already in km/h.
- id: wrong-precision
  description: Rounds to the wrong stated precision, for example to the nearest whole hour or the nearest 10 minutes when a finer precision was asked for.
