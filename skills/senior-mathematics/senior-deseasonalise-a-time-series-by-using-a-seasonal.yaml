id: senior-deseasonalise-a-time-series-by-using-a-seasonal
name: Deseasonalise a time series by using a seasonal index, including the use of spreadsheets to implement this process
domain: senior-mathematics
year_level: ['12']
description: 'Given a stated actual value and a seasonal index (as a bare percentage number, or a stated percentage change from the 100 baseline), compute the deseasonalised value (actual divided by index/100). Also inverts the operation (find the actual value given the deseasonalised value and index) and composes two deseasonalisations with a follow-on percentage-change comparison.'
status: active
placement_eligible: false
prerequisites:
- senior-calculate-seasonal-indices-by-using-the-average-percentage
capability_gates: [technology_use]
answer: number
