misconceptions:
- id: multiplies-instead-of-dividing
  description: Multiplies by index/100 instead of dividing (or, on the hard tier which inverts the operation, divides instead of multiplying).
- id: uses-raw-index-as-divisor
  description: Divides (or multiplies) by the raw index number itself instead of converting it to a proportion first (a factor-of-100 error), e.g. dividing by 108 instead of 1.08.
- id: misreads-percentage-change-as-index
  description: On the medium tier, reads "15% above" as the index itself (uses 15 instead of 115).
- id: uses-actual-values-for-the-change
  description: On the exam tier, reports the percentage change between the two ACTUAL values instead of the two deseasonalised values, skipping the deseasonalising step for the comparison.
