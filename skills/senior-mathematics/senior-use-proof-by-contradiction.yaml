id: senior-use-proof-by-contradiction
name: Use proof by contradiction
domain: senior-mathematics
description: Given bounded, fully specified inputs, use proof by contradiction. Return the resulting value, expression, relation, or classification.
status: active
placement_eligible: false
prerequisites:
- senior-use-implication-converse-equivalence-negation-contrapositive
- senior-use-the-quantifiers-for-all-and-there-exists
answer: mcq
sources:
- topic: proof_by_contradiction_identify
  params: {variant: single_simple}
  difficulty: easy
  stages: [0, 1, 2]
- topic: proof_by_contradiction_identify
  params: {variant: single_computed}
  difficulty: medium
  stages: [3, 4]
- topic: proof_by_contradiction_identify
  params: {variant: compound_claim}
  difficulty: hard
  stages: [5, 6, maintenance]
- topic: exd_x_pc1_contradiction_chain
  params: {tier: exam}
  difficulty: exam
  stages: [exam]
misconceptions:
- id: guesses-plausible-sounding-option
  description: Selects a distractor built from an unrelated property family (parity, sign, multiple-of-3, multiple-of-4, perfect-square) without checking whether the stated fact is actually true of n, mistaking a real, checkable numeric property for the correct contradiction.
- id: misattributes-property-family
  description: Confuses which property family is relevant to the claim at hand and selects an option from the wrong family, rather than verifying each option's truth directly against n.
- id: misidentifies-false-clause
  description: At the hard tier, names the clause that is actually true as the one producing the contradiction, or answers "Both clauses"/"Neither clause" when exactly one of the two stated clauses is false.
tags: [acara-v8-4-specialist, logic, proof-by-contradiction]
