misconceptions:
- id: assumes-supplementary
  description: Treats angles on opposite arcs as supplementary (180 - x) instead of equal (x), or uses supplementary relationship in intermediate steps.
- id: halves-the-angle
  description: Applies the inscribed-angle-is-half-central-angle theorem incorrectly to the same-arc theorem, computing x/2 instead of x.
- id: sign-error-in-the-equation
  description: Makes an algebraic sign error when solving the equality equation (e.g., subtracting instead of adding), leading to the wrong value for x.
