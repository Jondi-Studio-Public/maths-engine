id: senior-angles-at-the-circumference-of-a-circle-subtended
name: Angles at the circumference of a circle subtended by the same arc are equal
domain: senior-mathematics
description: Given bounded, fully specified inputs, Angles at the circumference of a circle subtended by the same arc are equal. Return the resulting value, expression, relation, or classification.
status: active
placement_eligible: false
prerequisites: []
answer: number
sources:
- topic: angles_same_arc
  params: {variant: direct}
  difficulty: easy
  stages: [0, 1, 2]
- topic: angles_same_arc
  params: {variant: triangle_sum}
  difficulty: medium
