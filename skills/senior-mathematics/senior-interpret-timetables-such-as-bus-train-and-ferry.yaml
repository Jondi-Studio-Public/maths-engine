id: senior-interpret-timetables-such-as-bus-train-and-ferry
name: Interpret timetables, such as bus, train and ferry timetables
domain: senior-mathematics
description: Given a stated timetable of several services' scheduled times at named
  stops, choose from offered times the departure time of the latest service from a
  named stop that reaches a second named stop by a stated time.
status: active
placement_eligible: false
prerequisites:
- f10-timetable-itinerary-duration
- convert-time-systems
answer: mcq
sources:
- topic: p19i_timetable_latest_service
  params:
    tier: easy
  difficulty: easy
  stages:
  - 0
  - 1
  - 2
- topic: p19i_timetable_latest_service
  params:
    tier: medium
  difficulty: medium
  stages:
  - 3
  - 4
- topic: p19i_timetable_latest_service
  params:
    tier: hard
  difficulty: hard
  stages:
  - 5
  - 6
  - maintenance
- topic: p19i_timetable_latest_service
  params:
    tier: exam
  difficulty: exam
  stages:
  - exam
misconceptions:
- id: latest-departure-ignores-deadline
  description: Picks whichever offered service departs latest, without checking
    whether it actually arrives by the stated deadline.
- id: earliest-meets-deadline
  description: Picks the earliest-departing service that still arrives by the deadline,
    instead of the latest one that does.
- id: adjacent-row-misread
  description: Reads off the departure time of whichever service is listed next
    to the correct one in the table's printed order, instead of checking each row's
    own arrival against the deadline.
- id: ignores-stated-constraint
  description: On the exam tier, ignores the stated mode/cancellation constraint
    and picks the latest service that still meets the deadline overall, including
    one that is disqualified by the constraint.
