id: complex-arg-ratio-geometry
name: Use the ratio of two vectors, midpoints and w = az + b in the complex plane
domain: senior-mathematics
year_level:
- '12'
description: 'Use the complex plane for geometry beyond rotation: find the image of a point under w = az + b, the midpoint
  and distance of two points, the ratio (c - b)/(a - b) and its argument as the angle at a vertex, and the tests for collinear
  and perpendicular points.'
