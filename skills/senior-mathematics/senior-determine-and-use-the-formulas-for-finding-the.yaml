misconceptions:
  - id: forgets-to-subtract-overlap
    description: Reports |A| + |B| (or |A| + |B| + |C|) uncorrected, forgetting to subtract the pairwise overlap(s) at all.
  - id: double-subtracts-overlap
    description: Subtracts the overlap twice (or, in the three-set case, subtracts the triple intersection again instead of re-adding it), producing an undercount of the union.
  - id: omits-triple-readdition
    description: 'Three-set case: applies the pairwise subtractions but omits the final +|A intersect B intersect C| re-addition, the classic inclusion-exclusion trap.'
  - id: confuses-neither-with-union
    description: Reports the union total |A union B| itself when asked for the "neither" count N - |A union B|, or vice versa. At the three-set hard tier this generalises to reporting the STATED union total itself when asked to solve for a withheld region term.
  - id: drops-a-term-rearranging-for-unknown
    description: 'Three-set hard tier, where the union total is stated and a different region term is withheld each draw: while rearranging the seven-term identity for the withheld term, drops one or more of the OTHER stated terms entirely (rather than a pure sign error), producing a plausible but incomplete isolate.'
