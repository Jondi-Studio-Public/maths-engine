id: senior-determine-and-use-the-formulas-for-finding-the
name: Determine and use the formulas for finding the number of elements in the union of two and the union of three sets
domain: senior-mathematics
description: |
  Given bounded, fully specified inputs, determine and use the formulas for finding the
  number of elements in the union of two and the union of three sets. Return the resulting
  value, expression, relation, or classification. Boundary against
  senior-review-the-rules-p-left-overline-a-right (which grades the structurally identical
  P(A union B) = P(A) + P(B) - P(A intersect B) identity for probabilities in [0, 1], with no
  universe count anywhere in its contract): every question here is framed with an explicit
  finite universe (a survey/count word problem) and answers with a plain integer count, never
  a probability. easy: two-set union, find the "neither" count via N - |A union B|. medium:
  the two-set inverse -- given N, the two set sizes and the "neither" count, find the overlap
  |A intersect B|. hard: three-set union with the union total now stated and exactly one of
  the seven region-derived totals withheld -- which one varies across draws -- solve for the
  missing term by rearranging the seven-term identity. Both the three-set case and the
  two-set inverse-overlap case have no analogue in the probability skill at all.
status: active
placement_eligible: false
