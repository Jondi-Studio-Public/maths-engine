name: The angle at the centre subtended by an arc of a circle is twice the angle at the circumference subtended by the same arc
domain: senior-mathematics
description: Given bounded, fully specified inputs, The angle at the centre subtended by an arc of a circle is twice the angle at the circumference subtended by the same arc. Return the resulting value, expression, relation, or classification.
