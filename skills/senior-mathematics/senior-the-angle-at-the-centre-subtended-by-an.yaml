misconceptions:
- id: reports-central-angle-itself
  description: Reports the stated central angle directly instead of halving it to get the circumference angle.
- id: doubles-instead-of-halving
  description: Doubles the stated central angle instead of halving it, inverting the theorem's relationship.
- id: uses-wrong-arc
  description: On the hard tier, computes (360 - reflex angle) / 2 -- the value that would be correct if P were on the major arc instead of the minor arc as stated.
