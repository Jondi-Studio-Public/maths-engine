misconceptions:
- id: swaps-tan-for-sin-or-cos
  description: Uses the sine or cosine ratio where the tangent ratio was needed for the height/distance relationship.
- id: missing-alternate-angle-correction
  description: On the medium tier, fails to recognise that the angle of depression from the top equals the angle of elevation from the ground point, or otherwise misapplies the given angle.
- id: inverts-the-ratio
  description: Divides by the wrong quantity (e.g. distance/height instead of height/distance), inverting the required ratio.
- id: single-observation-shortcut
  description: On the hard or exam tier, reports the height (hard tier) or one observer's own distance to the base (exam tier) implied by only one observation point, instead of solving the two-triangle system together.
- id: opposite-sides-misreading
  description: On the hard or exam tier, treats the two observation points as being on opposite sides of the tower rather than collinear on the same side, which the question states explicitly -- summing instead of subtracting (hard tier sums the cotangents, exam tier sums the two base distances).
