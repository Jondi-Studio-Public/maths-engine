id: senior-work-with-the-concepts-of-angle-of-elevation
name: Work with the concepts of angle of elevation and angle of depression
domain: senior-mathematics
description: Given bounded, fully specified inputs, work with the concepts of angle of elevation and angle of depression. Return the resulting value, expression, relation, or classification.
status: active
placement_eligible: false
prerequisites: []
answer: number
sources:
- topic: elevation_depression_problem
  params: {variant: elevation}
  difficulty: easy
  stages: [6]
- topic: elevation_depression_problem
  params: {variant: depression}
  difficulty: medium
  stages: [6]
- topic: elevation_depression_problem
  params: {variant: two_observation}
