misconceptions:
- id: wrong-sign-combination
  description: Adds and subtracts the wrong pair of vertices when applying the parallelogram vector relation (e.g. P + Q - R instead of P + R - Q), picking the wrong vertex to subtract.
- id: swaps-x-and-y
  description: Swaps the x- and y-coordinates of the final computed answer.
- id: reports-a-given-midpoint
  description: Reports the coordinates of one of the midpoints already stated in the question instead of computing the one actually asked for.
