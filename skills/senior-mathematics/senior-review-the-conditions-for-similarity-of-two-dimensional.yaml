misconceptions:
- id: assumes-aaa-sufficient-without-checking-sides
  description: Picks the AAA option on the SSS/SAS tiers, where only side data (and, on SAS, one angle) is given -- no second angle is ever stated for AAA to apply.
- id: ignores-included-angle-requirement
  description: On the SAS tier, checks only that the two given sides are proportional and ignores whether the given angle is actually the included one, or ignores an angle mismatch between the two triangles.
- id: assumes-any-proportional-sides-similar
  description: On the SSS tier, checks two of the three side ratios and assumes similarity even when the third pair does not match.
- id: treats-one-matching-angle-as-sufficient
  description: Assumes a single matching angle, without checking the rest, is enough to establish similarity.
