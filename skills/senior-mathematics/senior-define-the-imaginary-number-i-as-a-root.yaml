id: senior-define-the-imaginary-number-i-as-a-root
name: Define the imaginary number i as a root of the equation x^2=-1
domain: senior-mathematics
description: |
  Given bounded, fully specified inputs, define the imaginary number i as a root of the
  equation x^2=-1. Return the resulting value, expression, relation, or classification.
  Closed-form only: every answer is drawn from {1, -1, i, -i} or, at the easy tier, k*i
  for a perfect-square radicand -- no general complex arithmetic is assessed by this skill
  (that belongs to senior-solve-simple-polynomial-equations and the two n-th-roots
  skills). The learner-typed form is always lowercase i; capital I is not accepted, so
  the question text always shows lowercase i.
status: active
placement_eligible: false
prerequisites:
- classify-real-numbers
- f10-square-roots-perfect-squares
answer: expression
