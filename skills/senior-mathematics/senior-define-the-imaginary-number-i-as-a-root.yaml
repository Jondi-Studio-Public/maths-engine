misconceptions:
  - id: dropped-imaginary-unit-kept-sign
    description: Reports k instead of ki -- treats sqrt(-k^2) as sqrt(k^2), dropping the imaginary unit entirely.
  - id: dropped-imaginary-unit-flipped-sign
    description: Reports -k instead of ki -- takes the negative root before applying the imaginary unit.
  - id: sign-flip-on-i
    description: Reports -ki instead of ki (or vice versa) -- correct magnitude, wrong sign on the imaginary unit.
  - id: mod4-off-by-one-plus
    description: Reduces the exponent by (n+1) % 4 instead of n % 4 when evaluating i^n.
  - id: mod4-off-by-one-minus
    description: Reduces the exponent by (n-1) % 4 instead of n % 4 when evaluating i^n.
  - id: exponent-treated-as-positive
    description: For a negative exponent, reduces abs(n) % 4 instead of the correctly-signed n % 4 -- ignores that i^-1 = 1/i = -i.
