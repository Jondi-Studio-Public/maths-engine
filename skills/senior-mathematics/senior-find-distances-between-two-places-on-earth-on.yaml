id: senior-find-distances-between-two-places-on-earth-on
name: Find distances between two places on Earth on the same longitude
domain: senior-mathematics
description: Given bounded, fully specified inputs, find distances between two places on Earth on the same longitude. Return the resulting value, expression, relation, or classification.
status: active
placement_eligible: false
prerequisites: []
answer: number
sources:
- topic: earth_meridian_distance
  params: {mode: same_hemisphere}
  difficulty: easy
  stages: [0, 1, 2]
- topic: earth_meridian_distance
  params: {mode: opposite_hemisphere}
  difficulty: medium
  stages: [3, 4]
- topic: earth_meridian_distance
  params: {mode: combined_km}
