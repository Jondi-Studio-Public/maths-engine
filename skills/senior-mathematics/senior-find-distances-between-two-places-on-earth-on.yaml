misconceptions:
- id: wrong-hemisphere-rule
  description: Subtracts the two latitudes when they are in opposite hemispheres (should add the magnitudes), or adds them when they are in the same hemisphere (should subtract).
- id: forgot-arcminute-conversion
  description: Reports the angular separation in degrees, never multiplied by 60 into arcminutes, so the distance is far too small.
- id: halves-the-constant
  description: Multiplies the angular separation in degrees by 30 instead of 60, halving the true distance.
- id: forgot-unit-conversion
  description: Reports the nautical-mile figure as if it were already in kilometres.
- id: confuses-nm-with-statute-mile
  description: Multiplies the nautical-mile figure by 1.609 (the statute-mile-to-km factor) instead of 1.852.
- id: misreads-minutes-as-hundredths
  description: Reads "48 minutes" of latitude as ".48" of a degree instead of ".8" of a degree, starting from the wrong decimal latitude.
