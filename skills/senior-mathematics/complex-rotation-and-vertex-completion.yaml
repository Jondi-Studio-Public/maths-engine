id: complex-rotation-and-vertex-completion
name: Rotate points and complete vertices in the complex plane
domain: senior-mathematics
year_level:
- '12'
description: Rotate a point of the complex plane about the origin or about another centre by multiplying by a unit complex
  number, and find the missing vertex of a square or equilateral triangle from the vertices given. The exam chain gives the
  side, length and area of a square ABCD and one of its missing vertices.
