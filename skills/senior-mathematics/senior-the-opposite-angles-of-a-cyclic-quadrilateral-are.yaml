misconceptions:
- id: uses-360-instead-of-180
  description: Confuses the quadrilateral's full angle-sum (360 degrees) with the pair-supplement rule (180 degrees) that applies to a single pair of opposite angles.
- id: reports-non-requested-angle
  description: Reports a different angle than the one asked for -- the given angle instead of its opposite, or the other pair's evaluated angle -- instead of tracing through to the requested angle.
- id: drops-difference-relationship
  description: On the hard tier, ignores the stated angle-difference relationship between the other pair of opposite angles (as if it were zero) and reports an angle from the pair that was not asked about.
