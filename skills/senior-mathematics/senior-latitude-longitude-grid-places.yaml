misconceptions:
- id: longitude-written-first
  description: Writes the longitude before the latitude, when a position is written as latitude then longitude.
- id: wrong-hemisphere-letter
  description: Gives the right number of degrees with the wrong letter, N for S or E for W, so the place is on the wrong side of the equator or prime meridian.
- id: one-line-out
  description: Reads a line next to the right one, a place 10 degrees too far north, south, east or west.
- id: swaps-latitude-and-longitude
  description: Reads the latitude along the top and the longitude up the side, so the two numbers are swapped.
- id: subtracts-across-zero
  description: Subtracts the two numbers of degrees when the places are on opposite sides of the equator or prime meridian, instead of adding them.
- id: counts-squares-not-degrees
  description: Gives the number of squares between the places, not the degrees, forgetting each square is 10 degrees.
- id: counts-both-end-lines
  description: Counts both of the end lines as well, so the answer is one square, 10 degrees, too many.
- id: wrong-axis-difference
  description: Finds the difference of the other coordinate, the degrees of longitude for latitude or the reverse.
