id: senior-latitude-longitude-grid-places
name: Locate places by latitude and longitude on a map grid
domain: senior-mathematics
year_level: ['12']
description: "Use latitude and longitude to describe and compare the positions of places marked on a map grid with a line every 10 degrees. Easy reads the latitude, then the longitude, of a place. Medium picks the place at stated coordinates on a map that crosses the equator and the prime meridian. Hard finds the degrees of latitude or longitude between two places on opposite sides of the equator or the prime meridian. The exam tier finds the distance flown along a line of longitude, in kilometres, from the latitudes of two places and 111 km for each degree of latitude."
