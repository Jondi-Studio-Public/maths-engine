misconceptions:
- id: ignores-dst
  description: Omits the +1 hour allowance for a place that is currently observing daylight saving, treating its standard offset as the effective one.
- id: wrong-dst-table-entry
  description: Applies the daylight-saving allowance to a place that does not observe it, or omits it from a place that does -- confuses which of the two named places is currently observing daylight saving.
- id: dst-sign-flip
  description: Subtracts the one-hour daylight-saving allowance instead of adding it for a place that is currently observing it.
