id: senior-solve-problems-involving-time-zones-in-australia-and
name: Solve problems involving time zones in Australia and in neighbouring nations, making any necessary allowances for daylight saving
domain: senior-mathematics
description: Given each named place's standard UTC offset and an explicit sentence stating whether it is currently observing daylight saving, work out the magnitude of the current time difference between two Australian and/or neighbouring places, applying the daylight-saving allowance yourself where it applies.
status: active
placement_eligible: false
prerequisites:
