misconceptions:
- id: stated-number-read-on-the-wrong-axis
  description: Finds the stated number on the wrong axis and reads across to the other one, converting in the opposite direction to the one asked.
- id: proportional-reasoning-ignores-the-offset
  description: Scales the stated value by the ratio at one point on the line, as if the line passed through the origin, ignoring the constant that shifts it.
- id: repeats-the-stated-number-unconverted
  description: Gives the stated number back as the answer, reading it off the wrong scale instead of converting it.
- id: adjacent-grid-line-above
  description: Reads the line one grid line too high, giving the next labelled value instead of the one at the stated input.
- id: adjacent-grid-line-below
  description: Reads the line one grid line too low, giving the previous labelled value instead of the one at the stated input.
- id: counts-grid-squares-not-axis-units
  description: Counts grid squares from the origin instead of reading the numbers on the axis, so the answer is a number of squares and not of units.
