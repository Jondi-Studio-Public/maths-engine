id: senior-interpret-and-use-graphs-in-practical-situations-including
name: Interpret and use graphs in practical situations, including travel graphs and conversion graphs
domain: senior-mathematics
description: 'A straight-line conversion graph is drawn on a labelled grid, the prompt names both units and the
  direction and states one input value, and the learner types the converted value as a whole number in the
  unit asked for. Only true unit conversions (hours to minutes, feet to inches, kilometres to metres, ...) or
  an explicitly scenario-specific rule (one exchange desk today, a hiker''s rule of thumb treated as exact)
  are ever drawn; no rate, offset or equation is printed. The stated input and its output both sit on grid
  lines. Tier ladder by decision: easy converts the stated input forward on a proportional graph through the
  origin; medium reads the graph in reverse (the stated value is on the vertical axis, the answer on the
  horizontal), so the decision is which axis the number is on; hard uses an offset conversion that does not
  pass through the origin, so proportional reasoning from one point fails; exam reads the offset conversion
  in reverse on stepped unequal scales. This skill reads one converted value at a stated input, not the
  line''s parameters (rate-of-change; senior-determine-the-slope-and-intercepts-of-a-straight) and not a
  distance-versus-time travel graph (senior-interpret-distance-versus-time-graphs).'
