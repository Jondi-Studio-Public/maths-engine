id: senior-recognise-the-need-for-milligrams
name: Recognise the need for milligrams
domain: senior-mathematics
description: Given a stated real-world mass description, choose the most appropriate unit among milligrams, grams, kilograms and tonnes for measuring it.
status: active
placement_eligible: false
prerequisites: []
answer: mcq
