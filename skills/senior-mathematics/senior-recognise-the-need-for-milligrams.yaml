misconceptions:
- id: keeps-the-stated-unit
  description: Picks the unit the mass was already stated in, even though that gives an awkward decimal or an unwieldy number of digits.
- id: off-by-one-ladder-step
  description: Picks the mass unit one ladder step away (mg/g/kg/t) from the one that would give a whole number of no more than 3 digits.
- id: picks-the-opposite-direction
  description: When the stated unit is too small (an unwieldy large integer), picks a unit that makes the value even smaller (or vice versa when the stated unit is too large), moving the wrong way along the ladder.
