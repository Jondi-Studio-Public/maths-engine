id: senior-recognise-the-need-for-milligrams
name: Recognise the need for milligrams
domain: senior-mathematics
year_level: ['12']
description: >-
  Given a stated real-world mass description, choose the most appropriate unit among milligrams,
  grams, kilograms and tonnes for measuring it. The exam tier is a dosage problem that finds the
  mass of one dose and a day's total in milligrams, converts the total to grams and finds what
  remains of a tub of powder.
status: active
placement_eligible: false
prerequisites:
- convert-metric-mass
- senior-eview-metric-units-of-mass-and-weight-their
answer: mcq
sources:
