id: complex-polygon-vertices-and-roots-of-unity
name: Find polygon vertices and sum roots of unity
domain: senior-mathematics
year_level:
- '12'
description: 'Find the vertices of a regular polygon in the complex plane by repeated rotation through 360 degrees over n,
  and use the roots of unity: the sum of consecutive powers of a primitive root, the product and the sum of squares of the
  distances from one vertex to the rest, and the sum of the other roots of zⁿ = w. The exam chain takes the roots of zⁿ =
  rⁿ as a polygon: radius, side, perimeter and one root.'
