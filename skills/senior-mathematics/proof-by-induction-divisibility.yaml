id: proof-by-induction-divisibility
name: "Work the steps of an induction proof of divisibility"
domain: senior-mathematics
year_level: ['12']
description: "For a divisibility statement such as 7 divides 3^(2n + 1) + 2^(n + 2), supply one typed step of its proof by induction -- the whole-number multiple at the base case, the leftover term when f(k + 1) is written as a multiple of f(k) plus a remainder, or the multiple of the divisor exhibited in the inductive step. The answers are numbers and expressions, never a choice of which line of a proof is wrong."
status: active
placement_eligible: false
prerequisites:
- ucv1-proof-by-induction
- senior-review-indices-including-fractional-indices-and-the-index
answer: expression
