misconceptions:
- id: gives-quotient-not-value
  description: "Giving the quotient f(1) divided by d where the value of f(1) itself is asked for."
- id: forgets-to-divide-by-d
  description: "Stopping at the value of f(1) (or f(3)) without dividing by the divisor to find the whole-number multiple."
- id: exponent-shift-dropped
  description: "Dropping the constant shift in an exponent, so 3^(2n + 1) is evaluated as 3^(2n)."
- id: exponent-multiplier-dropped
  description: "Dropping the multiplier of n in an exponent when substituting n = 1, so 3^(2n + 1) becomes 3^(n + 1)."
- id: remainder-keeps-the-wrong-term
  description: "Keeping the other power as the leftover term when rearranging f(k + 1) = c f(k) + remainder."
- id: remainder-drops-the-factor
  description: "Forgetting the numerical factor (the difference of the bases) on the leftover power when rearranging f(k + 1)."
- id: remainder-sign-reversed
  description: "Getting the sign of the leftover term wrong when rearranging f(k + 1) into a\u00b7f(k) plus a remainder."
- id: uses-sum-not-difference-of-bases
  description: "Using a + b where the rearrangement gives a - b."
