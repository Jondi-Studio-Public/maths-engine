misconceptions:
- id: forgot-constant-of-integration
  description: Uses the antiderivative G(t) directly as s(t), never solving for the constant of integration against the stated initial position.
- id: power-rule-no-divide
  description: Raises each term's power without dividing by the new power when antidifferentiating v(t), then still solves its own (wrong) constant against the stated initial position.
- id: sign-error-on-constant
  description: Isolates the constant of integration with the sign flipped (medium/hard tiers only, where the stated instant is nonzero so this is a genuinely different value from the true answer).
- id: misread-worded-sign
  description: Treats the worded initial position as if it were always positive, using its magnitude instead of its true sign (hard tier only, only exercisable when the true initial position is negative -- "left of the origin").
