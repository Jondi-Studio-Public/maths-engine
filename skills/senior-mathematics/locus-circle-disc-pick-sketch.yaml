misconceptions:
- id: sr2l-boundary-included-or-excluded
  description: Counting a point on the boundary for a strict inequality, or leaving it out for a non-strict one.
- id: sr2l-centre-modulus-only
  description: Giving the distance from the origin to the centre as the greatest or least value of |z|, forgetting the radius.
- id: sr2l-centre-sign-flipped
  description: 'Reading the centre of a locus |z - w| = r with the signs of w reversed: z + 2 - 3i is taken to be centred
    at (2, -3) instead of (-2, 3).'
- id: sr2l-components-added
  description: Adding the real and imaginary parts of a difference of complex numbers instead of taking its modulus.
- id: sr2l-diameter-for-radius
  description: Using the diameter of a circle where its radius belongs.
- id: sr2l-difference-of-radii
  description: Using the difference of the two radii as the outer radius of the region between concentric circles.
- id: sr2l-greatest-and-least-confused
  description: Giving the greatest value of |z| over a disc where the least was asked for, or the reverse.
- id: sr2l-inner-circle-ignored
  description: Describing the region between two circles by its outer boundary alone, so the inner disc is wrongly included.
- id: sr2l-inside-outside-reversed
  description: Choosing the points outside the circle where the points inside were asked for, or the reverse.
- id: sr2l-larger-component-only
  description: Taking the larger of the real and imaginary parts as the modulus.
- id: sr2l-modulus-compared-with-radius
  description: Testing |z| against the radius instead of |z - c|, measuring the distance from the origin and not from the
    centre.
- id: sr2l-modulus-of-point-not-distance
  description: Using the modulus of a point on the circle as the radius, instead of its distance from the centre.
- id: sr2l-radius-for-modulus
  description: Giving the radius of a disc as the greatest or least value of |z|, forgetting that the centre is not the
    origin.
- id: sr2l-radius-squared
  description: Using the radius squared where the radius belongs, or comparing a squared distance with the radius itself.
- id: sr2l-real-imaginary-swapped
  description: Swapping the real and imaginary parts of a centre or point, so the real part is plotted up the imaginary
    axis.
- id: sr2l-subtracted-the-wrong-way
  description: Subtracting the larger quantity from the smaller, which gives a negative modulus.
difficulty_progression: Easy reads one drawn circle and writes |z - w| = r, where the sign of the centre is the trap. Medium
  plots four points, one of them exactly on the circle, and asks which satisfy a strict or non-strict inequality, so the
  boundary matters. Hard draws two concentric circles and states which boundary belongs to the region between them, so the
  double inequality has to carry the right strict and non-strict signs. The exam chain finds a radius from a point on the
  circle, then the greatest and least |z| over the disc (following through from the radius) and which complex number lies
  strictly inside.
