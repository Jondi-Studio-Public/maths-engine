misconceptions:
- id: reports-bearing-unchanged
  description: Reports the given bearing back unchanged instead of computing the reverse (back) bearing.
- id: forgets-to-normalise-mod-360
  description: Adds or subtracts 180 degrees without normalising past 0 or 360, giving a negative value or one that needs +360.
- id: adds-legs-instead-of-pythagoras
  description: Adds the two leg lengths directly instead of applying Pythagoras to find the straight-line distance.
- id: subtracts-legs-instead-of-pythagoras
  description: Subtracts the shorter leg length from the longer one instead of applying Pythagoras to find the straight-line distance.
- id: reports-single-leg-only
  description: Reports one leg's length as if it were the straight-line distance, forgetting the second leg entirely.
- id: forgets-to-convert-triangle-angle-to-bearing
  description: Reports the raw inverse-tangent angle from inside the right triangle without converting it into an absolute compass bearing.
- id: wrong-reference-direction
  description: Subtracts the triangle's angle from the reference bearing instead of adding it (or vice versa), taking the wrong turn direction.
- id: reports-opposite-direction-bearing
  description: Reports the forward bearing when the back bearing was asked, or vice versa, forgetting to add the 180-degree turn for the direction actually asked.
- id: swaps-opposite-and-adjacent-legs
  description: Swaps which leg is opposite and which is adjacent in the inverse-tangent ratio, giving the complementary angle.
