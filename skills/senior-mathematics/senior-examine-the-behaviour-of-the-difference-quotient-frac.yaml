misconceptions:
- id: reads-off-least-converged-value
  description: Reports the least-converged displayed value Q(0.1) instead of the value the sequence approaches as h -> 0.
- id: sign-error-on-difference
  description: Negates the limit, as if computing (f(p)-f(p+h))/h instead of (f(p+h)-f(p))/h.
- id: forgot-power-multiply
  description: Differentiates A*x^2 as A*x instead of 2*A*x, dropping the power-rule coefficient of 2.
- id: dropped-linear-term
  description: Drops the linear coefficient B entirely from the limiting value.
