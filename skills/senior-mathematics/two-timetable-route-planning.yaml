id: two-timetable-route-planning
name: Plan a journey using two timetables
domain: senior-mathematics
year_level: ['11']
description: Plan a journey that uses two timetables with a change between them, written as text with a stated minimum change
  time. Easy finds the earliest arrival for a traveller who catches the first service she can. Medium finds the whole journey
  time in minutes, waiting included. Hard finds the latest departure that still arrives by a deadline. The exam chain finds
  the interchange arrival, the wait, the final arrival and the journey time.
status: active
placement_eligible: false
