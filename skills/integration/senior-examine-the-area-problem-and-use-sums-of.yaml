misconceptions:
- id: wrong-endpoint-for-stated-rule
  description: Computes a left Riemann sum with right endpoints, or a right Riemann sum with left
    endpoints -- collapses to the OTHER named rule's value.
- id: reuses-endpoint-not-midpoint
  description: Uses the midpoint rule's own strip widths but evaluates f at an endpoint instead of
    recomputing it at the midpoint.
- id: shared-width-on-non-uniform-partition
  description: On a non-uniform partition, sums using one shared average width instead of each
    strip's own delta_x_i.
- id: off-by-one-rectangle
  description: Drops one or more trailing rectangles or breakpoint intervals when summing (a
    miscount of how many strips the partition has), instead of using every one.
