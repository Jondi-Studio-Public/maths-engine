id: partial-fractions-repeated-irreducible
name: Find partial fractions with repeated or irreducible quadratic factors
domain: integration
year_level: ['12']
description: Find the constants in a partial-fraction decomposition when the denominator has a repeated linear factor or an
  irreducible quadratic factor, and use them to integrate and evaluate.
status: active
