misconceptions:
- id: dropped-power-reduction-half-factor
  description: Uses the un-halved identity sin^2 x = 1 - cos 2x (or cos^2 x = 1 + cos 2x), forgetting
    the 1/2 factor and doubling the whole power-reduction contribution to the antiderivative.
- id: sign-error-on-cos-2kx-term
  description: Swaps the sin^2/cos^2 identity signs, writing + where - is needed or vice versa.
- id: dropped-inner-derivative-factor
  description: Forgets the 1/k chain-rule factor when integrating sin(2kx), cos(2kx) or tan(kx).
- id: dropped-minus-x-term
  description: Applies 1 + tan^2 x = sec^2 x but forgets the "- x" term, integrating only sec^2(kx)
    and omitting the -1 half of the identity.
- id: dropped-constant-of-integration
  description: Writes the antiderivative with no "+ C", omitting the arbitrary constant of integration.
