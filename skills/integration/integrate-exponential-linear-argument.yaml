id: integrate-exponential-linear-argument
name: Integrate exponential functions with a linear argument
domain: integration
year_level: ['12']
description: Find antiderivatives of exponential functions such as a e^(kx), e^(px + q) and b^x, including the constant of
  integration, then use a point on the curve to fix that constant.
status: active
placement_eligible: false
prerequisites:
- integrate-polynomial
answer: expression
