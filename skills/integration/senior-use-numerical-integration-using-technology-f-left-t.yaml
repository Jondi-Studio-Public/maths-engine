id: senior-use-numerical-integration-using-technology-f-left-t
name: 'Use numerical integration using technology \(f\left(t\right)=\lambda e^{-\lambda t}\) for
  \(t\geq0\) of the exponential random variable with parameter \(\lambda>0,\)'
domain: integration
description: 'Given a stated rate parameter lambda greater than zero and stated finite integration
  bounds, use numerical integration by technology to compute the value of the definite integral of
  the exponential probability density function f(t) = lambda * e^(-lambda * t) for t >= 0 between
  those bounds, to a stated precision. This skill covers only the first of the two clauses of the
  descriptor ACMSM127: the separate "use the exponential random variables and associated
  probabilities and quantiles to model data and solve practical problems" clause is excluded
  entirely -- no scenario, dataset or word problem is ever presented, at any difficulty including
  the exam tier.'
