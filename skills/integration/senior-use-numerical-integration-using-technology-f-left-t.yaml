misconceptions:
- id: swapped-sign
  description: Evaluates e^(-lambda*b) - e^(-lambda*a) instead of e^(-lambda*a) - e^(-lambda*b), the negative of the true answer.
- id: forgot-lower-bound
  description: Computes 1 - e^(-lambda*b) even though the lower bound a is stated and nonzero, omitting the lower-bound term entirely.
- id: sign-error-in-exponent
  description: Uses lambda*t instead of -lambda*t inside the exponential, evaluating e^(lambda*b) - e^(lambda*a).
- id: dropped-second-interval
  description: On the exam tier, reports only one of the two stated disjoint sub-intervals' integrals instead of their sum.
