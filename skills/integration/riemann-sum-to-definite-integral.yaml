misconceptions:
- id: riemann-limit-at-n-equals-one
  description: Reads the value of the sum at n = 1 instead of the value it approaches as n grows.
- id: riemann-limit-keeps-lower-order-terms
  description: Keeps the terms in 1/n along with the constant term when taking the limit.
- id: riemann-limit-drops-lower-limit
  description: Reads sample points a + ci/n as an integral from 0 to c, ignoring the starting point a.
- id: riemann-limit-width-as-upper-limit
  description: Takes the width c in a + ci/n as the upper limit, so the interval runs from a to c.
- id: riemann-n-from-error-bound
  description: Uses the crude error bound (b - a)(f(b) - f(a))/n and finds a larger n than the least one that works.
- id: riemann-n-off-by-one-at-threshold
  description: Gives the n just below or just above the least one that meets the tolerance.
