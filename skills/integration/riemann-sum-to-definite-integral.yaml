id: riemann-sum-to-definite-integral
name: From a Riemann sum to the definite integral
domain: integration
year_level: ['12']
description: Take the limit of a Riemann sum as the number of strips grows, recognise a limit of sums as a definite integral from its sample points and width, and find how many strips bring a left or right sum within a tolerance of the integral.
status: active
