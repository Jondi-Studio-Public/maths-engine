id: definite-integral-substitution-changed-limits
name: Evaluate definite integrals by substitution with changed limits
domain: integration
year_level:
- '12'
description: Find the exact value of a definite integral by substitution, changing the limits to match u, including a leftover
  x, exponential and trigonometric integrands, and the trigonometric substitution x = a sin(theta).
