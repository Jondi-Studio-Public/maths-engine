id: integrate-trig-powers
name: Integrate powers of sine and cosine
domain: integration
description: Integrate sin^n and cos^n of a linear argument by the double-angle identity for even powers and by substitution
  for odd powers, including products and exact definite values.
status: active
placement_eligible: false
