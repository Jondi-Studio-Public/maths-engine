misconceptions:
- id: accumulation-value-as-rate
  description: Gives the value of f at the upper limit when the accumulated value F was asked for.
- id: accumulation-ignores-lower-limit
  description: Evaluates the antiderivative at the upper limit only, as if the integral started at 0.
- id: accumulation-derivative-subtracts-lower-limit
  description: Treats F'(x) as f(x) - f(a), subtracting the integrand at the lower limit.
- id: accumulation-differentiates-integrand
  description: Differentiates f to find F', instead of recognising that F' is f.
- id: accumulation-min-taken-for-max
  description: Gives the point where F has a local minimum when the local maximum was asked for.
- id: accumulation-max-of-integrand
  description: Takes the x-value where f is greatest for the x-value where F is greatest.
- id: accumulation-chain-rule-forgotten
  description: Leaves out the factor g'(x) when the upper limit is g(x).
