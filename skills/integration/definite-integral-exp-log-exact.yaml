id: definite-integral-exp-log-exact
name: Find exact values of definite integrals of exponentials and reciprocals
domain: integration
year_level: ['12']
description: Evaluate definite integrals of exponential and reciprocal functions exactly, in terms of e and the natural logarithm,
  including areas, ratios of areas and average values.
status: active
