id: trig-substitution-hsc-tan-and-convert
name: 'Trigonometric substitution: convert the integral, then evaluate with x = a tan(theta) or a sin(theta)'
domain: integration
year_level:
- '12'
description: 'Use x = a sin(theta) and x = a tan(theta) on integrals of 1/(a^2 + x^2), 1/(a^2 + x^2)^2, sqrt(a^2 - x^2), x^2/sqrt(a^2
  - x^2), 1/sqrt(a^2 - x^2) and 1/(a^2 - x^2)^(3/2): convert the integrand, dx and the limits, then find the exact value of
  the definite integral.'
status: active
placement_eligible: false
