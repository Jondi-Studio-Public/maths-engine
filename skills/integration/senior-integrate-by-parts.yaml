misconceptions:
- id: sign-error
  description: Flipping the sign of the ∫v·du term in the by-parts formula.
- id: dropped-integral-term
  description: Dropping the ∫v·du term entirely and using only u·v.
- id: wrong-v-antiderivative
  description: Computing v without dividing by the inner coefficient.
- id: swapped-uv
  description: Swapping the roles of u and v in the by-parts formula, computing v·u - ∫u·dv instead of u·v - ∫v·du.
- id: only-upper-bound
  description: Evaluating the antiderivative at the upper bound only, without subtracting the lower bound.
