id: trapezium-rule-estimate
name: Estimate a definite integral with the trapezium rule
domain: integration
year_level: ['12']
description: Estimate an integral or an area with the trapezium rule on 2 to 5 equal strips from a formula (e^x, 1/x, sqrt(x), sin x) or a table of measurements, recover an unknown ordinate or the number of strips from a stated result, and compare an estimate with the exact value, signed and absolute.
status: active
placement_eligible: false
