id: integrate-f-prime-over-f
name: Integrate expressions of the form f'(x)/f(x) and f'(x)e^f(x) by inspection
domain: integration
year_level: ['12']
description: Recognise an integrand that is f'/f or f' e^f, or a constant multiple of it, and write the logarithmic or exponential
  antiderivative without a formal substitution.
status: active
placement_eligible: false
prerequisites:
