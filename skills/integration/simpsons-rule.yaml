misconceptions:
- id: simpson-trapezoidal-weights
  description: Applies the trapezium rule's weights 1, 2, 2, ..., 2, 1 (and h/2) when Simpson's rule was asked for.
- id: simpson-weights-swapped
  description: Puts the weight 4 on the even-numbered ordinates and 2 on the odd-numbered ones, the wrong way round.
- id: simpson-all-inner-weight-4
  description: Gives every inner ordinate the weight 4 instead of alternating 4 and 2.
- id: simpson-wrong-multiplier
  description: Multiplies the weighted sum by h/2 (or another factor) instead of h/3.
- id: simpson-strips-counted-as-ordinates
  description: Counts the n + 1 ordinates as the number of strips, so the strip width is the interval length over n + 1.
- id: simpson-uses-interval-length-as-h
  description: Uses the whole interval length as the strip width h.
