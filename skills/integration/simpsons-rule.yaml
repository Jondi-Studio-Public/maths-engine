name: Estimate a definite integral with Simpson's rule
domain: integration
year_level: ['12']
description: Estimate an integral or an area with Simpson's rule on 2, 4 or 6 equal strips from a formula or a table of measurements, recover an unknown ordinate from a stated estimate, and compare an estimate with the exact value.
