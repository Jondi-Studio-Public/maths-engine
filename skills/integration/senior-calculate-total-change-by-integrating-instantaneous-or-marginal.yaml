misconceptions:
- id: sign-error
  description: Evaluating the bounds swapped, flipping the sign of the result.
- id: wrong-power-rule
  description: Raising the power without halving when integrating the rate function.
- id: rate-times-duration
  description: Multiplying the endpoint rate by the duration instead of integrating a changing rate.
- id: only-upper-bound
  description: Evaluating the antiderivative at the upper bound only, without subtracting the lower bound.
- id: added-initial-amount
  description: Adding a stated initial amount to the total change, answering the final amount instead of the change.
