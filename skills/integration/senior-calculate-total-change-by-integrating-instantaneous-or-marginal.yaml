id: senior-calculate-total-change-by-integrating-instantaneous-or-marginal
name: Calculate total change by integrating instantaneous or marginal rate of change
domain: integration
description: Given bounded, fully specified inputs, calculate total change by integrating instantaneous or marginal rate of change. Return the resulting value, expression, relation, or classification.
status: active
placement_eligible: false
prerequisites:
- integrate-polynomial
answer: expression
