id: integrate-reciprocal-linear
name: Integrate reciprocals of linear expressions
domain: integration
year_level: ['12']
description: Find antiderivatives of a/x and a/(px + q) as logarithms of an absolute value with the constant of integration,
  including integrands that need a division first.
