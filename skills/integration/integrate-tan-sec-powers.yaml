id: integrate-tan-sec-powers
name: Integrate powers and products of tan and sec
domain: integration
year_level:
- '12'
description: Integrate tan^n and sec^n of a linear argument and the products sec^n tan and tan^m sec^2 by the identity tan^2
  = sec^2 - 1 and by substitution, including exact definite integrals.
status: active
placement_eligible: false
prerequisites:
