id: integrate-substitution-rewrite-x
name: Integrate by substitution when the leftover x must be rewritten in u
domain: integration
year_level:
- '12'
description: Integrate x(x + a)^n, x times a root of x + a, x over a power of x + a, and odd powers of x times a function
  of x squared, by a substitution that leaves a factor of x to be written in terms of u; then use it in a definite integral
  with changed limits.
status: active
placement_eligible: false
