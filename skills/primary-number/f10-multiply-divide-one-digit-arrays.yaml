id: f10-multiply-divide-one-digit-arrays
name: Multiply and divide using groups and arrays
domain: primary-number
description: Given a one-digit multiplication or division situation framed as equal groups or an array, compute the unknown total, each-group size, or number of groups.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: [multiplication-facts, equal-groups, whole-number-division-facts]
answer: number
sources:
- topic: multiply_divide_one_digit_arrays
  params: {variant: find_total, groups_range: [2, 9], each_range: [2, 9]}
  difficulty: easy
  stages: [0, 1, 2]
- topic: multiply_divide_one_digit_arrays
  params: {variant: find_each, groups_range: [2, 9], each_range: [2, 9]}
  difficulty: medium
  stages: [3, 4]
- topic: multiply_divide_one_digit_arrays
  params: {variant: find_groups, groups_range: [2, 9], each_range: [2, 9]}
  difficulty: hard
  stages: [5, 6, maintenance]
misconceptions:
- id: wrong-operation
  description: Applies the wrong operation for the situation -- adds instead of multiplying when finding a total, or multiplies instead of dividing when finding an unknown group count or group size.
- id: partitive-quotitive-confusion
  description: In a division situation, reports the other stated quantity (the given number of groups, or the given each-group size) as if it answered the question, confusing which of "each-group size" and "number of groups" is being asked for.
- id: off-by-one
  description: Answers one more or one fewer than the correct group count or each-group size.
tags: [acara-f10-v9, primary, multiplication, division, ac9m2n05, ac9m3n04]
