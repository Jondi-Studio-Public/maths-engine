misconceptions:
- id: denominators-added
  description: Treats fraction addition/subtraction like whole-number addition of a pair -- adds or keeps the original numerators over the SUM of the original denominators instead of the common denominator (e.g. for 1/3 + 1/6, answers 2/9 instead of 1/2).
- id: numerator-not-scaled
  description: Converts every term's denominator to the common denominator but forgets to scale one term's numerator to match, keeping it over the new denominator unchanged (e.g. for 1/3 + 1/6, answers 1/6 + 1/6 = 2/6 instead of 2/6 + 1/6 = 3/6).
- id: wrong-operation-sign
  description: On a subtraction question, computes the sum instead of the difference, or reverses the term order (b - a instead of a - b). Never exercisable on an addition-only question (the easy tier never subtracts).
