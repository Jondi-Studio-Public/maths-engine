id: f10-equivalent-fractions-related-denominators
name: Generate equivalent fractions with related denominators
domain: primary-number
description: Generate an equivalent fraction with a related denominator for a supplied fraction. Never a decimal connection, a number-line placement or a simplification -- grade_fraction compares fractions by exact value, so a distractor is never "the right value, a different denominator"; every misconception offered here is a genuinely different fraction value.
status: active
placement_eligible: false
prerequisites:
- f10-unit-fractions-combine-whole
- compare-common-fractions
answer: fraction
sources:
- topic: equivalent_fraction_related_denominator
  params: {shape: "direct"}
  difficulty: easy
  stages: [0, 1, 2]
- topic: equivalent_fraction_related_denominator
  params: {shape: "named"}
  difficulty: medium
  stages: [3, 4]
- topic: equivalent_fraction_related_denominator
  params: {shape: "backward"}
  difficulty: hard
