  params: {tier: exam}
  difficulty: exam
  stages:
  - exam
misconceptions:
- id: scaled-numerator-only
  description: Multiplies the numerator by the scale factor but leaves the denominator unchanged (e.g. for 2/3 -> ?/12, answers 8/3 instead of 8/12).
- id: scaled-denominator-only
  description: Multiplies the denominator by the scale factor but leaves the numerator unchanged (e.g. for 2/3 -> ?/12, answers 2/12 instead of 8/12).
- id: added-scale-factor
  description: Adds the scale factor to numerator and denominator instead of multiplying by it (e.g. scale factor 4, answers (2+4)/(3+4) = 6/7 instead of 8/12).
- id: wrong-scale-factor
  description: Uses the original denominator as if it were the scale factor, instead of dividing the target denominator by the original denominator to find it.
