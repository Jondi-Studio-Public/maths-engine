misconceptions:
- id: wrong-factor
  description: Reports the quotient as the OTHER family member instead of the one the fact or wording actually specifies -- the classic partitive/quotitive-divisor confusion, with the correct product.
- id: adjacent-fact
  description: Reports the product and quotient of the neighbouring fact (one more group than asked for) as if it answered the question asked.
- id: swapped
  description: Exchanges the product and the quotient.
- id: quotient-off-by-one
  description: Reports the correct product with the quotient shifted by one.
