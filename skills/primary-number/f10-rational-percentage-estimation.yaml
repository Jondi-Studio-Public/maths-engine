misconceptions:
- id: wrong-benchmark-divisor
  description: Applies a structurally wrong mental-math divisor for the stated benchmark (10% treated as divide-by-100; 25% treated as divide-by-2; 50% treated as divide-by-4).
- id: always-floor
  description: Never rounds up even at or past the midpoint; always floors the exact value.
- id: always-ceiling
  description: Always rounds up regardless of the fractional part; always takes the ceiling of the exact value.
