misconceptions:
- id: carry-forgotten
  description: Writes the ones, tens or hundreds digit of a column total but never adds the carried ten or hundred to the next column.
- id: smaller-from-larger
  description: In each column subtracts the smaller digit from the larger, whichever number it belongs to, instead of regrouping.
- id: borrow-not-paid
  description: Borrows ten for a column but does not reduce the column it borrowed from, so the answer is too large by a ten or a hundred.
- id: off-by-one
  description: States a value one more or one less than the correct answer.
