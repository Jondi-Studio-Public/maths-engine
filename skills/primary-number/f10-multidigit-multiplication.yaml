misconceptions:
- id: dropped-carry
  description: Multiplies digit by digit but drops the carry between place-value columns, instead of regrouping it into the next column.
- id: place-value-shift-error
  description: Multiplies correctly by the tens digit of the second factor but forgets to shift that partial product left by one place, leaving it a factor of 10 too small.
- id: transposed-digits
  description: Transposes two digits of one factor before multiplying, e.g. reads 63 as 36.
