misconceptions:
- id: reversed-order
  description: Orders the decimals from largest to smallest instead of smallest to largest.
- id: longer-is-bigger
  description: Reads the digits after the decimal point as if they were a whole number, ignoring place value, so a decimal with more digits after the point is wrongly ranked bigger (e.g. treats 0.45 as bigger than 0.5 because 45 > 5).
- id: shorter-is-bigger
  description: The mirror misconception -- treats a decimal with fewer digits after the point as bigger regardless of its digits (e.g. treats 0.5 as bigger than 0.45).
- id: adjacent-swap
  description: Orders the decimals correctly overall but swaps one neighbouring pair, as if two adjacent values did not need comparing once roughly placed.
