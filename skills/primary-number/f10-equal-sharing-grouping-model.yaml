misconceptions:
- id: swapped-reading
  description: Computes the right number but reports it under the other reading's unit -- e.g. reports a container count when the question asks for a per-container amount, or vice versa (the partitive/quotitive confusion this skill assesses).
- id: restates-total
  description: Reports the given total as if it were already the answer, without dividing.
- id: off-by-one
  description: Answers one more than the correct quotient, with the correct reading and unit.
- id: stops-after-first-step
  description: 'Exam tier only: reports the first-step share (before the second division is applied) as if it were the final answer.'
