misconceptions:
- id: mixed-representation-error
  description: Keeps one term in its original representation instead of converting -- e.g. adds the fraction's numerator directly to the decimal, treating 1/4 + 0.5 as 1.5 (i.e. 1 + 0.5, dropping the denominator).
- id: percent-computed-wrong
  description: At medium, applies a different benchmark percentage than the one stated. At hard, rounds the non-benchmark percentage to the nearest multiple of 10 before computing (e.g. computes 72% as if it were 70%).
- id: percent-as-whole-number
  description: Treats the stated percentage X% as the literal integer X instead of X/100 (e.g. reads 35% of a value as +35 instead of +0.35 * value).
