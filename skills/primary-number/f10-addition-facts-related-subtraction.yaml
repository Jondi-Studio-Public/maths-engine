misconceptions:
- id: names-subtracted-addend
  description: States the addend that was subtracted instead of the addend left over.
- id: restates-the-sum
  description: States the fact's own sum, as if the subtraction had done nothing.
- id: adds-instead-of-subtracts
  description: Adds the subtracted addend to the sum instead of subtracting it.
- id: off-by-one
  description: States a value one more or one less than the correct related-fact value.
