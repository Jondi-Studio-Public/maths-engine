id: f10-division-remainder-context
name: Divide and interpret remainders
domain: primary-number
year_level: ['5']
naplan_domain: [number]
description: Solve a division problem and express or interpret the remainder as a whole number (how many are left over), the number of groups needed to fit everything, or a decimal share amount, appropriate to the stated context.
status: active
placement_eligible: false
prerequisites: [whole-number-division-facts, f10-multiply-divide-one-digit-arrays]
answer: number
sources:
- topic: division_remainder_context
  params: {variant: leftover, total_range: [20, 99], divisor_range: [2, 9]}
  difficulty: easy
  stages: [0, 1, 2]
- topic: division_remainder_context
  params: {variant: groups_needed, total_range: [20, 99], divisor_range: [2, 9]}
  difficulty: medium
  stages: [3, 4]
- topic: division_remainder_context
  params: {variant: decimal_share, total_range: [30, 199]}
  difficulty: hard
  stages: [5, 6, maintenance]
- topic: exd_x_pr6_remainder_boxes
  params: {tier: exam}
  difficulty: exam
  stages:
  - exam
misconceptions:
- id: reports-quotient
  description: In a "how many are left over" question, reports the number of full groups (the quotient) instead of what remains.
- id: off-by-one-remainder
  description: Reports one more than the true remainder.
- id: reports-divisor
  description: In a "how many are left over" question, reports the group size itself, confusing "how many left over" with "how many in each group".
- id: forgets-to-round-up
  description: In a "how many groups are needed" question, always reports the floor quotient, even when a remainder means one more group is genuinely needed to fit everything.
- id: always-rounds-up
  description: In a "how many groups are needed" question, always adds one extra group, even when the division is exact and no extra group is needed.
- id: reports-remainder-instead
  description: In a "how many groups are needed" question, reports the leftover remainder itself as if it answered the "how many groups" question.
- id: reports-quotient-only
  description: In a "share equally as a decimal" question, reports only the whole-number quotient, dropping the fractional/decimal part entirely.
- id: remainder-as-decimal-digits
  description: In a "share equally as a decimal" question, treats the whole-number remainder's digits as if they were the decimal part directly, without actually dividing the remainder by the number of shares.
