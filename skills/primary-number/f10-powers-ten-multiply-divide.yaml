id: f10-powers-ten-multiply-divide
name: Multiply and divide by powers of ten
domain: primary-number
description: Multiply or divide a natural number or decimal by a multiple or power of ten using place-value relationships.
status: active
placement_eligible: false
prerequisites: [place-value-to-100, decimal-arithmetic]
answer: number
sources:
- topic: powers_ten_multiply_divide
  params: {variant: whole_power}
  difficulty: easy
  stages: [0, 1, 2]
- topic: powers_ten_multiply_divide
  params: {variant: whole_multiple}
  difficulty: medium
  stages: [3, 4]
- topic: powers_ten_multiply_divide
  params: {variant: decimal_power_missing_factor}
  difficulty: hard
  stages: [5, 6, maintenance]
misconceptions:
- id: wrong-direction-shift
  description: Applies the opposite operation to the one asked -- divides when multiplying was asked, multiplies when dividing was asked, or (for a decimal) shifts the decimal point the wrong way.
- id: off-by-one-place
  description: Shifts by an adjacent power of ten instead of the one asked, e.g. treats x100 as x10 or /1000 as /100.
- id: drops-decimal-point
  description: Treats a decimal operand as if it were the bare digit string with no decimal point (e.g. reads 4.6 as 46) before applying the shift.
tags: [acara-f10-v9, primary, place-value, multiplication, division, ac9m4n05, ac9m6n06]
