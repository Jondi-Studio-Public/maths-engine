misconceptions:
- id: reversed-order
  description: Orders the numbers from largest to smallest instead of smallest to largest.
- id: adjacent-swap
  description: Orders the numbers correctly overall but swaps the two middle values, as if two neighbouring values did not need comparing.
- id: leading-digit-only
  description: Orders numbers by comparing only their first digit, ignoring the rest of each number and its overall digit count -- so a shorter number with a larger leading digit is wrongly ranked above a longer number with a smaller leading digit.
