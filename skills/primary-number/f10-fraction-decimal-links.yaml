id: f10-fraction-decimal-links
name: Link tenths and hundredths as fractions and decimals
domain: primary-number
year_level: ['4']
naplan_domain: [number]
description: Move between decimals and fractions of tenths and hundredths, add and subtract tenths and hundredths written
  as fractions and give the result as a decimal, and count a mixed total in hundredths.
status: active
placement_eligible: false
prerequisites:
- f10-decimal-notation-tenths-hundredths
- f10-fractions-half-quarter-eighth
answer: number
sources:
- topic: fr2b_fraction_decimal_links
  params:
    tier: easy
  difficulty: easy
  stages:
  - 0
  - 1
  - 2
- topic: fr2b_fraction_decimal_links
