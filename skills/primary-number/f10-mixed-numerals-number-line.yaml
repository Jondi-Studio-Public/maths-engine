id: f10-mixed-numerals-number-line
name: Read mixed numerals on a number line
domain: primary-number
year_level: ['4']
naplan_domain: [number]
description: Read a marked point on a number line with equal steps between the whole numbers as a mixed numeral, and find
  the distance between two marked points.
status: active
capability_gates:
- figure_stimulus
needs_figure: true
placement_eligible: false
