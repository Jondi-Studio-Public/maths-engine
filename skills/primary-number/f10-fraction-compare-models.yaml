misconceptions:
- id: more-parts-means-more
  description: Chooses the model cut into more parts, because the parts are more numerous, although each part is smaller.
- id: more-shaded-parts-wins
  description: Chooses the model with more shaded parts without allowing for the parts being different sizes.
- id: most-parts-is-biggest
  description: Picks the model cut into the most parts as the one with the most shaded, although its parts are the smallest.
