  difficulty: hard
  stages: [5, 6, maintenance]
misconceptions:
- id: reversed-order
  description: Orders the fractions from largest to smallest instead of smallest to largest.
- id: adjacent-swap
  description: Orders the fractions correctly overall but swaps one neighbouring pair, as if two adjacent values did not need comparing once roughly placed.
- id: denominator-then-numerator-order
  description: Sorts by the displayed denominator ascending, then the displayed numerator ascending, ignoring the actual fraction value entirely -- so a fraction with a bigger denominator is always ranked after one with a smaller denominator, regardless of size.
