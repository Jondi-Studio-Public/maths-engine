misconceptions:
- id: rounds-down-always
  description: Floors every operand to the stated place instead of applying half-up rounding.
- id: uses-unrounded-operands
  description: Computes the operation on the raw, unrounded operands.
- id: wrong-place-value
  description: Rounds to one place coarser than instructed (e.g. nearest 100 when told nearest 10).
- id: same-place-for-both
  description: On hard tier, applies only the first stated place to both operands, ignoring the second operand's own different stated place.
