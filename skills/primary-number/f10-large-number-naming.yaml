misconceptions:
- id: reversed-order
  description: Orders the numbers from largest to smallest instead of smallest to largest.
- id: digit-count-only
  description: Groups numbers by digit count but never compares values within a group of the same length, leaving same-length numbers in whatever order they were shown.
- id: first-digit-only
  description: Orders numbers by comparing only their first digit, ignoring the rest of each number and its overall digit count.
- id: text-sort-ignores-length
  description: Sorts the numerals as plain text without accounting for differing digit counts, so a shorter number with a larger leading digit wrongly outranks a longer number.
- id: adjacent-swap
  description: Orders the numbers correctly overall but swaps the two middle values, as if two neighbouring magnitudes did not need comparing once roughly placed.
