id: f10-large-number-naming
name: Order large natural numbers
domain: primary-number
description: Order a set of distinct natural numbers greater than 10,000 from smallest to largest.
status: active
placement_eligible: false
prerequisites: [place-value-to-100]
answer: ordered_list
sources:
- topic: large_number_ordering
  params: {digit_lengths: [5]}
  difficulty: easy
  stages: [0, 1, 2]
- topic: large_number_ordering
  params: {digit_lengths: [6]}
  difficulty: medium
  stages: [3, 4]
- topic: large_number_ordering
  params: {digit_lengths: [5, 6, 7]}
