misconceptions:
- id: wrong-accuracy
  description: Rounds correctly but to a different context-implied place than the one this context actually uses (e.g. the nearest tenth instead of the nearest hundredth).
- id: truncation
  description: Drops the digits after the rounding place without applying the half-up rule, instead of rounding.
- id: wrong-direction-on-boundary
  description: When the digit after the rounding place is exactly 5, rounds down instead of up.
