misconceptions:
- id: forgets-to-normalise-e2
  description: Reports n times u_perp (or u_perp itself) instead of the unit vector, skipping the final division by the magnitude.
- id: uses-raw-v-for-e2
  description: Reports v normalised directly (v/|v|) instead of the orthogonalised-then-normalised vector, skipping the projection subtraction entirely.
- id: wrong-rotation-direction-for-u_perp
  description: Rotates u clockwise instead of counter-clockwise to build the perpendicular direction, flipping e2's sign incorrectly.
- id: swapped-e1-e2
  description: Reports the orthonormal pair in the wrong order, e2 before e1.
