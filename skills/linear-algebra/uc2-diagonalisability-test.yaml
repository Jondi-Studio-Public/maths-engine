id: uc2-diagonalisability-test
name: Test whether a 3×3 matrix is diagonalisable
domain: linear-algebra
year_level:
- university
description: Decide whether a 3×3 integer matrix is diagonalisable by comparing the algebraic and geometric multiplicity
  of each eigenvalue, including the value of a parameter at which it fails.
status: active
placement_eligible: false
