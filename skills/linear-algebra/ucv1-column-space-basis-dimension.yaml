id: ucv1-column-space-basis-dimension
name: Basis and dimension of a column space; rank-nullity
domain: linear-algebra
description: Find the dimension of a column space or span, apply the rank-nullity theorem, and choose a basis of the column
  space from the pivot columns.
status: active
placement_eligible: false
prerequisites: [ucv1-row-reduction-rref, matrix-rank-small]
answer: number
