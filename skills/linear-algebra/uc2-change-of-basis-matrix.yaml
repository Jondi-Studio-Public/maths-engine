id: uc2-change-of-basis-matrix
name: Change-of-basis (transition) matrices
domain: linear-algebra
year_level:
- university
description: Find the transition matrix P with [v]_C = P[v]_B between two bases of R^2, R^3 or the quadratics, convert coordinates
  with a transition matrix supplied in the opposite direction, compose two transitions, and find the transition between
  shifted-power bases of P_2.
