id: uc2-least-squares-normal-equations
name: Least squares by the normal equations
domain: linear-algebra
year_level:
- university
description: Find the least-squares line, parabola or solution of an inconsistent system Ax = b from the normal equations
  A^T A x = A^T b, and the residual vector or its length.
status: active
placement_eligible: false
prerequisites:
- uc2-projection-onto-subspace
- matrix-solve-system
answer: matrix
