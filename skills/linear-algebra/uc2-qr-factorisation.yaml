id: uc2-qr-factorisation
name: QR factorisation
domain: linear-algebra
year_level:
- university
description: Find the entries of Q and R in the QR factorisation of a 3 by 2 or 3 by 3 integer matrix, with R having a positive
  diagonal so both factors are unique, and use it to solve a least-squares problem.
status: active
placement_eligible: false
prerequisites:
- uc2-gram-schmidt
- matrix-multiplication
answer: matrix
