id: uc2-matrix-of-linear-map
name: Matrix of a linear map relative to given bases
domain: linear-algebra
year_level:
- university
description: Find the matrix of a linear map relative to supplied bases of R^2, R^3, the quadratics or a function space
  (differentiation, evaluation functionals, p' + c p), and move between matrices of the same map with A' = P^-1 A P. The
  exam chain uses the trace and determinant as basis-free checks.
status: active
placement_eligible: false
