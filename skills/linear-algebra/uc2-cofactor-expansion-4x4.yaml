id: uc2-cofactor-expansion-4x4
name: Cofactor expansion and 4×4 determinants
domain: linear-algebra
year_level:
- university
description: Evaluate 4×4 determinants by cofactor expansion and by row operations, find cofactors and entries of the inverse
  through the adjugate, and use det(kM) = kⁿ det M, det(MN) = det M · det N, det(Mᵀ) = det M, det(M⁻¹) = 1/det M and the effect
  of each row operation.
