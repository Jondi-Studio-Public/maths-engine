misconceptions:
- id: swaps-det-order
  description: Attaches each determinant's value to the wrong label -- e.g.
    reports D_x's value under the label D and vice versa.
- id: wrong-column-replaced
  description: 'Easy/medium tiers: replaces the second column when D_x was
    asked for (first column), or vice versa.'
- id: sign-error
  description: Computes a determinant with the two products added instead of
    subtracted (a11*a22 + a12*a21).
- id: uses-plain-determinant-twice
  description: Reports det(A) for both graded values, forgetting to substitute
    b into either column at all.
