id: uc2-basis-from-equations
name: Basis of a subspace from equations
domain: linear-algebra
year_level:
- university
description: Find a basis, and so the dimension, of a subspace of R^n, the cubics, or the 2x2 matrices defined by homogeneous
  conditions or by an intersection, written in a stated unique normal form (one vector per free variable, or the reduced
  row echelon form of a basis). The exam chain finds the parameter at which three equations become dependent and the dimension
  and basis there.
status: active
placement_eligible: false
