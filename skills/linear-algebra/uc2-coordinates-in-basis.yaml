id: uc2-coordinates-in-basis
name: Coordinates relative to a non-standard basis
domain: linear-algebra
year_level:
- university
description: Find the coordinate vector of a vector of R^3, a polynomial or a 2x2 matrix relative to a supplied non-standard
  basis, including bases of shifted powers (x - a)^k and of a plane in R^4. The exam chain finds the parameter that breaks
  a basis, a determinant, a coordinate vector and a converted component.
status: active
placement_eligible: false
