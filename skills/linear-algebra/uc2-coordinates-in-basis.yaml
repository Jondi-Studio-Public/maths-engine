misconceptions:
- id: coords-order-swapped
  description: Writing the coordinates relative to a basis in the reverse order, so each is paired with the wrong basis
    vector.
- id: coords-standard-used
  description: Giving the entries of the vector itself as its coordinates, as if the basis were the standard one.
- id: coords-basis-as-rows
  description: Writing the basis vectors as the rows of the coefficient matrix instead of its columns, so the system solved
    is for the transpose.
- id: coords-sign-slip
  description: Losing a minus sign on one coordinate when solving for the coordinates relative to a basis.
- id: taylor-derivative-not-divided
  description: Taking the coordinate of (x - a)^k to be the k-th derivative at a, without dividing by k factorial.
- id: taylor-centre-sign-error
  description: Expanding about -a instead of a when the basis is the powers of (x - a).
- id: colspace-forgot-multiplier
  description: Solving the consistency condition y·b = 0 without dividing by the coefficient of k.
- id: det-sarrus-sign-slip
  description: Getting the sign of one of the six products wrong when expanding a 3×3 determinant.
difficulty_progression: 'Easy solves a 3x3 system for the coordinates of a vector of R^3 (whole-number coordinates). Medium
  moves to a basis of quadratic polynomials whose coordinates are fractions, so the system must be solved exactly. Hard
  changes the setting: Taylor coordinates in the shifted basis 1, (x - a), (x - a)^2, (x - a)^3, a basis of 2x2 matrices
  (a 4x4 system), or a plane in R^4 where four equations in two unknowns must be consistent. The exam chain finds the parameter
  k at which three vectors stop being a basis, the determinant at a stated k (following through), the coordinates of a vector
  at that k, and a component of the vector with stated coordinates.'
