id: uc2-orthogonal-diagonalisation
name: Orthogonally diagonalise a symmetric matrix
domain: linear-algebra
year_level:
- university
description: Find the eigenvalues and orthonormal eigenvectors of a real symmetric 2×2 or 3×3 matrix, in a stated normal
  form, and use them for QᵀAQ and for eigenspace projections.
status: active
placement_eligible: false
