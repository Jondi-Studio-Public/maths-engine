id: uc2-orthogonal-complement
name: Orthogonal complement of a subspace
domain: linear-algebra
year_level:
- university
description: Find the orthogonal complement of a span, or of the solution set of a system, as the unique basis given by
  the non-zero rows of a reduced row echelon form, and find its dimension.
