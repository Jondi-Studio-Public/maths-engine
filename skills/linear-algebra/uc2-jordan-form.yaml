id: uc2-jordan-form
name: Find the Jordan normal form
domain: linear-algebra
year_level:
- university
description: Find the Jordan normal form of a 2×2 or 3×3 integer matrix with a repeated eigenvalue, in a stated block order,
  and the size of its largest block.
status: active
placement_eligible: false
prerequisites:
- ucv1-diagonalisation
- ucv1-null-space
answer: matrix
sources:
- topic: s2b2_jordan_form
  params: {}
  difficulty: easy
  stages:
