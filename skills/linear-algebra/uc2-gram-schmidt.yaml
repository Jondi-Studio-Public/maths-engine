id: uc2-gram-schmidt
name: Gram–Schmidt orthogonalisation
domain: linear-algebra
year_level:
- university
description: Apply the Gram–Schmidt process, in the order given and without normalising, to vectors in R^3 and R^4, to polynomials
  under an integral inner product on [-1, 1] or [0, 1], and to vectors under a weighted inner product, and give the exact
  orthogonal vector.
