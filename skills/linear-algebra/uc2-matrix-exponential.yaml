id: uc2-matrix-exponential
name: Compute the matrix exponential e^(At)
domain: linear-algebra
year_level:
- university
description: Find entries of e^(At) for 2×2 and 3×3 integer matrices, diagonalisable or with Jordan blocks, as expressions
  in t, and use them to solve x' = Ax.
status: active
placement_eligible: false
prerequisites:
- ucv1-diagonalisation
- ucv1-eigenvectors
answer: expression
