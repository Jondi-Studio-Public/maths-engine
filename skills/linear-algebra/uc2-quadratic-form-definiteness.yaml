id: uc2-quadratic-form-definiteness
name: Classify a quadratic form by its eigenvalues
domain: linear-algebra
year_level:
- university
description: Write a quadratic form as xᵀAx with A symmetric, diagonalise it by its eigenvalues, transform it under a change
  of variable, and classify it as definite, semi-definite or indefinite.
status: active
placement_eligible: false
prerequisites:
- ucv1-eigenvectors
- ucv1-diagonalisation
answer: matrix
