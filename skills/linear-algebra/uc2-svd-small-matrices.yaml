id: uc2-svd-small-matrices
name: Singular values of a small matrix
domain: linear-algebra
year_level:
- university
description: 'Find the singular values of a 2×2 or 2×3 integer matrix from the eigenvalues of AᵀA or AAᵀ, and use them: the
  spectral norm, the error of the best rank-1 approximation, the condition number, the share of the squared Frobenius norm
  a rank-1 approximation keeps, and a right singular vector.'
status: active
placement_eligible: false
