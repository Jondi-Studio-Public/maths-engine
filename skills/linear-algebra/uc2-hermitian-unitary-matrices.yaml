description: 'Work with the conjugate transpose of a complex matrix: the entries of A*A and tr(A*A), the real eigenvalues
  of a 2×2 Hermitian matrix, the normalising constant and missing entry of a unitary matrix, and a parameter fixed by an eigenvalue
  of a Hermitian matrix.'
