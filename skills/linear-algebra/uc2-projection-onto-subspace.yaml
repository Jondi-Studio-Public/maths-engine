id: uc2-projection-onto-subspace
name: Orthogonal projection onto a subspace
domain: linear-algebra
year_level:
- university
description: Project a vector orthogonally onto a line or plane in R^3 or R^4, write the projection matrix of a plane or
  hyperplane, and find the distance from a vector to a subspace.
status: active
placement_eligible: false
prerequisites:
- vector-projection
- ucv1-null-space
answer: matrix
