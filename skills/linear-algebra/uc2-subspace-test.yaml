id: uc2-subspace-test
name: Testing whether a set is a subspace
domain: linear-algebra
year_level:
- university
description: Decide which subsets of R^3, the polynomials of degree at most 2 or the 2x2 matrices are subspaces by testing
  the zero vector and closure, and find the parameter value that makes a parametrised solution set a subspace. The exam
  chain names the first failing test, finds the larger and smaller parameter values, and the dimension of the subspace.
