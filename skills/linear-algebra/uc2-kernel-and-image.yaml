id: uc2-kernel-and-image
name: Kernel and image of an abstract linear map
domain: linear-algebra
year_level:
- university
description: Find the dimension of the kernel and image of a linear map on polynomial spaces or 2x2 matrices given by a
  formula or by conditions (not by a matrix), use rank-nullity, and find the parameter value that makes a map non-injective.
  The exam chain finds the bad parameter, the nullity, the rank by rank-nullity and a normalised kernel vector.
