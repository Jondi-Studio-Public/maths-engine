misconceptions:
- id: wrong-pole
  description: Evaluates the local-limit formula at the other pole instead of the stated one.
- id: drops-the-factor
  description: Skips the (z - a) cancellation and evaluates the leftover factor at the wrong point.
- id: sign-flip
  description: Reports the residue with the wrong sign.
- id: uses-wrong-candidate
  description: Computes the residue as if the decoy candidate pole were the true one (exam tier only).
