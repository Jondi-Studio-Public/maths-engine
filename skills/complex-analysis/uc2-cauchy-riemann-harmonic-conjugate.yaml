id: uc2-cauchy-riemann-harmonic-conjugate
name: Cauchy-Riemann equations and harmonic conjugates
domain: complex-analysis
year_level: [university]
description: >-
  Use the Cauchy-Riemann equations to find a harmonic conjugate, a parameter that makes a function harmonic, an analytic f(z) from its real part, or the point where a function is complex differentiable.
