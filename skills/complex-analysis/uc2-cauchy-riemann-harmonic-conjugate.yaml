difficulty_progression:
  easy: {steps: 2, demand: "Integrate u_x with respect to y, fix the unknown function of x with u_y = -v_x and the condition v(0, 0) = 0 for a polynomial u; find the parameter that makes a polynomial harmonic; or recognise a polynomial u as Re f and write f(z) with f(0) = 0."}
  medium: {steps: 3, demand: "Differentiate and integrate exponential, trigonometric and hyperbolic functions of x and y to build the conjugate; find the positive parameter making e^(kx) cos(my) or sin(kx) sinh(my) harmonic; or solve the two linear Cauchy-Riemann equations to find the single point at which a non-analytic f is differentiable."}
  hard: {steps: 4, demand: "Recover f(z) as an expression in z from the real part of a sum of two analytic functions and a stated value f(0); find the conjugate of the real part of m/(z - a)^n with v = 0 on the real axis; or find both the point and the value of f' where a non-analytic f is differentiable."}
  exam: {steps: 4, demand: "Find two parameters that make a cubic u harmonic, then its conjugate, then f'(1 + i), where the last part uses the parameters from the first two."}
