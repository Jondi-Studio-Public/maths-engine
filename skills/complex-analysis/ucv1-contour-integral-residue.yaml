misconceptions:
- id: forgets-2-pi-i
  description: Reports the residue value alone, without multiplying by 2*pi*i.
- id: sign-flip
  description: Reports the contour integral with the wrong sign.
- id: wrong-pole
  description: Applies the residue theorem at the pole the contour does not enclose (medium/hard/exam only).
- id: drops-the-2-in-derivative
  description: Computes the residue via the quotient-rule formula but omits the factor of 2 from differentiating the squared term.
- id: uses-wrong-candidate
  description: Computes the contour integral as if the decoy candidate pole were the true one (exam tier only).
