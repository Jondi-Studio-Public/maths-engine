difficulty_progression:
  easy: {steps: 2, demand: "Find the modulus and principal argument of a number in any quadrant to write Log z, or evaluate i^(bi) using exp(w Log z)."}
  medium: {steps: 3, demand: "Reduce the argument into (-pi, pi] to find a principal root, the failure of Log(z1 z2) = Log z1 + Log z2, a one-sided limit on the cut, or z^(a + bi) for z = i, -i or -1."}
  hard: {steps: 4, demand: "Find the jump of z^(p/q) across the negative axis, Log(z^n) - n Log z, a principal fractional power when n times the argument wraps, or z^(a + bi) for z on the unit circle."}
  exam: {steps: 4, demand: "Evaluate Log(z - a) at a point, state the set where it is discontinuous, find a one-sided limit on the cut, and combine the two values."}
