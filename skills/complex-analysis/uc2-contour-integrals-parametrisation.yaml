difficulty_progression:
  easy: {steps: 3, demand: "Substitute the stated parametrisation of a segment or a quarter or half circle into z^n, conj(z), Re(z), Im(z) or |z|, multiply by z'(t) and integrate."}
  medium: {steps: 4, demand: "Choose the parametrisation of an arc or a two-segment path, rewrite conj(z) (or Re z, Im z, |z|) along it, and integrate where the antiderivative, the chord and the other arc all give a different value."}
  hard: {steps: 5, demand: "Integrate a non-analytic power round a full circle (only the power with exponent -1 survives), or find the difference of the integrals along two routes between the same points as a signed area."}
  exam: {steps: 6, demand: "Integrate along a chord and an arc between the same points, then bound the arc integral by M L and find how far the modulus falls short of the bound."}
