id: uc2-contour-integrals-parametrisation
name: Contour integrals by parametrisation
domain: complex-analysis
year_level: [university]
description: >-
  Evaluate a contour integral by writing the path as z = z(t), substituting into the integrand and integrating, for integrands such as
  conj(z), Re(z), Im(z) and |z| that have no antiderivative, along segments, arcs and two-segment paths; compare two routes and bound an
  integral with the ML inequality.
status: active
placement_eligible: false
