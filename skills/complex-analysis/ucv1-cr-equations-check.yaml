  difficulty: exam
  stages: [exam]
misconceptions:
- id: assumes-both-hold
  description: Assumes any polynomial u, v pair is automatically holomorphic without checking the equations.
- id: checks-only-one-equation
  description: Checks only u_x = v_y (or only u_y = -v_x) and stops, missing that the other equation can independently hold or fail.
- id: sign-error-in-second-equation
  description: Tests u_y = v_x instead of the correct u_y = -v_x.
