id: ucv1-cr-equations-check
name: Check the Cauchy-Riemann equations
domain: complex-analysis
description: At a supplied point, decide whether a polynomial complex function satisfies the Cauchy-Riemann equations. The exam tier computes how far each equation is from holding at the point, and the total.
status: active
placement_eligible: false
prerequisites:
- differentiate-polynomial
answer: mcq
