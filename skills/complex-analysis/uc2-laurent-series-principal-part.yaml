difficulty_progression:
  easy: {steps: 2, demand: "Divide a standard Maclaurin series, or a series about a shifted centre, by a power to read one Laurent coefficient; or expand a rational function in a stated annulus."}
  medium: {steps: 3, demand: "Write the principal part of a function at a pole by combining a Taylor expansion of the analytic factor with the power of the pole; or find a specific regular-part coefficient."}
  hard: {steps: 4, demand: "Choose the correct expansion for an annulus (geometric series in z/a or a/z), handle an essential singularity such as e^(c/z), or divide series for cot(cz), 1/(e^(cz) - 1) or 1/sin^2(cz)."}
  exam: {steps: 4, demand: "Find two coefficients of the principal part at a double pole, assemble the principal part at the other pole, and find the radius of the annulus of convergence."}
