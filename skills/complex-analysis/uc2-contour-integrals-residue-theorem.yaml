id: uc2-contour-integrals-residue-theorem
name: Contour integrals by the residue theorem
domain: complex-analysis
year_level: [university]
description: >-
  Evaluate the integral of a function round a circle of stated centre and radius by finding which poles lie inside and summing their residues.
status: active
placement_eligible: false
prerequisites:
- uc2-residues-higher-order-poles
- ucv1-contour-integral-residue
answer: expression
