difficulty_progression:
  easy: {steps: 3, demand: "Decide which of two poles lies inside a circle, find its residue and multiply by 2*pi*i."}
  medium: {steps: 4, demand: "Select the enclosed poles among a double pole and two simple poles, find each residue and add them."}
  hard: {steps: 5, demand: "Handle a function with an exponential factor, a circle enclosing every pole with the numerator one degree short of the denominator, an orientation reversal, or a conjugate factor replaced by r^2/(z - c) on the circle."}
  exam: {steps: 5, demand: "Count the poles inside a circle, find two residues, and combine the enclosed residues into the integral."}
