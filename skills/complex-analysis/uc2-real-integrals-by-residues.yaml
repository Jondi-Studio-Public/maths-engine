difficulty_progression:
  easy: {steps: 3, demand: "Evaluate an integral of 1/((x^2 + a^2)(x^2 + b^2)) over the real line, or of 1/(a + b cos t) over [0, 2*pi], by one residue."}
  medium: {steps: 4, demand: "Evaluate the integral over the real line of a rational function with a shifted or scaled denominator, or a trig integral with a numerator."}
  hard: {steps: 5, demand: "Handle a double pole in the upper half-plane, a quartic denominator that factors with surds, or the square of a trig denominator."}
  exam: {steps: 5, demand: "Either find two residue coefficients, then the integral over the real line and over the half line, or find the root of a quadratic inside the unit circle, then a trigonometric integral and its derivative in a parameter, each part using the result of the earlier one."}
