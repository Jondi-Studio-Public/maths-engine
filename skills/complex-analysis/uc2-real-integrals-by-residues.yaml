id: uc2-real-integrals-by-residues
name: Real integrals by residues
domain: complex-analysis
year_level: [university]
description: >-
  Evaluate a real integral over the whole line or a trigonometric integral over a full period by closing the contour and applying the residue theorem.
status: active
