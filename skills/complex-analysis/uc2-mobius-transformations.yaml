id: uc2-mobius-transformations
name: Mobius transformations
domain: complex-analysis
year_level: [university]
description: >-
  Find the image of a point, the fixed points, or the transformation itself for a Mobius transformation, from points or from a cross-ratio.
status: active
placement_eligible: false
