difficulty_progression:
  easy: {steps: 2, demand: "Substitute a point into T(z) = (az + b)/(cz + d), or find the image of infinity or the preimage of a point."}
  medium: {steps: 3, demand: "Solve T(z) = z for the fixed points, or solve T(z) = w for z with Gaussian-integer answers."}
  hard: {steps: 5, demand: "Find the transformation sending three points to 0, 1 and infinity, the image of a fourth point from the invariance of the cross-ratio, the second iterate by squaring the matrix, or fixed points of a loxodromic map."}
  exam: {steps: 5, demand: "Find T(z1) and T(T(z1)), the sum of the fixed points, and the image of that sum."}
