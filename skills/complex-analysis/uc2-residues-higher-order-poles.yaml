difficulty_progression:
  easy: {steps: 2, demand: "Evaluate the residue at a simple pole of a rational function whose denominator is a conjugate-pair quadratic, a product of three factors, or z^n - c."}
  medium: {steps: 3, demand: "Differentiate the rest of the function at a double or triple pole and divide by (m - 1)!."}
  hard: {steps: 4, demand: "Find the residue of a function with an exponential, trigonometric or inverse-sine factor by differentiating or by series, including g(z)/sin(pi z) at an integer."}
  exam: {steps: 4, demand: "Find two simple residues, then the double-pole residue from the fact that the residues sum to zero, then use them in a contour integral."}
