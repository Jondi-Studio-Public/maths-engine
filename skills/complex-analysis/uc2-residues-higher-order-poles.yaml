id: uc2-residues-higher-order-poles
name: Residues at simple and higher-order poles
domain: complex-analysis
year_level: [university]
description: >-
  Find the residue of a rational or elementary function at a simple pole or a pole of order two or three, as an exact complex number.
status: active
placement_eligible: false
