id: absolute-value-equations-inequalities
name: Solve equations and inequalities with absolute value
domain: inequalities
description: "Solve equations with the absolute value of a linear expression, including a modulus on both sides and a candidate that has to be rejected, and decide which integers satisfy a modulus inequality."
status: active
placement_eligible: false
