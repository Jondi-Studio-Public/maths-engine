misconceptions:
- id: ineq-reversed-without-need
  description: "Reversing the inequality sign after adding, subtracting or dividing by a positive number."
- id: strict-nonstrict-confused
  description: "Changing between < and ≤ (or > and ≥), so the bound is wrongly included or excluded."
- id: sign-error-moving-term
  description: "Moving a term across the sign without changing its sign."
- id: used-wrong-inverse-operation
  description: "Multiplying where dividing was needed (or the reverse) instead of using the inverse operation."
- id: forgot-to-divide-by-coefficient
  description: "Stopping before dividing by the coefficient of the variable."
- id: ineq-direction-not-reversed
  description: "Dividing by a negative number without reversing the sign (for the bracket cases, solving the wrong step first)."
