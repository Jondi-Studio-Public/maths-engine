id: rational-inequalities
name: Solve rational inequalities
domain: inequalities
year_level:
- '11'
- '12'
description: 'Solve an inequality with a variable in the denominator using a sign diagram: include a zero of the numerator
  only when equality is allowed, never the value that makes the denominator zero, and rearrange a fraction compared with
  a number into one fraction first.'
status: active
