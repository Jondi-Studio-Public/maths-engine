misconceptions:
- id: amgm-forgets-the-two
  description: "Giving the square root of pq as the minimum, forgetting the 2 in u + v >= 2 sqrt(uv)."
- id: amgm-forgets-the-root
  description: "Writing 2pq where AM-GM gives 2 times the square root of pq."
- id: amgm-ignores-the-coefficients
  description: "Bounding xy by the square of half the total, ignoring the coefficients of x and y in the constraint."
- id: amgm-forgets-the-four
  description: "Dropping the factor of 4 when bounding the product xy by the square of half the sum."
- id: evaluates-at-x-equals-1
  description: "Evaluating the expression at x = 1 and taking that as the least value."
- id: gives-the-value-not-x
  description: "Giving the least or greatest value where the value of x at which it occurs is asked for."
- id: forgets-to-take-the-root
  description: "Giving x squared (or q over p) where its square root is needed."
- id: forgets-the-fixed-charge
  description: "Leaving the fixed charge out of the least cost."
- id: two-term-bound-used-on-three-terms
  description: "Using the two-term bound 2 sqrt(uv) on a sum of three terms."
tags: [acara-v8-4-specialist, inequalities, am-gm, optimisation]
