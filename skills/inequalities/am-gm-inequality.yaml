id: am-gm-inequality
name: "Use the AM-GM inequality to find a least or greatest value"
domain: inequalities
year_level: ['12']
description: "Use the inequality of arithmetic and geometric means to find the least value of an expression such as x + k/x for x > 0, the greatest product of two numbers with a weighted sum, the value of x where equality holds, and the bound in a word problem (a fenced paddock, a running cost, an open box). The answers are numbers."
status: active
placement_eligible: false
prerequisites:
- inequality-word-problems
- factorise-quadratic
answer: number
