misconceptions:
- id: uses-connotation-not-stated-ranges
  description: Picks between "probable" and "likely" (or any adjacent pair) by everyday connotation rather than checking the value against the ranges stated in the prompt.
- id: ignores-boundary-inclusivity
  description: Misclassifies a value exactly at the edge of the range it belongs to, treating the boundary as belonging to the neighbouring category.
- id: skips-the-computation-step
  description: At medium/hard tiers, classifies the stated raw number (a percentage integer, a rate's numerator, or a stated complement) directly instead of first converting it to the probability the question actually asks about.
