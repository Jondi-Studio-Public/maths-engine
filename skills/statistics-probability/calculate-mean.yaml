id: calculate-mean
name: Calculate the arithmetic mean
domain: statistics-probability
description: Calculate the arithmetic mean of a small whole-number data set.
status: active
prerequisites:
- whole-number-division-facts
answer: number
sources:
- topic: summary_statistic
  params:
    kind: mean
  difficulty: easy
- topic: w3_mean_tiers
  params: {}
  difficulty: medium
  stages:
  - 3
  - 4
- topic: w3_mean_tiers
  params: {}
  difficulty: hard
  stages:
  - 5
  - 6
  - maintenance
- topic: exam_mean_summary_statistic
  params: {}
  difficulty: exam
  stages:
