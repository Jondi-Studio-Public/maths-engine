misconceptions:
- id: treats-as-unordered
  description: Multiplies the correct sequence product by the binomial coefficient nCr for the number of successes in the sequence, as if the question asked for an unordered count (the binomial-point-probability trap).
- id: swaps-p-and-q
  description: At the hard/exam tiers, uses p where q was actually stated (or vice versa), never performing the p = 1 - q conversion.
- id: drops-one-factor
  description: Reports the product of all but one of the stated trial outcomes (an off-by-one-trial error).
