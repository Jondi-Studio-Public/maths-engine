misconceptions:
- id: reverses-the-order
  description: Lists the probabilities in decreasing order of x instead of the stated increasing order.
- id: off-by-one-shift
  description: Pairs each frequency with the wrong value of x, shifted by one position.
- id: wrong-total
  description: Divides each frequency by a total that does not match the stated total number of observations.
