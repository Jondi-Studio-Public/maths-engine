misconceptions:
- id: picks-by-familiarity-not-variable-type
  description: Chooses whichever display is most familiar (usually a column graph or pie chart) instead of matching the display to the stated variable type and count.
- id: treats-a-numeric-label-as-a-measurement
  description: Sees a numeric-looking value (a postcode, jersey number, room number or ID number) and assumes it needs a numerical display, missing that it is a categorical label with no meaningful magnitude or order.
- id: misses-the-time-axis
  description: Given one numerical variable recorded at regular time points, chooses a scatterplot or histogram instead of a line graph, missing that the individuals ARE the time points, not two independent measured quantities.
- id: confuses-paired-measurements-with-grouped-comparison
  description: Given two numerical variables measured on the same individuals (a scatterplot), instead treats the data as one variable compared between two groups and picks a back-to-back stem-and-leaf plot, or the reverse.
