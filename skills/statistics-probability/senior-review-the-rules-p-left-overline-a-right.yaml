misconceptions:
- id: forgot-to-complement
  description: Reports P(A) itself instead of P(not A) when applying the complement rule.
- id: off-by-one-numerator
  description: Reports (d-a+1)/d instead of the correct (d-a)/d, an off-by-one error in the numerator.
- id: forgets-second-event
  description: Reports only P(A) when computing P(A union B) for mutually-exclusive events, forgetting to add P(B).
- id: double-counts-first-event
  description: Reports 2*P(A) + P(B) instead of P(A) + P(B), double-counting the first event.
- id: forgot-overlap
  description: Reports P(A) + P(B) when computing P(A union B) with overlapping events, forgetting to subtract the overlap.
- id: double-subtracts-overlap
  description: Reports P(A) + P(B) - 2*P(A intersect B), subtracting the overlap twice.
