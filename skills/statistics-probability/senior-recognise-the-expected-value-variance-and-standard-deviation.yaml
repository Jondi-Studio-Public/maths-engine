misconceptions:
- id: midpoint-as-half-range
  description: Reports (b-a)/2 instead of (a+b)/2 for E(X), confusing the midpoint with half the interval's width.
- id: forgets-variance-denominator
  description: Reports (b-a)^2 for Var(X), forgetting to divide by 12.
- id: forgets-square-root
  description: Reports Var(X) again as SD(X), forgetting to take the square root.
- id: swaps-variance-and-sd
  description: Reports the triple with Var(X) and SD(X) transposed.
