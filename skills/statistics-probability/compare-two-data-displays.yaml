id: compare-two-data-displays
name: Compare two data displays
domain: statistics-probability
year_level: ['6']
naplan_domain: [statistics]
description: >-
  Compare two groups measured on one variable when one group is shown in a drawn dot plot and the other in a
  stem-and-leaf plot printed in the question, so both displays have to be read before the centre (mode, median) and
  spread (range) are compared. easy finds how much greater one group's mode, range or number of values is than the
  other's; medium compares the two medians (a half when a group has an even number of values); hard uses one group's
  median to count values in the other group, or finds the range of the two groups together; exam is a chain from each
  group's median to the gap between them (following through from the two medians) and the gap between the ranges.
  Every answer is a number.
status: active
needs_figure: true
capability_gates: [figure_stimulus]
placement_eligible: false
prerequisites: [f6-read-a-dot-plot]
answer: number
