misconceptions:
- id: dg-cd-mode-as-frequency
  description: "Gives how many times the mode occurs (the height of the tallest stack or the number of leaves) instead of the mode itself."
- id: dg-cd-difference-reversed
  description: "Subtracts the larger measure from the smaller, so the difference has the wrong sign."
- id: dg-cd-difference-added
  description: "Adds the two measures instead of finding how much greater one is than the other."
- id: dg-cd-range-as-highest
  description: "Gives the highest value as the range instead of taking the lowest away from it."
- id: dg-cd-leaf-as-value
  description: "Reads a leaf as the whole value, ignoring its stem, when reading the stem-and-leaf plot."
- id: dg-cd-median-axis-middle
  description: "Takes the middle of the axis (or of the stems) as the median instead of the middle of the ordered values."
- id: dg-cd-median-even-lower
  description: "Takes the lower of the two middle values as the median when there is an even number of values."
- id: dg-cd-median-halfway-extremes
  description: "Takes the value halfway between the lowest and highest values as the median."
- id: dg-cd-count-total
  description: "Adds the two numbers of values when how many more one group has than the other was asked."
- id: dg-cd-count-off-one
  description: "Miscounts the values by one when reading a display."
- id: dg-cd-ticks-not-dots
  description: "Counts the ticks on the dot plot's axis where the number of values (dots) was needed."
- id: dg-cd-above-includes-equal
  description: "Counts values equal to the median as well as the values above it when only values above were asked."
- id: dg-cd-below-includes-equal
  description: "Counts values equal to the median as well as the values below it when only values below were asked."
- id: dg-cd-combined-range-of-one
  description: "Gives the larger of the two groups' ranges as the range of the combined data."
- id: dg-cd-combined-range-added
  description: "Adds the two groups' ranges to get the range of the combined data."
- {id: dg-near-miss-value, description: 'Reads, counts or works out a value a little way from the right one: out by one or two, with no single method behind the slip.'}
difficulty_progression:
  easy: {steps: 3, demand: "Read one measure (mode, range or number of values) from the dot plot and again from the stem-and-leaf plot, then find how much greater one is."}
  medium: {steps: 4, demand: "Find the median of each group from its own display, using the position (n + 1) / 2 and a half step for an even count, then compare them."}
  hard: {steps: 4, demand: "Find one group's median, then count the values of the other group above or below it, or take the range of the two groups combined."}
  exam: {steps: 4, demand: "Chain the two medians, the gap between them using both, and the gap between the two ranges."}
