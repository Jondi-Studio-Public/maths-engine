id: ir2a-pick-display-for-question
name: Pick the display for a question
domain: statistics-probability
year_level: ['4', '9']
naplan_domain: [statistics]
description: Choose the display or summary that answers a stated question (compare the typical value of two groups, show change over time, compare spread, show the shape of a distribution), then read or compute one value from the data. The exam chain compares two box plots or a time series through several linked steps.
status: active
placement_eligible: false
prerequisites:
- calculate-median
answer: mcq
