id: f10-boxplot-distribution
name: Compare continuous distributions with boxplots
domain: statistics-probability
year_level: ['10']
description: Given a small ordered numeric data set, compute the first quartile (Q1) and third quartile (Q3) using the exclusive method (split the data at the median, excluding the median itself from either half when the data set size is odd; Q1 is the median of the lower half and Q3 is the median of the upper half), then state the interquartile range Q3 minus Q1. The exclusive method is stated explicitly in every question; construction or reading of a rendered boxplot and open contextual comparison of shape/centre are excluded.
status: active
placement_eligible: false
prerequisites:
- calculate-median
- calculate-range
- calculate-mean
- calculate-mode
answer: pair
sources:
- topic: p18a_boxplot_quartiles
  params: {tier: easy}
  difficulty: easy
  stages: [0, 1, 2]
- topic: p18a_boxplot_quartiles
  params: {tier: medium}
  difficulty: medium
  stages: [3, 4]
- topic: p18a_boxplot_quartiles
  params: {tier: hard}
  difficulty: hard
  stages: [5, 6, maintenance]
- topic: exd_x_r2x_boxplot_two_groups
  params: {tier: exam}
  difficulty: exam
  stages: [exam]
misconceptions:
- id: tukey-inclusive
  description: Computes Q1/Q3 by the Tukey/inclusive method (including the overall median in both halves for an odd-sized data set) instead of the exclusive method the question states. Offered whenever it actually differs.
- id: swaps-q1-q3
  description: Reports Q3 in the Q1 slot and vice versa, so the IQR offered is the negative of the true value. Offered whenever Q1 and Q3 genuinely differ.
- id: iqr-as-range
  description: Reports the correct Q1/Q3 but states the IQR as the range (max minus min) instead of Q3 minus Q1. Offered whenever the range and the true IQR differ.
- id: positional-no-averaging
  description: Takes the literal 25th-percentile-position and 75th-percentile-position elements directly, with no averaging step, even where the exclusive method calls for one.
- id: off-by-one-split
  description: Shifts the lower/upper split boundary one index to the right of the correct one before taking each half's median.
- id: wrong-group
  description: On the exam-tier two-group comparison, reports the correctly-computed triple of the group with the SMALLER interquartile range instead of the one asked for.
tags: [acara-f10-v9, statistics-probability, p18a_boxplot_quartiles, AC9M10ST02]
