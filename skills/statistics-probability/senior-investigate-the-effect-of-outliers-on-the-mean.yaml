misconceptions:
- id: reversed-sign
  description: Reports mean-without minus mean-with, the negation of the correct answer. The dataset is constructed so the true difference is never zero.
- id: wrong-denominator
  description: Computes the mean without the outlier by dividing by n instead of n - 1, forgetting to shrink the denominator after removing the outlier.
- id: removes-the-wrong-value
  description: On the hard/exam tiers, where a second extreme value is present but not designated, computes the difference using that OTHER extreme value instead of the stated outlier.
