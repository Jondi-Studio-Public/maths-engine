id: construct-column-and-picture-graphs
name: Construct a column graph or picture graph from data
domain: statistics-probability
year_level: ['5']
naplan_domain: [statistics]
description: >-
  Build a column graph or a picture graph from data and state what is drawn, as the height of every column or the
  number of symbols in every row. easy sorts a list of survey responses into categories and gives the column heights;
  medium turns a frequency table into a picture graph where one symbol stands for 2, 4 or 10 and half a symbol for half
  of that, so an odd count needs a half symbol; hard builds the column graph of a number (pets per family) with a value
  that never occurs, or finds a missing count from the total first; exam is a chain from one list of responses to the
  column heights, the gap between the tallest and shortest column, the picture graph's rows and the symbol gap that
  follows from it. Replies are typed as Name = height, in the order asked.
status: active
placement_eligible: false
learner_band: primary
prerequisites: [f3-read-a-column-graph]
answer: bars
