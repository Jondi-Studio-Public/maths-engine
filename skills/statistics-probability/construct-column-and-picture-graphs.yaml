misconceptions:
- id: dg-cc-tally-miscount
  description: "Miscounts one category when sorting the responses, so one column is a unit too tall or too short."
- id: dg-cc-categories-swapped
  description: "Gives two categories each other's heights, matching a count to the wrong label."
- id: dg-cc-value-as-height
  description: "Uses the data value itself as the height of its column instead of counting how many times it occurs."
- id: dg-cc-zero-column-skipped
  description: "Gives a value that never occurs the height of the next value, skipping the column that should be zero."
- id: dg-cc-key-ignored
  description: "Draws one symbol for every item and ignores the key that says a symbol stands for more than one."
- id: dg-cc-key-multiplied
  description: "Multiplies the count by the key instead of dividing, so the rows are far too long."
- id: dg-cc-half-symbol-dropped
  description: "Drops the half symbol for an odd count, so the row is half a symbol too short."
- id: dg-cc-half-symbol-whole
  description: "Draws a whole symbol where a half symbol is needed, so the row is half a symbol too long."
- id: dg-cc-missing-total-as-count
  description: "Gives the total as the missing count, forgetting to take away the counts already known."
- id: dg-cc-missing-one-category-left-out
  description: "Leaves one known count out of the subtraction when finding the missing count."
- id: dg-cc-range-added
  description: "Adds the tallest and shortest column instead of finding how much taller one is."
- id: dg-cc-second-tallest
  description: "Compares the tallest column with the second shortest, or the second tallest with the shortest."
- id: dg-cc-difference-in-items-not-symbols
  description: "Gives the difference in items when the difference in symbols was asked for, forgetting to divide by the key."
difficulty_progression:
  easy: {steps: 2, demand: "Sort a list of responses into categories and count each one to get the height of its column."}
  medium: {steps: 2, demand: "Divide each count by the key of a picture graph, using a half symbol where the count is an odd number of halves."}
  hard: {steps: 3, demand: "Count how often each value of a number occurs (including a value that never occurs), or find the missing count from the total before drawing the columns."}
  exam: {steps: 5, demand: "Chain the column heights, the gap between the tallest and shortest column, the picture graph's rows and the same gap measured in symbols."}
