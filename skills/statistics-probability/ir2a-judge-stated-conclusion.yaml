id: ir2a-judge-stated-conclusion
name: Judge whether data supports a conclusion
domain: statistics-probability
year_level: ['8', '9', '10']
naplan_domain: [statistics]
description: 'Recompute the quantity behind a stated conclusion from the table (a percentage or a mean), then judge whether the data supports the conclusion: sound, wrong figure, too few values, cause claimed from association, an outlier, or a prediction beyond the data. The exam chain checks the figure and then the verdict.'
status: active
placement_eligible: false
prerequisites:
- calculate-median
answer: number
