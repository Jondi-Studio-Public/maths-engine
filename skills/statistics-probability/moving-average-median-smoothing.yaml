id: moving-average-median-smoothing
name: Smooth a time series with moving means and medians
domain: statistics-probability
year_level: ['12']
description: Smooth a time series written as a list of values. Easy finds a 3-point moving mean. Medium finds a 3-point moving
  median or a 5-point moving mean at a stated point. Hard finds how far a spike pulls the moving mean above the moving median,
  or the point where the 5-point moving mean is greatest. The exam chain finds both moving means, the moving median and their
  difference at a spike.
status: active
placement_eligible: false
prerequisites:
- moving-average
- calculate-median
answer: number
