id: senior-examine-the-approximate-normality-of-the-distribution-of
name: Examine the approximate normality of the distribution of p-hat
domain: statistics-probability
description: 'Given bounded, fully specified inputs (a sample size n and a sample proportion p-hat, stated directly or via raw counts), examine the approximate normality of the distribution of p-hat for large samples. Returns a 4-way classification -- valid (both n×p-hat and n×(1-p-hat) at least 10), or not valid because n×p-hat is less than 10, n×(1-p-hat) is less than 10, or both are less than 10 -- using the standard bounded rule, stated explicitly in every question''s own text rather than assumed memorised. This is a diagnostic classification, never an interval computation: it never produces interval bounds, which is the full computation the neighbouring senior-use-the-approximate-confidence-interval-left-widehat-p skill (ACMMM178) performs once the approximation already holds. Easy, medium and hard practice levels plus an exam tier: direct substitution given a stated sample proportion, confidently clear of the threshold either way; the same substitution given raw counts (x successes out of n) instead of the proportion directly, requiring a division first; and that same counts-based derivation constructed so that at least one of the two products lands within 1-2 of the threshold of 10 (never exactly on it), forcing genuine arithmetic care. The hard tier has two sources (the counts-based derivation above and a variant that states failures rather than successes), and a separate exam tier sits above them.'
status: active
placement_eligible: false
prerequisites: [simple-event-probability]
