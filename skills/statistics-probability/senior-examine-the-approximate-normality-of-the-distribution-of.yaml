misconceptions:
- id: checks-only-one-condition
  description: Checks only one of n×p-hat or n×(1-p-hat) against the threshold of 10 and ignores the other, picking a category true for only one condition.
- id: reverses-the-inequality
  description: Treats "at least 10" as "at most 10", inverting which side of the threshold counts as valid.
- id: assumes-validity-without-checking
  description: Assumes the normal approximation is always valid for a "large" sample without computing either product against the stated threshold.
