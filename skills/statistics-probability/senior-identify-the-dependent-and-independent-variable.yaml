misconceptions:
- id: swaps-dependent-independent
  description: Selects the independent variable, mistaking the manipulated/explanatory quantity for the measured outcome.
- id: confuses-controlled-with-dependent
  description: Selects a quantity the researcher deliberately held constant, mistaking "also named" for "also measured as an outcome".
- id: picks-irrelevant-recorded-quantity
  description: Selects a quantity that was recorded but plays no role in the relationship under investigation.
- id: mistakes-baseline-for-outcome
  description: On the exam tier, selects a baseline/pre-existing value in the same domain as the dependent variable, mistaking a held-constant starting value for the outcome itself.
