id: senior-identify-the-dependent-and-independent-variable
name: Identify the dependent and independent variable
domain: statistics-probability
description: 'Given a described pair of variables from an experiment or study context, identify which one is the dependent variable; naming it fixes the other of the pair as independent. The pair alone gives only one distractor, so the stimulus also names one or two further quantities from the same context that are neither: a controlled (held-constant) quantity, and/or a second recorded-but-irrelevant quantity. Four tiers: an explicit-manipulation experiment with one controlled quantity named; an observational study where the learner decides from the stated research aim which variable depends on the other; a neutral-verb study naming both a controlled and an irrelevant recorded quantity; and an exam tier whose controlled quantity is a baseline/pre-existing value in the same domain as the dependent variable, so the learner must separate what the study measures as its outcome from what it merely holds fixed.'
