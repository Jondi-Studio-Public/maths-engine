id: senior-complete-a-five-number-summary-for-different-datasets
name: Complete a five number summary for different datasets
domain: statistics-probability
description: Given a nine-value integer dataset, complete its five-number summary (min, Q1, median, Q3, max) using the median-of-the-lower/upper-half (Tukey/inclusive) method, stated explicitly in the question. Every value in the summary is a literal element of the dataset -- no interpolation.
status: active
placement_eligible: false
prerequisites: [simple-event-probability]
capability_gates: [authentic_data]
answer: pair
