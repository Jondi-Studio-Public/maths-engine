misconceptions:
- id: excludes-median-from-halves
  description: Uses the exclusive method (Q1/Q3 from v1..v4 / v6..v9, excluding the overall median) instead of the inclusive Tukey method the question specifies. Offered whenever it actually produces a different value.
- id: forgets-to-sort
  description: Applies the summary-statistic index positions directly to the presented, unsorted order instead of sorting first. Never offered on the easy tier (already sorted); offered on medium/hard/exam only when it actually differs.
- id: swaps-q1-q3
  description: Reports Q3 in the Q1 slot and vice versa. Offered only when Q1 and Q3 genuinely differ.
