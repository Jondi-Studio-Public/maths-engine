id: binomial-at-least-complement
name: "Find binomial tails and ranges by the complement"
domain: statistics-probability
year_level: ['12']
description: "For X binomial with n from 10 to 30 and a small success probability, find an at-least, at-most, strict-inequality or range probability by choosing between summing and taking the complement, then conditional probabilities built from two tails. The exam chain finishes with the chance an event happens on at least one of several independent days."
