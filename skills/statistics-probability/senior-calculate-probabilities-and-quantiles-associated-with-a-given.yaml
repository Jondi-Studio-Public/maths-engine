id: senior-calculate-probabilities-and-quantiles-associated-with-a-given
name: Calculate probabilities and quantiles associated with a given normal distribution using technology,
  and use these to solve practical problems
domain: statistics-probability
year_level: ['12']
description: 'Given bounded, fully specified inputs, calculate probabilities and quantiles associated
  with a given normal distribution using technology, and use these to solve practical problems. Return
  the resulting value, expression, relation, or classification. This is a CONTINUOUS N(mu, sigma^2)
  distribution computed with statistics.NormalDist, never a discrete probability mass function. Four
  tiers, each a genuine change of decision: a one-tail probability P(X<a) or P(X>b); a between-two-values
  probability P(a<X<b); the inverse problem of finding a quantile x from a stated cumulative proportion;
  and, on the exam tier, solving for a missing distribution parameter (mu or sigma) given the other
  parameter and a stated event proportion and threshold.'
