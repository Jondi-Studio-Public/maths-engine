misconceptions:
- id: wrong-tail
  description: Reports 1 minus the correct probability (or, on the between-tier, the complementary total), reading the asked-for tail/range backwards.
- id: reports-z-not-x
  description: Reports the standardised z-score instead of converting it back to the original value x (or the solved distribution parameter), on the quantile and parameter-solving tiers.
- id: variance-as-standard-deviation
  description: Uses sigma squared (the variance) where sigma (the standard deviation) belongs in the normal distribution's construction.
- id: forgets-the-standard-deviation
  description: Computes as if the standard deviation were 1, forgetting to standardise by the stated sigma at all.
- id: swapped-subtraction-order
  description: On the between-two-values tier, computes cdf(a) - cdf(b) instead of cdf(b) - cdf(a), reporting the negative of the correct probability.
- id: inverts-the-wrong-tail
  description: On the quantile tier, uses the inverse cdf of (1 - q) instead of q, confusing the smallest/largest proportion with its complement.
- id: z-sign-reversed
  description: Subtracts the other way when standardising, (mu - x) / sigma, so the z-score has the wrong sign.
- id: swaps-multiplication-and-division
  description: On the parameter-solving tier, multiplies where the algebra requires dividing (or vice versa) when isolating the unknown parameter.
