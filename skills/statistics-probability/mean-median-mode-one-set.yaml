misconceptions:
- id: mean-wrong-divisor
  description: Divides the total by one fewer than the number of observations (n - 1) instead of
    n. Always exercisable -- the data set is constructed so this always differs from the true
    mean by more than 1.
- id: median-does-not-sort
  description: Picks the middle value(s) of the data set in the order it was PRESENTED rather
    than sorting first. Genuinely different from the true median whenever the drawn presentation
    order differs from sorted order at the relevant position(s); honestly dropped on the rare seed
    where they coincide.
- id: mode-chooses-largest
  description: Reports the largest VALUE in the data set instead of the most FREQUENT one.
    Genuinely different whenever the mode value is not itself also the maximum of the set;
    honestly dropped on the seed where they coincide.
