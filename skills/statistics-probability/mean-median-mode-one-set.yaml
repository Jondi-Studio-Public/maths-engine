id: mean-median-mode-one-set
name: Find the mean, median and mode of one data set
domain: statistics-probability
description: Given ONE 8-12 value data set (values 1-60, with repeats), find the mean (to 1
  decimal digit), the median and the mode in a single question -- three independently graded
  answers. The median averages the two sorted middle values when the count is even (hard/exam);
  a single sorted middle value when the count is odd (easy/medium). This is the COMBINED,
  three-answer skill (an exam-style item); `calculate-mean`, `calculate-median` and
  `calculate-mode` remain separate, single-answer skills and are unaffected.
status: active
placement_eligible: false
