misconceptions:
- id: reads-wrong-time-point
  description: Reads the value at a neighbouring time point instead of the one the claim names, offered as a "was actually" decoy.
- id: subtracts-wrong-order
  description: Computes the change between two named points in the wrong order, reporting the opposite sign (a fall reported as a rise, or vice versa).
- id: wrong-change-magnitude
  description: Gets the direction of a change right but the size wrong, offered as a "rose/fell by" decoy with a plausible but incorrect magnitude.
- id: ignores-the-one-breaking-pair
  description: Assumes a rose/fell/stayed-the-same claim holds across the whole sequence without checking every consecutive pair, missing the single pair where the pattern actually breaks.
- id: distracted-by-interior-fluctuation
  description: On the exam tier's overall-change claim, refuses to resolve the net first-to-last change because the data moves up and down in between, instead of computing the two endpoints directly.
