id: f10-line-graph-change-over-time
name: Interpret line graphs of change
domain: statistics-probability
description: Given a quantity's value at a labelled sequence of time points, presented as an explicit list of time-value pairs, and one stated claim drawn from a fixed class (the value at a stated time point, the direction or size of the change between two stated time points, or whether the value rose, fell or stayed the same across every consecutive pair of time points), classify the claim as supported or not supported by the data. Every question shows the full sequence as text; open description of relationships/trends and any rendered figure are excluded, as is any claim outside the three named classes.
status: active
placement_eligible: false
prerequisites:
- calculate-mean
- calculate-median
- calculate-mode
- calculate-range
answer: mcq
