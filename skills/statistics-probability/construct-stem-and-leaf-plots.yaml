id: construct-stem-and-leaf-plots
name: Construct a stem-and-leaf plot from a list of values
domain: statistics-probability
naplan_domain: [statistics]
year_level: ['7']
description: >-
  Build an ordered stem-and-leaf plot from a jumbled list of values, filling in the leaves of every row in increasing
  order with a repeated value's leaf written as often as it occurs. easy uses two-digit whole numbers without repeats;
  medium has more values with repeats; hard uses values to one decimal place (stem the whole number, leaf the tenth) or
  three-digit values (stem all but the units digit); exam is a chain from the whole plot to the number of values, the
  position of the median (following through from the count) and the median itself.
status: active
placement_eligible: false
prerequisites: [f10-stem-and-leaf-plots]
answer: table
