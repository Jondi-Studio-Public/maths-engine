  stages: [6, maintenance]
- topic: exd_x_r2l_relfreq_chain
  params: {tier: exam}
  difficulty: exam
  stages: [exam]
misconceptions:
- id: reports-raw-count
  description: Reports the raw observed count of the event instead of dividing it by the total number of trials.
- id: wrong-denominator
  description: Divides the favourable count by the count of some other category instead of by the total number of trials.
- id: ignores-the-data
  description: Assumes every category is equally likely, ignoring the recorded frequencies entirely.
