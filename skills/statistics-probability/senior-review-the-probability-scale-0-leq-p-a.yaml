misconceptions:
- id: assumes-rule-implies-possible
  description: Assumes that any rule-phrased description must describe a possible (non-empty, non-total) subset, picking the "between" option when the rule is actually impossible or certain.
- id: miscounts-the-boundary
  description: Confuses impossible (P = 0) with certain (P = 1) or vice versa.
