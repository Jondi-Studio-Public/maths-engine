misconceptions:
- id: percentages-of-the-wrong-total
  description: Divides each count by the total of the other variable (the column total when the groups are the rows, or the row total when they are the columns), so the percentages do not add to 100 within each group.
- id: percentages-of-the-grand-total
  description: Divides each count by the grand total, so the percentages describe the whole sample and cannot be compared between groups.
- id: gives-the-complement-of-the-percentage
  description: Writes 100 minus the percentage, the share who are not in that category.
- id: takes-the-row-total-as-the-count
  description: Writes the row total in a missing cell, forgetting to take off the other counts in the row.
- id: takes-the-column-total-as-the-count
  description: Writes the column total in a missing cell, forgetting to take off the other counts in the column.
