misconceptions:
- id: off-by-one-fewer-outcomes
  description: Divides by one fewer than the actual number of outcomes, 1/(n-1), instead of 1/n.
- id: off-by-one-more-outcomes
  description: Divides by one more than the actual number of outcomes, 1/(n+1), instead of 1/n.
- id: assumes-two-outcomes
  description: Assumes exactly two possible outcomes and doubles the count, 2/n, regardless of how many outcomes are actually described.
