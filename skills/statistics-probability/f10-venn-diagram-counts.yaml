misconceptions:
- id: adds-shown-without-total
  description: Adds the numbers shown on the diagram and gives that as the missing region, never using the stated total.
- id: leaves-out-a-region
  description: Subtracts all but one of the shown regions from the total, so the answer is too large by the region left out.
- id: overlap-left-out-of-set
  description: Counts only the part of a circle outside the overlap when asked for everyone in that set.
- id: overlap-counted-twice
  description: Adds the whole of each circle for "either set", so the overlap is counted twice.
- id: exactly-one-with-overlap
  description: Includes the overlap when asked for exactly one of the sets.
