- topic: exd_x_fc_probability_tree
  params: {tier: exam}
  difficulty: exam
  stages: [exam]
misconceptions:
- id: adds-along-the-branches
  description: Adds the probabilities on the branches of a path instead of multiplying them.
- id: stops-after-the-first-branch
  description: Gives the probability on the first branch of a path and ignores the second branch.
- id: wrong-outcome-path
  description: Multiplies the branches of a different outcome from the one asked for, for example the other colour on one of the draws.
- id: counts-one-order-only
  description: Finds only one of the two paths to two different colours and leaves out the same colours in the other order.
- id: reads-with-replacement-values
  description: Uses the first-stage probabilities on the second stage of a tree drawn without replacement.
- id: stops-before-the-complement
  description: Finds the probability that neither counter is the colour and gives it as the answer for at least one.
tags: [acara-f10-v9, statistics-probability, fig_prob_tree, ac9m9p01, ac9m8p02]
