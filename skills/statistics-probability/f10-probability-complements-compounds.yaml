id: f10-probability-complements-compounds
name: Calculate complementary event probabilities
domain: statistics-probability
year_level: ['8']
naplan_domain: [probability]
description: >-
  Given the probability of one event in a complementary pair, expressed as a fraction,
  compute the probability of the complementary event as one minus the given probability,
  expressed as a fraction in lowest terms.
status: active
placement_eligible: false
prerequisites:
- f10-probability-scale-and-expectation
- multiplication-principle
answer: fraction
