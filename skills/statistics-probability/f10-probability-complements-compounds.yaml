misconceptions:
- id: forgot-to-complement
  description: States the probability of the original event instead of its complement.
- id: misreads-numerator
  description: Adjusts the numerator by ±1 before complementing, changing the first step without correct application of the complement rule.
- id: adds-instead
  description: Adds the probability to 1 instead of subtracting it from 1.
- id: reciprocal
  description: Swaps numerator and denominator instead of applying the complement rule.
