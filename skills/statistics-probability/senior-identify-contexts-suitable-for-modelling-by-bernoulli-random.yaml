misconceptions:
- id: reports-suited-for-repeated-trials
  description: Reports "Suited to a Bernoulli model" when the scenario explicitly repeats the trial a fixed number of times and asks for a count of successes -- a binomial setup, not a single trial.
- id: reports-suited-for-continuous-outcome
  description: Reports "Suited to a Bernoulli model" when the single trial's outcome is a continuous measurement, not one of two discrete categories.
- id: reports-suited-for-dependent-draw
  description: Reports "Suited to a Bernoulli model" when the single draw comes from a population whose composition has already changed noticeably, so its probability is not genuinely fixed.
- id: pattern-matches-already-removed
  description: At the exam tier, reports "Not suited -- the trials are not independent" purely because the scenario mentions items already removed without replacement, without checking whether the remaining population is large enough for the effect to be negligible.
