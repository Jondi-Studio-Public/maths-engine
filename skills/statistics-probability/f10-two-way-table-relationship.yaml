misconceptions:
- id: adds-instead-of-subtracting
  description: Adds the other known cells to a row or column total instead of subtracting them from it to find a missing cell.
- id: subtracts-from-the-grand-total
  description: Finds a missing cell by taking the known cells in its row away from the grand total instead of from that row's total.
- id: swaps-two-cells
  description: Writes the count for one cell in another cell of the table, usually the cell beside it or below it.
- id: leaves-out-a-cell-from-the-total
  description: Misses one cell when adding a row or column to find its total.
- id: adds-row-and-column-totals-together
  description: Finds the grand total by adding the row totals and the column totals together, counting everyone twice.
- id: miscounts-by-one
  description: Is one out when counting or adding up a cell, so the cell is one too high or one too low.
- id: reads-more-as-times
  description: Treats "N more than" as "N times as many" when using the stated condition about two totals.
- id: reads-times-as-more
  description: Treats "twice" or "three times" as "2 more" or "3 more" when using the stated condition about two totals.
