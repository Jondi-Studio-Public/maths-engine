id: f10-two-way-table-relationship
name: Complete a two-way table
domain: statistics-probability
description: Complete the blank cells of a two-way frequency table of counts for two categorical variables, each with a small named set of categories. Easy tabulates a list of paired observations into a 2 by 2 table with its totals; medium finds missing cells and totals from the given row, column and grand totals; hard also uses one stated condition linking two totals. Comparing proportions and discussing a relationship are not asked.
status: active
placement_eligible: false
prerequisites:
- f10-probability-complements-compounds
- conditional-probability-counts
answer: table
sources:
