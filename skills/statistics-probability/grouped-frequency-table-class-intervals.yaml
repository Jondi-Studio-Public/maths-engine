id: grouped-frequency-table-class-intervals
name: Use a grouped frequency table with class intervals
domain: statistics-probability
year_level: ['11']
description: Read a grouped frequency table written with class intervals. Easy finds the midpoint of the modal class. Medium
  estimates the mean from the class midpoints. Hard finds the lower limit of the class that contains the median, or recovers
  a missing frequency from a stated estimated mean. The exam chain estimates the total, the mean, the median class and the
  mean after further values are added.
status: active
placement_eligible: false
prerequisites:
- calculate-mean
- calculate-median
- f7-read-a-histogram
answer: number
