misconceptions:
- id: dg-dp-one-dot-per-value
  description: "Draws one dot above each different value, so a repeated value is not stacked."
- id: dg-dp-dots-shifted
  description: "Puts the dots one tick to the side of the value they belong to, so every stack is on the wrong value."
- id: dg-dp-value-as-dots
  description: "Uses the value itself as the number of dots above it instead of counting how many times it occurs."
- id: dg-dp-gap-closed
  description: "Squeezes the empty ticks out of the axis, so the stacks after a gap sit one value too low."
- id: dg-dp-miscount-one
  description: "Miscounts one stack by one dot when tallying the list."
- id: dg-dp-mode-as-count
  description: "Gives the number of dots in the tallest stack where the value of the mode was asked for."
- id: dg-dp-mode-second
  description: "Picks the second tallest stack, or the highest value, as the mode."
- id: dg-dp-median-as-middle-value
  description: "Takes the middle value of the axis, not the middle of the ordered data, as the median."
- id: dg-dp-median-as-mean-of-extremes
  description: "Takes the halfway point between the lowest and highest value as the median."
- id: dg-dp-median-even-lower
  description: "Takes the lower of the two middle values as the median when the number of values is even."
- id: dg-dp-difference-reversed
  description: "Subtracts the median from the mode when the median minus the mode was asked for."
- id: dg-dp-difference-uses-count
  description: "Uses the number of dots at the mode instead of the mode itself in the difference."
difficulty_progression:
  easy: {steps: 2, demand: "Tally a list of whole numbers and give one stack of dots for each value on the axis."}
  medium: {steps: 2, demand: "Tally data to one decimal place, matching the whole number and the tenth together so 6.2 and 6.3 stay on different ticks."}
  hard: {steps: 3, demand: "Tally data with a gap and a far-out value, giving the empty ticks between them a stack of 0 instead of closing the gap."}
  exam: {steps: 5, demand: "Chain the dots above each value, the mode, the median of an even or odd count, and the median minus the mode using the earlier answers."}
