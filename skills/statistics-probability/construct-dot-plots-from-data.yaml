id: construct-dot-plots-from-data
name: Construct a dot plot from a list of values
domain: statistics-probability
year_level: ['7']
description: >-
  Build a dot plot of a numerical variable from a list of values and give the number of dots above every value on the
  axis, in order, as Value = dots. easy uses whole-number data on an axis from the lowest to the highest value; medium
  uses data to one decimal place on an axis that steps by 0.1; hard has a gap and a far-out value so several ticks have
  no dots and must be given as 0; exam is a chain from the dots above each value to the mode, the median (a half when the
  number of values is even) and the median minus the mode, which follows through from the two before it.
status: active
placement_eligible: false
prerequisites: [f6-read-a-dot-plot]
answer: bars
sources:
