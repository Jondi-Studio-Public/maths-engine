id: f10-frequency-table-discrete-data
name: Frequency tables for discrete numerical data
domain: statistics-probability
year_level: ['3']
naplan_domain: [statistics]
description: Given data about a discrete numerical variable (pets at home, goals in a game, shoe sizes), supplied as a jumbled list, a column of tally marks or named observations, complete the blank cells of a frequency table. Easy counts how often each value occurs and totals the counts; medium also finds a row that adds the counts for values such as "at least 3" or "fewer than 3"; hard builds a running total or a "this many or more" column, or finds a missing count from a stated total. The data and the table are always given. Choosing a question, collecting the data and drawing a graph are not asked, and written explanations are not graded.
status: active
placement_eligible: false
prerequisites:
- f10-collect-sort-compare-categorical-data
answer: table
