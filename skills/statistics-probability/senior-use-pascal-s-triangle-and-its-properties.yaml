misconceptions:
- id: off-by-one-k
  description: Uses an adjacent position k+1 or k-1 instead of the correct position k.
- id: permutation-not-combination
  description: Computes P(n,k) treating order as mattering, instead of C(n,k) for combinations.
- id: subtracts-instead-of-adds
  description: Subtracts the two parent values instead of adding them.
- id: reports-one-parent-only
  description: Reports one parent value instead of computing the child via the recurrence.
- id: adds-instead-of-subtracts
  description: Adds parent values instead of subtracting to find the missing parent.
- id: reports-given-parent-as-the-answer
  description: Reports the given parent value instead of computing the missing parent via subtraction.
