id: senior-use-pascal-s-triangle-and-its-properties
name: Use Pascal’s triangle and its properties
domain: statistics-probability
description: 'Given bounded, fully specified inputs, use Pascal’s triangle and its properties. Return the resulting value, expression, relation, or classification. This skill assesses direct entry lookup in Pascal''s triangle, application of the additive recurrence rule to find entries, and inverse application to find missing parent values.'
