id: tally-tables
name: Tally tables
domain: statistics-probability
year_level: ['2']
naplan_domain: [statistics]
learner_band: early
description: "Read a tally table with marks in gates of five: how many a row shows, which row shows a stated count, and which row of a tally does not match the things that were sorted."
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
read_aloud: true
prerequisites: [one-to-one-displays]
answer: mcq
sources:
