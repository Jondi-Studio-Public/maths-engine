- topic: ey_tally_tables
  params: {tier: hard}
  difficulty: hard
  stages: [5, 6, maintenance]
difficulty_progression:
  easy:
    steps: 1
    demand: "Read the marks in one row, counting gates of five."
  medium:
    steps: 2
    demand: "Read every row to find the one that shows a stated count, rejecting rows that look close."
  hard:
    steps: 3
    demand: "Count each kind of thing in a scatter, read each row of the tally, and compare the two to find the row that is wrong."
misconceptions:
- id: eyt-neighbouring-row
  description: "Reads the row above or below the one the question names."
- id: eyt-skips-the-slash
  description: "Counts only the upright strokes of a tally, so each gate of five is read as four."
- id: eyt-gate-counted-as-one
  description: "Counts each gate of five tally marks as a single mark."
- id: eyt-count-one-over
  description: "Counts one too many in a row of tally marks."
- id: eyt-count-one-short
  description: "Counts one too few in a row of tally marks."
- id: eyt-picks-a-matching-row
  description: "Chooses a row of the tally that is right, so the row that is wrong is missed."
