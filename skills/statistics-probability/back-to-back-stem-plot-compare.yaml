id: back-to-back-stem-plot-compare
name: Compare two groups using a back-to-back stem plot
domain: statistics-probability
year_level: ['11']
description: Read a back-to-back stem plot of two groups, written as text. Easy finds the median of one named group. Medium
  finds the interquartile range of one group. Hard finds how much greater the less consistent group's interquartile range
  is, or counts the values of one group above the other group's upper quartile. The exam chain finds a median, both interquartile
  ranges and the gap between them.
