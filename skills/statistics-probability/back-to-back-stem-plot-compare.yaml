misconceptions:
- id: r4g-other-group-read
  description: Reading the value for the other group in a back-to-back plot instead of the group named.
- id: r4g-midrange-for-median
  description: Giving the number halfway between the smallest and largest values as the median.
- id: r4g-one-middle-value-only
  description: With an even number of values, giving one of the two middle values instead of the number halfway between them.
- id: r4g-mean-for-median
  description: Giving the mean of the values where the median was asked for.
- id: r4g-leaf-of-median-only
  description: Giving only the leaf of the median value, ignoring its stem.
- id: box-iqr-as-range
  description: Giving the range, whisker end to whisker end, where the interquartile range was asked for.
- id: box-quartile-for-iqr
  description: Giving a quartile on its own for the interquartile range.
- id: box-iqr-from-median
  description: Giving the distance from the median to a quartile for the interquartile range.
- id: r4g-median-kept-in-both-halves
  description: Leaving the median in both halves when finding the quartiles of an odd number of values.
- id: box-iqr-difference-of-medians
  description: Giving the difference between the medians where the difference between the interquartile ranges was asked for.
- id: box-iqr-difference-of-ranges
  description: Giving the difference between the ranges where the difference between the interquartile ranges was asked for.
- id: box-iqr-difference-summed
  description: Adding the two interquartile ranges where their difference was asked for.
- id: r4g-median-for-upper-quartile
  description: Comparing with the median of the other group where its upper quartile was asked for.
- id: r4g-value-equal-to-quartile-counted
  description: Counting values equal to the quartile as greater than it.
- id: r4g-count-below-not-above
  description: Counting the values that are not greater than the quartile instead of the values that are.
- id: box-iqr-difference-of-upper-quartiles
  description: Giving the difference between the upper quartiles where the difference between the interquartile ranges was
    asked for.
- id: r4g-own-quartile-used
  description: Comparing with the group's own upper quartile instead of the other group's.
- id: r4g-one-iqr-not-the-difference
  description: Giving the larger interquartile range instead of the difference between the two.
