id: senior-simulate-repeated-random-sampling-from-a-variety-of
name: Standardise a sample mean using the known population sigma
domain: statistics-probability
year_level: ['12']
description: >-
  Read the output of a seeded, reproducible simulation of repeated random
  sampling of size n from a stated distribution with mean mu and KNOWN
  standard deviation sigma, and compute the standardised value of a stated
  sample's mean, z = (x-bar - mu) / (sigma / sqrt(n)), to 2 decimal places.
  Never prints or asks for a sample standard deviation or sample variance --
  sigma is always the population's own, known value. Four tiers: mu and
  sigma stated directly, for a variety of populations (uniform, 0/1
  indicator, exponential, normal); the population given only as a small pmf
  table, so the learner derives mu and sigma of X first (distinct from
  `finite-distribution-variance`, where that derived variance is the whole
  answer -- here it is only an intermediate step, and the graded answer is
  the standardised sample mean); two stated samples of DIFFERENT sizes from
  the same population, asking which has the standardised value further from
  0 (the standard error depends on n); and a stated binomial count (m
  trials, success probability q), where the learner must recognise the
  model and derive mu = mq and sigma = sqrt(mq(1-q)) themselves. This is the
  sigma-known sibling of
  `senior-simulate-repeated-random-sampling-from-a-variety-of-acmsm139`,
  which never states or derives a population sigma and instead standardises
  with each sample's own sample standard deviation s.
status: active
