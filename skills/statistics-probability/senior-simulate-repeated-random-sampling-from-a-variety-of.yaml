misconceptions:
- id: omits-sqrt-n
  description: Divides the deviation by sigma alone, never taking the square root of n.
- id: divides-by-n
  description: Divides sigma by n instead of by the square root of n.
- id: uses-variance
  description: Divides by sigma squared over the square root of n, using the variance where the standard deviation belongs.
- id: reversed-difference
  description: Computes (mu - x-bar) instead of (x-bar - mu), flipping the sign.
- id: other-sample
  description: Reports the other stated sample's standardised value instead of the one that is actually further from 0.
