- topic: use_everyday_occurrences_to_illustrate_set_descriptions_and
  difficulty: medium
  stages: [6]
- topic: use_everyday_occurrences_to_illustrate_set_descriptions_and
  difficulty: hard
  stages: [6, maintenance]
misconceptions:
- id: confuses-union-with-intersection
  description: Chooses the union option when the description asks for intersection, or vice versa.
- id: ignores-direction-in-difference
  description: For "A but not B" vs "B but not A", misses that the direction determines which group is excluded.
- id: omits-exclusion-in-difference
  description: Correctly identifies the set operation as a difference but forgets that one group must be explicitly removed.
- id: misses-triple-set-complexity
  description: In hard tier, attempts to apply a 2-set logic to a 3-set description without tracking the third group.
- id: confuses-exactly-one-with-both
  description: Thinks "exactly one of A or B" means "at least one" (which is union), not the symmetric difference.
- id: misinterprets-neither
  description: Chooses union or intersection when the description asks for "neither A nor B" (the complement of their union).
