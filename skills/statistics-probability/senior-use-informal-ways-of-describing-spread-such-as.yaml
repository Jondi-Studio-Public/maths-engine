misconceptions:
- id: ignores-stated-rule
  description: Fails to read or apply the stated numeric threshold rule when classifying the data set.
- id: confuses-range-with-density
  description: Thinks "tightly packed" means high value density (many values close together) rather than all values within a stated range.
- id: misses-all-pairs-check
  description: For outlier detection, checks only if a value is far from the mean or from one other value, not from every other value.
- id: lone-outlier-vs-cluster
  description: Confuses a gap with one isolated value on one side (lone outlier) with a genuine gap between two clusters.
- id: misinterprets-cluster-definition
  description: Fails to recognize that a gap between clusters requires at least two values on each side of the gap.
