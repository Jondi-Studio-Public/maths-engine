misconceptions:
- id: negated
  description: Reports -r instead of r (a sign error), only offered when it clears the grader by construction.
- id: r-squared
  description: Reports r squared (the coefficient of determination) instead of r itself.
- id: mispaired
  description: Computes r after the y column has been read in the wrong order against x, losing the true pairing.
- id: raw-column
  description: On the medium tier, reports r between x and one of the two RAW printed columns instead of the derived variable.
- id: other-set
  description: On the hard tier, reports the correlation coefficient of the WEAKER data set instead of the stronger one.
- id: ignores-counts
  description: On the exam tier, reports r of the distinct pairs only, ignoring each pair's stated frequency.
