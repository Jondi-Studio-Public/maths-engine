misconceptions:
- id: wrong-sign-gradient
  description: Picks a line sloping the wrong way, ignoring whether the data trends up or down.
- id: right-gradient-wrong-intercept
  description: Picks a line parallel to the true trend but offset by a constant, ignoring where the data actually sits.
- id: overreacts-to-outlier
  description: Picks a line dragged toward a single standout point at the expense of the rest of the data.
