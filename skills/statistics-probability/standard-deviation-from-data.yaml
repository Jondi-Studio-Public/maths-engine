id: standard-deviation-from-data
name: Calculate the sample standard deviation of a data set
domain: statistics-probability
description: >-
  Calculate the SAMPLE standard deviation (divide the sum of squared
  deviations by n-1, never n) of a small (5-8 value) data set, working
  through the mean and the variance as steps. Every question states "sample
  standard deviation" explicitly and asks for the answer to 2 decimal
  places. Four tiers of genuine reasoning escalation: whole numbers whose
  mean is itself a whole number; whole numbers whose mean is not a whole
  number, forcing decimal arithmetic on every deviation; a data set given in
  a measurement context with a unit and one-decimal-place readings; and two
  labelled data sets given together, asking for the sample standard
  deviation of one named set.
status: active
prerequisites: [calculate-mean]
answer: number
sources:
# `difficulty` is the tier (easy, medium, hard, exam). The topic registers a
# preset of each of those names (see
# mathgen/generators/sample_standard_deviation.py), and the `variant` is kept
# explicit in `params` too: it wins over the preset, and a reader of this file
# sees the question shape without looking the preset up. Context and
# compare_sets share the hard tier: the first adds decimal readings with a
# unit, the second adds choosing between two labelled data sets.
- topic: standard_deviation_from_data
  params: {variant: integers}
  difficulty: easy
  stages: [0, 1]
- topic: standard_deviation_from_data
  params: {variant: non_integer_mean}
  difficulty: medium
  stages: [2, 3]
- topic: standard_deviation_from_data
  params: {variant: context}
  difficulty: hard
  stages: [4, 5]
- topic: standard_deviation_from_data
  params: {variant: compare_sets}
  difficulty: hard
  stages: [6, maintenance]
- topic: exd_x_s5_sd_summary
  params: {tier: exam}
  difficulty: exam
  stages:
  - exam
misconceptions:
- id: population-divisor
  description: Divides the sum of squared deviations by n instead of n-1, reporting the population standard deviation.
- id: reports-variance
  description: Reports the variance, forgetting to take the final square root.
- id: forgot-divide
  description: Takes the square root of the raw sum of squared deviations without dividing by n-1 (or n) first.
- id: wrong-data-set
  description: Computes the standard deviation of the other labelled data set instead of the one asked for.
tags: [statistics, standard-deviation, spread]
