id: f10-random-versus-convenience-sample
name: Compare random and convenience samples with the population
domain: statistics-probability
year_level: ['8']
naplan_domain: [statistics]
description: 'Read a random sample and a convenience sample against a school population given as a table. Work out a sample''s
  mean or percentage, or the whole school''s from the table, then how far each sample is from the whole school (typed number:
  a gap in the variable''s units or in percentage points). Harder tiers compare the two samples (how much nearer one is),
  pool them into one group, or scale the convenience sample''s error up to a whole-school total. Every figure is exact.
  Naming the sampling method, spotting bias in a described survey and writing the report on what a sample shows are not
  asked; the written report stays with the rubric skills.'
