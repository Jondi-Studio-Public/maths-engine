misconceptions:
- id: swapped-gradient-intercept
  description: Treats the intercept as the gradient and vice versa, computing y = cx + m (or, inverted, x = (y - m) / c; for a predicted change, c * (x2 - x1) instead of m * (x2 - x1)).
- id: omits-intercept
  description: Forgets the constant term entirely, computing y = mx (or, inverted, x = y / m).
- id: sign-error-on-intercept
  description: Flips the sign of the intercept, computing y = mx - c (or, inverted, x = (y + c) / m).
- id: uses-endpoint-instead-of-change
  description: For a predicted change in y over an interval, answers the absolute prediction at one endpoint (m * x2 + c or m * x1 + c) instead of the difference m * (x2 - x1).
