misconceptions:
- id: omits-square-root
  description: Computes z*phat*(1-phat)/n without taking the square root.
- id: omits-division-by-n
  description: Computes z*sqrt(phat*(1-phat)) without dividing by n.
- id: omits-complement
  description: Computes z*sqrt(phat/n) without including the (1-phat) factor.
- id: omits-z-squared
  description: Forgets to square z when solving for sample size.
- id: omits-E-squared
  description: Forgets to square the target margin of error when solving for sample size.
- id: uses-floor-instead-of-ceil
  description: Rounds down instead of rounding up when solving for required sample size.
