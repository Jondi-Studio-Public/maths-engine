misconceptions:
- id: omits-sqrt
  description: Computes the margin as z times phat times (1 - phat) divided by n, never taking the square root.
- id: omits-complement
  description: Computes the margin as z times the square root of (phat divided by n), dropping the (1 - phat) factor.
- id: one-sided-margin
  description: Reports (center, center + 2*margin), only ever adding the margin and never subtracting it.
