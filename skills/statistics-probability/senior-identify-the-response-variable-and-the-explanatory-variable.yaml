misconceptions:
- id: swaps-explanatory-response
  description: Offers the role-swapped pair, taking the quantity that is measured or predicted as the explanatory variable.
- id: pairs-a-recorded-extra-with-the-response
  description: Pairs the third recorded quantity (a grouping label or covariate) with the response variable, treating a recorded extra as the explanatory variable.
- id: pairs-a-recorded-extra-with-the-explanatory
  description: Keeps the true explanatory variable but names the third recorded quantity as the response, or takes the extra as the explanatory variable of the true explanatory variable.
- id: ignores-axis-convention
  description: On the exam tier, ignores that the horizontal axis carries the explanatory variable and the vertical axis the response, choosing by which variable seems more important.
