id: sampling-distribution-moments
name: "Find the mean and spread of a sample mean or proportion"
domain: statistics-probability
year_level: ['12']
description: "Find the standard deviation or variance of a sample mean from the population standard deviation and the sample size, the standard deviation of a sample proportion, how a standard error changes when the sample size is rescaled, the least sample size for a target standard error, and the standard deviation of a difference of two sample means. No tail probability is asked."
status: active
placement_eligible: false
prerequisites: [standard-deviation-from-data, senior-understand-the-concept-of-the-sample-proportion-widehat]
answer: number
