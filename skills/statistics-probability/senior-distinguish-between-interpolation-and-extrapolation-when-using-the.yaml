misconceptions:
- id: confuses-direction-with-distance
  description: Thinks "extrapolation" means predicting in a particular direction (left or right) rather than outside the data range.
- id: excludes-boundaries-from-interpolation
  description: Believes a prediction at exactly xmin or xmax is extrapolation (fails to recognise inclusive boundary).
- id: assumes-both-always-apply
  description: Selects "both" when a single prediction point is presented, misinterpreting the statement.
- id: ignores-stated-range
  description: Fails to extract or use the stated data range (or table-derived range) when classifying the prediction.
- id: confuses-small-distance-with-interpolation
  description: Thinks being "close to the data" or having a small margin is what defines interpolation, rather than the binary inside/outside rule.
