id: senior-distinguish-between-interpolation-and-extrapolation-when-using-the
name: Distinguish between interpolation and extrapolation when using the fitted line to make predictions, recognising the potential dangers of extrapolation
domain: statistics-probability
description: 'Given bounded, fully specified inputs, distinguish between interpolation and extrapolation when using the fitted line to make predictions, recognising the potential dangers of extrapolation. Return the resulting value, expression, relation, or classification. This skill assesses the distinction directly: interpolation means the prediction point lies within the range of the collected data; extrapolation means it lies outside that range. A binary classification with two real answer categories (interpolation vs. extrapolation) and no third-party "both apply" category or "cannot determine" outcome. The boundary is inclusive: a prediction at the exact minimum or maximum x-value is interpolation.'
