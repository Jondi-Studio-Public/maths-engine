id: limits-of-a-bivariate-claim
name: Know the limits of a claim from a line of fit
domain: statistics-probability
year_level: ['10']
description: Use a stated line of fit to predict a value, say whether the prediction is interpolation or extrapolation and whether to trust it, find where the line reaches a limit, and name the lurking variable that fits a scenario. The exam chain predicts, finds the change, and judges the claim.
