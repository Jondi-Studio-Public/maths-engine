misconceptions:
- id: adds-instead-of-multiplies
  description: Reports "Not independent" using P(A) + P(B) as the product test instead of P(A) x P(B), an addition-instead-of-multiplication misconception.
- id: subtracts-instead-of-multiplies
  description: Reports "Not independent" using |P(A) - P(B)| as the product test instead of P(A) x P(B).
- id: squares-one-probability
  description: Reports "Not independent" using P(A) x P(A) or P(B) x P(B) as the product test, forgetting the other event's probability entirely.
- id: averages-instead-of-multiplies
  description: Reports "Not independent" using the average (P(A) + P(B)) / 2 as the product test instead of P(A) x P(B).
