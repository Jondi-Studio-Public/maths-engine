id: f10-shape-and-variation-of-a-display
name: Shape and variation of a display
domain: statistics-probability
year_level: ['4']
naplan_domain: [statistics]
description: >-
  Read the shape and spread of one drawn display (a dot plot, or a column graph of how often each value occurs) and
  of two groups drawn together in one column graph. easy reads one feature as a number: the mode, the range, how many
  values are shown, how many have the mode value, or the value that is the outlier. medium names the true statements
  about a display (mode, range, number of values, symmetric, bunched at one end, an outlier) by their letters, finds
  the range once the outlier is left out, or counts the values above the mode. hard compares two groups on one
  variable: the true comparing statements (spread, mode, outlier, symmetry, number of values), how much greater one
  range is than the other, how many more values one group has, or the range of both groups together. Not asked: the
  written discussion of why one display suits a purpose or of what a shape means in context, which stays open-response
  (rubric) work. Answers are numbers or sets of statement letters.
status: active
needs_figure: true
capability_gates: [figure_stimulus]
placement_eligible: false
prerequisites: [f3-read-a-column-graph]
answer: number
sources:
