id: senior-compare-the-characteristics-of-the-shape-of-histograms
name: Compare the characteristics of the shape of histograms using symmetry, skewness and bimodality
domain: statistics-probability
description: 'Given a drawn histogram or a description of its shape, classify that shape as symmetric, skewed left, skewed right, or bimodal, from four options offered on every draw. Every prompt states the skewed-right/positively-skewed convention (longer tail towards larger values) so the classic sign confusion is removed by construction, not assumed. Four tiers: a verbal description of the shape that never uses the answer''s own words; one drawn histogram; one drawn histogram whose values are all subtracted from a stated number, so the learner classifies the drawn shape and then reflects it; and two drawn histograms, where the learner must first decide which one the prompt''s stated comparison (wider range, or larger total) picks out before classifying it. Distinct from senior-use-relative-frequencies-and-histograms-obtained-from-data, which uses the same class-frequency data to estimate a probability rather than classify the shape of the distribution itself.'
