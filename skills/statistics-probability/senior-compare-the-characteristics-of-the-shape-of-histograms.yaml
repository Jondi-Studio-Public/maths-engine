id: senior-compare-the-characteristics-of-the-shape-of-histograms
name: Compare the characteristics of the shape of histograms using symmetry, skewness and bimodality
domain: statistics-probability
description: 'Given a histogram''s class-frequency data or a description of its shape, classify that shape as symmetric, skewed left, skewed right, or bimodal, from four options offered on every draw. Every prompt states the skewed-right/positively-skewed convention (longer tail towards larger values) so the classic sign confusion is removed by construction, not assumed. Four tiers: a verbal description of the shape that never uses the answer''s own words; a class-frequency table printed in class order; the same table with its rows shuffled out of class order, so the classes must be reordered first; and an exam chain on one frequency table: estimate the mean from the class midpoints, estimate the median by interpolation, then use their difference to name the shape. Distinct from senior-use-relative-frequencies-and-histograms-obtained-from-data, which uses the same class-frequency data to estimate a probability rather than classify the shape of the distribution itself.'
