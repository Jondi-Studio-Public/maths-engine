id: senior-compare-the-characteristics-of-the-shape-of-histograms
name: Compare the characteristics of the shape of histograms using symmetry, skewness and bimodality
domain: statistics-probability
description: 'Given a drawn histogram, a description of its shape or a class-frequency table, classify that shape as symmetric, skewed left, skewed right, or bimodal. Every prompt states the skewed-right/positively-skewed convention (longer tail towards larger values) so the classic sign confusion is removed by construction, not assumed. Tiers: easy gives a verbal description of the shape that never uses the answer''s own words; medium gives one drawn histogram; hard gives one drawn histogram whose values are all subtracted from a stated number, so the learner classifies the drawn shape and then reflects it. The exam tier is a chain on one class-frequency table: estimate the mean from the class midpoints, estimate the median by interpolation, then use their difference to name the shape. Distinct from senior-use-relative-frequencies-and-histograms-obtained-from-data, which uses the same class-frequency data to estimate a probability rather than classify the shape of the distribution itself.'
