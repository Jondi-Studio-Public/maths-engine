misconceptions:
- id: skew-direction-confusion
  description: Picks the opposite skew direction (right for left, or left for right), the classic positively/negatively-skewed sign confusion the prompt's own convention sentence is meant to remove.
- id: skewed-as-symmetric
  description: Reads a skewed table as symmetric, missing that the tail's fall-off is one-sided rather than mirrored on both sides.
- id: symmetric-as-skewed
  description: Reads a genuinely symmetric table as skewed, over-reading a small (<=1) mirror difference as a real one-sided tail.
- id: skewed-as-bimodal
  description: Mistakes a single-peaked skewed distribution's tail for a second cluster, calling it bimodal when there is only one real peak.
- id: forgets-the-reflection
  description: On the hard tier, classifies the histogram as drawn and ignores that subtracting every value from a number reverses it, so a skewed shape keeps its old direction.
- id: wrong-histogram-in-exam
  description: On the exam tier, classifies the OTHER histogram instead of the one picked out by the stated comparison (wider range, or larger total).
