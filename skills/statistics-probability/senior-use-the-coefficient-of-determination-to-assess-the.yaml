misconceptions:
- id: reports-r-not-r-squared
  description: Reports the stated r itself (as a decimal or percentage) instead of squaring it.
- id: doubles-instead-of-squares
  description: Computes 2r (or 2|r|) instead of r^2.
- id: takes-square-root
  description: Computes sqrt(|r|) instead of r^2 -- the inverse operation.
- id: keeps-sign-after-squaring
  description: Squares a negative r but reports the result with the sign kept, as if squaring preserved it.
- id: reports-unexplained-share
  description: Reports 1 - r^2 (the UNexplained proportion of variation) instead of r^2 (the explained proportion).
- id: compares-signed-r
  description: On the hard tier, picks the explanatory variable with the larger SIGNED r instead of the larger |r|, so a negative-but-stronger variable is missed in favour of a weaker positive one.
- id: picks-one-model
  description: On the exam tier, reports one model's own r^2 (as a percentage) instead of the DIFFERENCE between the two models' r^2 values.
- id: forgets-to-square-before-differencing
  description: On the exam tier, subtracts the two stated |r| values directly (as a percentage) instead of squaring each first.
