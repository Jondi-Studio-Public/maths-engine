id: parallel-box-plots-outlier-fences
name: Use two parallel box plots to find fences, outliers and variability
domain: statistics-probability
description: 'Two box plots are drawn on one axis and the 1.5 x IQR rule is stated in the prompt. Easy: the interquartile range of one group, or how much higher one median is than the other. Medium: the upper or lower fence of a named group. Hard: how far a drawn outlier lies beyond its fence, or the smallest whole number that would be an outlier above a plot with none (the ''more than'' is strict). The exam chain asks the interquartile range, the fence on the outlier''s side (carried forward), how far the outlier lies beyond it (carried forward) and which group is more variable; the group with the outlier has the larger range but the smaller interquartile range. Distinct from senior-recognise-and-identify-outliers, which works from stated quartiles, and from f10-compare-box-plots, which compares without fences.'
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
