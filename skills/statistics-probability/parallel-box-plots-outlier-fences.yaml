misconceptions:
- id: bp-iqr-as-range
  description: Gives the range from one end of the whiskers to the other where the interquartile range was asked for.
- id: bp-iqr-as-quartile
  description: Gives the value of the third quartile in place of the interquartile range.
- id: bp-iqr-half-box
  description: Gives only half of the box, from the median to one quartile, as the interquartile range.
- id: bp-iqr-to-whisker
  description: Measures the interquartile range from the first quartile to the end of the upper whisker.
- id: bp-gridline-slip
  description: Reads a value from the axis one tick-mark away from the correct one.
- id: bp-median-diff-quartile
  description: Compares the quartiles of the two plots instead of the medians.
- id: bp-median-diff-whisker
  description: Compares the ends of the whiskers instead of the medians.
- id: bp-median-diff-range
  description: Compares the ranges of the two plots where the difference between the medians was asked for.
