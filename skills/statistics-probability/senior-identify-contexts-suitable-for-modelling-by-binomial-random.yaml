misconceptions:
- id: reports-suited-but-not-fixed
  description: Reports "Suited to a binomial model" when the number of trials is not fixed in advance (e.g. a process repeated until it first succeeds).
- id: reports-suited-but-not-independent
  description: Reports "Suited to a binomial model" when the trials are drawn without replacement from a small population, so the trial-to-trial probability genuinely changes.
- id: reports-suited-but-not-constant-p
  description: Reports "Suited to a binomial model" when the stated success probability differs between two named sub-groups of trials rather than staying constant.
- id: reports-suited-but-not-two-outcomes
  description: Reports "Suited to a binomial model" when each trial's outcome is a continuous measurement or one of more than two categories, rather than exactly two.
- id: pattern-matches-without-replacement
  description: At the exam tier, reports "Not suited -- the trials are not independent" purely because the scenario says "without replacement", without checking whether the sampled population is large enough for the dependence to be negligible.
