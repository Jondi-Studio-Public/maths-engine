misconceptions:
- id: ir2a-blames-the-horizontal-axis
  description: Calling a graph misleading because of its horizontal axis when the flaw is the vertical axis.
- id: ir2a-blames-the-vertical-steps
  description: Calling a graph misleading because the vertical steps are uneven when they are evenly spaced.
- id: ir2a-calls-a-small-rise-large
  description: Calling a rise large because it looks steep on the graph, without working out its percentage.
- id: ir2a-divides-by-the-final-value
  description: Dividing the rise by the final value instead of the starting value to find a percentage rise.
- id: ir2a-gives-one-height-not-the-ratio
  description: Giving one bar or point height when the ratio of the two heights was asked.
- id: ir2a-gives-the-final-value-as-a-percentage-of-the-first
  description: Giving the final value as a percentage of the first value when the percentage rise was asked.
- id: ir2a-gives-the-rise-as-a-percentage
  description: Giving the raw rise as the percentage rise.
- id: ir2a-measures-heights-from-zero-not-from-the-axis
  description: Measuring the heights of two points from zero when the axis starts higher, so the ratio is wrong.
- id: ir2a-reads-the-bottom-of-the-axis
  description: Reading the lowest value on the vertical axis instead of the value of the point.
- id: ir2a-reads-the-gridline-above
  description: Reading the gridline above a point instead of the value of the point.
- id: ir2a-reads-the-gridline-below
  description: Reading the gridline below a point instead of the value of the point.
- id: ir2a-reads-the-neighbouring-value
  description: Reading the value for a neighbouring month or case instead of the one asked for.
- id: ir2a-says-a-line-graph-is-the-wrong-display
  description: Calling a line graph the wrong display for values that change over time.
- id: ir2a-says-the-graph-cannot-be-read
  description: Saying a graph with a labelled scale cannot be read.
- id: ir2a-sees-a-flaw-in-an-honest-axis
  description: Calling a graph misleading when its vertical axis starts at zero.
- id: ir2a-trusts-a-graph-that-does-not-start-at-zero
  description: Trusting how large a change looks on a graph whose vertical axis does not start at zero.
