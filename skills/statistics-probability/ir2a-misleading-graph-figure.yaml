id: ir2a-misleading-graph-figure
name: Spot a misleading graph
domain: statistics-probability
year_level: ['9', '10']
naplan_domain: [statistics]
description: Read a line graph with a labelled scale, work out the real percentage rise and the apparent ratio of heights when the vertical axis does not start at zero, and pick what is misleading from five options. The exam chain judges a headline against the graph.
