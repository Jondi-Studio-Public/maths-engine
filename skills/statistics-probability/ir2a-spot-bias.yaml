id: ir2a-spot-bias
name: Spot bias in a survey
domain: statistics-probability
year_level: ['6', '8', '9']
naplan_domain: [statistics]
description: Given five numbered survey statements, list which describe a source of bias, estimate a population count from a described sample, and at the hard tier pick the flaw from five options. The exam chain estimates a population count and then judges the survey.
status: active
placement_eligible: false
prerequisites:
