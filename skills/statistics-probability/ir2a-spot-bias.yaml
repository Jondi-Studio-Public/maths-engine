misconceptions:
- id: ir2a-adds-instead-of-subtracting
  description: Adding the sample to the population when finding how much more a census needs.
- id: ir2a-blames-easy-to-reach-sample
  description: Naming an easy-to-reach sample as the main flaw when another source of bias is the real one.
- id: ir2a-blames-leading-question
  description: Naming a leading question as the main flaw when another source of bias is the real one.
- id: ir2a-blames-non-response
  description: Naming non-response as the main flaw when another source of bias is the real one.
- id: ir2a-blames-undercoverage
  description: Naming undercoverage (a list that leaves people out) as the main flaw when another source of bias is the real one.
- id: ir2a-blames-voluntary-response
  description: Naming voluntary response (people choosing themselves) as the main flaw when another source of bias is the real one.
- id: ir2a-compares-percentages-not-counts
  description: Giving the difference in percentage points when the difference in the numbers of people was asked.
- id: ir2a-flags-a-sound-feature-as-biased
  description: Counting a sound part of a survey as a source of bias.
- id: ir2a-gives-those-who-disagree
  description: Giving the number who did not agree when the number who agreed was asked.
- id: ir2a-misses-a-biased-feature
  description: Leaving a source of bias out of the list of biased statements.
- id: ir2a-reports-the-better-estimate
  description: Giving the better estimate itself instead of the amount by which the other estimate is too high.
- id: ir2a-reports-the-percentage-as-the-count
  description: Giving the percentage who agreed as if it were the number of people.
- id: ir2a-reports-the-sample-count-not-the-population-estimate
  description: Giving the number who agreed in the sample instead of scaling up to the whole population.
- id: ir2a-slips-a-power-of-ten
  description: Taking one tenth of the correct share, by dividing by 1000 instead of 100.
- id: ir2a-uses-the-biased-survey-percentage
  description: Estimating from the percentage in the biased survey when a properly drawn sample was available.
