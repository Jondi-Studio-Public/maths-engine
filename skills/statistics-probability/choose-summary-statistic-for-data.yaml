id: choose-summary-statistic-for-data
name: Choose a summary statistic for data
domain: statistics-probability
year_level:
- '10'
- '11'
- '12'
description: Choose the mode, median or mean from the type of variable, the shape of the data and what the figure is for (nominal
  categories, ordered ratings, skewed values with an outlier, balanced values when a total is wanted, a repeated count), work
  out the chosen measure, and find the better measure when a claimed one does not suit the data.
status: active
placement_eligible: false
prerequisites:
- classify-data
- calculate-mean
- calculate-median
- calculate-mode
answer: mcq
