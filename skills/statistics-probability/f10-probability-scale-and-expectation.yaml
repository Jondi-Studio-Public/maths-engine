  params: {tier: exam}
  difficulty: exam
  stages:
  - exam
misconceptions:
- id: uses_wrong_word_mapping
  description: Maps likelihood words to incorrect probability values (e.g., 0.33 for
    'even chance' instead of 0.5).
- id: confuses_probability_with_frequency
  description: Treats probability values as expected frequency counts without multiplying
    by trial count.
- id: wrong_arithmetic_composition
  description: Multiplies incorrectly when combining word-mapped probability with trial
    count, or adds instead of multiplying.
