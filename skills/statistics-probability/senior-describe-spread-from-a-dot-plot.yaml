misconceptions:
- {id: range-for-density, description: 'Calls dots tightly packed because there are many of them, when it is the
    width they cover that decides it.'}
- {id: lone-dot-called-cluster, description: Calls a single dot far from a group a second cluster instead of an
    outlier.}
- {id: gap-ends-miscounted, description: Gives the empty values on either side of the biggest gap as its ends instead
    of the occupied values.}
- {id: small-gap-for-biggest, description: Picks a small gap inside a group as the biggest gap.}
- {id: tallest-in-other-group, description: Gives the tallest column of the wrong group as the most crowded value.}
- {id: outlier-edge-off-by-one, description: Gives a value one step from the edge of the main group as its largest
    or smallest value.}
- {id: gap-by-sum, description: Adds the outlier and the edge of the group instead of finding the distance between
    them.}
- {id: range-without-outlier, description: Finds the range of the main group only and leaves the outlier out.}
difficulty_progression:
  easy: {steps: 2, demand: 'Judge how wide a single group of dots is: a few steps (tightly packed) or most of the
      axis (spread out).'}
  medium: {steps: 3, demand: 'Pick out the pattern: one group, two groups with a gap, or a group with one far dot.'}
  hard: {steps: 4, demand: 'Find the largest gap between occupied values and the tallest column, then match both
      to one statement.'}
  exam: {steps: 5, demand: 'Read the outlier and the edge of the main group, then the gap and the range of all the
      data.'}
