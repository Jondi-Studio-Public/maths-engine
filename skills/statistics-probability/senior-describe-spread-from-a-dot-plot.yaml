id: senior-describe-spread-from-a-dot-plot
name: 'Describe the spread of a dot plot in words: tightly packed, spread out, clusters, gaps and outliers'
domain: statistics-probability
year_level: ['11']
description: A dot plot of whole-number data is described with the informal words of spread. Easy says whether the
  dots are tightly packed or spread out, medium names the pattern (two clusters with a gap between them, one cluster
  with an outlier, spread out or tightly packed), hard picks the statement that places the biggest gap and the most
  crowded value correctly, and the exam chain reads the outlier, the edge of the main group, the size of the gap
  and the range of all the data. A gap is three or more empty values between dots, and a cluster is a group of dots
  with no gap inside it.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: [f6-read-a-dot-plot]
answer: mcq
