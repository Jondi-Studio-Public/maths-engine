misconceptions:
- id: confuses-sample-for-population
  description: Selects the surveyed group itself (the sample) as the target population, rather than the whole group the research question is actually about.
- id: ignores-qualifying-clause
  description: Picks the "obvious" unqualified population, missing a qualifying clause in the research question (e.g. "who intend to vote") that actually narrows the true target population.
- id: matches-the-sampling-frame-not-the-question
  description: Selects the group that was actually reachable via the described sampling frame (e.g. app users), rather than the true target population the research question names.
