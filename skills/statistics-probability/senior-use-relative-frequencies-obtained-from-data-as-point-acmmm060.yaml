misconceptions:
- id: reversed-conditioning
  description: Reports P(A) minus P(A given B) instead of P(A given B) minus P(A).
- id: bare-conditional-probability
  description: Reports P(A given B) alone, never comparing it with the estimate of P(A).
- id: wrong-denominator
  description: Divides by the grand total instead of the relevant column (or row) total when estimating the conditional probability.
