misconceptions:
- id: opposite-extreme
  description: Offers the most extreme non-outlier value on the side OPPOSITE the true outlier (on hard/exam this value sits within 1 unit of, or exactly on, that side's own fence).
- id: near-quartile-value
  description: Offers a value near the SAME quartile as the true outlier (on medium, deliberately placed beyond 1 times IQR but within 1.5 times IQR of that quartile).
- id: inner-filler-value
  description: Offers an ordinary value between the relevant quartile and the extreme end of the data on the non-outlier side.
