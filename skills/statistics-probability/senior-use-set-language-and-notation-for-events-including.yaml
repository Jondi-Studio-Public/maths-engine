misconceptions:
- id: confuses-intersection-with-union
  description: Lists the outcomes in both events when the notation asks for either, or the reverse.
- id: ignores-the-complement
  description: Reads A' or B' as A or B and leaves the prime out of the working.
- id: complements-the-wrong-event
  description: Applies the complement to the wrong event, so A ∩ B' is worked out as A' ∩ B.
- id: combines-the-events-the-other-way-round
  description: Swaps both the complement and the intersection or union.
- id: moves-the-complement-inside-without-swapping
  description: Reads (A ∪ B)' as A' ∪ B' (or (A ∩ B)' as A' ∩ B'), keeping the intersection or union instead of swapping it.
- id: reads-the-complement-as-the-other-event
  description: Takes A' to be the other named event B.
- id: leaves-out-an-outcome
  description: Misses one outcome that belongs in the event.
- id: adds-an-outcome-that-does-not-belong
  description: Includes an outcome that is not in the event.
