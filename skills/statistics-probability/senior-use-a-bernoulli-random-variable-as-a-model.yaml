misconceptions:
- id: uses-failure-probability
  description: Reports 1 - p (or q) instead of p at the easy tier.
- id: adds-instead-of-multiplies
  description: Reports p + (1 - p) = 1 instead of the product p(1 - p) at the medium (variance) tier.
- id: wrong-root-selected
  description: At the hard/exam tiers, reports the algebraically valid but contextually wrong root of p^2 - p + Var(X) = 0.
- id: off-by-one-count
  description: Miscounts the shaded/marked outcomes by one when deriving p from the described scenario.
- id: treats-variance-as-probability
  description: At the hard/exam tiers, reports the stated Var(X) value itself instead of solving for p.
