id: ir2a-compare-groups-evidence
name: Judge the strength of evidence between two groups
domain: statistics-probability
year_level: ['7', '9']
naplan_domain: [statistics]
description: Using a stated rule, find the difference between the medians and the interquartile ranges of two groups and decide whether the evidence of a real difference is strong, weak or cannot be judged for lack of values. The exam chain works from the five-number summaries of two groups.
status: active
placement_eligible: false
