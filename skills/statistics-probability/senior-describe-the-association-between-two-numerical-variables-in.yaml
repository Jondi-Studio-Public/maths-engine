misconceptions:
- id: direction-sign-flip
  description: Reports the opposite direction from the one the stated trend, or r's sign, actually gives.
- id: form-confusion
  description: Reports the opposite form -- calling a curved-residual (non-linear) association linear, or a random-scatter (linear) association non-linear.
- id: strength-band-off-by-one
  description: Reports a strength one band away from the correct one (strong for moderate, or moderate for weak, and the reverse).
- id: r-for-nonlinear-strength
  description: Reads strength off |r| for a non-linear draw instead of the stated closeness-to-curve description, ignoring that r only measures linear strength.
- id: trusts-large-r-on-exam
  description: On the exam tier, trusts a large |r| as evidence of a strong LINEAR association even when the stated residual plot shows a clear curved pattern, missing that r's size does not establish linearity.
