misconceptions:
- id: omits-sqrt-n
  description: Computes the margin as z times s, never dividing by the square root of n.
- id: omits-z
  description: Computes the margin as s divided by the square root of n, forgetting to multiply by z.
- id: one-sided-margin
  description: Reports (center, center + 2*margin), only ever adding the margin and never subtracting it.
