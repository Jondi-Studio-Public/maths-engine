misconceptions:
- id: adjacent-rank-plus-one
  description: Reports the value one rank above the correct one (k+1 instead of k).
- id: adjacent-rank-minus-one
  description: Reports the value one rank below the correct one (k-1 instead of k).
- id: rank-from-top
  description: Reports the value found by counting the rank from the top of the data instead of the bottom (rank n-k+1).
- id: rank-as-value
  description: Reports the numeric rank k itself as though it were the data value.
- id: percentile-as-rank
  description: Treats the stated level P as if it were itself the rank position, rather than converting P to the rank k = P/100 * n, only offered when that differs from k.
- id: cumulative-as-frequency
  description: On the exam tier, misreads the stated CUMULATIVE counts as if they were each value's own individual frequency.
