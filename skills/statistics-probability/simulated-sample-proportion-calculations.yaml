id: simulated-sample-proportion-calculations
name: Calculate with simulated sample proportions and their spread
domain: statistics-probability
year_level:
- '12'
description: Work out sample proportions from simulated counts, the mean and standard deviation of simulated proportions,
  the standard deviation sqrt(p(1-p)/n) of the sample proportion and how it shrinks as the sample size grows, typing each
  number to 3 decimal places.
status: active
placement_eligible: false
prerequisites:
- senior-understand-the-concept-of-the-sample-proportion-widehat
- senior-simulated-samples-variability
answer: number
