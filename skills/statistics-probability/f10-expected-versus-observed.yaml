id: f10-expected-versus-observed
name: Compare expected and observed frequencies
domain: statistics-probability
description: 'Predict how many times an event should happen in a number of trials from its theoretical probability,
  then compare the prediction with the number that happened in an experiment. Easy finds the expected count from
  a die, a spinner or a bag. Medium finds how far the observed count is from the expected count. Hard needs a second
  step to reach the probability: a sector angle, marbles taken out of the bag first, or an overlapping ''or'' on
  a die.'
status: active
placement_eligible: false
