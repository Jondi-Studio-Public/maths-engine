misconceptions:
- id: adds-instead-of-subtracting
  description: Adding two results where their difference is asked.
- id: and-instead-of-or
  description: Counting only the trials where both events happen for an event described with "or".
- id: compares-with-the-rest-not-the-whole
  description: Dividing the favourable outcomes by the other outcomes instead of by all the outcomes.
- id: counts-only-one-named-category
  description: Using the count of only one of the two categories named in an event.
- id: divides-by-the-complement
  description: Dividing the target count by the probability of the opposite event instead of the probability of
    the event.
- id: expected-complement-count
  description: Finding the expected count for everything except the category asked about.
- id: expected-count-multiplies-by-favourable-only
  description: Multiplying the number of trials by the number of favourable outcomes without dividing by the number
    of possible outcomes.
- id: expected-count-uses-one-outcome
  description: Dividing the number of trials by the number of possible outcomes, as though only one outcome were
    favourable.
- id: gave-complement-for-event
  description: Giving the probability of the opposite event (or the complementary proportion) for the one asked.
- id: ignores-the-removed-marbles
  description: Using the original numbers in the bag when some marbles had been taken out before the draw.
- id: multiplies-instead-of-dividing
  description: Multiplying by the number in front of the unknown instead of dividing by it.
- id: overlap-counted-twice-in-or
  description: Adding the totals for the two events without taking off the overlap, so the trials where both happen
    are counted twice.
- id: removes-from-the-red-but-not-the-total
  description: Taking removed marbles off the count of one colour but forgetting that the total number of marbles
    drops as well.
- id: reports-expected-not-difference
  description: Giving the expected count where the difference between observed and expected was asked for.
- id: reports-observed-not-difference
  description: Giving the observed count where the difference between observed and expected was asked for.
- id: reports-observed-not-expected
  description: Giving the number that happened in the experiment where the number theory predicts was asked for.
- id: reports-the-target-not-the-trials
  description: Giving the number of times wanted where the number of trials needed to expect it was asked for.
- id: uses-a-half-turn-as-the-whole-circle
  description: Dividing a sector angle by 180 degrees instead of 360 degrees to find its share of the circle.
- id: uses-observed-as-theoretical-probability
  description: Using what happened in the experiment as the theoretical probability of the event.
