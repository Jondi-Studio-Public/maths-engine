id: construct-a-time-series-plot
name: Construct a time series plot
domain: statistics-probability
year_level: ['12']
description: 'Plot every value of a time series against time and join the points in time order. Easy: six values. Medium: two cycles of a seasonal pattern. Hard: a starting value and the change from each value to the next. The exam chain plots twelve values, then finds the length of the cycle, the change of level from one cycle to the next and a forecast. Distinct from time-series-features, which reads a drawn plot.'
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: [f10-line-graph-change-over-time]
answer: polyline
