misconceptions:
- id: fl-slope-sign
  description: Gives the gradient of a falling line as a positive number, or of a rising line as a negative number.
- id: fl-slope-as-intercept
  description: Gives the value where the line meets the vertical axis in place of the gradient.
- id: fl-slope-run-over-rise
  description: Divides the run by the rise instead of the rise by the run when finding the gradient.
- id: fl-slope-whole-rise
  description: Gives the rise over the whole drawn line, or a doubled rise, instead of the rise for each unit across.
- id: fl-predict-nearest-point
  description: Reads the value of the plotted data point instead of the value the line predicts.
- id: fl-predict-forgets-intercept
  description: Multiplies the gradient by the value across but leaves out where the line meets the vertical axis.
- id: fl-predict-slope-one
  description: Adds the value across to the intercept as if the gradient were 1.
