misconceptions:
- id: reports-complement
  description: Reports the probability of X falling OUTSIDE [p, q] (1 minus the true answer) instead of within it.
- id: sign-swap
  description: Integrates in the wrong direction, reporting the negative of the true probability.
- id: forgets-normalisation-shift
  description: Uses the wrong power or the wrong normalising base for the density's algebraic shape (e.g. applies a lower-tier density's formula to a higher-tier one).
