misconceptions:
- id: assumes-uniform-distribution
  description: Treats all outcomes as equally likely, computing 1/k instead of using the stated probabilities.
- id: forgets-complement-step
  description: Computes the sum of other probabilities correctly but forgets to take the complement to find the missing probability.
- id: ignores-probabilities-for-expectation
  description: Computes arithmetic mean of outcomes instead of weighted mean, ignoring probability weights.
- id: uses-mode-instead-of-mean
  description: Reports the most likely outcome (mode) as the expected value instead of computing the weighted average.
- id: off-by-one-error
  description: Makes an arithmetic error of exactly 1 in the final numerator, possibly from miscounting or mis-summing.
