id: f10-relative-frequency-estimate
name: Estimate a probability from relative frequency
domain: statistics-probability
description: Estimate a probability from a table of trial results by dividing the number of times an event happened
  by the total number of trials. Easy estimates the probability of one category. Medium estimates an event made
  of two categories, or the event that a category does not occur. Hard gives the relative frequencies as percentages
  with one category unrecorded, so the missing share has to come from the percentages summing to 100%.
status: active
placement_eligible: false
prerequisites:
- simple-event-probability
- probability-representations
answer: fraction
