misconceptions:
- id: hs-modal-upper-edge
  description: Gives the upper boundary of a class where its lower boundary was asked for.
- id: hs-modal-frequency-for-boundary
  description: Gives the height of the tallest bar where the boundary of its class was asked for.
- id: hs-modal-boundary-for-frequency
  description: Gives a class boundary where the height of the tallest bar was asked for.
- id: hs-modal-neighbour-class
  description: Reads the class or bar beside the one asked about.
- id: hs-modal-midpoint
  description: Gives the midpoint of the class where its lower boundary was asked for.
- id: hs-gridline-slip
  description: Reads a height or count one gridline or one value away from the correct one.
- id: hs-class-number-for-frequency
  description: Counts the classes or their position along the axis instead of reading the frequencies.
- id: hs-range-whole-axis
  description: Uses the whole length of the horizontal axis as the range, including empty classes at the ends.
