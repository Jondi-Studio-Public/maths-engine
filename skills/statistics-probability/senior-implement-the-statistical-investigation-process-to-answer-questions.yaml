misconceptions:
- id: wrong-order
  description: Computes Group 2's statistic minus Group 1's statistic instead of Group 1 minus Group 2.
- id: reports-one-groups-statistic
  description: Reports a single group's own mean or median instead of the difference between the two groups.
- id: forgets-to-divide-by-count
  description: Reports the difference between the two groups' totals instead of dividing each total by its own group size first.
- id: uses-the-wrong-measure
  description: Computes the mean when the median was asked for, or the median when the mean was asked for.
