id: f10-collect-sort-compare-categorical-data
name: Collect, sort and compare object data
domain: statistics-probability
year_level: [F, '1']
naplan_domain: [statistics]
description: Given data supplied as text (a jumbled list of objects, tally marks, a described survey or a list of whole-number readings), sort it into categories, count each category and complete the blank cells of a frequency table, including a comparison of category counts, a total and a derived row on the harder tiers. The data and the question are always given; the learner does not pose a question or draw a graph.
status: active
placement_eligible: false
prerequisites:
- compare-quantities-to-10
answer: table
sources:
- topic: f10_collect_sort_categorical
  params: {tier: easy}
  difficulty: easy
  stages: [0, 1, 2]
