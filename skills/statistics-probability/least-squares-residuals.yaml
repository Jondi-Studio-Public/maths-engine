id: least-squares-residuals
name: Calculate residuals from a least-squares line
domain: statistics-probability
description: Find the predicted value and the residual (observed minus predicted) for data and a given least-squares
  line, find the residual of greatest size, and use the fact that the residuals of a least-squares line sum to zero.
status: active
placement_eligible: false
