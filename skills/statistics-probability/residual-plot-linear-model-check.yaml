id: residual-plot-linear-model-check
name: Use residuals to judge whether a linear model is appropriate
domain: statistics-probability
description: 'Decide from a residual plot or a list of residuals whether fitting a linear model is appropriate:
  random scatter supports it, a curved or fanning pattern does not, whatever the value of r squared.'
status: active
