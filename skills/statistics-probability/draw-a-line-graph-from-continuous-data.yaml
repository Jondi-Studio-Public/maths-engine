id: draw-a-line-graph-from-continuous-data
name: Draw a line graph of a quantity that changes continuously
domain: statistics-probability
year_level: ['11']
description: 'Draw a line graph on a blank grid by plotting and joining the points. Easy and medium: readings at equal time steps, plotted and joined in order. Hard: no readings are listed; a rate for each stage of a tank (filling, draining, held steady) gives the points where the graph changes direction. The exam chain draws the tank graph, reads a volume, finds when a volume was reached and totals the litres that left. Distinct from f10-line-graph-change-over-time, which reads a drawn line graph.'
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: [f10-line-graph-change-over-time]
answer: polyline
sources:
- topic: dr1_line_graph
  params:
    tier: easy
  difficulty: easy
