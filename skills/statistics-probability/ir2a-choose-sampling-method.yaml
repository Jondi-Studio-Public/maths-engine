id: ir2a-choose-sampling-method
name: Choose and apply a sampling method
domain: statistics-probability
year_level: ['6', '8', '9']
naplan_domain: [statistics]
description: 'Given a described survey, name the sampling method (census, simple random, systematic, stratified or convenience) from five options, then work out a typed number that follows from it: the interval between systematic picks, the nth or last member chosen, or the number drawn from each stratum. The exam chain follows one survey through the method, the interval or strata counts and a chance of selection.'
status: active
placement_eligible: false
