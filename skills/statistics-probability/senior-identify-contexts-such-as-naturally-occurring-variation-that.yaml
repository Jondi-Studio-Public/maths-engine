misconceptions:
- id: confuses-discrete-count-with-normal
  description: Treats a discrete count over an open-ended time window (e.g. the number of emails received in an hour) as normal because "it varies a lot," missing that it is Poisson-like and cannot take negative or fractional values.
- id: confuses-skewed-nonnegative-with-normal
  description: Treats a strictly non-negative, right-skewed quantity (e.g. time until a lightbulb fails, household income) as normal because it "has an average," missing that such quantities cannot be symmetric about their mean.
- id: pattern-matches-continuous-sounding-wording-on-a-uniform-quantity
  description: Selects a near-miss context that sounds like a continuous measurement (e.g. waiting time for a bus arriving on a fixed schedule) as normal, missing that it is uniformly distributed over a bounded interval, not normal.
