id: senior-identify-contexts-such-as-naturally-occurring-variation-that
name: Identify contexts such as naturally occurring variation that are suitable for modelling by normal random variables
domain: statistics-probability
description: 'Given several short described measured-quantity contexts, choose which ONE is best modelled by a normal random variable -- a naturally occurring, continuous physical measurement subject to many small independent influences, roughly symmetric about its mean. Every other offered context is genuinely not normal, drawn from at least two of three distinct wrong-context classes on every draw: discrete-count/Poisson-like (e.g. the number of emails an office receives in an hour), strictly non-negative/skewed (e.g. the time until a lightbulb fails), or bounded/clustered-at-a-boundary (e.g. the number of heads in 3 coin tosses). This is NOT the neighbouring senior-examine-the-approximate-normality-of-the-distribution-of (ACMMM175), which diagnoses the normality of an ACTUAL sampling distribution of p-hat given a stated n and x -- a computed check on numbers already given, never a real-world-context judgement; and it is NOT senior-understand-the-concept-of-a-random-sample (ACMMM171), which judges selection-method validity, never a quantity''s distributional shape. Four tiers: easy offers 3 contexts (one obviously normal, one discrete-count, one skewed); medium offers 4 (a less-familiar normal context alongside discrete-count, skewed, and bounded wrong options); hard offers 4-5, sometimes including a near-miss continuous-but-uniform context (e.g. waiting time for a bus on a fixed schedule) that looks measurement-like but is not normal; exam wraps every option in an extra, orthogonal data-collection clause the learner must read past to see what is actually being measured, a genuine new prompt shape over hard.'
