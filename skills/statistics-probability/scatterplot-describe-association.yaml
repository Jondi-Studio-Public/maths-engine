id: scatterplot-describe-association
name: Describe the association shown by a drawn scatterplot
domain: statistics-probability
description: 'Describe a drawn scatterplot of twelve points in words. Easy: direction then strength, as an ordered list (''positive, strong''). Medium: direction, form (linear or non-linear, with curves accelerating or levelling off) and strength. Hard: one point P is labelled; give the direction and the strength with every point included, then whether the association would be stronger or weaker without P. Every drawn set keeps its strength measure well clear of the 0.5 and 0.75 band edges. The exam chain states r and asks the description, the percentage of variation explained (carried forward to the percentage not explained) and the conclusion the data justify. Distinct from senior-describe-the-association-between-two-numerical-variables-in, which describes a stated set of summary statistics rather than a drawn plot.'
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: [senior-describe-the-association-between-two-numerical-variables-in]
answer: ordered_list
