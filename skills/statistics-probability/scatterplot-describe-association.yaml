misconceptions:
- id: sc-direction-reversed
  description: Reads the direction of an association the wrong way round, calling a rising pattern negative or a falling one positive.
- id: sc-strength-one-band-off
  description: Judges the strength of an association one step too strong or too weak for how closely the points follow the pattern.
- id: sc-fields-swapped
  description: Gives the description words in the wrong order for the fields asked for.
- id: sc-form-misjudged
  description: Calls a curved pattern linear, or a straight-line pattern non-linear.
- id: sc-outlier-effect-reversed
  description: Says removing an outlier would weaken the association when it would strengthen it, or the other way round.
- id: sc-strength-without-outlier
  description: Describes the strength the data would have without the outlier instead of with it.
- id: sc-negative-as-weak
  description: Treats a negative correlation as a weak one, mixing up direction with strength.
- id: sc-r-not-squared
  description: Gives the correlation coefficient as a percentage instead of squaring it for the coefficient of determination.
