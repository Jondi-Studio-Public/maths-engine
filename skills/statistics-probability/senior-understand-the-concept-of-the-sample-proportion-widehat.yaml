misconceptions:
- id: omits-n
  description: Reports the standard deviation as the square root of p(1-p) alone, without dividing by n first.
- id: omits-sqrt
  description: Reports p(1-p)/n directly as if it were the standard deviation, never taking the square root (reports the variance instead).
- id: mean-as-variance
  description: Reports the mean of p-hat as p(1-p) (the variance formula) instead of p itself.
- id: swaps-mean-and-sd
  description: Reports the pair as (standard deviation, mean) instead of (mean, standard deviation).
