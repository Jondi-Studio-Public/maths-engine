id: senior-identify-possible-non-causal-explanations-for-an-association
name: Identify possible non-causal explanations for an association, including coincidence and confounding due to a common response to another variable, and communicate these explanations in a systematic and concise manner
domain: statistics-probability
description: 'Given a description of an observed association between two variables together with a plausible confounding or coincidental circumstance, classify the most plausible non-causal explanation as coincidence, confounding due to a common response to another variable, or a common cause. The "communicate these explanations in a systematic and concise manner" clause of the descriptor is not assessed (an open explanatory deliverable with no stated content to write). Because these labels overlap in common textbook usage unless defined, every question states the three definitions ONCE, after the scenario, and offers the three short labels (Coincidence, Common cause, Confounding) as its fixed multiple-choice options -- the scenario itself never states a category''s own definitional wording, only plain facts: every scenario opens by stating the observed association between the two variables, then states either that no known factor links them (coincidence), that a third variable drives increases in both (common cause), or that a third variable moves alongside the explanatory variable and is also known to affect the response directly (confounding). Four tiers: the mechanism stated plainly; the mechanism given as separate context facts the learner must connect; an added irrelevant (but plausible, study-meta) named variable that plays no role; and an exam tier where the live decision is whether the explanatory variable could plausibly have a direct effect on the response, separating common cause from confounding. Distinct from senior-distinguish-between-causality-and-correlation-through-examples (ACMEM147), whose own kernel is a binary study-design classification (random assignment supports causation; an observational study with a named confounder supports only correlation), not a three-way classification of WHICH non-causal mechanism explains a given association.'
status: active
