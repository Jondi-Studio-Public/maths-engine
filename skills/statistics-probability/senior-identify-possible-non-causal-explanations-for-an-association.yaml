misconceptions:
- id: assumes-coincidence-by-default
  description: Selects coincidence whenever no manipulation is mentioned, without checking the scenario for a stated third-variable mechanism.
- id: confuses-common-cause-with-confounding
  description: Selects common cause when the scenario in fact states that the explanatory variable could plausibly affect the response directly (confounding), or vice versa.
- id: ignores-irrelevant-named-variable
  description: On the hard tier, selects the explanation associated with a variable that was named but plays no role in the association.
- id: misreads-common-response-as-common-cause
  description: Reads "confounding due to a common response to another variable" as identical to common cause, missing that confounding requires the explanatory variable to still plausibly affect the response.
