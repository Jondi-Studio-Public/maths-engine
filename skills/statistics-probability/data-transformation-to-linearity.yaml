id: data-transformation-to-linearity
name: Transform data to linearity and predict
domain: statistics-probability
year_level:
- '12'
description: Straighten a curved scatterplot by squaring x, taking log x or taking 1 over x, chosen from the shape of the
  curve, and predict from the straight line. Easy picks the matching fitted line from three and predicts. Medium builds the
  line from two points. Hard recognises the transformation from a table and predicts y or finds x. The exam chain finds the
  gradient, intercept, a prediction and an inverse prediction.
status: active
placement_eligible: false
