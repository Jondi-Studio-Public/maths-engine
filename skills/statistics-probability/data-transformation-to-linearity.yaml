misconceptions:
- id: r4g-wrong-transformation-chosen
  description: Choosing a transformation that does not match the shape of the curve (for example 1 over x for a curve that
    rises ever more steeply).
- id: r4g-transformed-variable-not-computed
  description: Putting x into the equation where the transformed value (x squared, log x or 1 over x) belongs.
- id: r4g-intercept-times-slope
  description: Multiplying the intercept by the slope instead of adding the slope term to the intercept.
- id: r4g-straight-line-through-raw-points
  description: Joining the original points with a straight line instead of transforming x first.
- id: r4g-transformed-value-given-as-x
  description: Giving the value of the transformed variable as the value of x.
- id: r4g-rise-without-the-run
  description: Giving the rise in y as the gradient without dividing by the change in the transformed variable.
- id: r4g-run-for-gradient
  description: Giving the change in the transformed variable as the gradient.
- id: r4g-first-y-as-intercept
  description: Giving the first y value as the intercept, without taking away the gradient times the transformed x.
- id: r4g-intercept-sign-slip
  description: Adding the gradient times the transformed value to y instead of subtracting it when finding the intercept.
- id: r4g-gradient-on-raw-x
  description: Finding the gradient from the change in x instead of the change in the transformed variable.
- id: r4g-gradient-given-as-intercept
  description: Giving the gradient as the intercept of the line.
- id: r4g-undoing-the-transformation-slip
  description: Undoing the transformation incorrectly, for example reading off a power of ten that is one out.
- id: r4g-gradient-inverted
  description: Dividing the change in the transformed variable by the change in y, so the gradient is upside down.
