id: f10-compound-event-frequencies
name: Estimate compound event probabilities from trial data
domain: statistics-probability
description: Estimate the probability of a compound event, such as both events, at least one of them, neither or
  exactly one, from the counts recorded in a two-way table of trial results. Easy finds the probability that both
  events happen. Medium finds the probability that at least one happens, without counting the overlap twice. Hard
  works from the totals for each event and for both, to find neither, exactly one, or one without the other.
status: active
placement_eligible: false
prerequisites:
- f10-relative-frequency-estimate
- f10-probability-complements-compounds
answer: fraction
