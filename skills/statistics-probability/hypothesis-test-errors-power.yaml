id: hypothesis-test-errors-power
name: "Find the critical region, Type I and Type II error probabilities and power of a z-test for a mean"
domain: statistics-probability
description: "For a z-test of a population mean with known standard deviation, find the critical value of the sample mean from the significance level and the stated critical z value, the probability of a Type I error from a stated critical value, the probability of a Type II error and the power at a stated true mean (one-sided and two-sided), the effect of a larger sample, and the smallest sample size that gives a stated power. The exam chain finds the critical value, beta, the power and the power with a quadrupled sample."
status: active
placement_eligible: false
prerequisites: [senior-calculate-probabilities-and-quantiles-associated-with-a-given]
answer: number
sources:
- topic: r3f_test_errors_power
  params: {tier: easy}
  difficulty: easy
  stages: [0, 1, 2]
