misconceptions:
- id: reversed-difference
  description: Subtracts the slope term instead of adding it (or vice versa) when evaluating the trend equation.
- id: off-by-one-period
  description: Evaluates the trend at a period one before or after the one stated.
- id: swaps-intercept-and-slope
  description: Swaps the roles of the intercept and the slope when substituting into the trend equation.
