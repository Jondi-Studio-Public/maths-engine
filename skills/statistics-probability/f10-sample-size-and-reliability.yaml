misconceptions:
- id: adds-the-distances
  description: Adding two distances from the theoretical probability where their difference was asked for.
- id: averages-percentages-ignoring-trial-numbers
  description: Averaging the percentages from several experiments as if each had the same number of trials, instead
    of combining the successes and the trials.
- id: compares-the-two-estimates-not-the-distance-to-p
  description: Finding how far apart the two estimates are instead of how far each is from the theoretical probability.
- id: pools-when-asked-for-one-result
  description: Combining all the results into one estimate when the question asked which single result to rely on.
- id: projects-the-complement
  description: Projecting the relative frequency of the opposite event onto future trials instead of the event asked
    about.
- id: reports-one-distance-only
  description: Giving the distance from the theoretical probability for only one of the two estimates.
- id: reports-raw-count-not-projection
  description: Giving the number observed in the original trials when asked to predict the number in a different
    number of future trials.
- id: reports-the-estimate-not-the-gap
  description: Giving the estimate itself where its distance from the theoretical probability was asked for.
- id: reports-the-theoretical-value-not-the-gap
  description: Giving the theoretical percentage where the gap between it and the estimate was asked for.
- id: reports-the-trials-not-the-successes
  description: Giving the number of trials where the number of successes was asked for.
- id: trusts-a-small-experiment
  description: Using the result of a small experiment as the best estimate, when a larger experiment gives a more
    reliable one.
- id: uses-one-experiment-only
  description: Giving the result of one experiment where the results of the experiments had to be combined.
- id: uses-theoretical-not-the-estimate
  description: Using the theoretical probability to make a prediction where the experimental estimate was asked
    for.
- id: wrong-denominator-for-proportion
  description: 'Dividing by the wrong total: the grand total or a column total when the proportion is of a row,
    a total one out, or anything other than the number of trials.'
