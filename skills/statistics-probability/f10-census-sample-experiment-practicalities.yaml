id: f10-census-sample-experiment-practicalities
name: Judge census, sample, experiment and observation
domain: statistics-probability
year_level: ['8']
naplan_domain: [statistics]
description: 'For a described study (a school surveyed in full, batteries run until they go flat, a recipe tried on volunteers, birds counted at a feeder), type the letters of the true statements from a pool of lettered statements about the four ways of collecting data. The statements cover what each method collects and changes, what it can and cannot show (only an experiment can test a cause), how practical it is (cost, time, a test that uses the unit up, population size, with figures to work out on the harder tiers) and what the result implies (volunteers against a random pick, a sample against a census). Every statement is true or false by construction from the facts and figures given. Written explanation of a choice is NOT asked here and stays a rubric (R) task.'
status: active
placement_eligible: false
prerequisites:
- choose-sampling-method
answer: set
sources:
- topic: ds_census_sample_statements
  params: {tier: easy}
  difficulty: easy
  stages: [0, 1, 2]
- topic: ds_census_sample_statements
  params: {tier: medium}
