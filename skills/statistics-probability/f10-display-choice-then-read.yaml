id: f10-display-choice-then-read
name: Choose a display, then work out how it is built
domain: statistics-probability
year_level: ['9']
naplan_domain: [statistics]
description: 'A described data set and a purpose decide the display, and the answer is a number that only the right display gives: how many sectors, columns, points or stems it needs, the angle of a sector, the top of its axis. The display is never named. Easy counts the marks for shares of a whole, change over time, two groups across categories or two measured variables. Medium takes one construction step on the display the purpose points to (the angle of the largest sector, the columns of a histogram with a given class width, the top of a counting axis, the segments of a line graph). Hard disguises or chains: shirt numbers that are labels against measurements with the same range, a missing share found before its angle, the highest balance found from monthly changes before the axis is sized, and a shared stem column for two groups with gaps. Writing out why the display suits the data stays rubric work and is not asked here.'
status: active
placement_eligible: false
prerequisites:
- classify-data
- f10-data-display-selection
answer: number
