id: ir2a-question-to-data-needed
name: Match a question to the data needed
domain: statistics-probability
year_level: ['3', '4', '5', '6', '7']
naplan_domain: [statistics]
description: For a stated investigation question, put the variables to record in order, say whether a variable is categorical or numerical, choose the plan that collects the right data, and work out the sample size or the number of values to record. The exam chain follows one question through variables, type, plan and counts.
