misconceptions:
- id: swaps-condition-and-target
  description: Takes the event that is named first, or the one with the bigger count, as the target regardless of the marker word, so condition and target are swapped.
- id: reads-conditional-as-both-events
  description: Reads "given", "of" or "if ... then" as a joint statement about both events happening together.
- id: negates-the-condition
  description: Reads the condition as its opposite, describing the target given that the condition does not happen.
- id: negates-the-target
  description: Describes the opposite of the target given the condition.
