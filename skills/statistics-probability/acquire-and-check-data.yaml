id: acquire-and-check-data
name: Choose what to collect and check the data
domain: statistics-probability
year_level: ['4', '5']
naplan_domain: [statistics]
description: 'Decide what to record to answer a question, choose the survey question that collects it, and spot the one recorded entry that cannot be right. Nothing is drawn.'
status: active
