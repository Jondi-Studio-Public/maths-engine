id: investigation-step-order
name: Order the steps of a statistical investigation
domain: statistics-probability
year_level: ['3', '5', '8']
naplan_domain: [statistics]
description: Put described actions of an investigation in order (pose the question, collect, organise, display, analyse, conclude) and name the stage a described action belongs to. The exam chain adds a mean and a difference worked from the collected data.
status: active
placement_eligible: false
prerequisites:
- calculate-median
answer: ordered_list
sources:
- topic: ir2a_investigation_step_order
  params:
    tier: easy
  difficulty: easy
  stages:
  - 0
  - 1
  - 2
- topic: ir2a_investigation_step_order
  params:
    tier: medium
  difficulty: medium
  stages:
  - 3
  - 4
- topic: ir2a_investigation_step_order
  params:
    tier: hard
  difficulty: hard
  stages:
