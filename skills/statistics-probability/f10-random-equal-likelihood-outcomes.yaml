misconceptions:
- id: counts-labels-not-sectors
  description: Counts the number of distinct labels rather than comparing sector counts, so a spinner with 3 labels and unequal sectors is marked as equally likely.
- id: eyeballs-visual-balance
  description: Judges balance by approximate visual balance rather than counting exact sector sizes or item counts.
- id: ignores-minority-imbalance
  description: Notices only the majority outcome's count and ignores whether all outcomes have the same count.
