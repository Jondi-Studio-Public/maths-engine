id: f10-random-equal-likelihood-outcomes
name: Classify equally and unequally likely outcomes
domain: statistics-probability
year_level: ['5']
naplan_domain: [probability]
description: >-
  Given a chance-generating device or collection described with an explicit quantitative
  structure (for example, the size of each sector of a spinner, or the count of each
  labelled item in a collection) together with its full list of distinct possible outcomes,
  classify whether those outcomes are equally likely (every distinct outcome corresponds
  to the same total share of the structure) or not equally likely (at least one distinct
  outcome corresponds to a different share).
status: active
placement_eligible: false
prerequisites:
- f10-chance-language-and-outcomes
answer: mcq
sources:
