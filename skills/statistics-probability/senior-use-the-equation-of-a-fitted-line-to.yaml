misconceptions:
- id: forgets-intercept
  description: Computes m*x without adding the constant c.
- id: swaps-slope-intercept
  description: Swaps the roles of slope and intercept, computing c*x + m instead of m*x + c.
- id: adds-instead-of-multiplies
  description: Adds the slope to x instead of multiplying, computing m + x + c instead of m*x + c.
- id: off-by-one-input
  description: Uses x+1 instead of x in the substitution, computing m*(x+1) + c.
- id: forgets-to-subtract-intercept
  description: Solves by dividing y by m without first subtracting c.
- id: swaps-operation-order
  description: Solves by computing (y - m) / c instead of (y - c) / m.
- id: sign-error
  description: Solves by adding c instead of subtracting, computing (y + c) / m.
