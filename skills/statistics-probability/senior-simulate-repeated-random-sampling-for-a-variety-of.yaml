misconceptions:
- id: se-uses-p
  description: Computes the standard error using p instead of p-hat's own value, sqrt(p(1-p)/n) instead of sqrt(p-hat(1-p-hat)/n).
- id: omits-n
  description: Divides by p-hat(1-p-hat) alone, never by n, inside the square root.
- id: omits-sqrt
  description: Divides by p-hat(1-p-hat)/n directly, never taking the square root.
- id: reversed-difference
  description: Computes (p - p-hat)/SE instead of (p-hat - p)/SE, flipping the sign.
- id: other-sample
  description: On the hard tier, reports the other named sample's standardised value instead of the one further from 0.
- id: count-not-proportion
  description: On the medium/exam tiers, uses the raw count x in place of p-hat in the numerator, never dividing by n first.
