id: senior-simulate-repeated-random-sampling-for-a-variety-of
name: Simulate repeated random sampling and standardise the sample proportion
domain: statistics-probability
description: 'The generator runs a REAL, seeded simulation of k = 5 to 8 independent samples of n
  Bernoulli(p) trials for a stated true proportion p and sample size n; the learner reads off the
  reported sample proportion p-hat for a stated one of the samples and computes the standardised
  value z = (p-hat - p) / sqrt(p-hat(1 - p-hat)/n), using p-hat''s own standard error (always
  stated in the prompt as a convention, never assumed memorised). Four tiers: easy prints p-hat
  directly per sample; medium prints the number of successes x per sample instead, requiring
  p-hat = x/n first; hard names two samples on opposite sides of p and asks which has the
  standardised value further from 0, construct-to-target so a larger raw distance from p does not
  always mean a larger standardised value; exam never prints p as a number, giving instead a
  stated chance model (a spinner, a fair die, a well-shuffled deck) the learner must turn into an
  exact fraction p first. This is NOT the neighbouring senior-use-the-approximate-confidence-interval-left-widehat-p
  (ACMMM178, computes interval bounds from p-hat and n, no true p) or
  senior-examine-the-approximate-normality-of-the-distribution-of (ACMMM175, classifies n*p-hat >=
  10, never standardises): this is the only sibling that states a true p AND standardises a
  printed simulated sample statistic.'
status: active
placement_eligible: false
