misconceptions:
- id: omits-sqrt-n
  description: Divides the deviation by s alone, never taking the square root of n.
- id: divides-by-n
  description: Divides s by n instead of by the square root of n.
- id: variance-as-sd
  description: Uses the sample variance directly as if it were the sample standard deviation s.
- id: reversed-difference
  description: Computes (mu - x-bar) instead of (x-bar - mu), flipping the sign.
- id: other-sample
  description: Reports the other stated sample's standardised value instead of the one that is actually further from 0.
- id: population-divisor
  description: Computes the sample standard deviation with an n divisor instead of n - 1.
