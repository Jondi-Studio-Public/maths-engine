id: senior-simulate-repeated-random-sampling-from-a-variety-of-acmsm139
name: Standardise a sample mean using the sample's own s (large samples)
domain: statistics-probability
year_level: ['12']
description: 'Read the output of a seeded, reproducible simulation of repeated random sampling of size n (n >= 30 always) from a stated distribution with mean mu, and compute the standardised value of a stated sample''s mean, z = (x-bar - mu) / (s / sqrt(n)), using THAT SAMPLE''s OWN sample standard deviation s (n - 1 divisor), to 2 decimal places. Never states or names a population sigma at any tier -- sigma is unknown and s is always estimated fresh from each sample''s own data. Four tiers: each sample''s own printed mean and s; each sample''s own printed mean and sample VARIANCE, so the learner must root it first (recognise variance vs standard deviation); two stated samples of the SAME size, asking which has the standardised value further from 0 (each sample''s own s can trap a learner who compares raw deviations instead of standardising); and an exam chain: the estimated standard error s / sqrt(n), then the standardised value z, then the two-tailed normal probability of a sample mean at least that far from mu (distinct from `standard-deviation-from-data`, which asks for s itself as the final answer -- here s is only an intermediate and the graded answer is the standardised sample mean). This is the s-estimated sibling of `senior-simulate-repeated-random-sampling-from-a-variety-of`, which states a KNOWN population sigma directly (or derives it from a stated distribution''s own parameters) and never estimates s from sample data.'
status: active
placement_eligible: false
