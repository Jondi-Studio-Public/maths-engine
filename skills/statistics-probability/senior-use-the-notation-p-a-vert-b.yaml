misconceptions:
- id: reports-joint-not-conditional
  description: Reports P(A ∩ B) instead of P(A|B), confusing the joint probability with the conditional.
- id: reports-marginal-of-conditioning-event
  description: Reports P(B) instead of P(A|B), treating the conditioning event as the answer.
- id: conditions-on-complement
  description: Divides by the count not in B instead of the count in B, using the complement of the conditioning event.
