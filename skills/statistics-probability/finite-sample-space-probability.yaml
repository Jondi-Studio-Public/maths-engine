misconceptions:
- id: event-count
  description: Reports the count of favourable outcomes as a bare integer instead of a probability fraction.
- id: inverted-ratio
  description: Divides total outcomes by favourable outcomes instead of favourable by total.
- id: complement
  description: Calculates the probability of the complement (1 minus the event probability).
- id: favourable-over-other
  description: Divides favourable outcomes by unfavourable outcomes instead of total outcomes.
