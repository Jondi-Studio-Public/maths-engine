id: build-sample-space
name: Build the sample space of a two-stage experiment
domain: statistics-probability
description: List the ordered-pair outcomes of a two-stage experiment, the outcomes that satisfy a stated property, and the
  outcomes of compound events, then find the probability of an event and of its complement.
status: active
placement_eligible: false
prerequisites:
- simple-event-probability
answer: set
