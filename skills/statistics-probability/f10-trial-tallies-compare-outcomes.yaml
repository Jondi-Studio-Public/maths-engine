id: f10-trial-tallies-compare-outcomes
name: Read tallies from repeated chance trials
domain: statistics-probability
year_level: ['3', '4', '5']
naplan_domain: [probability]
description: >-
  Read the tallies from repeated chance trials with whole-number answers and no fractions. Easy reads one tally,
  the gap between two tallies, or the count for the most common outcome. Medium compares an outcome's tally with
  the count equal likelihood would give for a spinner with equal sections. Hard works with a tally after the first
  trials and again after more, to find the extra trials on their own, the gap between two outcomes in them, or the
  most common outcome against equal likelihood. Coin, die, card and tile experiments add the trials that were not one outcome, the pooled count of two groups, and the gap or the rest across both groups.
status: active
placement_eligible: false
prerequisites:
- f10-chance-language-and-outcomes
answer: number
