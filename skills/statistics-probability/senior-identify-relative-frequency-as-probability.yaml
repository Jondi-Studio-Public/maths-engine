id: senior-identify-relative-frequency-as-probability
name: Identify relative frequency as probability
domain: statistics-probability
description: Given a stated count of times an outcome occurred in a stated number of trials, compute its relative frequency as an estimate of its probability. Always exactly ONE stated count out of exactly ONE stated total number of trials -- never a frequency table with several categories to distinguish (that is the shipping senior-use-relative-frequencies-obtained-from-data-as-point / ...-as-point-acmmm060 / ...-to-obtain skills' own stimulus shape, each strictly more complex). Graded as a decimal to a stated precision that the prompt itself states; the exam tier escalates the FORMAT convention (a percentage) rather than the table complexity, which never changes.
status: active
placement_eligible: false
prerequisites:
- simple-event-probability
- expected-frequency
answer: number
