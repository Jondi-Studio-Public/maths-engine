misconceptions:
- id: off-by-one-count
  description: Uses one fewer than the recorded count, (count-1)/trials, instead of count/trials.
- id: wrong-denominator
  description: Divides the count by the complementary (non-occurring) count instead of by the total number of trials.
- id: swaps-success-and-failure
  description: Reports the complementary relative frequency (the non-occurring outcome's rate) instead of the stated outcome's own rate.
