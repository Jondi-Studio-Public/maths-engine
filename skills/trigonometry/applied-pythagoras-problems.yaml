id: applied-pythagoras-problems
name: Apply Pythagoras' theorem to real-world problems
domain: trigonometry
description: Solve Pythagoras word problems drawn from four real scenarios -- a ladder leaning against a wall, a walking displacement inferred from directional language ("north"/"east"), the altitude of an equilateral triangle, and the space diagonal of a rectangular solid -- by first extracting or deriving the right triangle from the context, not by recognising a triangle already labelled with legs and a hypotenuse.
status: active
placement_eligible: false
prerequisites:
- pythagorean-hypotenuse
- pythagorean-leg
answer: number
