misconceptions:
- id: double-amplitude
  description: Reports the full peak-to-trough range (2*|A|) as the amplitude instead of |A| itself.
- id: half-period
  description: Reports the x-coefficient's own denominator k directly as the period, forgetting to double it (period = 2*pi/|B|, not pi/|B|).
- id: period-off-by-one
  description: Reports a period one unit away from the correct value, an arithmetic slip.
- id: swapped-amplitude-period
  description: Reports the period's value as the amplitude and the amplitude's value as the period.
- id: includes-vertical-shift
  description: Adds the vertical shift D onto the amplitude, treating it as if it changed the peak height.
- id: drops-absolute-value
  description: Reports the signed coefficient A directly as the amplitude instead of |A|, when A is negative.
- id: doesnt-simplify-b
  description: Reports the unsimplified denominator of B (before cancelling the shared factor with its numerator) directly as the period, instead of simplifying pi/k first.
