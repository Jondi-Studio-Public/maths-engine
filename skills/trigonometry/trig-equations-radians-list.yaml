id: trig-equations-radians-list
name: Solve trigonometric equations over 0 to 2 pi and give every solution in exact radians
domain: trigonometry
description: Find all solutions of sine, cosine and tangent equations over 0 ≤ x < 2π, typed as multiples of pi. Covers negative
  values, rearranged equations, multiple angles, quadratics in sine or cosine, and shifted arguments.
status: active
placement_eligible: false
prerequisites:
- senior-recognise-the-exact-values-of-cos-theta-sin
- angle-degrees-radians-pi-form
answer: set
