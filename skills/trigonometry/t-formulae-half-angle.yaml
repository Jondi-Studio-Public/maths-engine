id: t-formulae-half-angle
name: Use the t = tan(x/2) substitution for half angles and equations in sine and cosine
domain: trigonometry
description: Write sin x, cos x and tan x in terms of t = tan(x/2), find tan(x/2) from cos x or from a standard angle, and
  solve a sin x + b cos x = c by reducing it to a quadratic in t.
status: active
placement_eligible: false
prerequisites:
- trig-compound-angle-exact
- senior-recognise-the-exact-values-of-cos-theta-sin
answer: expression
sources:
