misconceptions:
- id: swapped-cos-sin
  description: Reports the value of the other named function (e.g. sin(theta) when cos(theta) was asked for) instead of the one actually requested.
- id: sign-flipped-value
  description: Reports the correct magnitude but with the wrong sign for the quadrant theta is in.
- id: confuses-zero-and-undefined
  description: Swaps "tan(theta) = 0" and "tan(theta) is undefined" at the quadrantal angles, offering 0 where cos(theta) = 0 or "undefined" where sin(theta) = 0.
- id: forgets-to-divide-for-tan
  description: Reports sin(theta) alone instead of computing tan(theta) = sin(theta)/cos(theta).
- id: wrong-standard-angle
  description: Reports the exact value for a nearby standard angle (e.g. pi/3 instead of pi/6) rather than the one actually stated.
