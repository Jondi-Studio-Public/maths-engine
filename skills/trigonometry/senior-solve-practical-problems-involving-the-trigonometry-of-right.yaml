misconceptions:
- id: tan-applied-to-baseline
  description: Applies the elevation tangent ratio directly to the stated ground baseline PQ instead of the leg (PT or QT) derived from solving the non-right ground triangle first.
- id: sine-cosine-swap-in-ground-triangle
  description: Swaps sine and cosine when applying the sine rule to the ground triangle, using cos of the stated angle where sin was required.
- id: wrong-vertex-in-sine-rule
  description: Pairs the stated angle with the wrong side in the sine rule, deriving the OTHER leg of the ground triangle (PT instead of QT, or vice versa) and applying the elevation ratio to it instead of the correct leg.
- id: cosine-rule-sign-error
  description: On the hard tier, adds instead of subtracts the 2*PQ*QT*cos(angle) term when applying the cosine rule (SAS) to the ground triangle.
- id: cosine-rule-missing-factor-of-two
  description: On the hard tier, omits the factor of 2 in the cosine rule's 2*PQ*QT*cos(angle) term.
