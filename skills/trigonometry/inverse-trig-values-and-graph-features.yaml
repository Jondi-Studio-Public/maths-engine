misconceptions:
- {id: gti-angle-outside-range, description: 'Giving an angle outside the principal range of the inverse function, such as the 330 degree or 11 pi over 6 angle.'}
- {id: gti-angle-reduced-not-principal, description: 'Reducing the angle to the first quadrant instead of finding the principal value.'}
- {id: gti-arcsin-arccos-swapped, description: 'Using the arcsin range for arccos, or the arccos range for arcsin.'}
- {id: gti-arcsin-range-and-arccos-range-swapped, description: 'Giving the range of arccos where the range of arcsin is asked, or the reverse.'}
- {id: gti-asymptote-uses-pi, description: 'Giving the arctan asymptote as y = pi or y = pi over 4 instead of y = pi over 2.'}
- {id: gti-composite-cancels, description: 'Cancelling an inverse trig function with its partner for an angle outside the principal range, such as arcsin(sin(5 pi over 6)) = 5 pi over 6.'}
- {id: gti-domain-ignores-b, description: 'Giving the domain -1 to 1 for arcsin(bx) without dividing by b.'}
- {id: gti-domain-ignores-shift, description: 'Giving the domain of an inverse trig function without allowing for a horizontal shift.'}
- {id: gti-doubles-the-sine-only, description: 'Multiplying only the sine by the factor and not the whole function when evaluating a scaled inverse trig function.'}
- {id: gti-forgets-the-factor-two, description: 'Forgetting the vertical dilation factor when finding the greatest value or an intercept.'}
- {id: gti-forgets-the-shift, description: 'Evaluating an inverse trig function at a point without adding its vertical shift.'}
- {id: gti-least-for-greatest, description: 'Giving the least value of an inverse trig function where its greatest value is asked.'}
- {id: gti-multiplies-by-b, description: 'Multiplying the end points of the domain by b instead of dividing, for arcsin(bx).'}
- {id: gti-negative-angle, description: 'Giving a negative angle where the inverse function has only non-negative values, or the reverse.'}
- {id: gti-negative-angle-for-arccos, description: 'Giving a negative angle for arccos of a negative number, where arccos has range 0 to pi.'}
- {id: gti-range-ignores-shift, description: 'Giving the range of a shifted or scaled inverse trig function without applying the vertical shift.'}
- {id: gti-reciprocal, description: 'Giving the reciprocal of the ratio when solving for the x-intercept.'}
- {id: gti-returns-the-argument, description: 'Giving the argument back as the value of an inverse trig function.'}
- {id: gti-second-quadrant-angle, description: 'Giving the second-quadrant angle for an arcsin or arctan value, which lies outside the range of the function.'}
- {id: gti-shift-sign, description: 'Applying a vertical shift with the wrong sign when finding an extreme value of an inverse trig function.'}
- {id: gti-sign-dropped, description: 'Dropping the sign of the argument: giving arcsin(1/2) for arcsin(-1/2), or the positive angle where the answer is negative.'}
- {id: gti-sign-of-root, description: 'Giving the wrong sign when solving for the x-intercept of a shifted inverse trig function.'}
- {id: gti-wrong-ratio, description: 'Using the wrong exact ratio for the angle, such as the sine of pi over 6 taken as root 3 over 2.'}
difficulty_progression:
  easy: {steps: 2, demand: 'Recall the exact value of sine, cosine or tangent at a standard angle and choose the angle in the principal range of the inverse function.'}
  medium: {steps: 3, demand: 'Use the range or domain of the inverse function to find a greatest value, an asymptote or a domain end point of a scaled and shifted graph.'}
  hard: {steps: 4, demand: 'Evaluate a composite, deciding whether the inner angle lies in the principal range or must be replaced by its principal equivalent, or use a double angle identity with a right triangle.'}
  exam: {steps: 7, demand: 'Find the domain, greatest value and a value of a scaled and shifted arcsin function, then solve f(x) = 0 for the x-intercept.'}
