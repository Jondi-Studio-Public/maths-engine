id: inverse-trig-values-and-graph-features
name: Find exact values, domains, ranges and graph features of arcsin, arccos and arctan
domain: trigonometry
year_level: ['12']
description: Give the exact principal value of arcsin, arccos or arctan at a standard point, state a greatest value, an
  asymptote, a domain end point or a value of a transformed inverse trig function, and evaluate composites such as
  arcsin(sin(7pi/6)) or sin(2 arcsin(-4/5)); the exam chain takes f(x) = a arcsin(bx) + c through its domain, greatest
  value, a value and its x-intercept.
status: active
placement_eligible: false
prerequisites: [senior-understand-the-unit-circle-definition-of-cos-theta-acmmm034, exact-trig-values-typed]
answer: expression
