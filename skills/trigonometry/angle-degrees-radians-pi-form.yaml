misconceptions:
- id: halves-the-base-conversion-factor
  description: Divides the degree measure by 90 instead of 180, halving the pi-coefficient.
- id: drops-the-pi-factor
  description: Reduces degrees/180 to a plain fraction but forgets the identity is a multiple of pi.
- id: uses-the-degree-value-as-the-pi-coefficient
  description: Uses the raw degree number itself as the coefficient of pi, skipping the division by 180.
- id: reports-the-pi-coefficient-numerator-as-the-degree-answer
  description: Reports the bare numerator of the pi-form coefficient as if it were already the degree answer, forgetting to multiply by 180.
- id: halves-the-correct-degree-value
  description: Uses 90 instead of 180 as the base when converting back, halving the correct degree answer.
- id: flips-the-pi-coefficient-before-multiplying
  description: Flips the numerator and denominator of the pi-form coefficient before multiplying by 180.
tags: [trigonometry, angle-measure, radians]
