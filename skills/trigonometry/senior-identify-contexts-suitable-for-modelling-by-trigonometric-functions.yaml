misconceptions:
- id: forgets-amplitude
  description: Reports the mean value alone, ignoring the sine term entirely, as if the quantity were constant.
- id: forgets-mean
  description: Reports only the deviation from the mean (A*sin(...)) instead of adding the mean value D.
- id: sign-flip
  description: Reflects the deviation from the mean the wrong way (as if the sine term's sign were flipped).
- id: over-amplitude
  description: Adds an extra whole amplitude on top of the correctly evaluated quantity.
- id: wrong-root
  description: Reports the second (later) solution of the sinusoidal equation within the period instead of the smallest positive one, on the exam-tier inverse problem.
- id: half-period-guess
  description: Guesses half the stated period as the answer time, without solving the sinusoidal equation at all, on the exam-tier inverse problem.
- id: late-by-one-period
  description: Reports the correct smallest positive time plus one whole extra period, on the exam-tier inverse problem.
