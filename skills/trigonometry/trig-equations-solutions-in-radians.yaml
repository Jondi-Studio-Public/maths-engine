id: trig-equations-solutions-in-radians
name: Solve trigonometric equations over an interval in radians
domain: trigonometry
year_level:
- '11'
description: 'Find every solution, in radians, of f(a(x - b)) = c on a stated interval, for f one of sine, cosine or tangent:
  as multiples of π when c is an exact value, or to 2 decimal places when c needs a calculator. The exam chain gives the period,
  the number of solutions (following through from the period), the smallest solution and the full list.'
