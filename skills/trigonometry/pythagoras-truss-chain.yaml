id: pythagoras-truss-chain
name: Chained Pythagoras through a truss
domain: trigonometry
description: Track one computed length through 2-3 dependent right-angled triangles in a labelled truss, where each triangle's found leg feeds the next triangle's given leg. Not the theorem itself -- the learner already has pythagorean-hypotenuse and pythagorean-leg for single-step Pythagoras.
