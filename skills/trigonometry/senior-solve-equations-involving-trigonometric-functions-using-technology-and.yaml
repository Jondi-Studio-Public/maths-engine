misconceptions:
- id: wrong-ordinal
  description: Offers a different, adjacent member of the same verified solution list -- a genuine root of the equation, just not the one asked for.
- id: sign-flip
  description: Reads the stated k with the wrong sign and reports the corresponding base solution of trig(x) = -k instead.
- id: forgot-divide-by-a
  description: Forgets the final division (or division after subtracting c) that isolates the trig ratio, solving trig(x) = d directly instead of trig(x) = d/a.
- id: forgot-divide-by-b
  description: Reports the un-recovered b*x angle itself, forgetting to divide back by b to reach x (or t).
- id: degrees-as-radians
  description: Computes the correct angle but reports the internal radian value as if it were already in degrees (or hours).
