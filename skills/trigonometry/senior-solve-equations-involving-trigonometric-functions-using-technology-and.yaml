id: senior-solve-equations-involving-trigonometric-functions-using-technology-and
name: Solve equations involving trigonometric functions using technology, and algebraically in simple
  cases
domain: trigonometry
description: 'Given bounded, fully specified inputs, solve equations involving trigonometric functions
  using technology, and algebraically in simple cases. Return the resulting value, expression, relation,
  or classification. Every question is a general trigonometric EQUATION over a stated interval that can
  hold two or more solutions (sin(x)=k, a*trig(bx)+c=d) -- never an inverse-trig lookup of a right triangle''s
  own side ratio (that shape belongs to the prerequisite skill, right-triangle-angle). Four tiers, each
  a genuine change of decision: a direct sin(x)=k or cos(x)=k with exactly two solutions in [0, 360),
  named "the smaller/larger solution"; the same equation with a coefficient the learner must isolate first;
  a multi-period trig(bx)=k with b>=2 holding more than two solutions, named by a verified ordinal; and,
  on the exam tier, an applied periodic-quantity context (tide height) with every constant stated and the
  target value kept away from every standard angle, so the solve is a genuine technology decimal solve.'
status: active
placement_eligible: false
prerequisites: [right-triangle-angle]
capability_gates: [technology_use]
answer: number
