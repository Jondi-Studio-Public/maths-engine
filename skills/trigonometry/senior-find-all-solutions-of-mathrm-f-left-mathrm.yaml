misconceptions:
- id: wrong-quadrant-cast
  description: Applies the opposite CAST-rule sign branch, selecting solutions from the wrong quadrants.
- id: misses-solutions-from-extra-periods-or-drops-one
  description: On easy/medium, picks only one solution; on hard, forgets that the coefficient a=2 requires checking multiple periods within the domain.
