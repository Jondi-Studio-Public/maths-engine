misconceptions:
- id: swapped-coordinate-ratio
  description: Treats the x-coordinate as sin(theta) and the y-coordinate as cos(theta), computing x/y instead of y/x.
- id: reports-y-coordinate-alone
  description: Reports sin(theta) (the y-coordinate) directly instead of dividing by cos(theta).
- id: sign-flipped-tan
  description: Computes the correct magnitude but with the wrong sign.
- id: drops-the-sign
  description: Reports the unsigned magnitude of tan(theta), ignoring that the coordinates' signs determine whether tan is positive or negative.
- id: confuses-zero-and-undefined
  description: Swaps "tan(theta) = 0" and "tan(theta) is undefined" at the quadrantal angles, offering 0 where cos(theta) = 0 or "undefined" where sin(theta) = 0.
- id: reports-bare-coordinate
  description: Reports the x- or y-coordinate directly as the answer instead of computing the sin/cos ratio.
