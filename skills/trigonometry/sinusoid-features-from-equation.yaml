id: sinusoid-features-from-equation
name: Read the features of a sinusoid from its equation
domain: trigonometry
year_level:
- '11'
description: 'From the equation of y = a sin(b(x - c)) + d, its cosine form or a tangent, state a feature in exact form, with
  multiples of π where needed: the amplitude, period, horizontal and vertical translation, and the maximum or minimum value;
  then, with the bracket expanded and a negative, the translation and extremes; then the smallest positive x at which the
  maximum or minimum occurs, the y-intercept or the first vertical asymptote of a tangent. The exam chain finds the amplitude,
  period, horizontal translation and (following through) the maximum value.'
status: active
