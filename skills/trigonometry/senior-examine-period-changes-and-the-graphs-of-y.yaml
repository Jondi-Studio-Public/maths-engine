misconceptions:
- id: half-period
  description: Gives half the period, taking the spacing between consecutive zero crossings (or half a cycle) as one full cycle.
- id: double-period
  description: Gives twice the period, counting two cycles as one or reading from every second feature.
- id: quarter-period
  description: Gives a quarter of the period, the x-value of the first peak or trough, instead of the length of a full cycle.
- id: frequency-b
  description: Gives the value of b (the number of cycles in 2pi) as a plain number instead of the period 2pi/b in terms of pi.
