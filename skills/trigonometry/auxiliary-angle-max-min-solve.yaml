id: auxiliary-angle-max-min-solve
name: Use the auxiliary angle to find extremes and solve a cos x + b sin x = c
domain: trigonometry
year_level:
- '12'
description: Write a cos x + b sin x as R cos(x - α) and use it to find the greatest and least values of a wave, the x at
  which they occur, and the solutions of a cos x + b sin x = c on an interval, without being told R or α.
status: active
placement_eligible: false
prerequisites:
- senior-convert-sums-mathrm-a-cos-mathrm-x-mathrm
answer: expression
