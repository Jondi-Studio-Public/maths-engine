id: de-moivre-multiple-angle
name: Use De Moivre's theorem for multiple angles and powers of sine and cosine
domain: trigonometry
description: Expand (cos θ + i sin θ) to the third and fourth powers to find cos 3θ, sin 3θ, cos 4θ and sin 4θ from one
  ratio, write cos nθ as a polynomial in cos θ, and write powers of sine and cosine as sums of multiple angles.
status: active
placement_eligible: false
prerequisites:
- senior-convert-between-cartesian-and-polar-form
- multiply-complex-numbers
answer: expression
