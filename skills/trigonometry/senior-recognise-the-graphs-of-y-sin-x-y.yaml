id: senior-recognise-the-graphs-of-y-sin-x-y
name: 'Recognise the graphs of \(y=\sin x,\;y=\cos x,\) and \(y=\tan x\) on extended domains'
domain: trigonometry
year_level: ['11']
description: Given an unlabelled graph of y = sin x, y = cos x or y = tan x on a grid whose x-axis is marked in multiples of pi, choose which of the three functions is drawn (or, with several curves drawn, which function's curve passes through a lettered point). Never asks for an amplitude, period, shift or any value.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites:
- senior-understand-the-unit-circle-definition-of-cos-theta-acmmm034
- senior-recognise-the-exact-values-of-cos-theta-sin
answer: mcq
sources:
- topic: pv1f_trig_graph_id
  difficulty: easy
  stages: [0, 1, 2]
- topic: pv1f_trig_graph_id
  difficulty: medium
  stages: [3, 4]
- topic: pv1f_trig_graph_id
  difficulty: hard
  stages: [5, 6, maintenance]
- topic: pv1f_trig_graph_id
  difficulty: exam
  stages: [exam]
misconceptions:
- id: sin-as-cos
  description: Takes the curve that passes through the origin for cosine, or the curve that peaks at x = 0 for sine, mixing up the starting point of the two waves.
- id: tan-as-sin
  description: Calls a curve that rises through the origin sine without noticing that it runs off the grid in separate branches, which sine never does.
- id: bounded-as-tan
  description: Calls a wave that stays between -1 and 1 tangent, or a branch-by-branch curve a wave.
- id: wrong-curve-through-point
  description: With several curves drawn, names the function of a neighbouring curve instead of the one through the lettered point.
