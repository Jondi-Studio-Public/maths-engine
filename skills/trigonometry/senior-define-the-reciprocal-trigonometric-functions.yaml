misconceptions:
- id: recip-not-taken
  description: Gives the value of cos, sin or tan where sec, cosec or cot was asked for, forgetting the reciprocal.
- id: recip-sec-cosec-swapped
  description: Takes sec as the reciprocal of sine, or cosec as the reciprocal of cosine.
- id: recip-cot-as-tan
  description: Reads cot as tan, giving sin/cos where cos/sin was asked for.
- id: recip-cot-as-cosec
  description: Confuses cot with cosec, taking cot as the reciprocal of sine.
- id: trig-sign-wrong-quadrant
  description: Gives a negative value where the function is positive in the angle's quadrant.
- id: trig-quadrant-sign-ignored
  description: Gives the value of the reference angle without the negative sign the quadrant requires.
- id: trig-wrong-reference-angle
  description: Uses the complement of the reference angle, so 30 degrees and 60 degrees are exchanged.
- id: trig-sin-cos-swapped
  description: Gives cos where sin was asked for, or the reverse.
- id: recip-reciprocal-given
  description: Gives the reciprocal function's value, sec for cos or cosec for sin.
difficulty_progression: Easy asks for sec, cosec or cot of 30, 45 or 60 degrees, so the work is one reciprocal of a
  known ratio. Medium moves the angle into the other three quadrants, so the sign has to be decided as well. Hard uses
  radians for angles that are negative or more than a full turn, so the angle is reduced to a standard angle before
  the quadrant is found. The exam chain finds sin and cos at an angle outside the first quadrant, then builds cosec
  and cot from them.
