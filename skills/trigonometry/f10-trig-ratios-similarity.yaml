misconceptions:
- id: adds-the-difference
  description: Treats similar triangles additively, adding to the reference side the amount the known side grew by, instead of multiplying by the scale factor (easy tier).
- id: scales-the-wrong-side
  description: Applies the scale factor to the third side of the reference triangle rather than the side asked for (easy tier).
- id: forgets-to-scale
  description: Reports the reference triangle's side without scaling it up to the larger triangle (easy tier).
- id: adds-the-scale-factor
  description: Adds the scale factor to the reference side instead of multiplying by it (easy tier).
- id: swaps-opposite-and-adjacent
  description: Mixes up which leg is opposite and which is adjacent to the stated angle, so the wrong ratio (the complementary angle's) is used (medium and hard tiers).
- id: multiplies-instead-of-divides
  description: Picks the right ratio but applies it the wrong way round, multiplying where it should divide or the reverse (medium and hard tiers).
- id: treats-the-known-side-as-the-hypotenuse
  description: Multiplies the known side by the unknown side's ratio as if the known side were the hypotenuse (medium and hard tiers).
- id: divides-by-the-unknown-sides-ratio
  description: Divides the known side by the sine or cosine belonging to the unknown side, instead of forming the ratio the two sides share (medium and hard tiers).
