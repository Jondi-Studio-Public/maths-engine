id: angle-radians-to-dms
name: Convert a radian angle to degrees and minutes
domain: trigonometry
description: 'Given a radian value in one of four input shapes (a 3dp decimal, a word-problem framing of the same decimal, a bare fraction, or a word-problem framing of an exact pi-fraction), convert to degrees and minutes, rounded to the nearest minute. Reverse direction of the DMS-to-radians conversion (a separate skill); split because they use different grader kinds.'
status: active
placement_eligible: false
prerequisites: []
answer: pair
sources:
