misconceptions:
- id: dropped-minutes
  description: Converts the whole-degree part correctly but forgets to convert the fractional degree into minutes at all.
- id: minutes-as-hundredths
  description: Misreads the fractional degree as hundredths rather than sixtieths, so 0.5 degrees becomes 50 minutes instead of 30.
- id: swapped-components
  description: Swaps the degrees and minutes components in the answer.
