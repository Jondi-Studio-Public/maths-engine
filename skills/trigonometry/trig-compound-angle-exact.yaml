id: trig-compound-angle-exact
name: Use the compound and double angle formulas to find exact trigonometric values
domain: trigonometry
description: Find exact values of sine, cosine and tangent at 15°, 75° and 105°, of sums and differences of angles given by
  fractions, with the quadrant deciding the signs, and of sin 2x, cos 2x and tan 2x from one ratio.
status: active
placement_eligible: false
prerequisites:
- senior-recognise-the-exact-values-of-cos-theta-sin
- angle-degrees-radians-pi-form
answer: expression
