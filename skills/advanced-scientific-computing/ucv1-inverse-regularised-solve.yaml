- topic: exd_x_r2h_ridge_chain
  params: {tier: exam}
  difficulty: exam
  stages:
  - exam
misconceptions:
- id: omits-lambda
  description: Solves the plain (unregularised) normal equations A^T A x =
    A^T b, ignoring the penalty entirely.
- id: adds-lambda-once
  description: Adds lambda to only one diagonal entry of A^T A instead of
    both.
- id: swaps-x1-x2
  description: Reports the solved pair in the wrong order.
- id: forgets-transpose
  description: 'Easy tier only (square A): uses A in place of A^T A, i.e.
    solves A x = b directly.'
- id: wrong-row-division
  description: 'Exam tier only: recovers lambda from row 1''s equation but
    divides by x2 instead of x1.'
- id: flips-lambda-sign
  description: 'Exam tier only: reports the recovered penalty with the
    wrong sign.'
tags: [university-core-v1, scientific-computing, inverse-problems]
