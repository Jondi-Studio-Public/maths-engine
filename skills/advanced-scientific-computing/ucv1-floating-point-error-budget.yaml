misconceptions:
- id: counts-operations
  description: >-
    Gives the number of operations as the error multiple, treating every rounding as one unit of error whatever the size
    of the value that was rounded.
- id: magnitudes-not-carried
  description: >-
    Adds the sizes of the intermediate results but does not carry an early rounding error through the later multiplications
    and additions that use it.
- id: final-rounding-only
  description: Counts only the rounding of the last operation, as if the earlier results were exact.
- id: misses-last-rounding
  description: >-
    Carries every earlier rounding correctly but leaves out the rounding of the final operation.
- id: each-step-once
  description: >-
    Counts a rounding error once even when the intermediate result is used on two paths, so its effect is under-counted.
