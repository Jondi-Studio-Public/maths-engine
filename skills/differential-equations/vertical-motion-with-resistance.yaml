id: vertical-motion-with-resistance
name: "Analyse vertical motion with resistance proportional to speed"
domain: differential-equations
description: "Model a body falling or thrown upwards against resistance cv: the terminal speed, the speed and time by dv/dt, and the greatest height and distance fallen by v dv/dx, with g stated."
status: active
placement_eligible: false
prerequisites:
- acceleration-function-of-velocity
answer: number
sources:
