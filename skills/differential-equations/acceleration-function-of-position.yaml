id: acceleration-function-of-position
name: "Solve motion where acceleration is a function of position"
domain: differential-equations
description: "Use a = v dv/dx to find v² from an acceleration that depends on position (linear, inverse-square and power laws), then speeds, turning points and greatest speeds."
status: active
placement_eligible: false
