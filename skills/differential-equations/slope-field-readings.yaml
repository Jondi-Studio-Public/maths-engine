id: slope-field-readings
name: Read numbers from a slope field of dy/dx = f(x, y)
domain: differential-equations
year_level: ['12']
description: Find the slope of the segment at a grid point of dy/dx = f(x, y), recover a rule or a parameter k from stated slopes, walk along the field in steps of width h, count the grid points of a given slope, and compare a two-step walk with the exact solution of a separable equation. Every answer is a typed number.
status: active
placement_eligible: false
