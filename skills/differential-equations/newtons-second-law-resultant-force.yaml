id: newtons-second-law-resultant-force
name: Apply Newton's second law to a resultant of several forces
domain: differential-equations
description: Use F = ma with several forces on one body, in one dimension and with force vectors, to find an acceleration,
  a missing force or a mass, including the components, size and direction of an unknown force.
