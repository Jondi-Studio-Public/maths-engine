misconceptions:
- id: proportional-to-time-not-quantity
  description: 'Easy tier: models the rate as proportional to time (kt) rather than to the
    quantity itself (kQ).'
- id: constant-rate
  description: 'Easy tier: uses a constant rate (k) that ignores the "proportional to the
    quantity" clause entirely.'
- id: cooling-drops-ambient-term
  description: 'Medium tier: drops the ambient-temperature clause entirely, modelling plain
    proportional change (kT) instead of k(A - T).'
- id: cooling-reverses-difference
  description: 'Medium tier: reverses the stated order of the temperature difference,
    writing k(T - A) instead of k(A - T) -- physically backwards under a positive
    constant, since an object above ambient must cool toward it (negative rate).'
- id: logistic-reverses-capacity-term
  description: 'Hard tier: reverses the sign of the remaining-capacity term, writing
    kP(P - N) instead of kP(N - P).'
- id: logistic-adds-instead-of-multiplies
  description: 'Hard tier: adds the population and its remaining capacity instead of
    multiplying them, which algebraically collapses to a constant rate.'
- id: logistic-drops-capacity
  description: 'Hard tier: drops the capacity term entirely, modelling plain exponential
    growth (kP).'
- id: combined-rate-sign-reversed
  description: 'Exam tier: reverses the sign of the decay term, modelling growth from decay
    (r + kQ) instead of loss (r - kQ).'
- id: combined-rate-wrong-scope
  description: 'Exam tier: applies the proportionality constant to the whole expression
    (k(r - Q)) instead of only to the decay term.'
