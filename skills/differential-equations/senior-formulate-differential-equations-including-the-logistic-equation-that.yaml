id: senior-formulate-differential-equations-including-the-logistic-equation-that
name: 'Formulate differential equations including the logistic equation that will arise in, for
  example, chemistry, biology and economics, in situations where rates are involved'
domain: differential-equations
description: Given a verbal description of a rate relationship (proportional growth/decay,
  Newton's law of cooling, logistic growth, or a combined input/decay rate), choose the
  differential equation FORM that models it. At the exam tier a well-mixed tank is worked numerically (the
  rate in, the rate out, dQ/dt and the long-run amount). Never asks the learner to solve the equation.
status: active
placement_eligible: false
prerequisites:
- solve-ode-exponential
answer: mcq
