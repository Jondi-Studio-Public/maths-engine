misconceptions:
- id: r3h-euler-slope-at-next-point
  description: Evaluating the slope at the next x-value (with the old y) instead of at the current point (x(n), y(n)).
- id: r3h-euler-step-size-not-applied
  description: Adding the slope itself to y instead of the slope times the step size, y(n+1) = y(n) + f(x(n), y(n)).
- id: r3h-euler-restarts-from-initial-value
  description: Adding each new increment to the starting value y(x0) instead of to the previous estimate.
- id: r3h-euler-slope-not-updated
  description: Reusing the first slope for every step instead of recomputing f at each new estimate.
- id: r3h-euler-error-reversed
  description: Subtracting in the wrong order, giving the estimate minus the exact value, so the error has the wrong sign.
- id: r3h-euler-error-uses-previous-step
  description: Comparing the exact value with the estimate from the step before the last.
- id: r3h-euler-increment-reported-as-estimate
  description: Reporting the increment h f(x, y) as the new estimate instead of adding it to the old one.
- id: r3h-euler-slope-uses-old-point
  description: Finding the slope with the old x or the old y instead of the new estimate.
- id: r3h-euler-slope-uses-x-only
  description: Reporting x, or a function of x alone, as the slope when the equation depends on y as well.
- id: r3h-euler-error-relative
  description: Reporting the error as a percentage of the exact value instead of the difference asked for.
- id: r3h-euler-error-estimate-only
  description: Giving the Euler estimate itself where the error was asked for.
