id: euler-method-nonlinear-table
name: Euler's method for a non-linear equation
domain: differential-equations
description: Apply several steps of Euler's method to dy/dx = f(x, y) with f non-linear in y (xy, y^2, x/y, y(1 - y)), recomputing
  the slope at each new estimate, completing a table of estimates and slopes, and comparing the final estimate with the exact
  solution. The existing Euler skill takes one step of a linear equation.
