id: logistic-equation-solution
name: Solve the logistic equation
domain: differential-equations
description: 'Solve dP/dt = kP(1 - P/M) for P(t) = M/(1 + A e^(-kt)) from the initial population, find k from a later reading,
  and find the time to reach a stated fraction of the carrying capacity or the time and size of the greatest growth rate.
  The equation is given: the formulation skill covers writing it from a description.'
