misconceptions:
- id: forgot-direction-sign
  description: Reports the unsigned magnitude of the momentum or resultant force,
    dropping the stated direction sign entirely.
- id: ignores-one-force
  description: Uses only one of the two applied forces' magnitude, ignoring the other,
    when finding the resultant force.
- id: forgot-friction-in-net-force
  description: On the three-force/acceleration tier, ignores the resisting friction
    force entirely and computes acceleration from the two applied forces alone.
- id: sign-error-on-friction
  description: On the three-force/acceleration tier, applies the friction force in
    the same direction as the net of the two applied forces instead of opposing it.
- id: forgot-divide-by-mass
  description: On the three-force/acceleration tier, reports the net force in newtons
    as if it were the acceleration, forgetting to divide by the mass.
- id: wrong-conservation-denominator
  description: On the momentum-conservation tier, uses the difference of the two masses
    instead of their sum in the denominator of the conservation equation.
- id: forgot-one-momentum-term
  description: On the momentum-conservation tier, omits one object's momentum term
    (mass times velocity) from the numerator of the conservation equation.
