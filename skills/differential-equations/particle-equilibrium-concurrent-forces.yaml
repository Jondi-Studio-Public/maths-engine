id: particle-equilibrium-concurrent-forces
name: Find unknown forces on a particle in equilibrium
domain: differential-equations
description: Resolve concurrent forces in two perpendicular directions and set each total to zero to find an unknown
  force component, a magnitude, or the tensions in strings supporting a weight.
status: active
