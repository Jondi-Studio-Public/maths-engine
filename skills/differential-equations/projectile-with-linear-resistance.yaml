id: projectile-with-linear-resistance
name: "Analyse projectile motion with resistance proportional to velocity"
domain: differential-equations
year_level:
- '12'
description: "Model a projectile launched at an angle against resistance kv: resolve the launch velocity, solve the horizontal and vertical motions separately, and find the time to the top, the greatest height and the horizontal distance and speed there, with g stated."
status: active
placement_eligible: false
