id: senior-understand-motion-of-a-body-under-concurrent-forces
name: Understand motion of a body under concurrent forces
domain: differential-equations
description: Given two or more force vectors, stated by magnitude and direction,
  acting concurrently on a body of stated mass, compute the resultant force's
  magnitude and direction (or the resulting acceleration's magnitude and
  direction).
status: active
placement_eligible: false
prerequisites:
- senior-examine-momentum-force-resultant-force-action-and-reaction
- vector-addition
answer: pair
sources:
- topic: p19g_concurrent_forces_resultant
  params: {}
  difficulty: easy
  stages: [0, 1, 2]
- topic: p19g_concurrent_forces_resultant
  params: {}
  difficulty: medium
  stages: [3, 4]
- topic: p19g_concurrent_forces_resultant
  params: {}
  difficulty: hard
