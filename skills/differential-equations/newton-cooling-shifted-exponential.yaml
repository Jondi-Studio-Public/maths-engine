id: newton-cooling-shifted-exponential
name: 'Newton''s law of cooling: the shifted exponential'
domain: differential-equations
description: Solve dT/dt = -k(T - A) for T = A + (T0 - A)e^(-kt), where the object approaches the surrounding temperature
  A rather than zero; find k from a later reading and the time to reach a stated temperature, for cooling and for warming
  objects.
