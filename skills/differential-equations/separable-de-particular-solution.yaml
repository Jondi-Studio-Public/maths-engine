id: separable-de-particular-solution
name: Solve a separable differential equation through a given point
domain: differential-equations
description: 'Solve dy/dx = g(x)h(y) by separating the variables, integrating both sides and using a point on the curve to
  fix the constant, then write y explicitly in terms of x. The right-hand side has y in it (dy/dx = xy, cos(x)/y, sin(x)y^2),
  so the work is in integrating 1/h(y) correctly and inverting the result. Hard questions need integration by parts for g(x)
  or an inverse tangent; the exam tier is a four-part chain: the x-antiderivative, the constant, the solution and a value.'
status: active
placement_eligible: false
