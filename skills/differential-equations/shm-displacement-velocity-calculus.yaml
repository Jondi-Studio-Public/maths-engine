id: shm-displacement-velocity-calculus
name: "Differentiate the displacement of simple harmonic motion"
domain: differential-equations
description: "Differentiate x = A cos(nt) or A sin(nt) (and sums and phase shifts of them) for the velocity and the acceleration, and read the amplitude, period, greatest speed and greatest acceleration from the result."
status: active
placement_eligible: false
prerequisites:
- senior-recognise-acceleration-as-the-second-derivative-of-position
- simple-harmonic-angular-frequency
answer: number
sources:
