misconceptions:
- id: sign-error-isolating-yprime
  description: Reports the negative of the correct dy/dx, a sign error moving terms across the equals sign.
- id: forgot-yprime-factor
  description: Differentiates the y-term without the chain-rule factor y', dropping y from the denominator entirely.
- id: dropped-coefficient
  description: Drops a coefficient when isolating dy/dx.
- id: forgot-product-rule
  description: On medium/hard/exam tiers (a cross term), applies only one part of the product rule
    to a term like B*x*y, dropping either the "+By" or the "+Bx*y'" piece.
- id: forgot-chain-rule-on-power-term
  description: Differentiates a y**2 or y**3 term without its chain-rule factor y', so that term's
    contribution never joins the y'-bearing side of the equation.
