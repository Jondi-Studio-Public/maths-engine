id: inclined-plane-friction
name: Solve problems on a rough inclined plane
domain: differential-equations
description: Resolve the weight on a slope, then use the coefficient of friction to find a normal reaction, a friction
  force, a limiting coefficient, or the acceleration of a block sliding down.
