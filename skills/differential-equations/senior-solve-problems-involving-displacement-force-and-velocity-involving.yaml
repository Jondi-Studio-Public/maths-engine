misconceptions:
- id: uses-pythagoras
  description: Ignores the stated angle entirely and combines two vector magnitudes as if they were perpendicular (easy, hard and exam tiers).
- id: wrong-sign-cosine-rule
  description: Subtracts instead of adds the cross term in the cosine rule, easy tier.
- id: adds-the-magnitudes
  description: Treats the two forces as collinear and simply adds their magnitudes, easy tier.
- id: wrong-side-of-sine-rule
  description: Swaps the two forces' roles in the sine-rule ratio, medium tier.
- id: halves-the-angle
  description: Reports half the stated angle between the forces as the resultant's direction, medium tier.
- id: ignores-the-angle-for-direction
  description: Treats the two forces as perpendicular legs and reports atan(F2/F1), ignoring the stated angle, medium tier.
- id: swapped-rates
  description: Uses the boat's own across-river speed in place of the current's speed when scaling by the crossing time, hard tier.
- id: forgot-the-time
  description: Reports the current's speed itself as the drift, never multiplying by the crossing time, hard tier.
- id: dropped-a-vector
  description: Omits one of the three vectors from the component sum, exam tier.
- id: component-sign-error
  description: Subtracts instead of adds one vector's component when summing, exam tier.
