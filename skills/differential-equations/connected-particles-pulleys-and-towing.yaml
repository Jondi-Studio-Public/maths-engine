misconceptions:
- id: mech-forgot-acceleration-of-car
  description: Taking the tension to be the driving force less the resistance on the car, forgetting that the car
    is accelerating too.
- id: mech-forgot-divide-by-mass
  description: Reporting the resultant force in newtons where the acceleration was asked, without dividing by the
    mass.
- id: mech-forgot-g
  description: Multiplying the coefficient of friction by the mass and leaving out g.
- id: mech-forgot-mass-in-resultant
  description: Using the acceleration as the resultant force, without multiplying it by the mass.
- id: mech-forgot-square-root
  description: Reporting v² as the speed.
- id: mech-forgot-two-in-kinematics
  description: Dropping the 2 in v² = u² + 2as when finding the acceleration or speed.
- id: mech-friction-direction-reversed
  description: Adding the friction force to the driving weight, as if friction helped the motion.
- id: mech-friction-omitted-from-block
  description: Leaving friction out of the block's own equation, so the tension is just m×a.
- id: mech-friction-without-coefficient
  description: Giving the normal reaction as the friction force, leaving out the coefficient of friction.
- id: mech-g-applied-twice
  description: Multiplying by g a second time after the weight has already been found.
- id: mech-ignored-friction
  description: Leaving the friction force out of the equation of motion.
- id: mech-ignored-resistance
  description: Leaving the resisting force out of the resultant force.
- id: mech-masses-swapped
  description: Putting the block's mass where the hanging mass belongs, so the wrong weight drives the motion.
- id: mech-ratio-inverted
  description: Inverting the ratio of the masses, so the acceleration comes out larger than g.
- id: mech-resistance-added
  description: Adding a resisting force to the forces that drive the motion instead of subtracting it.
- id: mech-system-mass-omitted
  description: Using only one body's mass as the mass of the whole system, or the wrong mass in a single body's
    equation.
- id: mech-tension-averaged
  description: Taking the tension to be the average of the two weights.
- id: mech-tension-equals-weight
  description: Taking the tension in the string to equal the weight of one of the masses, which is only true when
    there is no acceleration.
- id: mech-weight-and-acceleration-opposed
  description: Subtracting the acceleration from g where the load accelerates upward, or adding it where it accelerates
    downward.
- id: mech-wrong-body-mass
  description: Using the mass of the other body in one body's equation of motion.
