id: connected-particles-pulleys-and-towing
name: Solve problems on connected particles
domain: differential-equations
description: Find the acceleration and the tension for two bodies joined by a string or tow bar, such as a car and
  trailer or two masses over a smooth pulley, by taking the whole system and then one body.
