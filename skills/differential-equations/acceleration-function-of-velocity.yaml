id: acceleration-function-of-velocity
name: "Solve motion where acceleration is a function of velocity"
domain: differential-equations
description: "Solve a = −kv and a = −kv² for the velocity against time and against distance, and find speeds, times and distances, including the distance in a stated time and the limiting distance."
status: active
placement_eligible: false
prerequisites:
- solve-ode-exponential
- acceleration-function-of-position
answer: number
sources:
