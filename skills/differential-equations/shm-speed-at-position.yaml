id: shm-speed-at-position
name: "Find speed and position in simple harmonic motion from v² = n²(a² − x²)"
domain: differential-equations
description: "Use v² = n²(a² − x²) to find the speed at a displacement, the displacement at a speed, the amplitude, the greatest acceleration and the time between two positions, reading n from the acceleration, the greatest speed, the period or two speeds."
status: active
placement_eligible: false
prerequisites:
- shm-displacement-velocity-calculus
answer: number
sources:
- topic: r3d_shm_speed
  params: {}
  difficulty: easy
  stages: [0, 1, 2]
- topic: r3d_shm_speed
  params: {}
  difficulty: medium
  stages: [3, 4]
- topic: r3d_shm_speed
