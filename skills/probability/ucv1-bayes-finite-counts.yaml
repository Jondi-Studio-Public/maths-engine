id: ucv1-bayes-finite-counts
name: Compute a Bayes update from a finite table
domain: probability
description: Given a prior population split across two groups as raw counts and a
  per-group rate for an evidence property, construct the joint counts and invert
  them into a posterior probability. Excludes a pre-tabulated joint count table
  handed to the learner whole -- that shape is conditional-probability-counts.
status: active
placement_eligible: false
prerequisites: [conditional-probability-counts]
answer: fraction
sources:
