misconceptions:
- id: likelihood-instead-of-posterior
  description: Reports the raw per-group rate for group 1 (or its complement, on
    the not-E tier) instead of the updated posterior probability.
- id: prior-instead-of-posterior
  description: Reports the prior population share for group 1 instead of the
    posterior probability given the evidence.
- id: wrong-group
  description: Reports the posterior probability for group 2 instead of group 1,
    swapping which group the question asked about.
- id: forgot-to-complement
  description: On the not-E tier, uses the E counts instead of the not-E counts,
    answering as if the question had asked about the evidence rather than its
    complement.
tags: [university-core-v1, probability, bayes-theorem]
