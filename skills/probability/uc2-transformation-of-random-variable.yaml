id: uc2-transformation-of-random-variable
name: Density of a function of a random variable
domain: probability
year_level:
- university
description: >-
  Find the density of Y = g(X) from the density of X by the change-of-variable formula or the distribution-
  function method, including maps that are not one-to-one and the density of a sum of two independent uniform
  variables.
