id: uc2-gamma-beta-moments
name: Gamma and beta distribution moments
domain: probability
year_level:
- university
description: "Recognise a gamma or beta density from its form and find its moments, normalising constant and tail probabilities\
  \ exactly, and recover the parameters from a stated mean and variance by matching moments."
status: active
placement_eligible: false
prerequisites:
- finite-distribution-variance
- discrete-expected-value
answer: fraction
