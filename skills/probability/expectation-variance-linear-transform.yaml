difficulty_progression:
  easy: {steps: 1, demand: "Apply the rule for the mean or the variance of aX + b to a stated mean or variance."}
  medium: {steps: 2, demand: "Convert a mean, standard deviation or variance between units, where a shift moves the mean and leaves the spread alone."}
  hard: {steps: 3, demand: "Find the variance from a table first, then transform it, or find E(aX^2 + bX + c) from E(X) and E(X^2)."}
  exam: {steps: 4, demand: A connected chain of four parts in which each later part uses an earlier answer.}
misconceptions:
- id: r3a-linear-mean-omits-the-shift
  description: "Finding E(aX + b) as a E(X), leaving out the added constant b."
- id: r3a-linear-mean-omits-the-multiplier
  description: "Finding E(aX + b) as E(X) + b, leaving out the multiplier a."
- id: r3a-linear-mean-multiplies-the-shift
  description: "Applying the multiplier to the added constant as well: a(E(X) + b) for E(aX + b)."
- id: r3a-linear-variance-omits-the-square
  description: "Finding Var(aX + b) as a Var(X): the multiplier is not squared."
- id: r3a-linear-variance-adds-the-shift
  description: "Adding the constant b to the variance of aX + b."
- id: r3a-linear-sd-applies-the-shift
  description: "Adding the constant b to the standard deviation of aX + b; a shift does not change the spread."
- id: r3a-linear-sd-squares-the-multiplier
  description: "Multiplying the standard deviation by a^2 instead of "
- id: r3a-linear-sd-unchanged-by-scaling
  description: "Leaving the standard deviation unchanged after the measure is multiplied by a constant; only a shift leaves it alone."
- id: r3a-variance-without-subtracting-the-mean-squared
  description: "Reporting E(X^2) as the variance, leaving out the subtraction of (E(X))^2."
- id: r3a-second-moment-squares-the-mean
  description: "Replacing E(X^2) by (E(X))^2."
tags: [round-3, probability, expectation, variance, acmmm167, linear-transformation]
