id: expectation-variance-linear-transform
name: "Find the mean and spread of aX + b"
domain: probability
year_level: ['12']
description: "Find E(aX + b), Var(aX + b) and SD(aX + b) from the mean and spread of X (stated, or found from a table first), including a change of units and a negative multiplier. The exam chain finds E(X) and Var(X) from a table, then the mean and standard deviation of Y = aX + b."
status: active
placement_eligible: false
prerequisites: [discrete-expected-value, finite-distribution-variance]
answer: number
