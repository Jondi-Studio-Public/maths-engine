id: uc2-conditional-density-expectation
name: Conditional density and conditional expectation
domain: probability
year_level:
- university
description: >-
  From a joint density of two continuous random variables, find the conditional density of one given the other,
  the conditional mean and the conditional variance, including the case where the joint density factorises.
status: active
