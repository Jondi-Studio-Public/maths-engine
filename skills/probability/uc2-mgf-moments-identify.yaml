id: uc2-mgf-moments-identify
name: Moments and identification from a moment generating function
domain: probability
year_level:
- university
description: >-
  Use a moment generating function to find the mean, variance and higher moments of a random variable, to
  identify its distribution and the distribution of a sum of independent variables, and to find the MGF of a
  linear transformation.
status: active
