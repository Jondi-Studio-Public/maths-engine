id: uc2-joint-continuous-density
name: Joint continuous density, regions and marginals
domain: probability
year_level:
- university
description: >-
  Work with a joint density of two continuous random variables on a rectangle or a triangle: find the
  normalising constant, the probability of a sloping event, a marginal density and an expectation by double
  integration.
status: active
placement_eligible: false
