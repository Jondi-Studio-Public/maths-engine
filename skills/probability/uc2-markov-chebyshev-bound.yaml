id: uc2-markov-chebyshev-bound
name: Markov and Chebyshev bounds
domain: probability
year_level:
- university
description: "Bound tail probabilities from a mean and a standard deviation without assuming a distribution: decide which\
  \ information is usable, find the guaranteed bound for a tail, an off-centre interval, a second moment or a sample mean,\
  \ and work backwards to the sample size or interval width that a guarantee needs."
status: active
placement_eligible: false
