misconceptions:
- id: numerator-only
  description: Offers a single joint cell instead of summing the whole row (or column) for a marginal.
- id: forgets-division
  description: Offers the raw joint probability where a conditional was asked, never dividing by the marginal.
- id: wrong-axis
  description: Sums the wrong axis (row instead of column, or vice versa) for the conditioning marginal.
- id: complement-slip
  description: Offers 1 minus the correct probability.
- id: wrong-missing-cell
  description: Recovers the missing cell as (sum of the other five) minus 1 instead of 1 minus that sum, then carries the error through (exam tier only).
