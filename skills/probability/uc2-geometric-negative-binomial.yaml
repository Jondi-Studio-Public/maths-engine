id: uc2-geometric-negative-binomial
name: Geometric and negative binomial waiting times
domain: probability
year_level:
- university
description: >-
  Find probabilities, tails and variances for the number of independent trials up to the first success
  (geometric) or the r-th success (negative binomial), including parity and two-player race questions that need
  a geometric series.
status: active
placement_eligible: false
