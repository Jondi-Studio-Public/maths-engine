id: ucv1-total-variance-finite
name: Apply the law of total variance
domain: probability
year_level: [university]
description: Compute total variance from supplied conditional means and conditional
  variances for two cases.
status: active
placement_eligible: false
prerequisites: [finite-distribution-variance]
answer: fraction
sources:
- topic: p14e_total_variance_two_case
  params: {}
  difficulty: easy
  stages:
  - 0
  - 1
  - 2
- topic: p14e_total_variance_two_case
  params: {}
  difficulty: medium
  stages:
  - 3
  - 4
- topic: p14e_total_variance_two_case
