id: senior-understand-the-concepts-of-concavity-and-points-of
name: Understand the concepts of concavity and points of inflection and their relationship with the second derivative
domain: differentiation
description: Given a cubic function with exactly one point of inflection (by construction, on every question), find that point's x-value -- where the second derivative equals zero and changes sign -- and state whether concavity changes from concave up to concave down or from concave down to concave up there. The graded answer is the x-value followed by the concavity-change phrase, typed as two items separated by a comma (e.g. "3, concave up to concave down") -- graded as an ordered_list because a pair grader cannot compare a text direction component.
