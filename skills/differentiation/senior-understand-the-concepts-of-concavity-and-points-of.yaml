misconceptions:
- id: solves-first-derivative-instead-of-second
  description: Solves f'(x) = 0 (a stationary point) instead of f''(x) = 0 (the point of inflection) -- confuses this skill with the second-derivative test skill, the sharpest distractor risk for this skill.
- id: flipped-concavity-direction
  description: Reports the correct x-value but the wrong direction -- flips concave-up-to-down and concave-down-to-up, the natural sign-convention error for this skill.
- id: sign-error-on-inflection-x-value
  description: Reports the correct direction but the wrong x-value -- a sign error solving the linear equation 6*A*x + 2*B = 0 (reports the negative of the true inflection point).
