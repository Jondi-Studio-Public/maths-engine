misconceptions:
- id: reported-velocity-not-acceleration
  description: Reports the velocity s'(t) at the stated time instead of the acceleration s''(t).
- id: reported-position-not-acceleration
  description: Reports the position s(t) at the stated time instead of the acceleration.
- id: dropped-second-power-rule-coefficient
  description: Applies the power rule correctly once but forgets the extra factor the SECOND differentiation contributes, halving every coefficient of the true second derivative.
- id: sign-error-on-acceleration
  description: Reports the negative of the correct acceleration.
