misconceptions:
- id: value-not-slope
  description: Evaluates f(p) instead of f'(p).
- id: forgot-power-multiply
  description: Differentiates x**2 as x instead of 2x (forgets the power-rule coefficient).
- id: dropped-linear-term
  description: Drops the derivative's constant term entirely.
- id: wrong-power-rule-in-equation
  description: Solves as if f'(x) = ax + b (drops the power-rule coefficient when solving, not just when differentiating).
- id: dropped-coefficient
  description: Solves 2ax = m - b as if the coefficient on x were 1.
- id: sign-error
  description: Reports the negative of the correct x-coordinate.
- id: tangent-through-origin
  description: Forgets to solve for the y-intercept (writes the line as if it passed through the origin).
- id: uses-function-value-as-intercept
  description: Uses f(p) directly as the y-intercept instead of f(p) - slope*p.
- id: swapped-slope-and-intercept
  description: Swaps which computed number is the slope and which is the intercept.
