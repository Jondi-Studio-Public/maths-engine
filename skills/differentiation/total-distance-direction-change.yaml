id: total-distance-direction-change
name: Total distance when a particle changes direction
domain: differentiation
description: 'Find the distance travelled by a particle moving on a line when it turns round in the interval: find when the
  velocity is zero, split the interval there and add the sizes of the changes in position, or integrate the speed when the
  velocity is given. Contrasts total distance with displacement and average speed with average velocity.'
status: active
placement_eligible: false
