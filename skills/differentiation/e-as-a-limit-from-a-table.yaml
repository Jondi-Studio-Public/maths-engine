id: e-as-a-limit-from-a-table
name: Find the number e from tables of (a^h - 1)/h
domain: differentiation
year_level: ['12']
description: >-
  Read tables of (a^h - 1)/h at small values of h and use them to find the number e, the base for which the limit is 1,
  as the gradient of y = a^x at (0, 1). Easy picks the base from tables at two small h. Medium adds a large-h row built
  to mislead, so the trend down each column has to be followed. Hard interpolates between two bases for the base whose
  limit is a stated value other than 1, or scales a limit to a base that is a power of the tabulated one. The exam chain reads two limits, finds
  the base by interpolation (carried forward) and finds where the tangent at (0, 1) meets the x-axis. Distinct from
  senior-estimate-the-limit-of-frac-a-h-1, which estimates the limit for one stated base and does not identify e.
status: active
placement_eligible: false
prerequisites:
- senior-estimate-the-limit-of-frac-a-h-1
answer: number
sources:
- topic: w5b_e_limit_table
  params: {}
  difficulty: easy
  stages: [0, 1, 2]
- topic: w5b_e_limit_table
  params: {}
  difficulty: medium
  stages: [3, 4]
- topic: w5b_e_limit_table
  params: {}
  difficulty: hard
  stages: [5, 6, maintenance]
