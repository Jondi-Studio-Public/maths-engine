  params: {tier: exam}
  difficulty: exam
  stages: [exam]
difficulty_progression:
  easy:
    steps: 2
    demand: "Compare each base's last-row value with 1 and choose the nearest."
  medium:
    steps: 3
    demand: "Follow each column down to the value it settles on, ignoring the large-h row that looks nearest 1, then compare with 1."
  hard:
    steps: 4
    demand: "Interpolate on the limits between two bases to reach a stated limit, or recognise that (a^k)^h = a^(kh) multiplies the limit by k and scale it."
  exam:
    steps: 5
    demand: "Read a limit from each table, interpolate the base from the two limits you found, then use the limit to find where the tangent at (0, 1) meets the x-axis."
misconceptions:
- id: picks-base-from-the-coarsest-row
  description: Choosing the base whose value in the largest-h row is nearest 1, instead of following each column down to the value it settles on as h shrinks.
- id: gives-the-limit-instead-of-the-base
  description: Giving the value the quotient tends to (1) where the base that produces it was asked for.
- id: midpoint-of-the-two-bases-used
  description: Taking the halfway point between the two bases instead of interpolating on the quotient.
- id: interpolation-ratio-inverted
  description: Interpolating with the ratio the wrong way round.
- id: limit-not-scaled-by-the-exponent
  description: Giving the limit for the original base for a base that is a power of it, ignoring that (a^k)^h = a^(kh) multiplies the limit by k.
- id: tangent-intercept-sign-dropped
  description: Giving the tangent's x-intercept with the wrong sign; the tangent at (0, 1) rises to the right, so it meets the axis on the left.
tags: [acara-senior-v8-4, differentiation, euler-number, limits, acmmm099]
