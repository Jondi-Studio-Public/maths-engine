id: differentiate-ln-composite
name: Differentiate natural logarithms of composite functions
domain: differentiation
year_level: ['12']
description: Differentiate ln f(x) for composite arguments as f'(x)/f(x), simplify products, quotients and roots with the
  laws of logarithms first, and find gradients at a point.
