misconceptions:
- id: dropped-a-coefficient
  description: Reports f'(x) + b*g'(x), silently treating the coefficient a as 1 instead
    of applying the stated value.
- id: sign-error-on-one-term
  description: Flips the sign of one of the two scaled terms, e.g. reporting a*f'(x) -
    b*g'(x) when both terms should add.
- id: swapped-coefficients
  description: Reports b*f'(x) + a*g'(x), applying each constant to the wrong derivative.
- id: exam-translation-slip
  description: At the exam tier, reads the stated English combination with the wrong
    sign (e.g. reads "minus" as "plus"), dropping the sign the words state.
