id: senior-recognise-and-use-linearity-properties-of-the-derivative
name: Recognise and use linearity properties of the derivative
domain: differentiation
year_level: ['11']
description: 'Given two differentiable functions f and g whose derivatives f''(x) and
  g''(x) are stated as expressions, and constants a and b, compute the derivative of
  a*f(x) + b*g(x) as a*f''(x) + b*g''(x). Easy draws a, b as positive small integers with
  f''(x)/g''(x) already simplified. Medium allows a or b negative. Hard hands f''(x)/g''(x)
  in an UNSIMPLIFIED form (e.g. "3x + 2x" instead of "5x"), so the learner must simplify
  before combining. Exam states the combination in WORDS instead of bare a/b (e.g. "h(x)
  is twice f(x) minus three times g(x)"), so the learner must translate English into the
  coefficients before applying linearity. Never hands a bare polynomial to differentiate
  from scratch (differentiate-polynomial), never uses the first-principles limit definition
  (senior-define-the-derivative-f-left-x-right-as), and never composes or multiplies two
  functions (senior-apply-the-product-quotient-and-chain-rule-to) -- this skill only scales
  and adds two already-given derivatives.'
status: active
placement_eligible: false
prerequisites:
- differentiate-polynomial
answer: expression
