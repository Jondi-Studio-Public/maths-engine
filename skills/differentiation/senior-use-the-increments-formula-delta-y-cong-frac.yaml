misconceptions:
- id: used-exact-change-not-approx
  description: Reports the true exact change f(x0+δx) - f(x0) instead of the linear estimate.
- id: forgot-to-multiply-by-dx
  description: Reports the derivative value (plus f(x0) at the hard tier) without multiplying by δx.
- id: sign-error-on-dx
  description: Uses the negative of the stated δx in the increments formula.
- id: forgot-to-add-f-of-x0
  description: Reports just the estimated increment, omitting the addition of f(x0) when asked for the new value.
