misconceptions:
- id: inverse-trig-sign-flip
  description: Uses the wrong sign on the derivative (confuses arcsine's and arccosine's formulas, or flips arctangent's).
- id: inverse-trig-dropped-sqrt
  description: Drops the square root in the arcsine/arccosine derivative formula.
- id: confused-with-direct-trig-derivative
  description: Differentiates as if the function were the plain (non-inverse) trig function instead.
- id: chain-rule-forgot-inner-factor
  description: Uses the bare inverse-trig derivative formula without the chain-rule factor from a scaled inner argument.
- id: chain-rule-forgot-affine-intercept
  description: Uses only the linear coefficient of the inner argument, dropping its constant term, when applying the chain rule.
