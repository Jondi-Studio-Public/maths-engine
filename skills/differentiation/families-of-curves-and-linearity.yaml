id: families-of-curves-and-linearity
name: Families of curves and linearity of the derivative and integral
domain: differentiation
description: A derivative fixes a function only up to a constant, so f'(x) gives the family F(x) + C and one point picks the
  member; and because differentiation and integration are linear, a combination r f + s g can be handled from what is known
  about f and g separately. Easy takes the derivative of a combination at a point, medium the integral of a combination over
  an interval from given partial integrals, hard builds the combination of two members of families from their derivatives
  and one value each; the exam tier finds the antiderivative, the constant, a value, and an integral by linearity.
