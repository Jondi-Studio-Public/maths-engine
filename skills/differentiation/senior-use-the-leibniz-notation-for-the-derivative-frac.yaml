misconceptions:
- id: power-rule-drop
  description: Reports A*p, dropping the factor of 2 from the power rule.
- id: sign-error
  description: Reports the negative of the correct derivative value.
- id: dropped-linear-term
  description: Drops the linear coefficient B from the derivative formula before evaluating.
- id: confuses-derivative-with-value
  description: Reports f(p), the function's value at the point, instead of its derivative there.
- id: evaluates-instead-of-solves
  description: Plugs the stated derivative value T into the derivative formula as if T were the point, instead of solving for the point that produces T.
- id: sign-error-on-solve
  description: Solves the correspondence equation with the stated derivative value negated.
- id: ignored-b-in-solve
  description: Drops the linear coefficient B from the equation before solving for the point.
