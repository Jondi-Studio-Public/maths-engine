misconceptions:
- id: reads-first-coarsest-row-not-the-trend
  description: Reports the table's own h=0.1 row value as the limit instead of extrapolating the trend toward the smallest-h row, mistaking a nearby approximation for the limit itself.
- id: confuses-difference-quotient-with-h-equals-1
  description: Reports a - 1 (the value of (a^h-1)/h at h=1) instead of extrapolating the table's own trend as h -> 0, mistaking a finite-difference estimate at h=1 for the limit.
- id: sign-error-on-the-estimate
  description: Reports the negative of the correct rounded estimate, a sign slip that a learner who has not checked the table's own trend direction (positive for a>1, negative for a<1) would not catch.
- id: assumes-limit-is-always-positive
  description: For a in (0,1), expects a positive limit by analogy with the a>1 case, missing that the table's own values trend to a negative number.
- id: exam-compares-a-values-not-magnitudes
  description: 'Exam tier: assumes the side with the larger a always has the larger-magnitude estimated limit, without checking that one side''s limit is negative -- fails when the negative side''s magnitude is actually larger.'
