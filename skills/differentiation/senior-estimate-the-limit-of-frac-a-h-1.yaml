id: senior-estimate-the-limit-of-frac-a-h-1
name: 'Estimate the limit of (a^h-1)/h as h->0 using technology, for various values of a>0'
domain: differentiation
description: 'Given bounded, fully specified inputs, estimate the limit of (a^h-1)/h as h->0 using technology, for various values of a>0. Return the resulting value, expression, relation, or classification. Presents a table of (a^h-1)/h at decreasing positive h for a stated a, computed as a learner''s own calculator would show it, and asks the learner to estimate the limit from the table''s trend as an MCQ over rounded numerals -- never an exact closed-form value, which the learner never sees or types. Does not assess unbounded investigations, unstated assumptions, or assessment modes outside capability_gate.'
status: active
placement_eligible: false
prerequisites:
- differentiate-polynomial
answer: mcq
