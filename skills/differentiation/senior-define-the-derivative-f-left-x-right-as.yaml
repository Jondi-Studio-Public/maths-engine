misconceptions:
- id: forgot-to-divide-by-h
  description: Reports f(x+h)-f(x) without dividing by h.
- id: dropped-h-term
  description: Drops the term containing h before it has actually been taken to the limit.
- id: sign-error-on-difference
  description: Computes (f(x)-f(x+h))/h, the numerator order reversed.
- id: forgot-to-take-limit
  description: Keeps the term containing h instead of letting it vanish as h approaches 0.
- id: dropped-linear-term
  description: Drops the derivative's constant (linear coefficient) term entirely.
- id: forgot-power-multiply
  description: Differentiates x**2 as x instead of 2x (forgets the power-rule coefficient).
