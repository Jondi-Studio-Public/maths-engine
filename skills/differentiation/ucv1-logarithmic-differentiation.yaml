id: ucv1-logarithmic-differentiation
name: Differentiate by taking logarithms
domain: differentiation
year_level:
- university
description: Differentiate functions with a variable exponent, such as x to the power of sin x, and long products and quotients
  of powers, by taking logarithms first; evaluate the result at a point.
status: active
placement_eligible: false
prerequisites:
- differentiate-chain-rule
