id: senior-use-exponential-functions-and-their-derivatives-to-solve
name: Use exponential functions and their derivatives to solve practical problems
domain: differentiation
description: 'Given bounded, fully specified inputs, use exponential functions and their derivatives to solve practical problems. Return the resulting value, expression, relation, or classification.'
status: active
placement_eligible: false
prerequisites: [differentiate-polynomial]
capability_gates: [modelling]
answer: number
sources:
- topic: p12c_exp_deriv_apply
  params: {mode: rate_at_zero}
  difficulty: easy
  stages: [6]
- topic: p12c_exp_deriv_apply
  params: {mode: rate_at_t}
  difficulty: medium
  stages: [6]
- topic: p12c_exp_deriv_apply
  params: {mode: time_for_rate}
