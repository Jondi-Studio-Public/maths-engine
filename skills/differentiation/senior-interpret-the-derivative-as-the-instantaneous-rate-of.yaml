misconceptions:
- id: evaluated-function-value
  description: Reports f(x) at the stated point instead of f'(x), the value rather than the rate of change.
- id: dropped-power-rule-coefficient
  description: Differentiates the leading term without multiplying by its power (e.g. A*x^3 as A*x^2 instead of 3*A*x^2).
- id: used-wrong-point
  description: Evaluates the derivative at the un-adjusted point instead of the derived evaluation point (exam tier only).
- id: sign-error
  description: Negates the correctly computed instantaneous rate of change.
