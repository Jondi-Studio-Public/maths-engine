misconceptions:
- id: evaluates-value-not-rate
  description: Evaluates H(t) (the modelled quantity's value) instead of dH/dt (its rate of change).
- id: dropped-chain-rule-factor
  description: Differentiates a*sin(bt) as a*cos(bt), dropping the chain-rule factor b.
- id: sign-error-on-derivative
  description: Reports the negative of the correct rate of change.
- id: solves-value-equation-not-rate-equation
  description: On hard/exam tiers, solves H(t) = target instead of dH/dt = target, forgetting to
    divide the inverse-cosine angle by b when isolating t.
- id: sign-error-on-target
  description: On hard tier, looks up arccos(-k) instead of arccos(k), a sign error on the stated target.
- id: ignores-trig-evaluation
  description: On medium tier, reports a*b directly, as if cos(bt) were always 1.
