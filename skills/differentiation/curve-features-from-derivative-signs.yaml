misconceptions:
- id: curve-increasing-decreasing-swapped
  description: Gives the intervals where f is decreasing when increasing was asked for, or the reverse.
- id: curve-drops-one-interval
  description: Gives only one of the two intervals on which the derivative has the required sign.
- id: curve-includes-stationary-points
  description: Writes closed endpoints that include the stationary points, when open intervals were asked for.
- id: curve-splits-at-inflexion-stationary-point
  description: Breaks an interval at a stationary point where f' touches zero but does not change sign.
- id: curve-concave-up-down-swapped
  description: Gives the intervals of concave down when concave up was asked for, or the reverse.
- id: curve-concavity-from-first-derivative
  description: Reads concavity from the sign of f' instead of the sign of f''.
- id: curve-vertex-without-halving
  description: Leaves the factor 2 out when differentiating f' = ax^2 + bx + c, so the point of change of concavity is twice too far.
- id: curve-only-first-condition
  description: Answers for the first of two stated conditions and ignores the other.
tags: [senior, differentiation, curve-sketching, concavity, acmmm112, year-12]
