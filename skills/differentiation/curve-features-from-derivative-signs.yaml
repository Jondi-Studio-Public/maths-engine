id: curve-features-from-derivative-signs
name: Curve features from the signs of f' and f''
domain: differentiation
year_level: ['12']
description: Read where a function is increasing or decreasing and where its graph is concave up or down from the sign of f' and f'' given as a formula, including a squared factor, and combine the two; then find stationary points and the point of inflection of a cubic.
status: active
placement_eligible: false
prerequisites:
- stationary-points
- second-derivative
answer: inequality
