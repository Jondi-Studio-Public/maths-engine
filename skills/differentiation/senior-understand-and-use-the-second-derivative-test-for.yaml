id: senior-understand-and-use-the-second-derivative-test-for
name: Understand and use the second derivative test for finding local maxima and minima
domain: differentiation
year_level: ['12']
description: Given a function with exactly one critical point where its first derivative is zero (by construction, on every question), find that critical point's x-value and use the second derivative test to classify it as a local maximum or a local minimum. Functions where the test is genuinely inconclusive (f''(x0) = 0) never appear; the test is never asked to answer "inconclusive". The graded answer is the x-value followed by the classification, typed as two items separated by a comma (e.g. "3, local maximum") -- graded as an ordered_list because a pair grader cannot compare a text classification component.
status: active
placement_eligible: false
