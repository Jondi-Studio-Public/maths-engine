misconceptions:
- id: flipped-classification
  description: Reports the correct critical x-value but the wrong classification -- flips local maximum and local minimum, the natural sign-convention error for this skill.
- id: treats-zero-first-derivative-as-inconclusive
  description: Reports the critical point as "neither maximum nor minimum", mistaking f'(x0) = 0 itself for evidence the test cannot classify the point.
- id: sign-error-on-critical-x-value
  description: Reports the correct classification but the wrong x-value -- a sign error solving f'(x) = 0 (reports the negative of the true critical point).
