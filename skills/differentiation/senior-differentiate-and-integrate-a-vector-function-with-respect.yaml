misconceptions:
- id: evaluated-position-not-velocity
  description: Reports the position vector at the stated time instead of the velocity vector.
- id: forgot-power-rule-coefficient
  description: Differentiates each component's squared term as if it were linear, forgetting the power-rule coefficient.
- id: sign-error-both-components
  description: Reports the negative of the correct velocity vector.
- id: forgot-chain-rule-both-components
  description: Differentiates as if the inner argument had coefficient 1, forgetting the chain-rule factor on both components.
- id: sign-confused-trig-derivative
  description: Confuses the sine derivative with the cosine derivative's sign, or evaluates at the wrong point.
- id: sign-error-exponential-component
  description: Reports the negative of the correct exponential-component derivative.
- id: used-velocity-instead-of-integrating
  description: Reports the velocity vector at the stated time instead of integrating to find displacement.
- id: botched-power-rule-antiderivative
  description: Antidifferentiates as if the variable's own antiderivative were itself, instead of applying the power rule in reverse.
