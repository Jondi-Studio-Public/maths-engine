id: methods-optimisation-context
name: Optimise a quantity described by a situation
domain: differentiation
description: Build a function of one variable from a described situation (a tin of fixed volume, a box folded from a rectangular
  sheet, a rectangle under a parabola, profit with a cubic cost, the point of a parabola nearest a point), state the allowed
  values, find the stationary point, reject a root outside the allowed values, and show with the second derivative that it
  is the greatest or least value. Easy asks for the function, medium for the optimising value, hard for the optimum value.
status: active
placement_eligible: false
