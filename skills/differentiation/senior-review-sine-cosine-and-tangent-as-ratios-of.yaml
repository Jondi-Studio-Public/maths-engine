misconceptions:
- id: uses-wrong-side-pairing
  description: States the ratio for the wrong pair of sides (e.g. gives sine when cosine was asked), which is the same value as the requested ratio for the OTHER acute angle.
- id: reports-the-reciprocal
  description: Reports the reciprocal of the correct ratio (e.g. adjacent/opposite instead of opposite/adjacent).
- id: repeats-the-given-ratio
  description: On the hard tier, restates the given ratio's value instead of deriving the newly-asked ratio.
- id: reports-the-third-ratio
  description: On the hard tier, computes the one named ratio that is neither given nor asked, confusing which ratio the question wants.
