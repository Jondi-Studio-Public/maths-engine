misconceptions:
- id: cofunction-swap
  description: Confuses the angle with its complementary (cofunction) angle.
- id: wrong-standard-angle
  description: Reports a different standard angle from the 30-45-60 family.
- id: sign-or-branch-error
  description: Reports the value with the wrong sign or from the wrong branch.
- id: treats-acos-as-odd
  description: For arccos of a negative input, negates the positive-input result instead of using pi minus it.
- id: forgot-to-apply-identity
  description: Returns the original stated ratio unchanged instead of computing the requested trigonometric ratio of the angle.
- id: used-wrong-ratio-of-the-triangle
  description: Uses a different side ratio of the right triangle than the one requested (e.g. tangent instead of sine).
- id: inverted-the-ratio
  description: Reports the reciprocal of the correct ratio.
