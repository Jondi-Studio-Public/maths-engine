misconceptions:
- id: chord-for-secant
  description: Uses the chord AB in place of the whole secant AM (e.g. TM^2 = AB x BM, or reports AB when AM is asked).
- id: no-square-root
  description: Reports AM x BM directly as TM instead of taking the square root.
- id: arithmetic-mean
  description: Reports the arithmetic mean of the two given lengths instead of applying AM x BM = TM^2.
- id: whole-secant-when-part-asked
  description: Reports the whole secant AM (or an intermediate value that stops short of subtracting BM) instead of continuing to the length actually asked for.
- id: tm-not-squared
  description: Uses TM (not TM^2) in the relation, e.g. computing AM = TM / BM instead of AM = TM^2 / BM.
- id: other-root-or-other-segment
  description: On the exam tier, reports the other segment of the secant (AM when BM was asked, or vice versa) instead of the one requested.
- id: pythagoras-slip
  description: On the through-centre exam variant, reports BM or AM as if it were MO, or uses TM + r in place of sqrt(TM^2 + r^2).
