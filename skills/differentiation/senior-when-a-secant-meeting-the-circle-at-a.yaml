id: senior-when-a-secant-meeting-the-circle-at-a
name: When a secant (meeting the circle at \(A\) and \(B\)) and a tangent (meeting the circle at \(T\)) are drawn to a circle from an external point \(M\), the square of the length of the tangent equals the product of the lengths to the circle on the secant. \((AM\times BM=TM^2)\)
domain: differentiation
description: >-
  Given two of the lengths AM, BM and TM for a secant through A and B and a tangent at T drawn from
  an external point M (M outside the circle, B between A and M), find the third using
  AM x BM = TM^2. easy states AM and BM and asks for TM; medium states TM and one of AM/BM and asks
  for the other; hard states BM and the chord AB (so the learner must first recover the whole
  secant AM = AB + BM) and asks for TM, or states TM and BM and asks for the chord AB; exam states
  TM and the chord AB and asks for BM or AM, solving the quadratic x(x + AB) = TM^2 and rejecting
  the negative root, or gives the secant through the circle's centre with a stated radius and asks
  for the distance MO. This is not `senior-the-alternate-segment-theorem` (angles, not lengths) and
  not `senior-when-two-chords-of-a-circle-intersect-the` (that skill's point is inside the circle,
  on two ordinary chords, with no tangent and no squared length -- this skill's point M is outside
  the circle and one side of the relation is a tangent length squared).
