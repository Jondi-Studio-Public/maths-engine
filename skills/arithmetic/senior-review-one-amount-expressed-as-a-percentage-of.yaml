misconceptions:
- id: swaps-the-base
  description: Computes B/A x 100 instead of A/B x 100, dividing by the wrong quantity.
- id: forgets-times-100
  description: Reports the raw ratio A/B without multiplying by 100 to convert it to a percentage.
- id: subtracts-instead-of-dividing
  description: Reports the difference between the two amounts as if that were the percentage.
- id: caps-at-100-percent
  description: When one amount exceeds the other, reports 100 unconditionally, as if a percentage of another amount could never exceed 100%.
