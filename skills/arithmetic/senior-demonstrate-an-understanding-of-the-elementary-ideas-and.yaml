id: senior-demonstrate-an-understanding-of-the-elementary-ideas-and
name: Demonstrate an understanding of the elementary ideas and notation of ratio
domain: arithmetic
description: Given two whole-number quantities, express their ratio in simplest
  whole-number a:b form.
status: active
placement_eligible: false
prerequisites:
- order-of-operations
answer: fraction
sources:
- topic: p19i_ratio_simplest_form
  params:
    tier: easy
  difficulty: easy
  stages:
  - 0
