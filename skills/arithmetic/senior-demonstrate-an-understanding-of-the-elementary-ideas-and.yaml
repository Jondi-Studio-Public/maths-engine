misconceptions:
- id: swaps-the-two-terms
  description: Reports the ratio with its two terms reversed (b:a instead of a:b).
- id: unreduced-wrong-pair
  description: On the medium tier, forms the ratio from the wrong pair of counts
    (one relevant count with the irrelevant third quantity) instead of the two
    counts the question actually asks to compare.
- id: denominator-as-term
  description: On the hard tier, uses the stated fraction's denominator directly
    as one ratio term instead of deriving the actual boys count from the total.
- id: wrong-power-of-ten
  description: On the exam tier, clears one decimal by the wrong power of 10 (100
    instead of 10), producing a genuinely different ratio.
