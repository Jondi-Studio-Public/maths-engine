misconceptions:
- id: confuses-speed-and-non-speed-rate
  description: Picks the wrong unit convention for the quantity -- swaps km/h and m/s ignoring the named reporting context (public display or broadcast versus an SI-unit scientific document), swaps pulse with breathing rate, or picks a scale alternative (per hour, per second, mL) instead of the conventional per-minute or per-hour unit.
- id: picks-wrong-clause-in-two-quantity-item
  description: On the hard tier, answers using the quantity that is NOT the one the question states is graded, when two quantities of the same scenario are named in one item.
- id: matches-wrong-named-source-in-exam-item
  description: On the exam tier, where one report states three figures from three named sources (always both km/h and m/s conventions live in the same item, plus one non-speed quantity), answers with the unit for a different named source's figure than the one the question asks about -- or defaults to whichever of km/h or m/s "sounds right" for the topic instead of checking which source is actually named.
