misconceptions:
- id: gives-the-dividend-per-share-as-the-total
  description: Writes the dividend per share in the dividend paid cell, without multiplying by the number of shares held.
- id: slips-a-decimal-place
  description: Multiplies correctly but puts the decimal point one place out, so the dividend paid is ten times too large or too small.
- id: leaves-a-holding-out-of-the-total
  description: Misses one company when adding up the dividend paid on the portfolio.
- id: totals-the-per-share-dividends
  description: Adds the dividends per share instead of the dividends paid on each holding.
- id: reads-the-percentage-as-dollars-per-share
  description: Treats a dividend of 3.2% of the share price as $3.20 per share instead of taking 3.2% of the price.
- id: ignores-the-share-price
  description: Takes the percentage dividend of the number of shares instead of finding the percentage of the share price first.
- id: divides-by-the-earnings-instead-of-the-price
  description: Finds the dividend yield by dividing the dividend per share by the earnings per share (the payout ratio) instead of by the share price.
- id: uses-the-dividend-paid-instead-of-the-dividend-per-share
  description: Divides the dividend paid on the whole holding by the share price to get the yield, instead of the dividend per share.
- id: inverts-the-price-to-earnings-ratio
  description: Divides the earnings per share by the share price instead of the share price by the earnings per share.
- id: divides-the-price-by-the-dividend
  description: Divides the share price by the dividend per share to get the P/E ratio, instead of by the earnings per share.
- id: applies-the-yield-to-the-earnings
  description: Finds the dividend per share by taking the yield of the earnings per share instead of the share price.
- id: divides-by-the-ratio-instead-of-multiplying
  description: Divides the earnings per share by the P/E ratio to find the share price, when the price is the ratio times the earnings.
- id: divides-by-the-share-price
  description: Divides the dividend paid by the share price to find the number of shares, instead of by the dividend per share.
