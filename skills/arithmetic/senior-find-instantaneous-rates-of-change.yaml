id: senior-find-instantaneous-rates-of-change
name: Find instantaneous rates of change
domain: arithmetic
description: Given bounded, fully specified inputs, find instantaneous rates of change. Return
  the resulting value, expression, relation, or classification.
status: active
placement_eligible: false
