misconceptions:
- id: average-rate-not-instantaneous
  description: Computes the average rate of change over [0, t0] (or the stated interval) instead
    of the instantaneous rate at the stated instant.
- id: evaluates-value-not-rate
  description: Evaluates Q(t0) (the modelled quantity's value) instead of Q'(t0) (its rate of
    change).
- id: dropped-power-rule-coefficient
  description: Differentiates a*t^n as if the power-rule coefficient were un-multiplied (e.g.
    treats d/dt[a*t^2] as a*t, or d/dt[a*t^3] as a*t^2).
- id: solves-value-equation-not-rate-equation
  description: On the hard tier, forgets to divide by the derivative's own leading coefficient
    when isolating t from Q'(t) = k.
- id: sign-error-on-derivative-or-solved-t
  description: Reports the negative of the correct rate of change, or the negative of the correct
    solved time.
