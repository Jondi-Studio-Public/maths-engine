misconceptions:
- id: truncates-instead-of-rounds
  description: Always rounds each operand down (truncates) to its own leading digit instead of rounding to the nearest one.
- id: same-fixed-place-for-every-operand
  description: Rounds every operand to the same fixed place (e.g. the nearest ten) instead of each operand's own leading digit.
- id: left-to-right-instead-of-precedence
  description: Evaluates the rounded expression strictly left to right instead of applying multiplication before addition.
