misconceptions:
- id: added-rate-and-quantity
  description: Adds the rate and the quantity/time instead of multiplying them.
- id: extra-unit-of-quantity
  description: Multiplies the rate by one extra unit of quantity/time.
- id: rate-only
  description: Gives the rate alone, forgetting to multiply by the quantity/time.
- id: known-value-as-unknown
  description: Gives the known total, rate or quantity/time back instead of solving for the actual unknown.
- id: multiplied-total-by-known
  description: Multiplies the total by the known rate or quantity/time instead of dividing.
- id: ignored-one-worker
  description: Computes the combined time using only one tap or worker's rate, ignoring the other entirely.
- id: multiplied-rates-instead-of-added
  description: Multiplies the two rates instead of adding them before dividing the shared total.
