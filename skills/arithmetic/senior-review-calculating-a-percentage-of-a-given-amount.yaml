misconceptions:
- id: divides-by-ten-not-hundred
  description: Treats the percent as if dividing by 10 instead of 100, giving a result ten times too large.
- id: subtracts-the-percentage-amount
  description: Reports the amount minus the percentage amount instead of the percentage amount itself.
- id: forgets-to-apply-percent-to-sum
  description: Reports the raw summed total of the two amounts instead of the percentage of that total.
- id: caps-at-the-whole-amount
  description: For a percent over 100, reports the original amount itself, as if a percentage could never exceed 100% of the whole.
