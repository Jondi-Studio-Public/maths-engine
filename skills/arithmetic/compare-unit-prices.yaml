misconceptions:
- id: picks-lower-total-price
  description: Picks the pack with the lower total sticker price instead of the lower unit price -- assuming the bigger pack (or the cheaper-looking sticker price) must be the better value.
- id: compares-without-converting-units
  description: Compares the two packs' raw prices or quantities without first converting them onto a common unit, when the units are mismatched (mL vs L, g vs kg, item vs dozen).
- id: rounds-before-comparing-declares-false-tie
  description: Rounds each pack's unit price to the nearest cent before comparing, so two prices that are exactly unequal (by a fraction of a cent) are wrongly declared a tie.
