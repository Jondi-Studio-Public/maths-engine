misconceptions:
- id: forgot-one-fixed-expense
  description: Drops the last fixed-expense item from the sum, as if only the earlier fixed expenses existed.
- id: added-instead-of-subtracted
  description: Adds the fixed (and, where present, discretionary) spending to the income instead of subtracting it.
- id: percentage-of-remainder
  description: 'Hard tier: applies the discretionary percentage to income after fixed expenses instead of to the whole income.'
- id: percent-read-as-dollars
  description: 'Hard tier: treats the stated percentage figure as a flat dollar amount instead of a percentage of income.'
