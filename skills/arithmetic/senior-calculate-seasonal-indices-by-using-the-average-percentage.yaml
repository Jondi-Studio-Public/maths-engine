misconceptions:
- id: averages-raw-values-not-percentages
  description: Averages the raw quarter values across years directly, skipping the percentage-of-year-mean step entirely.
- id: divides-by-seasons-not-years
  description: Divides the summed percentages by the number of seasons (4) instead of the number of years given (2) when averaging.
- id: uses-overall-mean-not-years-own-mean
  description: Uses the average of the two years' own means as a single overall denominator in the percentage step, instead of each year's own mean.
- id: forgets-the-adjustment-step
  description: On the exam tier, reports the unadjusted fourth-quarter index instead of scaling it so all four quarters sum to exactly 400.
