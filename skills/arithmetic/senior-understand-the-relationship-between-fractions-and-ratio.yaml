misconceptions:
- id: numerator-denominator-swapped
  description: Offers the flipped fraction (the whole over the named term's count)
    instead of the named term's count over the whole.
- id: wrong-named-term
  description: Uses the OTHER named term's count as the numerator instead of the
    one actually asked about.
- id: irrelevant-number-as-numerator
  description: On the exam tier, copies an irrelevant third stated number into the
    numerator instead of the correct named term's count.
- id: ratio-as-fraction-directly
  description: Treats the stated ratio a:b as the fraction a/b directly, instead
    of a/(a+b).
