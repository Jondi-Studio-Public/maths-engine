id: senior-understand-the-relationship-between-fractions-and-ratio
name: Understand the relationship between fractions and ratio
domain: arithmetic
description: Given a stated two-term ratio a:b, express the fraction of the whole
  that one named term represents (a/(a+b) or b/(a+b)).
status: active
placement_eligible: false
prerequisites: []
answer: fraction
