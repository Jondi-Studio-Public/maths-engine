misconceptions:
- id: adds-the-percentages
  description: Sums the stated percentages and applies the total as a single change to the original quantity, instead of compounding each change in turn.
- id: applies-only-the-first-change
  description: Applies only the first stated percentage change and ignores every change after it.
- id: applies-only-the-last-change
  description: Applies only the final stated percentage change to the original quantity, ignoring every earlier change.
