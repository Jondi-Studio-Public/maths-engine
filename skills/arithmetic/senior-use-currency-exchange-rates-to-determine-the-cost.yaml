misconceptions:
- id: wrong-direction
  description: Applies the other operation to the same rate and amount (multiplies when the rate is AUD-based and division was correct, or divides when the rate is foreign-based and multiplication was correct).
- id: treats-as-one-to-one
  description: Reports the foreign amount unchanged as the AUD value, as if the exchange rate were exactly 1.
- id: adds-the-rate
  description: Adds the exchange rate to the foreign amount instead of multiplying or dividing by it.
