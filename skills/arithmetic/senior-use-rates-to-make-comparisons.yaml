misconceptions:
- id: sum-instead-of-difference
  description: Adds the two rates instead of finding their difference.
- id: reports-larger-rate-only
  description: Reports the larger rate alone instead of the difference between the two.
- id: reports-smaller-rate-only
  description: Reports the smaller rate alone instead of the difference between the two.
- id: raw-totals-not-rates
  description: Compares the raw totals instead of computing each unit rate first.
- id: raw-quantities-not-rates
  description: Compares the raw quantities (hours/minutes) instead of the computed rates.
- id: mL-treated-as-litres
  description: Divides the mL-labelled pack price by its raw number, treating millilitres as if they were already litres.
- id: added-instead-of-subtracted-per-litre
  description: Adds the two per-litre prices instead of subtracting them.
