misconceptions:
- id: applies-the-other-named-strategy
  description: Applies front-end truncation when rounding to a stated place was asked, or the reverse.
- id: rounds-to-own-leading-digit-instead-of-stated-strategy
  description: Rounds each operand to its own leading digit (leading-digit approximation) instead of applying the strategy the question named.
- id: switches-strategy-partway
  description: Applies the named strategy to only some of the operands in a multi-step calculation instead of consistently to all of them.
