misconceptions:
- id: wrong-direction
  description: Applies the percentage adjustment in the wrong direction (adds a discount instead of subtracting it, or subtracts a GST/service-charge addition instead of adding it), then continues with the remaining step(s).
- id: dropped-non-percentage-step
  description: Reports only the percentage step's own result, never applying the flat add/subtract, multiply, or split step the situation also requires.
- id: dropped-percentage-step
  description: Applies only the non-percentage step to the original base amount, skipping the percentage-based step entirely.
- id: red-herring-as-relevant
  description: On the exam-tier situation, treats the stated irrelevant quantity (a red herring that plays no role in the calculation) as though it were part of the calculation -- most often using it in place of the genuine split divisor.
