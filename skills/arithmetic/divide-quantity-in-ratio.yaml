id: divide-quantity-in-ratio
name: Divide a quantity in a ratio
domain: arithmetic
description: Divide a supplied quantity into two shares in a supplied whole-number
  ratio.
status: active
placement_eligible: false
prerequisites:
- fraction-of-quantity
- ratio-rate-proportion
answer: pair
