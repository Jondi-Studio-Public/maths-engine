misconceptions:
- id: ignores-the-ratio
  description: Splits the quantity into two equal halves instead of using the
    stated ratio.
- id: swapped-ratio-terms
  description: Attaches the wrong ratio term to the wrong share -- on the hard
    tier, reports the second share as equal to the first (given) share instead
    of solving for it separately.
- id: off-by-one-denominator
  description: Divides using one more part than the ratio actually has (or, on
    the medium tier, divides the difference by the ratio's sum instead of its
    difference).
