id: proportional-vs-non-proportional
name: Distinguish proportional and non-proportional linear relations
domain: linear-relations
year_level:
- '8'
description: Use tables, equations, situations and lines through two points to decide whether y is a fixed multiple of x,
  so that the relation passes through the origin.
status: active
placement_eligible: false
