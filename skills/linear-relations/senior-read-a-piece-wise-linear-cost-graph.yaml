misconceptions:
- id: pwg-leaves-out-the-fixed-charge
  description: Leaves the fixed charge out of a cost read from, or built on, a graph that starts above zero.
- id: pwg-first-rate-for-all-units
  description: Applies the rate of the first section to all of the usage, though part of it lies in a later section with a different rate.
- id: pwg-reads-the-neighbouring-gridline
  description: Reads the graph one gridline away, the neighbouring usage, instead of the stated one.
- id: pwg-reads-the-rate-for-the-cost
  description: Gives the rate of the section where a cost was asked.
- id: pwg-reads-the-usage-for-the-cost
  description: Gives the stated usage back where the cost at that usage was asked.
- id: pwg-total-change-for-rate
  description: Gives the total rise in cost over the section instead of the rise for each extra unit.
- id: pwg-average-rate-for-gradient
  description: Divides the cost at the end of the section by the usage, the average cost per unit, instead of the rise over the run of that section.
- id: pwg-other-section-rate
  description: Gives the rate of a different section from the one between the stated usages.
- id: pwg-forgets-the-breakpoint-offset
  description: Finds only the extra units beyond the kink and does not add the usage at the kink back on.
- id: pwg-extends-from-the-origin
  description: Multiplies the last rate by the whole usage, as if the graph started at the origin with no fixed charge.
- id: pwg-kink-for-crossing
  description: Takes the kink of the two-section plan for the point where the two plans cost the same.
- id: pwg-reads-the-other-plan
  description: Reads the line of the other plan where the plan named in the question was asked.
- id: pwg-crossing-cost-for-usage
  description: Gives the cost at the point where the two plans meet where the usage at that point was asked.
