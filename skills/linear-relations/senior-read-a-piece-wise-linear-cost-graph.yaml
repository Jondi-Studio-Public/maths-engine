id: senior-read-a-piece-wise-linear-cost-graph
name: Read a piece-wise linear cost graph
domain: linear-relations
year_level: ['11']
description: Given a drawn cost graph made of two or three straight sections (for example a data, taxi or electricity charge with a fixed charge and a rate that changes at a kink), read the cost at a stated usage, the fixed charge, the rate of a section and the usage where the rate changes. Hard finds the usage that gives a stated cost and continues the last section beyond the drawing. The exam question puts two plans on one graph and finds the cost of one, the rate of the other, the usage where they cost the same and that common cost, with follow-through.
