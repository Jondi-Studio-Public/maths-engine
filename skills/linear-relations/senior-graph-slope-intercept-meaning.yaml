misconceptions:
- {id: intercept-as-rate, description: Gives the vertical intercept (the fixed amount) as the rate of change per
    unit.}
- {id: end-value-as-rate, description: 'Gives the value at the far end of the line, or at the first marked point,
    as the rate.'}
- {id: direction-of-change-reversed, description: 'Says a falling line rises, or a rising line falls.'}
- {id: slope-as-fixed-amount, description: Gives the slope (the rate) as the fixed fee or the starting amount.}
- {id: fixed-amount-as-rate, description: 'Says each unit adds the fixed amount: reads the intercept as a charge
    per unit.'}
- {id: first-point-as-fixed-amount, description: Takes the value at the first unit (fixed amount plus one rate)
    as the fixed amount.}
- {id: prediction-forgets-fixed-amount, description: Predicts a value by multiplying the rate by the count and leaving
    out the fixed amount.}
- {id: inverse-forgets-fixed-amount, description: Finds how many units give a stated amount by dividing it by the
    rate without taking away the fixed amount.}
difficulty_progression:
  easy: {steps: 2, demand: 'Read two marked points, find the rise over the run and give the rate with its unit and
      direction.'}
  medium: {steps: 2, demand: Read the value where the line meets the vertical axis and say what it stands for in
      the situation.}
  hard: {steps: 3, demand: Read the intercept and the slope and choose the sentence that names both the fixed amount
      and the rate correctly.}
  exam: {steps: 5, demand: 'Read the slope and the intercept, use the model to predict a value beyond the line,
      then solve for a count.'}
