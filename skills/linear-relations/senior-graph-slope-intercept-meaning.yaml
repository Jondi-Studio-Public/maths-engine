id: senior-graph-slope-intercept-meaning
name: Say what the slope and intercept of a straight-line graph mean in a practical situation
domain: linear-relations
year_level: ['11']
description: A straight-line graph models a practical situation (a plumber's cost against hours, a taxi fare against
  distance, water in a tank against time, battery charge against hours). Easy reads the slope as a rate with its
  units ('rises by $20 per day'), medium says what the vertical intercept means (the fixed fee or the starting amount),
  hard picks the statement that gets both the rate and the fixed amount right, and the exam chain reads the slope,
  then the intercept, then predicts a value with the model and finds how many units give a stated amount. A falling
  line appears from the medium tier. Every point read sits on a grid crossing.
status: active
