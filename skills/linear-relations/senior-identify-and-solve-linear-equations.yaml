misconceptions:
- id: wrong-classification
  description: Stated the opposite classification from the true one -- called a linear equation "not linear", or a non-linear equation "linear"
- id: right-classification-wrong-value
  description: Correctly classified the equation as linear but stated an incorrect solution (a sign error or a dropped/duplicated term)
- id: surface-pattern-misclassification
  description: Classified the equation from its surface shape -- a solvable-looking reciprocal, or a bracket pair that looks identical to a sibling equation -- without actually expanding, simplifying, or checking where the unknown sits
