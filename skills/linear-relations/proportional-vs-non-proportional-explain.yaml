misconceptions:
- id: increasing-means-proportional
  description: Believes any relationship where y increases with x is proportional.
- id: starting-fee-ignored
  description: Ignores a starting value, so a rule with a fixed fee is taken as proportional.
- id: compares-differences-not-ratios
  description: Compares the differences between y-values instead of the ratios y divided by x.
difficulty_progression:
  easy:
    steps: 4
    demand: Divide y by x for each pair in a table and compare.
  medium:
    steps: 4
    demand: Evaluate a rule at zero and another value and use y = 0 when x = 0 as the test.
  hard:
    steps: 4
    demand: Compare two real-world pricing plans for proportionality using ratios and the value at zero.
