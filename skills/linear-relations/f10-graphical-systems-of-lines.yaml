misconceptions:
- id: rounded-the-crossing-to-a-grid-point
  description: Reads a crossing that falls between grid lines as the nearest grid point instead of solving for it.
- id: x-and-y-swapped
  description: Writes the solution as (y, x) instead of (x, y).
