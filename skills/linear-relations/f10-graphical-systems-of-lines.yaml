id: f10-graphical-systems-of-lines
name: Find where two lines cross from their graphs
domain: linear-relations
year_level: ['10']
naplan_domain: []
description: Find the solution of a pair of simultaneous linear equations from two drawn lines. Read off a grid crossing, read both equations and solve for a crossing between grid lines, or combine a drawn line with a line given by a gradient and a point to find a crossing off the grid. Answers are typed points.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: [equation-from-graph, solve-simultaneous-equations]
answer: pair
