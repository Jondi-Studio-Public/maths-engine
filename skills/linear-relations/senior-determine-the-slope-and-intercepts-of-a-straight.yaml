misconceptions:
- id: swapped-m-and-c
  description: Gives the y-intercept first and the gradient second, writing (c, m) for (m, c).
- id: sign-error-on-m
  description: Reads the rise and run correctly but gives the wrong sign for the gradient (a falling line as rising, or the reverse).
- id: c-read-from-a-point
  description: Gives the y-coordinate of a plotted point as the y-intercept instead of where the line meets x = 0.
- id: inverted-gradient
  description: Gives run over rise, the reciprocal of the gradient.
- id: sign-error-on-c
  description: Gives the gradient correctly but the y-intercept with the wrong sign.
- id: m-counted-in-squares
  description: Counts rise and run in grid squares and ignores the scale on the axes, so the gradient is wrong whenever one grid step is not one unit on both axes.
- id: c-counted-in-squares
  description: Takes the y-intercept in grid squares instead of in the units on the y-axis.
