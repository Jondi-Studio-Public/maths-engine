id: senior-determine-the-slope-and-intercepts-of-a-straight
name: Determine the slope and intercepts of a straight-line graph from both its equation and its plot
domain: linear-relations
description: 'A straight line is drawn on a labelled grid and the learner types its gradient and
  y-intercept as the ordered pair (m, c). Nothing the key needs is printed: two points on the line are
  grid intersections at least two columns apart, and no equation, coordinate or rate appears in the
  prompt. Tier ladder by decision: easy draws the y-axis and the line meets it at a lattice point with
  a whole-number gradient, so c is read at the axis and m is rise over run; medium leaves the y-axis out
  of the window (x = 0 is not drawn) with a whole-number or half gradient, so c is found by running the
  line back to x = 0 along its slope; hard uses a fractional gradient (halves, thirds, quarters, three
  halves and so on) and puts the y-intercept outside the visible window, so c is extrapolated from the
  gradient, never read; exam gives the two axes different scales (a grid step is not one unit on both),
  so the decision is converting rise and run to the units on the axis labels instead of counting
  squares. This skill reads the abstract pair (m, c) off a bare graph; it does not read the gradient
  alone (rate-of-change), build an equation from stated information
  (senior-find-the-equation-of-a-straight-line-given) or ask the sign only
  (senior-recognise-features-of-the-graph-of-y-mx).'
