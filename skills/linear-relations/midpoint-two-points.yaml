id: midpoint-two-points
name: Calculate the midpoint of two Cartesian points
domain: linear-relations
description: Calculate the exact midpoint ordered pair of two supplied Cartesian points.
status: active
placement_eligible: false
prerequisites:
- coordinate-plane-readiness
- integer-arithmetic
answer: pair
sources:
- topic: midpoint_two_points
  params: {coord_lo: 0, coord_hi: 6}
  difficulty: easy
  stages: [0, 1, 2]
- topic: midpoint_two_points
  params: {coord_lo: -8, coord_hi: 8}
  difficulty: medium
  stages: [3, 4]
- topic: midpoint_two_points
