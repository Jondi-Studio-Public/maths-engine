misconceptions:
- id: subtract-instead-of-average
  description: Subtracts the two points' coordinates instead of averaging them.
- id: halve-one-coordinate
  description: Halves one coordinate's sum but forgets to halve the other, leaving it as the raw sum.
- id: omits-division
  description: Sums each pair of coordinates and stops, never dividing by two.
- id: averages-known-point-and-midpoint
  description: When finding the other endpoint from one endpoint and the midpoint, averages the known point and the midpoint instead of reflecting the midpoint through the known point (B = 2M - A).
