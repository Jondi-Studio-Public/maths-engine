misconceptions:
- id: region-on-the-wrong-side-of-the-line
  description: Chooses the region above the line when it is below, or the reverse.
- id: boundary-point-handled-the-wrong-way
  description: Includes a point on a strict boundary (> or <), or leaves out a point on an inclusive one (≥ or ≤).
- id: only-one-condition-checked
  description: Tests a point against one of two conditions and stops.
