misconceptions:
- id: reports-a-place-that-fits-as-a-counterexample
  description: Names a row or step that agrees with the conjecture as a counterexample, usually because the arithmetic was not checked.
- id: accepts-the-conjecture-after-checking-only-some-places
  description: Decides that no counterexample exists after checking only the first few rows or steps.
- id: compares-changes-without-allowing-for-the-x-step
  description: Compares the raw change in y across steps of different size in x, instead of the change in y for each 1 in x, and so calls a step that fits a counterexample.
