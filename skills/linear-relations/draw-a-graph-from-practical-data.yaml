id: draw-a-graph-from-practical-data
name: Draw a graph from data for a practical situation
domain: linear-relations
year_level: ['12']
description: 'Plot the points of a practical relationship on a blank grid. Easy: a table of values. Medium: a fixed charge plus a rate in words, evaluated then plotted. Hard: a tiered rate, a balance that runs down, or a rule found from two readings. The exam chain plots three readings, then finds the fixed charge, the rate and a prediction. Distinct from plot-a-point-from-coordinates, which gives the coordinates.'
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: [plot-a-point-from-coordinates]
answer: points
sources:
- topic: dr1_graph_from_data
  params:
    tier: easy
  difficulty: easy
  stages: [0, 1, 2]
- topic: dr1_graph_from_data
  params:
