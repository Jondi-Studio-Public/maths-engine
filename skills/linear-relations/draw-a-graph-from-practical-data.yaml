  difficulty: exam
  stages: [exam]
misconceptions:
- id: dr1-data-point-omitted
  description: Leaves out one of the readings, so the graph has a point fewer than the data.
- id: dr1-fixed-charge-omitted
  description: Leaves out the fixed starting amount and uses only the rate multiplied by the input.
- id: dr1-rate-and-fixed-swapped
  description: Swaps the fixed amount and the rate, using the rate as the starting amount and the fixed amount as the rate.
- id: dr1-pairs-mismatched
  description: Pairs a value with the wrong partner, so the points do not match the data.
- id: dr1-off-by-one
  description: Reads or counts one unit too many or too few.
- id: dr1-first-reading-for-intercept
  description: Gives the first reading as the starting amount instead of working back to the value at zero.
- id: dr1-total-change-for-rate
  description: Gives the change between two readings without dividing by the gap between them.
- id: dr1-last-reading-restarted
  description: Adds the full prediction on to the last reading instead of from the starting amount.
difficulty_progression:
  easy: {steps: 1, demand: 'Plot the points of a table of values.'}
  medium: {steps: 2, demand: 'Evaluate a fixed charge plus a rate for each input, then plot.'}
  hard: {steps: 3, demand: 'Find the values from a tiered rate, a falling balance or two readings, then plot.'}
  exam: {steps: 5, demand: 'Chain the plotted readings, the fixed charge, the rate and a prediction.'}
