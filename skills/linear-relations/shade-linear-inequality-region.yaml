id: shade-linear-inequality-region
name: Shade the region of a linear inequality
domain: linear-relations
year_level:
- '10'
naplan_domain: []
description: Shade the region of the plane that satisfies one or more linear inequalities, with a solid or dashed boundary,
  on an interactive grid or by typing the inequalities.
status: active
