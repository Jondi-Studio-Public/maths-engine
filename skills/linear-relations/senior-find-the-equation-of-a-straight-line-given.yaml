misconceptions:
- id: reversed-rise-run
  description: Reversing rise and run when computing gradient from two points
- id: used-total-not-change
  description: Using total values (y/x) instead of the change between two points ((y2-y1)/(x2-x1)) when computing gradient
- id: swapped-intercept-sign
  description: Negating the intercept but keeping the gradient
- id: used-perpendicular-gradient
  description: Using the perpendicular gradient (-1/m) when a parallel line (same gradient) is required
- id: reused-reference-intercept
  description: Keeping the reference line's intercept instead of computing the new intercept for the given point
- id: used-same-gradient
  description: Using the same gradient instead of the perpendicular gradient
