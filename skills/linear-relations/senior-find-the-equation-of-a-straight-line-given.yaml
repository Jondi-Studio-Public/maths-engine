id: senior-find-the-equation-of-a-straight-line-given
name: Find the equation of a straight line given sufficient information; parallel and perpendicular lines
domain: linear-relations
description: Given bounded, fully specified inputs, find the equation of a straight line given sufficient information; parallel and perpendicular lines. Never given the information as a table or graph; the input is written in prose/coordinate form. This skill goes further than rate-of-change (which computes only the gradient value) — the full equation (both gradient and intercept) is produced, plus parallel/perpendicular construction.
status: active
placement_eligible: false
prerequisites:
- rate-of-change
answer: expression
