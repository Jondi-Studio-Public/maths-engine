id: graph-y-mx
name: Match proportional relations to their graphs
domain: linear-relations
description: 'A straight line through the origin is shown on a labelled grid and the learner picks the equation y = mx that matches it, from four text options. The prompts ask the learner to read the graph and do not ask them to draw, plot or sketch anything. Easy has a whole-number gradient; medium a negative or fractional gradient; hard gives the axes different scales, so the gradient is read in axis units. Options include an equation with an unstated intercept added.'
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites:
- rate-of-change
- plot-linear-points
- ratio-rate-proportion
answer: mcq
sources:
- topic: fg1_proportional_graph
  params: {tier: easy}
  difficulty: easy
  stages: [0, 1, 2]
- topic: fg1_proportional_graph
  params: {tier: medium}
  difficulty: medium
  stages: [3, 4]
- topic: fg1_proportional_graph
  params: {tier: hard}
  difficulty: hard
  stages: [5, 6, maintenance]
misconceptions:
- id: sign-error-on-gradient
  description: Reads the size of the gradient correctly but gives it the wrong sign.
- id: adds-an-unstated-intercept
  description: Adds a constant to a proportional relation, although the line passes through the origin.
- id: gradient-off-by-one
  description: Reads the gradient one more or one less than it is.
- id: inverted-gradient
  description: Writes run over rise as the gradient.
- id: gradient-counted-in-squares
  description: Counts the gradient in grid squares and ignores the scale on each axis.
tags: [acara-f10-v9, linear-relations, ac9m8a02, figure]
