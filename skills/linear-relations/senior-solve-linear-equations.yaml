id: senior-solve-linear-equations
name: Solve linear equations
domain: linear-relations
description: Solve a linear equation in one variable whose coefficients include algebraic fractions, with the unknown appearing on both sides. Every equation this skill generates is already known to be linear -- it never asks the learner to judge linearity (senior-identify-and-solve-linear-equations covers that) and never reads a solution off a graph (the deferred solve-linear-equations-graphically covers that).
