misconceptions:
- id: wrong-side-collection
  description: Collected the unknown terms on the wrong side when isolating x, flipping the sign of the whole coefficient (subtracted where the correct move was to add, or vice versa)
- id: partial-clear-denominator
  description: Cleared the denominator on only part of the equation -- distributing the cleared multiplier to some terms but not every fraction term -- leaving a term that should have been cleared still effectively divided
- id: sign-error-clearing-denominator
  description: Distributed a negative sign incorrectly across a numerator while combining fraction terms over a common denominator, leaving one term's sign unflipped
