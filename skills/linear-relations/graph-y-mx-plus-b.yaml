id: graph-y-mx-plus-b
name: Match linear relations in slope-intercept form to their graphs
domain: linear-relations
year_level: ['8']
naplan_domain: [algebra]
description: 'A straight line is shown on a labelled grid and the learner picks the list of (x, y) pairs, written as a table of values, that all lie on it. The prompts ask the learner to read the graph and do not ask them to draw, plot or sketch anything. Easy has a whole-number gradient and the y-axis drawn; medium has a negative or fractional gradient; hard leaves the y-axis out of the window. Options come from leaving out the intercept, a sign error, swapped coordinates and a swapped gradient and intercept.'
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites:
- graph-y-mx
- intercept
- gradient-from-graph
answer: mcq
sources:
- topic: fg1_line_table
  params: {tier: easy}
  difficulty: easy
  stages: [0, 1, 2]
- topic: fg1_line_table
  params: {tier: medium}
  difficulty: medium
  stages: [3, 4]
- topic: fg1_line_table
  params: {tier: hard}
  difficulty: hard
  stages: [5, 6, maintenance]
misconceptions:
- id: intercept-left-out
  description: Uses y = mx and leaves out the intercept, so every pair is shifted.
- id: sign-error-on-gradient
  description: Gets the intercept right but the gradient with the wrong sign.
- id: sign-error-on-intercept
  description: Gets the gradient right but the intercept with the wrong sign.
- id: coordinates-reversed
  description: Writes each pair as (y, x) instead of (x, y).
- id: one-pair-off-by-one-square
  description: Reads one of the pairs one gridline away from where the line is.
- id: gradient-and-intercept-swapped
  description: Uses the intercept as the gradient and the gradient as the intercept.
tags: [acara-f10-v9, linear-relations, ac9m8a02, figure]
