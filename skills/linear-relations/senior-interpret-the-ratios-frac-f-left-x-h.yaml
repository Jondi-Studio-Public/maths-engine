misconceptions:
- id: tangent-slope-at-first-point
  description: Reads the slope of the line that only touches the curve at the first point (the tangent) instead of the chord that meets the curve again at the second stated x-value.
- id: reciprocal
  description: Divides run by rise instead of rise by run.
- id: sign-flipped
  description: Gives the slope with the wrong sign, for example flipping it because h is negative or because the curve heads the other way at one end.
- id: rise-only
  description: Gives the change in height between the two points without dividing by the change in x.
- id: curve-height-difference-over-wrong-run
  description: Divides the change in height by the wrong run, such as the second x-value, instead of the difference of the two x-values.
- id: average-of-heights
  description: Averages the two heights of the curve instead of finding how fast it changes between them.
