id: senior-interpret-the-ratios-frac-f-left-x-h
name: Interpret the ratios (f(x+h)-f(x))/h and δy/δx as the slope of a chord
domain: linear-relations
description: Given the graph of y = f(x) with a chord drawn between two points of the curve at stated x-values (each at a grid intersection, coordinates not labelled), state the slope of the chord. The ratio (f(x+h)-f(x))/h, including a negative h, is that slope.
