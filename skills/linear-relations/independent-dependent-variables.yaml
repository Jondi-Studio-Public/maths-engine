misconceptions:
- id: w5v-swaps-the-roles
  description: Swaps the independent and dependent variables.
- id: w5v-picks-a-fixed-amount
  description: Chooses a fixed amount, such as a rate or a starting charge, as a variable.
- id: w5v-irrelevant-quantity
  description: Chooses a quantity that plays no part in the relationship.
- id: w5v-axis-position-decides
  description: Decides which variable is independent by the axis it is drawn on.
- id: w5v-forgets-the-fixed-amount
  description: Leaves out the fixed starting amount when working out the dependent value.
- id: w5v-adds-instead-of-multiplies
  description: Adds the rate and the independent value instead of multiplying them.
- id: w5v-multiplies-the-fixed-amount
  description: Multiplies the fixed starting amount by the independent value as well.
- id: w5v-off-by-a-step
  description: Adds one extra step of the rate to the dependent value.
difficulty_progression:
  easy:
    steps: 2
    demand: Name the independent or the dependent variable in a situation with a clear rule, separating variables from fixed
      amounts and irrelevant details.
  medium:
    steps: 3
    demand: Name both variables, including situations where time is the dependent variable.
  hard:
    steps: 5
    demand: Name a variable when the graph's axes are described in the opposite way to the usual, or when asked which quantity
      changes as a result.
  exam:
    steps: 6
    demand: Chain the independent variable, the dependent variable and the value of the dependent variable for a given value
      of the independent variable.
