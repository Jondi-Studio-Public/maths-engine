id: independent-dependent-variables
name: Identify independent and dependent variables
domain: linear-relations
year_level:
- '7'
- '8'
description: Identify which quantity is chosen or changes first (independent) and which depends on it (dependent), including
  situations where time is not independent and where the axis a variable is drawn on gives no guide.
status: active
placement_eligible: false
prerequisites:
- variable-concept
- input-output-tables
