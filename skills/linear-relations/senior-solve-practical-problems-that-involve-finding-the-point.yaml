misconceptions:
- id: ignores-unit-cost
  description: Computes F/p, ignoring the unit cost entirely, as if all revenue were profit.
- id: adds-unit-cost
  description: Computes F/(p + v), adding the unit cost to the price instead of subtracting it from the price.
- id: rounds-down
  description: Rounds the exact non-integer break-even DOWN to the nearest whole unit instead of up, missing that a profit needs strict inequality.
- id: average-cost-as-unit-cost
  description: Uses the average total cost per unit at one of the two stated points (which already includes a share of the fixed cost) as if it were the marginal unit cost.
- id: fee-ignored
  description: Solves the break-even as if there were no percentage fee, ignoring the reduced margin.
- id: fee-on-cost
  description: Applies the percentage fee to the unit cost instead of the selling price.
