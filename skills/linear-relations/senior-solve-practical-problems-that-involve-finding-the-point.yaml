id: senior-solve-practical-problems-that-involve-finding-the-point
name: Solve practical problems that involve finding the point of intersection of two straight-line graphs;
  for example, determining the break-even point where cost and revenue are represented by linear equations
domain: linear-relations
description: From a stated fixed cost, cost per unit and selling price per unit, find the break-even quantity
  at which total cost equals total revenue -- the intersection of the cost line C = F + vq and the revenue
  line R = pq. easy states F, v and p directly for a whole-number break-even; medium keeps the same three
  givens but the exact break-even is not whole, so the smallest whole number of units for a profit must be
  rounded up; hard recovers v and F from two (quantity, total cost) points instead of stating them; exam
  adds a percentage sales fee that reduces the per-unit margin. This skill does not cover reading the
  intersection from a graph (the graphical method is dropped) and never hands over the two linear equations
  ready-formed, which is the neighbouring skill solve-simultaneous-equations.
status: active
placement_eligible: false
prerequisites: [rate-of-change]
answer: number
