misconceptions:
- id: first-point-cost
  description: Reads the total cost at the first plotted point on the line instead of at zero, giving the cost of the first few items rather than the fixed cost.
- id: rate-as-fixed-cost
  description: Gives the rate (the cost for each extra unit) as the fixed cost, taking the slope for the intercept.
- id: cost-at-largest-x
  description: Reads the total cost at the far right end of the line instead of where the line meets x = 0.
- id: grid-step-as-unit
  description: Takes the rise per grid line as the rate per real unit of x when the x grid lines are more than one unit apart, so the extrapolation back to zero over-corrects.
