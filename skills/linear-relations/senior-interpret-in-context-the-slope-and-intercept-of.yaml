id: senior-interpret-in-context-the-slope-and-intercept-of
name: Interpret, in context, the slope and intercept of a straight-line graph used to model and analyse
  a practical situation
domain: linear-relations
description: 'A straight-line graph of total cost against a count (hours, classes, posters, kilometres) is
  drawn on a labelled grid and the learner types the fixed cost, in dollars: the value of the line at zero.
  The rate is never stated. Tier ladder by decision: easy draws the y-axis from zero and the line meets it
  at a lattice point, so the fixed cost is read at x = 0; medium offsets the y scale so it does not start at
  zero (x = 0 is still drawn), so the reading is made against a scale whose bottom edge is not the origin;
  hard starts the x scale above zero so the y-axis is not drawn, and the fixed cost is extrapolated back
  from two lattice points and the slope; exam does the same on stepped axes (both axes step by more than one
  real unit per grid line) with a fractional rate per real unit, and asks for the fee by its own name (hire
  fee, joining fee, call-out fee, set-up cost). This skill reads one contextual quantity, not the abstract
  pair (m, c) off a bare graph (senior-determine-the-slope-and-intercepts-of-a-straight) and not the rate
  itself (rate-of-change).'
status: deferred
