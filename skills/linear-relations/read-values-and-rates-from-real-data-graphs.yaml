id: read-values-and-rates-from-real-data-graphs
name: Read values and rates from graphs of real data
domain: linear-relations
year_level: ['7']
naplan_domain: [algebra]
description: >-
  Read values, rates and predictions from a drawn graph of real data whose axes are scaled in steps that are not 1: a cost
  graph, a conversion graph, a fuel graph or a distance-time graph. easy reads the value for a stated amount (or the amount
  for a stated value) from a line through the origin; medium finds a rate from such a line, or the starting value, a value,
  a rate or an amount from a line that does not start at zero (a taxi fare, a bike hire, a falling fuel tank); hard carries
  a line past the edge of the graph at its rate with its starting value, or works on a distance-time journey with a stop
  (the speed of a stage, the time stopped, the average speed including the stop); exam is a four-part fare or hire chain
  from the starting charge and rate to a prediction and the largest trip a budget allows, the last two following through.
status: active
needs_figure: true
capability_gates: [figure_stimulus]
placement_eligible: false
prerequisites: [f10-line-graph-change-over-time]
answer: number
