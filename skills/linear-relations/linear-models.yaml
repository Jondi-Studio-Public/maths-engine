id: linear-models
name: Create and evaluate linear models
domain: linear-relations
description: Build a linear model from a rule or from two readings, use it to predict, and judge where it stops
  making sense. Easy substitutes into a stated rule. Medium finds the rate from two readings and predicts a later
  value. Hard finds when a fitted model reaches a target, where two plans cost the same, or the last whole number
  of steps for which a falling model stays non-negative.
status: active
placement_eligible: false
