misconceptions:
- id: adds-the-rates-instead-of-subtracting
  description: Adding the two rates where the difference between them decides when two plans agree.
- id: adds-the-starting-value-and-the-rate-first
  description: Adding the starting value to the rate and multiplying by the input, instead of multiplying the rate
    by the input and then adding the starting value.
- id: adds-the-whole-change-not-the-rate
  description: Adding the whole change between two readings to the last reading, whatever the number of steps ahead.
- id: adds-where-dividing-is-needed
  description: Adding two quantities where one had to be divided by the other.
- id: applies-the-rate-for-only-one-step
  description: Adding the rate for a single step where several steps lie between the reading and the prediction.
- id: assumes-the-quantity-is-proportional-to-the-input
  description: Treating the output as a fixed multiple of the input, so a starting value or a changing ratio is
    ignored.
- id: counts-one-step-too-many
  description: Using the input one more than the story states, or counting the start as a step.
- id: divides-by-one-plans-rate-only
  description: Dividing the joining fee by the rate of one plan alone, when the plans agree where the fee equals
    the difference in cost per unit.
- id: gets-the-direction-of-change-wrong
  description: Treating a quantity that falls as one that rises, or the reverse, so the sign of the rate is wrong.
- id: ignores-the-rate-in-the-first-plan
  description: Dividing the joining fee by the second plan's rate alone instead of by the difference between the
    rates.
- id: ignores-the-starting-value
  description: Dividing the target by the rate without taking the starting value off it first.
- id: inverts-the-rate
  description: Dividing the change in the input by the change in the output, so the rate is upside down.
- id: leaves-out-the-starting-value
  description: Multiplying the rate by the input without adding the starting value.
- id: reports-the-change-as-the-starting-value
  description: Giving the change between two readings as the starting value.
- id: reports-the-extra-time-since-the-first-reading
  description: Giving the time since the first reading where the total time was asked for.
- id: reports-the-extra-time-since-the-last-reading
  description: Giving the extra time after the last reading where the total time was asked for.
- id: reports-the-first-reading-as-the-starting-value
  description: Giving the first reading as the starting value, as though it had been taken at the start.
- id: rounds-up-where-the-model-stops-making-sense
  description: Rounding the point where a model reaches zero up to the next whole number, so the model gives a negative
    value there.
- id: slips-a-decimal-place
  description: Moving the decimal point one place when working with percentages.
- id: subtracts-the-rate-from-the-starting-value
  description: Taking the rate off the starting value once, where the rate is taken off for every step.
- id: swaps-the-starting-value-and-the-rate
  description: Swapping the starting value and the rate, so the starting value is multiplied by the input.
- id: uses-the-change-between-readings-as-the-rate
  description: Taking the change between two readings as the rate per step, when the readings are several steps
    apart.
- id: uses-the-wrong-operation-for-the-change
  description: Adding where the story takes away, or taking away where it adds.
