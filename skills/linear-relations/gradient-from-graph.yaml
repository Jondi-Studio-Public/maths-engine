id: gradient-from-graph
name: Determine gradient from a graph
domain: linear-relations
year_level: ['9']
naplan_domain: [algebra]
description: 'A straight line is shown on a labelled grid and the learner reads its gradient as a whole number or fraction. Easy has two marked points and a whole-number gradient; medium has two marked points and a negative or fractional gradient; hard marks no points and gives the two axes different scales, so the learner chooses two grid crossings and reads rise and run in axis units rather than counting squares. No gradient, rise or run is printed.'
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites:
- rate-of-change
- plot-linear-points
answer: fraction
sources:
- topic: fg1_gradient_from_graph
  params: {tier: easy}
  difficulty: easy
  stages: [0, 1, 2]
- topic: fg1_gradient_from_graph
  params: {tier: medium}
  difficulty: medium
  stages: [3, 4]
- topic: fg1_gradient_from_graph
  params: {tier: hard}
  difficulty: hard
  stages: [5, 6, maintenance]
misconceptions:
- id: inverted-gradient
  description: Gives run over rise, the reciprocal of the gradient.
- id: sign-error-on-gradient
  description: Reads rise and run correctly but gives the wrong sign, calling a falling line rising or the reverse.
- id: rise-without-run
  description: Gives the vertical change between the two points and does not divide by the horizontal change.
- id: gradient-counted-in-squares
  description: Counts rise and run in grid squares and ignores the scale on each axis.
- id: inverted-and-sign-error
  description: Inverts the gradient and also gets its sign wrong.
