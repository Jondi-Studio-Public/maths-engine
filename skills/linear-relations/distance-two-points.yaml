misconceptions:
- id: forgot-square-root
  description: Reports dx² + dy² as the answer, forgetting to take the square root.
- id: summed-differences
  description: Adds the horizontal and vertical differences (Manhattan distance) instead of applying Pythagoras.
- id: ignores-one-dimension
  description: Uses only one coordinate's difference and ignores the other axis entirely.
- id: sqrt-without-squaring
  description: Remembers the square root but forgets to square the differences first, taking √(dx + dy).
- id: missed-a-side
  description: When finding a triangle's perimeter, sums only two of the three side lengths, forgetting to close the triangle back to the first point.
