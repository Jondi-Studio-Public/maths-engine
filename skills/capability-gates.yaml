# Capability gate registry: the named capabilities a skill may depend on, each with a status.
#
# A skill that cites a gate here may not go live until that gate's status is
# "passed" -- fail closed.
#
# `status` allowed values: not_benchmarked | benchmarking | passed | failed. `fail_closed` must always
# be true -- this is an invariant, not a per-gate choice; it is spelled out on every row so a reviewer
# can see it without having to trust the loader.
#
# `technology` and `visual` are spelling aliases of `technology_use` and `visual_construction`, not
# separate rows -- see `mathgen/capabilities.py::canonical_gate_id`.
#
# `figure_stimulus` is for skills that show a figure and take a typed or picked answer;
# `visual_construction` is for answers the learner draws.

- id: algorithm
  name: Algorithm design and authoring
  owner: unassigned
  status: not_benchmarked
  benchmark_suite: null
  threshold: null
  fail_closed: true

