id: matrix-arithmetic
name: Add, scale and multiply matrices
domain: matrices
year_level: ['11']
description: 'Matrix operations written out in full. Easy: a combination such as 2A - 3B of two matrices of the same size.
  Medium: the product AB of matrices of different sizes, where the order of the factors and the size of the answer matter.
  Hard: A squared minus a multiple of A plus a multiple of the identity, or (A + B) squared - A squared - B squared, which
  is AB + BA and not 2AB. The exam chain finds the determinants of two matrices, writes their product and finds the determinant
  of the product (carried forward). Full-matrix answers; the multiple-choice matrix-multiplication skill checks recognition
  only.'
