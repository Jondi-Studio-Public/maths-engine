id: matrix-costing-model
name: Cost orders with a price row and a quantity matrix
domain: matrices
year_level: ['11']
description: 'A price row and a matrix of quantities ordered by several branches give the cost of each order. Easy: the cost
  of one branch''s order in dollars. Medium: the cost of all the branches'' orders together. Hard: two stages, with a recipe
  matrix of ingredients per product, ingredient prices and the batches each outlet orders, ending with the cost for one outlet.
  The exam chain costs one batch of each of two products from the recipe matrix, the cost of an order (carried forward) and
  the profit on it (carried forward).'
status: active
placement_eligible: false
prerequisites:
- matrix-arithmetic
- matrix-multiplication
answer: number
