id: dominance-matrix-ranking
name: Rank teams with a dominance matrix
domain: matrices
description: 'Round-robin results are turned into a one-step dominance matrix and used to rank the teams. Easy: given the
  dominance matrix, rank the teams by wins (one-step dominance). Medium: given the matrix, rank the teams by one-step plus
  two-step dominance. Hard: from results listed in sentences, with the two best teams level on wins, rank by one-step plus
  two-step dominance. The exam chain writes the matrix from the results, then one team''s one-step dominance, its two-step
  dominance and their sum (carried forward). Distinct from graph-adjacency walk counts: here the matrix records who beat whom
  and the aim is a ranking.'
status: active
