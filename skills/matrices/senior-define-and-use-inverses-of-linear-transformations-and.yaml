misconceptions:
- id: forward-not-inverse
  description: Reapplies the stated transformation to the image instead of inverting it to recover the original point.
- id: swapped-lambda
  description: Divides by the dilation factors in the wrong order, swapping which factor undoes which coordinate.
- id: sign-flip
  description: Negates the x-coordinate of the otherwise-correctly-recovered original point.
- id: swapped-coords
  description: Swaps the x and y coordinates of the otherwise-correctly-recovered original point.
- id: sign-flip-both
  description: Negates both coordinates of the otherwise-correctly-recovered original point.
- id: point-reflection
  description: Treats the image as though it came from a 180 degree rotation about the origin, negating both coordinates, instead of reflecting.
- id: wrong-line
  description: Reflects the image in a different line (the other line from the same paired-line set) instead of the stated line of reflection.
- id: identity
  description: Reports the image point unchanged, as if the reflection had no effect.
