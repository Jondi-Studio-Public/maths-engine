id: permutation-binary-matrices
name: Scramble and unscramble with permutation matrices; binary matrices of relations
domain: matrices
description: 'Matrices of 0s and 1s. Easy: scramble a message in blocks with a given permutation matrix, or write the binary
  matrix of a relation on five numbers. Medium: unscramble a received message with a given permutation matrix, using that
  its inverse is its transpose. Hard: the matrix is not given and must be found from one block before and after, then used
  to unscramble a received message. The exam chain writes the permutation matrix, scrambles a second message, finds how many
  scrambles restore a block and the fewest scrambles matching a long run (carried forward).'
status: active
