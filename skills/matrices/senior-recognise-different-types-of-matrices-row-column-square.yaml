misconceptions:
- id: swapped-rows-and-columns
  description: Reports the correct type but with rows and columns transposed (e.g. "column, 1, 3" instead of "column, 3, 1").
- id: ignores-precedence-order
  description: Applies a label the matrix also satisfies but which is not the FIRST applicable label in the stated order (e.g. calling an identity matrix "square" instead of "identity", or a 1xN zero matrix "row" instead of "zero").
- id: misses-near-identity-or-near-zero-trap
  description: Classifies a matrix that is CLOSE to identity or zero (all entries match except one) as identity or zero, without checking every entry.
- id: treats-rectangular-as-square
  description: Reports "square" for a matrix whose row and column counts genuinely differ.
