misconceptions:
- id: only-second
  description: Applies only the second stated transformation to the point, skipping the first transformation entirely.
- id: only-first
  description: Applies only the first stated transformation to the point, never applying the second.
- id: added-not-composed
  description: Adds the two dilation factors coordinate-wise instead of composing the two transformations via a matrix product (or, equivalently, sequential application).
- id: reversed-order
  description: Applies the two stated transformations in the opposite order from the one the question stated, exploiting the fact that a dilation/rotation or rotation/reflection pair generally does not commute.
