id: transition-matrix-states
name: Move a population between states with a transition matrix
domain: matrices
description: 'A population is shared among three or four states (phone plans, shops, ways to travel, clubs) and each period
  some members move between them, described in words. Easy: the numbers in each state after one period, written as a column.
  Medium: after two periods, where one state''s movements are given with the rest left over. Hard: four states, the start
  given as shares of a total, and the numbers in every state after three periods. The exam chain finds a missing stay share
  from a column total, then the numbers in one state after one and two periods (carried forward) and the change. Distinct
  from the two-state Markov skills, which have one transition probability and a single state.'
status: active
placement_eligible: false
