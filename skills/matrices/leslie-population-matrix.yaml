id: leslie-population-matrix
name: Project an age-class population with a Leslie matrix
domain: matrices
description: 'An animal population is counted in three age classes, with a birth rate for each class and a survival share
  into the next class, described in words. Easy: the whole population next year. Medium: the whole population in two years.
  Hard: the age classes keep a fixed ratio from year to year, so the growth factor of the whole population is found. The exam
  chain finds the young born, the total next year, the percentage change in the total (carried forward) and the age classes
  after two years.'
status: active
placement_eligible: false
