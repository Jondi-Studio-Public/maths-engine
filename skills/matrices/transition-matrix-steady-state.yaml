id: transition-matrix-steady-state
name: Find the long-run shares of a three-state transition model
domain: matrices
description: 'Movements among three states are given in words and the long-run behaviour is found by solving T s = s with
  the shares adding to 1. Easy: the long-run fraction in one state. Medium: the long-run fraction in two states together,
  where one state''s movements are given with the rest left over. Hard: one movement share is unknown and the long-run share
  of a state is stated, so the unknown is found and then the long-run fraction of a second state. The exam chain finds two
  long-run shares, the third from them (carried forward) and the long-run number in the third state. Goes beyond the two-state
  stationary skill: three states need a linear system, not a ratio.'
status: active
placement_eligible: false
prerequisites:
- transition-matrix-states
- matrix-solve-system
answer: fraction
