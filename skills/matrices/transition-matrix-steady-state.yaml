misconceptions:
- id: r3c-ss-complement
  description: Gives one minus the long-run share where the share itself was asked for.
- id: r3c-ss-equal-shares
  description: Assumes the long-run shares are equal, so each state gets the same fraction of the total.
- id: r3c-ss-not-normalised
  description: Solves for the shares in proportion to one another but does not scale them so they add to 1 (or to the total).
- id: r3c-ss-one-group-only
  description: Gives the long-run share of only one of the two groups asked about, leaving out the other.
- id: r3c-ss-product
  description: Multiplies two long-run shares where the third is found by subtracting both from 1.
- id: r3c-ss-rows-columns-swapped
  description: Reads the transition table by rows where it is read by columns, so the long-run shares come from the table
    turned on its side.
- id: r3c-ss-share-slip
  description: Finds the unknown share one step of 10 percentage points too high or too low after a slip in balancing the
    long-run equations.
- id: r3c-ss-stay-share
  description: Takes each group's long-run share to be its stay share divided by the total of the stay shares, ignoring the
    members who move in from the other groups.
- id: r3c-ss-sum-not-remainder
  description: Adds the two known long-run shares where the third is what is left of 1 after taking both away.
- id: r3c-ss-wrong-state
  description: Gives the long-run share (or number) of a different group from the one asked about.
