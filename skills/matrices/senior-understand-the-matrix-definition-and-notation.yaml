misconceptions:
- id: swapped-index
  description: Reports a_{j,i} instead of a_{i,j} -- reads the row index as the column index and vice versa.
- id: adjacent-row-error
  description: Reads the entry from the wrong row of the same column.
- id: adjacent-column-error
  description: Reads the entry from the wrong column of the same row.
- id: misresolves-relative-index-reference
  description: Fails to resolve a described index (e.g. "the last row", "row m - 1") into the correct numeral before looking up the entry.
