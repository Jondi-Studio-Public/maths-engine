id: significant-figures
name: Round to significant figures
domain: secondary-number
description: Round a value to a stated number of significant figures, keeping leading zeros non-significant and trailing zeros before the decimal point in place to preserve magnitude.
status: active
placement_eligible: false
prerequisites: [round-decimals]
answer: number
