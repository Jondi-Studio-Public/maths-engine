misconceptions:
- id: counts-leading-zeros
  description: Treats a leading zero after the decimal point as if it were already significant, so one fewer real digit is kept than the requested count.
- id: rounds-to-decimal-places-instead
  description: Applies the stated significant-figure count as a decimal-place count instead, the confusion round-decimals' own rule invites.
- id: drops-magnitude
  description: On a value whose requested significant-figure count is fewer than its integer digit count, keeps only the leading digits with no zero padding, losing the value's magnitude.
- id: rounds-wrong-direction
  description: Rounds the opposite way from what the next digit calls for.
