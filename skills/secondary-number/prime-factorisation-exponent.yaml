id: prime-factorisation-exponent
name: Express prime factorisation with exponents
domain: secondary-number
description: Express a supplied natural number as a product of prime powers in exponent notation.
status: active
prerequisites: [prime-factorisation, evaluate-powers]
answer: mcq
sources:
- topic: prime_factorisation_exponent
  params: {primes: [2, 3, 5], term_hi: 2, exponent_hi: 2}
  difficulty: easy
  stages: [0, 1, 2]
- topic: prime_factorisation_exponent
  params: {primes: [2, 3, 5, 7], term_hi: 3, exponent_hi: 3}
  difficulty: medium
  stages: [3, 4]
- topic: prime_factorisation_exponent
  params: {primes: [2, 3, 5, 7], term_hi: 3, exponent_hi: 3, composite_form: true}
  difficulty: hard
  stages: [5, 6, maintenance]
difficulty_progression: Easy and medium supply an integer to factorise. Hard supplies a product with composite bases such as 6² × 10, so the learner must split each base into primes and distribute the outer exponent over them before collecting powers.
misconceptions:
- id: expands-repeated-factors
  description: Writes repeated prime factors instead of collecting them as powers.
- id: leaves-composite-factor
  description: Leaves a composite factor or the original number instead of fully expressing prime powers.
tags: [acara-gap-build, primes, exponents, acara-v9-year-7]
