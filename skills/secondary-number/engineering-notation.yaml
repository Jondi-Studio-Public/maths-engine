id: engineering-notation
name: Write numbers in engineering notation
domain: secondary-number
description: Re-express an already scientific-notation quantity so the power of ten is a multiple of three and the coefficient runs from 1 up to (not including) 1000, naming the matching SI prefix.
status: active
placement_eligible: false
prerequisites: [scientific-notation]
answer: mcq
sources:
- topic: engineering_notation
  params: {variant: large_positive}
  difficulty: easy
  stages: [0, 1, 2]
- topic: engineering_notation
  params: {variant: small_value}
  difficulty: medium
  stages: [3, 4]
- topic: engineering_notation
  params: {variant: wide_exponent}
  difficulty: hard
