  difficulty: exam
  stages: [exam]
misconceptions:
- id: scientific-notation-exponent-grouping
  description: Leaves the coefficient at a single digit before the point instead of regrouping to a multiple-of-three exponent, the scientific-notation habit this skill must break.
- id: mantissa-out-of-range
  description: Pairs the multiple-of-three exponent with the original scientific-notation coefficient, never shifting it into the engineering coefficient's own [1, 1000) range.
- id: wrong-si-prefix
  description: Groups the number correctly but names the wrong SI prefix for that power of ten.
- id: sign-error-on-exponent
  description: Flips the sign of the exponent (and its SI prefix), confusing a positive power of ten with its negative counterpart.
- id: ignores-smaller-term
  description: On the exam-tier sum/difference source, combines two far-apart-exponent scientific-notation values by taking only the numerically dominant term and discarding the smaller one entirely, instead of aligning exponents and adding exactly.
tags: [secondary, number, indices, engineering-syllabus]
