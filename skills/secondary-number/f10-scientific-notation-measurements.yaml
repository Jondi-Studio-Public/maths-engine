misconceptions:
- id: wrong-power-combination
  description: Combines the coefficients or powers of ten with the wrong operation for the step being performed -- adds the coefficients instead of multiplying them (easy tier), or adds the exponents instead of subtracting them when dividing, or uses one quantity's own coefficient directly instead of dividing the two coefficients (medium tier).
- id: off-by-one-order-of-magnitude
  description: Misplaces the decimal point by one power of ten, over- or under-stating the result by a factor of ten.
- id: inverts-comparison-ratio
  description: In the magnitude-comparison question, divides the larger coefficient by the smaller one directly instead of accounting for which quantity's exponent makes it the larger overall value, reporting the ratio inverted (hard tier only).
