id: rationalise-binomial-denominator
name: Rationalise a binomial denominator
domain: secondary-number
description: Rationalise a fraction whose denominator is a two-term surd expression a +/- sqrt(b) by multiplying
  numerator and denominator by the conjugate a -/+ sqrt(b), giving a single simplified expression with a
  rational denominator. Confined to binomial denominators -- a monomial surd denominator is already rationalised
  by sympy on parse and is not this skill's scope.
status: active
placement_eligible: false
prerequisites:
- simplify-surds
- difference-of-squares
answer: expression
