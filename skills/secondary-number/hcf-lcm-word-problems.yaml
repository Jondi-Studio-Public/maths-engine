id: hcf-lcm-word-problems
name: HCF and LCM word problems
domain: secondary-number
year_level:
- '7'
- '8'
description: Decide whether a story needs the highest common factor or the lowest common multiple, then use it for equal groups,
  repeating events, tiling and meeting times.
status: active
placement_eligible: false
prerequisites:
- list-factors
answer: number
sources:
