difficulty_progression:
  easy:
    steps: 2
    demand: Find a percentage increase from an original and a final value.
  medium:
    steps: 3
    demand: Find an increase or a decrease, to one decimal place.
  hard:
    steps: 5
    demand: Combine two changes, find the fall that undoes a rise, or the change in a rate itself.
  exam:
    steps: 7
    demand: Chain percentage changes over several steps.
