misconceptions:
- id: divides-by-final
  description: Divides the change by the final value instead of the original value.
- id: w3pc-over-final
  description: Divides the change by the final value instead of the original value.
- id: w3pc-change-as-percent
  description: Gives the amount of the change as the percentage.
- id: w3pc-ratio-as-change
  description: Gives the final value as a percentage of the original and does not subtract 100.
- id: w3pc-original-as-final
  description: Gives the original value as a percentage of the final value.
- id: w3pc-points-as-percent
  description: Gives the rise in percentage points as the percentage change.
- id: w3pc-adds-steps
  description: Adds the increase and takes off the decrease instead of multiplying the two multipliers.
- id: w3pc-sums-percentages
  description: Adds the two percentages whatever their direction.
- id: w3pc-reverse-same-percent
  description: Takes the fall that undoes a rise to be the same percentage as the rise.
- id: w3pc-second-step-on-original
  description: Gives the fall in the second step as a percentage of the original price, not the overall change.
- id: w3pc-wrong-direction
  description: Gives a percentage increase where a decrease was asked, or the reverse.
tags:
