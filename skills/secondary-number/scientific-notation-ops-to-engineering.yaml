id: scientific-notation-ops-to-engineering
name: Combine scientific-notation values and convert to engineering notation
domain: secondary-number
description: Multiply or divide two scientific-notation values (4-significant-figure coefficients,
  either may be negative from the hard tier up) and re-express the result in engineering notation
  (coefficient with magnitude 1 up to but not including 1000, exponent a multiple of three).
status: active
placement_eligible: false
prerequisites:
- scientific-notation
- engineering-notation
answer: mcq
