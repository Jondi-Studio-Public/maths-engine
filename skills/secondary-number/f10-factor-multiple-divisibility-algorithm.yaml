misconceptions:
- id: range-includes-zero
  description: Treats 0 as if it were in the range 1 to R (0 is divisible by everything), overcounting the true count by one.
- id: complement-count
  description: Counts the numbers that FAIL the divisibility test instead of the numbers that pass (R minus the correct count).
- id: single-condition-count
  description: Evaluates only the first stated divisor's count, ignoring the second stated divisor entirely.
- id: and-or-confusion
  description: Computes the OR-count when the question asked AND, or the AND-count when the question asked OR.
- id: reports-final-value-not-steps
  description: Reports the final odd value the algorithm reaches instead of the number of halving steps taken to reach it.
- id: off-by-one-step-count
  description: Reports one halving step too many or too few in the traced sequence.
