difficulty_progression: Easy and medium state the number in digits and ask whether it is a perfect square. Hard states it as a product of prime powers, so the learner must decide from the parity of the exponents (all even means a square) rather than by recognising or computing a square. The exam tier is a connected question about turning a number that is not a perfect square into one (by multiplying, adding or setting aside), then asking for the resulting square and its square root.
