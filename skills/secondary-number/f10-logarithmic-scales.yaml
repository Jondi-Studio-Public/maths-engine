misconceptions:
- id: linear-interpolation
  description: Computes the value (or, on the inverse-direction question, the position) as if the scale were linear -- A + t*(B-A) -- instead of using the exponential/multiplicative-ratio relationship.
- id: off-by-one-decade
  description: Uses one decade too many or too few (j+1 or j-1 instead of the correct j), a one-decade miscount.
- id: swaps-reference-direction
  description: Computes as if starting from B and working backward (B*(A/B)^t), which is only correct at the scale's exact midpoint. Never offered where it would collide with the correct answer (the fixed easy-tier midpoint, or an inverse-tier position exactly at the midpoint).
- id: halves-the-ratio-not-the-exponent
  description: Easy-tier-only substitute for swaps-reference-direction (which always collides with the correct answer at the fixed easy-tier midpoint position). Halves the whole multiplicative ratio A-to-B arithmetically (dividing by 2) instead of taking the correct geometric half (halving the exponent, i.e. a square root of the ratio).
