id: f10-logarithmic-scales
name: Interpret logarithmic scales
domain: secondary-number
description: Given a logarithmic scale with two labelled reference values and a stated position on the scale expressed as a fraction of the scale-distance between them, calculate the numeric value at that position, using the fact that equal scale-distances correspond to equal multiplicative ratios.
status: active
placement_eligible: false
prerequisites: [logarithm-laws, scientific-notation]
answer: number
sources:
