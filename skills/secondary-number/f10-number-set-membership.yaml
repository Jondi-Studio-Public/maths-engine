misconceptions:
- id: named-only-the-smallest-set
  description: Names only the smallest set that contains the number, forgetting that the sets nest inside the larger ones.
- id: recurring-decimal-treated-as-irrational
  description: Calls a repeating decimal irrational because it goes on forever; it can be written as a fraction, so it is rational.
- id: judged-by-the-root-sign-without-simplifying
  description: Calls an expression irrational because it contains a root sign or pi, without simplifying it first.
