id: f10-number-set-membership
name: Decide which number sets a number belongs to
domain: secondary-number
year_level: ['9', '10']
naplan_domain: [number]
description: Decide which of the natural, integer, rational, irrational and real numbers contain a number written in a disguised form (a fraction that is a whole number, a recurring decimal, a root of a perfect square, a product of surds), and pick out the rational or irrational numbers from a list after simplifying. Answers are typed sets of letters, never a two-way choice.
status: active
placement_eligible: false
prerequisites: [classify-real-numbers]
answer: set
