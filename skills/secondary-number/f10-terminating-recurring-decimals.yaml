misconceptions:
- id: treats-recurring-as-terminating
  description: Reads the shown finite digits (dropping the ellipsis) as the exact value and reduces that.
- id: misclassifies-terminating-as-recurring
  description: Applies the repeating-block formula to a terminating decimal.
- id: ignores-non-repeating-lead
  description: Applies the pure-repeat formula without separating out the non-repeating lead digits.
- id: wrong-repeat-length
  description: Treats a two-digit repeating block as if it were single-digit (denominator 9 instead of 99).
- id: misplaces-decimal-point
  description: Answers with the true value divided by 10, as if the decimal point were one place further left.
- id: wrong-denominator-by-one
  description: Answers with the numerator over a denominator that is one more than the true reduced denominator.
