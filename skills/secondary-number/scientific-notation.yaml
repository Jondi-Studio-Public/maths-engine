id: scientific-notation
name: Write numbers in scientific notation
domain: secondary-number
description: Represent a very large or small terminating decimal as a coefficient from one to ten times a power of ten.
status: active
prerequisites: [decimal-place-value, evaluate-powers]
answer: mcq
