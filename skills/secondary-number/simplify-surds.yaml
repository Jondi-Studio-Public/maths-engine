id: simplify-surds
name: Simplify surds
domain: secondary-number
description: Simplify a surd expression by extracting the largest perfect-square factor of each radicand -- a
  single surd, a sum of two surds that combine into one term, or a subtraction of two coefficiented surds --
  answered in the form a√b. Confined to numeric radicands.
status: active
placement_eligible: false
prerequisites:
- f10-square-roots-perfect-squares
- prime-factorisation
answer: expression
