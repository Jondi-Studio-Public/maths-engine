id: uc2-linear-system-real-eigen
name: Solve a linear system with real eigenvalues
domain: ordinary-differential-equations
year_level:
- university
description: Solve the initial value problem x' = Ax for a 2x2 or 3x3 constant matrix with real, distinct eigenvalues,
  and give one component of the solution as a function of t or as a value at a stated time.
status: active
placement_eligible: false
