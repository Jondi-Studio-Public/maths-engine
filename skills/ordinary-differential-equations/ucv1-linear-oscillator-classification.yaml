misconceptions:
- id: discriminant-sign-flip
  description: Computes 4mk - b^2 instead of b^2 - 4mk, so the whole classification is reversed between underdamped and overdamped.
- id: treats-small-discriminant-as-zero
  description: Rounds a small nonzero discriminant to zero, calling an underdamped or overdamped case critically damped.
- id: assumes-any-damping-below-critical-is-critical
  description: Classifies as critically damped whenever b is below the critical value, missing the exact equality b^2 = 4mk that defines the boundary.
- id: assumes-any-damping-above-critical-is-critical
  description: Classifies as critically damped whenever b is above the critical value, missing the exact equality b^2 = 4mk that defines the boundary.
