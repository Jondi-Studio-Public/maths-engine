id: uc2-exact-equation
name: Exact equations and integrating factors
domain: ordinary-differential-equations
year_level: [university]
description: Test a first-order equation M dx + N dy = 0 for exactness, find its potential function and the
  constant for an initial condition, and find an integrating factor in x or y alone when it is not exact.
status: active
placement_eligible: false
prerequisites:
- partial-derivative-x
- partial-derivative-y
- solve-ode-separable-poly
answer: expression
sources:
