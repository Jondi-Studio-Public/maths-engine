id: uc2-linear-system-complex-eigen
name: Solve a linear system with complex eigenvalues
domain: ordinary-differential-equations
year_level:
- university
description: Solve the initial value problem x' = Ax for a 2x2 constant matrix whose eigenvalues are complex, and
  give a component of the real-valued solution as a function of t or as a value at a stated time.
