id: uc2-variation-of-parameters
name: Variation of parameters
domain: ordinary-differential-equations
year_level: [university]
description: >-
  Find a particular solution of a second-order linear equation whose forcing term (sec, csc, tan, e^x/x, ln x,
  1/(1 + e^x)) defeats undetermined coefficients, and work with the Wronskian, u1' and u2'.
status: active
placement_eligible: false
prerequisites:
- ucv1-second-order-characteristic-roots
- senior-integrate-by-parts
answer: expression
