id: uc2-linear-system-repeated-eigen
name: Solve a linear system with a repeated eigenvalue
domain: ordinary-differential-equations
year_level:
- university
description: Solve the initial value problem x' = Ax when the matrix has a repeated eigenvalue with only one independent
  eigenvector, so the solution needs a generalised eigenvector and a t e^(λt) term.
status: active
placement_eligible: false
prerequisites:
