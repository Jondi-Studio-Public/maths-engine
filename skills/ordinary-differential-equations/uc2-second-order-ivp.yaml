id: uc2-second-order-ivp
name: Second-order initial value problems
domain: ordinary-differential-equations
year_level: [university]
description: Solve a non-homogeneous constant-coefficient second-order equation with initial conditions, in
  every root case and including resonant forcing, and evaluate the solution.
status: active
placement_eligible: false
prerequisites:
- ucv1-second-order-characteristic-roots
- ucv1-initial-value-constant
answer: expression
sources:
- topic: s2c1_second_order_ivp
  params: {}
  difficulty: easy
  stages: [0, 1, 2]
- topic: s2c1_second_order_ivp
  params: {}
  difficulty: medium
  stages: [3, 4]
- topic: s2c1_second_order_ivp
  params: {}
