misconceptions:
- id: ode1-eval-exponent-sign
  description: Evaluating the decaying term with the sign of its exponent flipped.
- id: ode1-eval-exponential-dropped
  description: Treating the exponential factor as 1 when evaluating the solution.
- id: ode1-eval-exponential-term-dropped
  description: Dropping the decaying term when evaluating the solution.
- id: ode1-eval-particular-dropped
  description: Dropping the particular solution when evaluating, keeping only the decaying term.
- id: ode1-factor-coefficient-dropped
  description: Dropping the coefficient k from the integral of k/x, so the factor becomes x.
- id: ode1-factor-coefficient-inverted
  description: Using e^(x/a) as the integrating factor for a constant coefficient a.
- id: ode1-factor-integral-not-exponentiated
  description: Giving the integral of P as the integrating factor instead of e raised to it.
- id: ode1-factor-integral-skipped
  description: Using e^(P(x)) as the integrating factor without integrating P.
- id: ode1-factor-power-rule-misapplied
  description: Integrating P(x) with the wrong power-rule step (forgetting to halve or raise the power) before exponentiating.
- id: ode1-factor-sign-flipped
  description: Using e^(-integral of P) rather than e^(integral of P) as the integrating factor.
- id: ode1-homogeneous-exponent-sign
  description: Writing the complementary term with the wrong sign in its exponent (e^(+ax) instead of e^(-ax)).
- id: ode1-ic-evaluated-at-wrong-point
  description: Evaluating the particular solution at x = 1 rather than at the point where the initial condition is given.
- id: ode1-ic-homogeneous-term-dropped
  description: Dropping the arbitrary-constant term from the solution once the initial condition is applied.
- id: ode1-ic-ignores-particular-part
  description: Setting the constant equal to y(0) without subtracting the particular solution's value at 0.
- id: ode1-ic-sign-error
  description: Subtracting the wrong way round when fixing the constant from the initial condition.
- id: ode1-integral-over-integrated
  description: Integrating a constant right-hand side twice (giving x^2/2 instead of x).
- id: ode1-integrating-factor-division-skipped
  description: Forgetting to divide the constant of integration by the integrating factor.
- id: ode1-integration-by-parts-sign
  description: A sign error in the integration by parts, giving (r + m)/a instead of (r - m)/a for the constant term.
- id: ode1-lead-coefficient-not-divided
  description: Not dividing the right-hand side by x before using the integrating factor, so the power is one too high.
- id: ode1-linear-coefficients-swapped
  description: Swapping the coefficient of x and the constant on the right-hand side when finding the particular solution.
- id: ode1-particular-coefficient-divided-twice
  description: Dividing by the exponent coefficient a twice when finding the particular solution.
- id: ode1-particular-coefficient-not-divided
  description: Leaving the forcing coefficient undivided by the factor the integral produces, so the particular solution
    is too large.
- id: ode1-particular-coefficient-sign-flipped
  description: Giving the particular-solution coefficient with the opposite sign.
- id: ode1-particular-constant-correction-missed
  description: Finding the constant of the particular solution as r/a, missing the -m/a correction from integration by parts.
- id: ode1-particular-denominator-sign
  description: Dividing the forcing coefficient by a - k instead of a + k.
- id: ode1-resonance-factor-x-missing
  description: Missing the factor x in the solution when the forcing term matches the complementary solution.
