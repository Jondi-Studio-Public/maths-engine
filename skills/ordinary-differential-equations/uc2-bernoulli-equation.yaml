id: uc2-bernoulli-equation
name: Bernoulli equations
domain: ordinary-differential-equations
year_level: [university]
description: >-
  Solve y' + P(x)y = Q(x)y^n with the substitution v = y^(1 - n), then apply an initial condition to the
  solution for y.
status: active
placement_eligible: false
prerequisites:
- solve-ode-separable-poly
- solve-ode-exponential
answer: expression
