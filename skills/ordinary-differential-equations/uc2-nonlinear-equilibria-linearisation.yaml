id: uc2-nonlinear-equilibria-linearisation
name: Linearise a nonlinear system at an equilibrium
domain: ordinary-differential-equations
year_level:
- university
description: Find an equilibrium of a nonlinear two-dimensional system (competing species, predator and prey, or
  a damped pendulum), form the Jacobian matrix there, and use it to find the eigenvalues, an eigenvector, and the
  type of the equilibrium.
status: active
