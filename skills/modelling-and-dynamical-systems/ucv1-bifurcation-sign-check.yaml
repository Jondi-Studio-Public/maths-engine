id: ucv1-bifurcation-sign-check
name: Detect a one-parameter equilibrium bifurcation
domain: modelling-and-dynamical-systems
description: For a supplied scalar equilibrium equation, identify the parameter value where the number of real equilibria changes.
status: active
placement_eligible: false
prerequisites:
- autonomous-equilibrium-stability
answer: number
sources:
