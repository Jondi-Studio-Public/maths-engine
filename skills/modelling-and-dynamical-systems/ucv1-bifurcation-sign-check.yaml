misconceptions:
- id: drops-the-four
  description: Reports r* = b^2/a, forgetting the factor of 4 in the discriminant.
- id: sign-flip
  description: Reports r* = -b^2/(4a).
- id: swaps-coefficients
  description: Reports r* = a^2/(4b), swapping which coefficient is squared.
- id: uses-wrong-candidate
  description: On the exam tier, reports the decoy candidate value of r instead of the one that actually zeroes the discriminant.
- id: wrong-root-sign
  description: On the hard tier, reports the negative threshold -2*sqrt(ac) instead of the positive value asked for.
