misconceptions:
- id: ey2a-reports-one-part
  description: "Giving the size of one part when the whole (both kinds together) was asked for."
- id: ey2a-count-one-over
  description: "Counting one too many: counting a counter twice or going one past the end."
- id: ey2a-count-one-short
  description: "Counting one too few: missing a counter or stopping early."
- id: ey2a-subtracts-the-parts
  description: "Subtracting one part from the other when the parts should be put together."
- id: ey2a-counts-empty-boxes
  description: "Counting the empty boxes of the ten frame instead of the counters (or the reverse)."
- id: ey2a-reports-shown-part
  description: "Giving the number of counters shown in the picture rather than the number that are missing."
- id: ey2a-reports-the-whole
  description: "Giving the whole (the total) instead of the part, share or answer the question asked for."
- id: ey2a-adds-parts-for-missing
  description: "Adding the whole and the shown part when the missing part is the whole take away the shown part."
