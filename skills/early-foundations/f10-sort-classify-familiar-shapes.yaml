misconceptions:
- id: flat-solid-swap
  description: Counts the flat shapes when asked for solids, or the other way round.
- id: only-the-square-has-four-corners
  description: Counts only squares as having 4 corners, leaving out rectangles, rhombuses and kites.
- id: semicircle-not-curved
  description: Treats a shape with one straight edge and one curved edge as having no curved side.
- id: odd-one-out-by-looks
  description: Looks for a difference in size, turn or shading instead of the sides, corners or curves that make one shape different.
- id: right-shape-wrong-reason
  description: Finds the odd shape but gives a reason about size, turn or shading rather than sides, corners or curves.
