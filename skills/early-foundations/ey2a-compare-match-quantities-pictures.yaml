misconceptions:
- id: ey2a-reports-smaller-group
  description: "Giving the size of the smaller group when the bigger group was asked for."
- id: ey2a-reports-the-difference
  description: "Giving how many more the bigger group has instead of how many it has."
- id: ey2a-count-one-over
  description: "Counting one too many: counting a counter twice or going one past the end."
- id: ey2a-count-one-short
  description: "Counting one too few: missing a counter or stopping early."
- id: ey2a-adds-groups
  description: "Adding the sizes of the groups together when the groups should be compared."
- id: ey2a-reports-larger-group
  description: "Giving the size of the bigger group instead of how many more it has."
- id: ey2a-fixes-one-ring-only
  description: "Adding counters to only one of the smaller rings to match the biggest."
- id: ey2a-compares-wrong-rings
  description: "Comparing two of the three rings, but not the biggest and the smallest."
