misconceptions:
- id: names-the-wrong-shape
  description: Mixes up the names of the basic shapes, for example calling a rectangle a square.
- id: turned-shape-is-different
  description: Does not count a shape that is turned or tilted, thinking a tilted square is a new shape.
- id: counts-a-near-neighbour
  description: Counts a shape that only looks alike (a rectangle among the squares, an oval among the circles).
- id: flat-for-solid
  description: Names the flat shape for a solid one, for example a circle for a ball or a rectangle for a box.
