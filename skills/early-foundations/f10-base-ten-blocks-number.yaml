id: f10-base-ten-blocks-number
name: Read a number from base-ten blocks
domain: early-foundations
year_level: ['1', '2']
naplan_domain: [number]
learner_band: primary
description: Read a picture of hundreds flats, tens rods and ones cubes, including blocks not yet swapped for bigger ones, and say the number it shows.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: [place-value-to-20]
answer: number
sources:
- topic: base_ten_read
  difficulty: easy
  stages: [0, 1, 2]
- topic: base_ten_read
  difficulty: medium
  stages: [3, 4]
- topic: base_ten_read
  difficulty: hard
  stages: [5, 6, maintenance]
misconceptions:
- id: counts-blocks
  description: Gives the number of blocks instead of the number they are worth.
- id: tens-ones-swapped
  description: Writes the count of cubes before the count of rods.
- id: skips-the-empty-place
  description: Leaves out the zero when a place has no blocks, so 304 becomes 34.
- id: counts-as-digits
  description: When there are ten or more cubes (or rods), writes the counts side by side as if they were digits.
