misconceptions:
- id: dollars-and-cents-separately
  description: Takes the dollars apart and copies the cents across, so the cents of the price reappear in the change.
- id: off-by-a-dollar
  description: Is a whole dollar too high or too low after taking the price from the money.
- id: adds-price
  description: Adds the price to the money paid instead of taking it away.
- id: ignores-the-coins
  description: Takes the price from the note alone and leaves out the coins also paid.
