misconceptions:
- id: ey2a-count-one-short
  description: "Counting one too few: missing a counter or stopping early."
- id: ey2a-count-one-over
  description: "Counting one too many: counting a counter twice or going one past the end."
- id: ey2a-reports-the-count
  description: "Saying how many there are now, without doing what the question then asks (adding one, or finding how many more)."
- id: ey2a-moves-the-wrong-way
  description: "Taking one away when one was added (or adding one when one was taken away)."
- id: ey2a-counts-all-kinds
  description: "Counting every counter, plain and ringed, when only one kind was asked for."
- id: ey2a-counts-wrong-kind
  description: "Using the count of the other kind of counter instead of the kind asked for."
