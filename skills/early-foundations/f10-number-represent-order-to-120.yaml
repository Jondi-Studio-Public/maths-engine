misconceptions:
- id: reversed-order
  description: Orders the numbers from largest to smallest instead of smallest to largest.
- id: adjacent-swap
  description: Orders the numbers correctly overall but swaps the two middle values, as if two neighbouring values did not need comparing.
- id: teen-reversal-confusion
  description: Confuses a teen number with its digit-reversed two-digit counterpart (e.g. 13 and 31) and swaps their order in the sequence. Computed on every medium question; presented as a distinct third option only when the pair does not land in the same two positions the adjacent-swap distractor already occupies (empirically ~95% of medium seeds).
- id: leading-digit-only
  description: Orders numbers by their first digit alone, ignoring overall digit count, so a shorter number with a larger leading digit is wrongly placed above a longer number (e.g. ranking 99 above 105).
