id: gradient-vector
name: Gradient vector
domain: partial-derivatives
year_level: [university]
description: Find the gradient vector of a function of two variables at a point, including functions that need the
  chain, product or quotient rule, and use it to find the direction of steepest ascent or descent, the point where the
  gradient takes a stated value, the unit tangent to a level curve, and the rates of change in a stated direction and
  in the steepest direction. Answers are ordered pairs, graded as pairs.
status: active
prerequisites:
- partial-derivative-x
- partial-derivative-y
answer: pair
