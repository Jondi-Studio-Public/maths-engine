misconceptions:
- id: r3h-elim-values-swapped
  description: Finding the right values but giving them in the wrong order, such as y, x, z instead of x, y, z.
- id: r3h-elim-sign-of-last-variable
  description: A sign error in the final step, so one unknown has the right size and the wrong sign.
- id: r3h-elim-constant-sign-slip
  description: Copying a constant with the wrong sign when forming or combining equations, so the whole solution shifts.
- id: r3h-elim-coefficient-sign-slip
  description: Giving a coefficient the wrong sign when scaling or subtracting equations during elimination.
- id: r3h-elim-subtracted-instead-of-added
  description: Subtracting two equations where the signs of the unknown to be removed are opposite, so it is doubled instead
    of removed.
- id: r3h-elim-constants-not-combined
  description: Combining the coefficients of two equations but carrying only one of the constants.
- id: r3h-elim-coefficients-swapped
  description: Writing the coefficients of x and y of the combined equation in the wrong order.
- id: r3h-elim-back-substitution-sign
  description: A sign slip when substituting a found value back into an equation to find the next unknown.
