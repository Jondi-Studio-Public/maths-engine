id: three-variable-elimination-triple
name: Solve a 3 x 3 linear system by elimination
domain: linear-systems
description: Solve three linear equations in three unknowns by elimination and give the solution as the ordered triple (x,
  y, z), checking it in all three equations. Harder questions have the unknowns on both sides of the equations and need every
  elimination scaled; the exam tier asks for the first eliminated equation and then each unknown in turn.
status: active
placement_eligible: false
