misconceptions:
- id: forgets-the-sqrt-factor
  description: Omits the sqrt(pi/a) (or convention-appropriate) prefactor entirely.
- id: wrong-exponent-denominator
  description: Uses a denominator of 2a instead of 4a inside the exponent.
- id: keeps-original-a-in-exponent
  description: Uses the original a inside the transform's exponent instead of inverting it.
- id: inverts-a-in-prefactor
  description: Inverts a inside the prefactor's square root instead of the exponent (medium tier only).
- id: wrong-convention-constant
  description: Uses the ordinary-convention prefactor when the unitary convention was stated, or vice versa (hard/exam only).
- id: forgets-the-2-pi-substitution
  description: Uses the angular variable w in place of the frequency variable f without substituting w = 2*pi*f (exam tier only).
- id: halves-the-2-pi-substitution
  description: Substitutes w = pi*f instead of w = 2*pi*f (exam tier only).
