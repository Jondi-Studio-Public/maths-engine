id: uc2-fourier-series-full-period
name: Fourier series of a piecewise function on a full period
domain: fourier-analysis-and-pdes
year_level:
- university
description: Find a Fourier coefficient a0, an or bn of a piecewise function with period 2L by integrating over [-L, L],
  and say what value the series converges to at a jump, at the end of a period or outside [-L, L).
