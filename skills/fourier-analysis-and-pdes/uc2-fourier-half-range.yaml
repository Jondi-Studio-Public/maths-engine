id: uc2-fourier-half-range
name: Half-range Fourier sine and cosine series
domain: fourier-analysis-and-pdes
year_level:
- university
description: Find a coefficient of the half-range Fourier sine or cosine series of a function given on [0, L], and say what
  value each series converges to at a stated point by using the odd or even periodic extension.
