misconceptions:
- id: wrong-family
  description: Uses sin when the boundary condition is Neumann, or cos when it is Dirichlet.
- id: drops-the-square
  description: Leaves n unsquared in the decay exponent.
- id: drops-alpha
  description: Omits alpha from the decay factor.
- id: wrong-coefficient
  description: Uses 1 instead of the stated coefficient (medium/hard/exam only).
- id: uses-wrong-candidate
  description: Reports the decoy candidate's eigenfunction family (exam tier only).
