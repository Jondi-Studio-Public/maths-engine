id: pde-discriminant-values-and-canonical-form
name: PDE discriminant values and canonical form
domain: fourier-analysis-and-pdes
year_level: [university]
description: >-
  Compute the discriminant B^2 - 4AC of a second-order PDE, find the parameter value or the integer parameter values at which it changes
  type, and for a hyperbolic equation find its characteristic slopes and the mixed coefficient of its canonical form.
status: active
placement_eligible: false
prerequisites:
