misconceptions:
- id: wrong-family
  description: Uses cosine spatial modes for a Dirichlet boundary (or sine modes for a Neumann boundary), swapping the required family.
- id: wrong-time-factor
  description: Uses the wrong time factor, such as sin(...) when the string starts from rest requires cos(...), or vice versa.
- id: drops-c
  description: Omits the wave speed c from the time-factor argument entirely.
- id: wrong-amplitude
  description: Reports the mode with the wrong overall amplitude coefficient.
- id: uses-wrong-family-candidate
  description: Builds the mode from the decoy family candidate instead of the one implied by the stated boundary condition (exam tier only).
