id: uc2-heat-equation-initial-fit
name: Fit the heat equation on a rod to its initial temperature
domain: fourier-analysis-and-pdes
year_level:
- university
description: Solve the heat equation on a rod with fixed-temperature or insulated ends by separation of variables, fit the
  series to the initial temperature (a finite sum of modes or a function that needs Fourier coefficients), and find the
  temperature at a point and time.
