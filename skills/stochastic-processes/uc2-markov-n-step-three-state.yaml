id: uc2-markov-n-step-three-state
name: Three-state Markov chains, n-step, absorption and long-run behaviour
domain: stochastic-processes
year_level:
- university
description: >-
  Work with a three-state Markov chain given by its transition matrix: n-step transition probabilities from the
  matrix power, the distribution after n steps, absorption probabilities, expected time to absorption by first-
  step analysis, and the stationary distribution.
status: active
placement_eligible: false
