id: ucv1-poisson-count-probability
name: Compute a Poisson process count probability
domain: stochastic-processes
description: Compute P(N(t)=k) for a supplied Poisson rate, time and count using an
  exact bounded parameter set. The exponential factor e^(-lambda t) is always
  supplied as a given exact value in the question text; never a Poisson-process
  construction proof, inter-arrival simulation, martingale or stochastic-calculus
  exercise.
status: active
placement_eligible: false
prerequisites: [simple-event-probability]
answer: fraction
sources:
- topic: p12e_poisson_count
  params: {}
  difficulty: easy
  stages:
