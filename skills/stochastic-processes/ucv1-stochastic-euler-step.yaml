id: ucv1-stochastic-euler-step
name: Compute one stochastic Euler update
domain: stochastic-processes
description: Compute one Euler-Maruyama update for a supplied scalar drift, diffusion,
  step and noise value. The diffusion coefficient is a stated constant (additive
  noise) at the easy and medium tiers, and a stated function of the current value,
  sigma(Y) = k*Y (multiplicative noise), at the hard and exam tiers. Every noise
  value is a fixed, stated rational number given in the question text -- never
  sampled or simulated.
status: active
placement_eligible: false
prerequisites: [explicit-euler-linear-ode]
answer: fraction
