misconceptions:
- id: omits-diffusion
  description: Reports the deterministic-only Euler value (the answer
    explicit-euler-linear-ode would give for the same lambda, forcing, Y0, h),
    dropping the diffusion term entirely.
- id: omits-step-size-on-diffusion
  description: Computes sigma*h*dW instead of sigma*dW, treating the diffusion
    term as if it scaled with the step size the way the drift term does.
- id: wrong-sign-diffusion
  description: Subtracts the diffusion term instead of adding it.
- id: uses-dW-as-h
  description: Substitutes the stated noise value dW in place of h in the
    deterministic drift term.
- id: forgets-Y0-scaling-in-diffusion
  description: 'Hard/exam tiers only: at multiplicative noise, uses the constant
    k in place of the correctly-scaled sigma(Y) = k*Y, as if the noise were
    additive.'
tags: [university-core-v1, stochastic-processes, numerical-methods]
