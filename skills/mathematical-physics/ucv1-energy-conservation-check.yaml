id: ucv1-energy-conservation-check
name: Check mechanical energy across two supplied states
domain: mathematical-physics
description: >-
  Compute the difference in kinetic-plus-potential energy between two supplied states of a
  one-dimensional oscillator. The exam tier asks for the total energy of a mass on a spring from one
  observed state, then the amplitude, the maximum speed and the speed at another position.
status: active
placement_eligible: false
prerequisites:
- simple-harmonic-angular-frequency
answer: number
sources:
- topic: p14f_energy_conservation_check
  params: {variant: direct, mk_hi: 4, xv_hi: 4, allow_negative: false}
  difficulty: easy
  stages: [0, 1, 2]
- topic: p14f_energy_conservation_check
  params: {variant: direct, mk_hi: 8, xv_hi: 6, allow_negative: true}
  difficulty: medium
  stages: [3, 4]
- topic: p14f_energy_conservation_check
  params: {variant: implicit, mk_hi: 8, xv_hi: 6}
  difficulty: hard
  stages: [5, 6, maintenance]
- topic: exd_x_r3g_oscillator_energy
  params: {tier: exam}
  difficulty: exam
  stages: [exam]
misconceptions:
- id: drops-the-half
  description: Reports E = k*x^2 + m*v^2, forgetting both factors of 1/2.
- id: sign-flip
  description: Reports E1 - E2 instead of the required E2 - E1.
- id: swapped-roles
  description: Uses m where k belongs and vice versa in the energy formula.
- id: single-state-only
  description: Reports just state 2's energy, forgetting to subtract state 1's.
- id: wrong-branch
  description: On the hard tier, assumes the wrong term (displacement or velocity) vanishes at the described turning point or equilibrium-crossing state.
