id: limit-degree-comparison
name: Degree-mismatch limits
domain: limits
description: "Evaluate limits at infinity and minus infinity by comparing degrees: fractions with different degrees, sums with a mismatched term, factored and square-root forms, and the powers that decide whether a limit is 0 or infinite."
status: active
prerequisites:
- limit-at-infinity
answer: expression
