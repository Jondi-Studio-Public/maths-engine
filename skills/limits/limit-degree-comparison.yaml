misconceptions:
- id: ignored-degree-mismatch
  description: Applying the leading-coefficient ratio when the degrees differ.
- id: wrong-infinite-sign
  description: Getting the sign of an infinite limit wrong.
- id: w6-limit-direction-sign-ignored
  description: Giving the sign of the limit as x tends to plus infinity when x tends to minus infinity.
- id: w6-limit-root-of-x-squared-taken-as-x
  description: Taking the square root of x squared as x, not |x|.
- id: w6-limit-factors-counted-not-degrees
  description: Counting the factors instead of adding their degrees.
- id: w6-limit-equal-degree-allowed
  description: Allowing a power equal to the denominator's degree when the limit is to be 0 or infinite.
difficulty_progression:
  easy:
    steps: 2
    demand: Compare the degrees of one fraction to decide between 0, infinity and minus infinity, or find the largest or smallest power that gives 0 or an infinite limit.
  medium:
    steps: 3
    demand: Combine a mismatched fraction with an equal-degree fraction in a sum, or take x to minus infinity where an odd difference of degrees flips the sign.
  hard:
    steps: 4
    demand: Read the degree and leading coefficient from factored form, or from a square root where the degree halves and the root of x squared is |x|.
