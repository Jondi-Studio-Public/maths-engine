id: uc2-simplex-final-tableau-reading
name: Reading a final simplex tableau
domain: optimisation
year_level:
- university
description: 'Read an optimal simplex tableau: the value of a variable, a constraint''s shadow price, how far a resource
  can change before the basis changes, and the new optimum after a change. The exam chain finds the decision variables,
  a shadow price, the allowable increase and the new maximum.'
