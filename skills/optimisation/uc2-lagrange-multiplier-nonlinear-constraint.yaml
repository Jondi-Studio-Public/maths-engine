id: uc2-lagrange-multiplier-nonlinear-constraint
name: Extremise on a nonlinear constraint with a Lagrange multiplier
domain: optimisation
year_level:
- university
description: Use a Lagrange multiplier to find the extreme value of a function of two variables on a circle, an ellipse or
  another conic.
