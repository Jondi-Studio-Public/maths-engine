id: uc2-lp-duality-dual-formulation
name: The dual of a linear programme
domain: optimisation
year_level:
- university
description: Write the dual of a linear programme as an augmented matrix, and use complementary slackness to find the optimal
  dual solution from a given optimal primal solution. The exam chain writes the dual, finds the slack of each constraint,
  finds a dual value and uses it to update the optimum.
