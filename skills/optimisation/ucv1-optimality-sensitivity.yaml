id: ucv1-optimality-sensitivity
name: Interpret a bounded optimum perturbation
domain: optimisation
description: >-
  Given a convex quadratic's stated minimiser and minimum value, and a stated parameter
  perturbation, select the one of four conclusions about the resulting change that is justified. The
  exam tier gives only the quadratic and the changed coefficient, finds the minimiser and minimum
  value before and after the change, and compares the exact new minimum with the first-order
  estimate.
status: active
placement_eligible: false
prerequisites:
- convex-quadratic-minimum
answer: mcq
