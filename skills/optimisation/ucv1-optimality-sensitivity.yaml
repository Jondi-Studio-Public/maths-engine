misconceptions:
- id: drops-the-chain-factor
  description: Reports the minimiser's move as -d/a (or -d/(4a)) instead of -d/(2a), forgetting or misremembering the chain factor from x* = -b/(2a).
- id: linearises-a-nonlinear-dependence
  description: Estimates the minimum value's change with a first-order (linear) approximation instead of the exact non-linear formula, so the reported change is a genuinely different number from the true one.
- id: attributes-change-to-the-wrong-part
  description: In the two-variable separable case, computes the value change from the untouched variable's coefficients instead of the perturbed variable's, missing which part of the separable sum was actually changed.
