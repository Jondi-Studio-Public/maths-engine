id: uc2-mm1-queue-and-eoq
name: M/M/1 queue measures and the economic order quantity
domain: optimisation
year_level: [university]
description: >-
  Operations-research formulas with exact answers. For an M/M/1 queue: utilisation, the mean number in the system and in the queue, the mean wait and time
  in the system (with Little's law), P(n customers) and the tail probability, and the largest arrival rate or smallest service rate that meets a target.
  For inventory: the economic order quantity, the minimum annual cost, orders per year, the reorder point and the best lot when orders come in multiples
  of a stated size. The exam chains follow an answer through three parts in either model.
