id: uc2-simplex-one-pivot
name: One pivot of the simplex method
domain: optimisation
year_level:
- university
description: Build and pivot a simplex tableau for a maximisation problem with a stated pivot rule (most negative objective
  entry, then the minimum ratio, lowest index on a tie), giving every tableau as a matrix of exact fractions. The exam chain
  writes the initial tableau, the minimum ratio, the tableau after the first pivot and the new value of z.
status: active
placement_eligible: false
