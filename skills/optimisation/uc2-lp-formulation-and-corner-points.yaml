id: uc2-lp-formulation-and-corner-points
name: Formulate a linear programme and optimise at the corner points
domain: optimisation
year_level:
- university
description: Turn a story about two products or two ingredients into a linear programme in two variables, find the corner
  points of its feasible region, and read the optimum off them. The exam chain lists the corner points, then finds the optimal
  plan and the greatest profit.
status: active
placement_eligible: false
