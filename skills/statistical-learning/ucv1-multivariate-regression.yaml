misconceptions:
- id: wrong-order
  description: Reports [b0, b2, b1], swapping the two feature slopes -- exactly
    the mistake the order-sensitive grader exists to catch.
- id: ignores-one-feature
  description: Solves as if the model were y = b0 + b1*x1 only, dropping x2's
    column from the system entirely and reporting b2 = 0.
- id: off-diagonal-ignored
  description: 'Non-orthogonal/Gram tiers only: solves as if the Gram matrix were
    diagonal, dividing each cross-product entry by the matching diagonal entry
    and ignoring the off-diagonal (feature-correlation) terms.'
- id: sign-flip
  description: Negates one coefficient, a plausible sign-tracking slip during
    elimination.
- id: omits-mean-adjustment
  description: 'Exam tier only: reports b0 = ybar directly, skipping the derived
    combination step b0 = ybar - b1*x1bar - b2*x2bar that recovers the intercept
    of the original (uncentred) model.'
tags: [university-core-v1, statistical-learning, regression]
