id: ucv1-multivariate-regression
name: Fit a two-feature linear regression
domain: statistical-learning
description: Compute coefficients [b0, b1, b2] for a supplied two-feature design
  y = b0 + b1*x1 + b2*x2 with an invertible Gram matrix, solving (X^T X) b = X^T y.
  Presentation ranges from raw (x1, x2, y) data to the Gram matrix X^T X / X^T y
  given directly. Answers are graded positionally, order matters -- a transposed
  [b0, b2, b1] is a different, wrong answer.
