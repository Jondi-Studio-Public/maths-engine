misconceptions:
- id: omits-lambda
  description: Reports the zero-penalty OLS value Sxy/Sxx, ignoring the penalty
    entirely.
- id: subtracts-lambda
  description: Computes Sxy/(Sxx-lambda) instead of Sxy/(Sxx+lambda).
- id: adds-lambda-to-numerator
  description: Computes (Sxy+lambda)/Sxx instead of adding lambda to the
    denominator.
- id: uses-lambda-squared
  description: Computes Sxy/(Sxx+lambda^2) instead of Sxy/(Sxx+lambda).
- id: wrong-sum
  description: 'Hard tier only: computes sum(x_i^2) correctly but sum(y_i*y_i)
    instead of sum(x_i*y_i) for the numerator, a plausible mix-up when given
    raw (x, y) pairs.'
