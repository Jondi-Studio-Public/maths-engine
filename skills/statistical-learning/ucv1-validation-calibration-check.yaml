misconceptions:
- id: skips-binning
  description: Computes the calibration error from the overall mean prediction and outcome directly, skipping the stated per-bin convention.
- id: direction-flipped
  description: Computes the calibration error correctly but reports the opposite over-/under-confidence direction.
- id: unweighted-bin-average
  description: Averages the bins' errors equally instead of weighting each bin by its share of the total points.
