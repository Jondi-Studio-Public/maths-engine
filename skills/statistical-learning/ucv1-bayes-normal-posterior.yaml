misconceptions:
- id: doesnt-shrink
  description: Reports the prior variance tau0^2 unchanged as tau1^2, ignoring
    the data entirely for the variance component.
- id: forgot-n
  description: Computes precision1 = 1/tau0^2 + 1/sigma^2, omitting the sample
    size n multiplying the data precision -- a common "one observation" slip
    that also corrupts mu1 through the same missing n.
- id: swapped-precision-weights
  description: Computes mu1 using tau0^2/n in place of n/sigma^2, mixing up
    which precision belongs to which term.
- id: reports-precision-not-variance
  description: Returns precision1 itself (the reciprocal) instead of tau1^2 =
    1/precision1, a units/inversion slip.
- id: unweighted-average
  description: Reports mu1 as (mu0 + x-bar) / 2, ignoring both precisions
    entirely.
