id: ucv1-metric-axiom-check
name: Check metric axioms on a finite distance table
domain: metric-spaces-and-topology
description: >-
  Decide which metric axiom fails, if any, for a supplied finite symmetric distance table. The exam
  tier gives a distance table with one distance t missing and asks for the least and greatest t that
  keep the triangle inequality, then how many whole-number values of t give a metric.
status: active
placement_eligible: false
prerequisites: []
answer: mcq
