misconceptions:
- id: assumes-symmetry-suffices
  description: Treats a symmetric table as automatically satisfying every metric axiom, without separately checking d(x, x) = 0, positivity for distinct points, or the triangle inequality.
- id: overlooks-diagonal-entries
  description: Never inspects the diagonal d(x, x) values, so a table with a nonzero self-distance is misclassified as satisfying the identity axiom.
- id: eyeballs-triangle-inequality
  description: Compares the relative sizes of d(x, z), d(x, y) and d(y, z) informally rather than actually adding d(x, y) + d(y, z), so a near-miss violation (the sum exceeded by exactly 1) is missed, or a satisfied inequality is wrongly flagged as broken.
