misconceptions:
- id: checks-coverage-only
  description: Confirms the union of the collection is the whole universe but never checks the finite-intersection condition, so a collection that fails intersection is misclassified as a basis.
- id: checks-intersection-only
  description: Confirms the finite-intersection condition but never checks coverage, so a collection that fails coverage is misclassified as a basis.
- id: assumes-singletons-present
  description: Treats every pairwise intersection as automatically refinable without checking whether a small enough member is actually present in the collection, so a family built only from mid-sized sets is misclassified as satisfying the intersection condition.
