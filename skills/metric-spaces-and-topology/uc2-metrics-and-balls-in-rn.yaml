difficulty_progression:
  easy: {steps: 2, demand: "Find the exact distance between two points of R^2 or R^3 under a named metric: taxicab, Euclidean, maximum or a weighted taxicab metric."}
  medium: {steps: 3, demand: "Decide which of six points lie strictly inside an open ball, with points on the sphere as the trap, or compare balls of two metrics using the norm-comparison constant."}
  hard: {steps: 4, demand: "Find the least upper bound of the radii whose ball misses part of a set, the exact area or volume of a ball or a shell between balls, or the radius of the ball with listed vertices."}
  exam: {steps: 6, demand: "Find two distances, count the points of a set inside a ball, find the least radius whose ball contains the set, then the area or volume of that ball by follow-through."}
