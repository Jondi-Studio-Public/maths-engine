id: uc2-metrics-and-balls-in-rn
name: Distances and open balls in R^n under the taxicab, Euclidean and maximum metrics
domain: metric-spaces-and-topology
year_level: [university]
description: >-
  Compute distances in R^2 and R^3 under the taxicab, Euclidean and maximum metrics, count the points in an open
  ball, compare balls of different metrics, and measure balls exactly. The exam chain finds two distances, a
  membership count, the least radius whose ball contains a set, and the area or volume of that ball.
