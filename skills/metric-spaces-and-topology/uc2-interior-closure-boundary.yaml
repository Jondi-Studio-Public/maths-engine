id: uc2-interior-closure-boundary
name: Interior, closure, boundary and limit points of subsets of R and the plane
domain: metric-spaces-and-topology
year_level: [university]
description: >-
  Find the interior, closure, boundary points and limit points of subsets of R built from intervals, isolated
  points, sequences such as 1/n and rational intervals, and classify points against simple planar sets (discs,
  annuli, half-planes, rectangles). The exam chain finds the interior, the boundary points, their number, their sum
  and their mean by follow-through.
status: active
placement_eligible: false
prerequisites:
- uc2-metrics-and-balls-in-rn
answer: set
