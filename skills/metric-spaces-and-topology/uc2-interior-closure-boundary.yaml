difficulty_progression:
  easy: {steps: 2, demand: "Name the endpoints of the interior, of the closure, or of the boundary of a union of one or two intervals and an isolated point."}
  medium: {steps: 3, demand: "Merge or separate touching intervals, then find the interior, closure, boundary set or isolated points of a union with isolated points."}
  hard: {steps: 4, demand: "Find the limit points of a sequence such as 1/n, the endpoints of the closure points missing from a set, or the interior or closure of a set of rationals in an interval; or pick out which lattice points lie in the interior, closure or boundary of a disc, punctured disc, annulus, half-plane or rectangle."}
  exam: {steps: 6, demand: "Find the interior, the boundary points (or the closure points missing from the set), their number and their sum, then their mean by follow-through."}
