id: unit-pricing
name: Calculate a unit price
domain: financial-discrete
description: Divide a pack price by its quantity to calculate price per item.
status: active
prerequisites:
- ratio-rate-proportion
answer: number
sources:
- topic: unit_pricing
  params: {}
  difficulty: easy
- topic: w3_unit_tiers
  params: {}
  difficulty: medium
  stages:
  - 3
  - 4
- topic: w3_unit_tiers
  params: {}
  difficulty: hard
  stages:
  - 5
  - 6
  - maintenance
- topic: exd_x_g5_unit_pricing
  params:
    tier: exam
  difficulty: exam
