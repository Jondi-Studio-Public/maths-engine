id: payg-payslip-reading
name: 'Read a payslip: gross, PAYG, net pay and employer super'
domain: financial-discrete
description: Read a payslip table to find gross pay, PAYG withheld, deductions, net pay deposited and the employer's super,
  keeping the employer's super apart from the pay and counting only ordinary-time earnings towards it.
status: active
placement_eligible: false
prerequisites:
- calculate-wages
- percentage-of-quantity
answer: number
