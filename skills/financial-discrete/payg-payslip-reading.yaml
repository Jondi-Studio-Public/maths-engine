misconceptions:
- id: r3e-allowance-left-out-of-gross
  description: Leaving the allowance out of the gross pay.
- id: r3e-allowance-left-out-of-super-base
  description: Leaving the allowance out of the ordinary-time earnings that super is worked out on.
- id: r3e-current-given-as-previous
  description: Giving this pay where the pay from earlier periods was asked for.
- id: r3e-employer-super-added-to-pay
  description: Adding the employer's super to the pay deposited in the bank account.
- id: r3e-employer-super-deducted
  description: Taking the employer's super contribution off the net pay, though the employer pays it on top of the wages.
- id: r3e-fee-added-to-pay
  description: Adding a deduction to the pay instead of taking it off.
- id: r3e-fee-left-out
  description: Leaving a fixed fee or deduction out of the working.
- id: r3e-gross-given-as-net
  description: Giving the gross pay where the net pay was asked for.
- id: r3e-hours-added-to-gross
  description: Adding the number of hours worked in as if it were a dollar amount in the gross pay.
- id: r3e-mean-over-wrong-count
  description: Dividing the earlier pay total by the number of pays including this one instead of by the earlier pays.
- id: r3e-overtime-left-out-of-gross
  description: Leaving the overtime out of the gross pay.
- id: r3e-payg-left-out
  description: Leaving the PAYG tax out of the deductions.
- id: r3e-payg-on-gross-after-sacrifice
  description: Working the PAYG on the full gross pay but still subtracting the sacrifice.
- id: r3e-payg-on-ordinary-pay-only
  description: Working the PAYG out on the ordinary pay only, not on the whole gross pay.
- id: r3e-payg-taken-as-remainder
  description: Giving the pay left after tax where the tax withheld was asked for.
- id: r3e-percent-decimal-slip
  description: Moving the decimal point one place too far when turning a percentage into dollars.
- id: r3e-percentage-added-to-net
  description: Adding the PAYG percentage on to the net pay to get the gross pay.
- id: r3e-percentage-taken-of-net
  description: Taking the PAYG percentage of the net pay to find the gross pay.
- id: r3e-sacrifice-deducted-twice
  description: Taking the salary sacrifice off twice.
- id: r3e-sacrifice-ignored
  description: Leaving the salary sacrifice out of the pay calculation.
- id: r3e-sacrifice-not-deducted-from-pay
  description: Not taking the salary sacrifice out of the pay deposited.
- id: r3e-super-on-net-pay
  description: Working super out on the net pay instead of the ordinary-time earnings.
- id: r3e-super-on-overtime-only
  description: Working super out on the overtime instead of on the ordinary-time earnings.
- id: r3e-super-on-overtime-too
  description: Working super out on the gross pay including overtime, when super is paid on ordinary-time earnings only.
- id: r3e-ytd-includes-this-pay
  description: Dividing the year-to-date total by the number of earlier pays without first taking this pay out of it.
- id: r3e-ytd-mean-over-all-periods
  description: Dividing the year-to-date total, which includes this pay, by the number of pays including this one.
difficulty_progression:
  easy:
    steps: 2
    demand: Find the net pay from the gross pay, the PAYG and the union fee, with an employer-super line in the table that
      is not a deduction.
  medium:
    steps: 3
    demand: Pick out the ordinary-time earnings (not the overtime) to find the employer super; or read a year-to-date column
      back to the mean of earlier pays.
  hard:
    steps: 4
    demand: Work back from net pay through a PAYG percentage and a fixed fee to gross pay; or apply a salary sacrifice before
      the PAYG percentage.
  exam:
    steps: 4
    demand: Gross pay from its lines, the PAYG, the net pay, then the employer super on ordinary-time earnings, each following
      through.
