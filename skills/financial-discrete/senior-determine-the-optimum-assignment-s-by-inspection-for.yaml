misconceptions:
- id: row-greedy-ignores-conflicts
  description: Each worker independently picks their cheapest task, ignoring that multiple workers might pick the same task (infeasible assignment).
- id: column-greedy-ignores-conflicts
  description: Each task independently picks its cheapest worker, ignoring that multiple tasks might claim the same worker (infeasible assignment).
- id: diagonal-default-unchecked
  description: Assumes the default assignment (worker i does task i) is optimal without checking other permutations.
