misconceptions:
- id: predecessor-es-instead-of-ef
  description: Gives the predecessor's earliest start instead of its earliest finish (forgets to add duration).
- id: ef-instead-of-es
  description: Gives the activity's earliest finish instead of earliest start.
- id: activity-duration-only
  description: Gives only the activity's duration, ignoring the network before it.
- id: sum-instead-of-max-at-merge
  description: Sums the two predecessors' finish times instead of taking the maximum.
- id: min-instead-of-max-at-merge
  description: Takes the minimum finish time of two predecessors instead of the maximum.
- id: es-instead-of-ls
  description: Gives the activity's earliest start instead of its latest start (skips backward scan).
- id: lf-instead-of-ls
  description: Gives the activity's latest finish instead of latest start (forgets to subtract duration).
- id: max-instead-of-min-for-successors
  description: Takes the maximum latest start of successors instead of the minimum.
