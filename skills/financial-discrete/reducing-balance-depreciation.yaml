misconceptions:
- id: rbd-rate-not-converted
  description: Multiplies by the percentage without dividing by 100.
- id: rbd-depreciation-for-value
  description: Gives the amount depreciated where the value was asked.
- id: rbd-uses-flat
  description: Takes the same amount off each year (flat rate) when the percentage applies to the current value.
- id: rbd-one-year-only
  description: Applies the percentage once however many years have passed.
- id: rbd-multiplies-by-years
  description: Multiplies the rate by the number of years inside the bracket instead of using a power.
- id: rbd-extra-year
  description: Applies the percentage one year too many.
- id: rbd-one-year-short
  description: Applies the percentage one year too few.
- id: rbd-rate-for-multiplier
  description: Multiplies by the rate (for example 0.15) instead of by one less the rate (0.85).
- id: rbd-growth-multiplier
  description: Uses one plus the rate as the yearly multiplier, which grows the value.
- id: rbd-total-for-value
  description: Gives the value left where the total depreciation was asked.
- id: rbd-first-year-amount
  description: Finds the depreciation for the first year only and calls it the total.
- id: rbd-boundary-year
  description: Gives the last year the value is still at or above the target, not the first year it is below it.
- id: rbd-flat-years
  description: Finds the years to reach the target as if the same amount came off each year.
- id: rbd-rate-from-whole-drop
  description: Takes the whole drop over two years as the yearly rate instead of finding the yearly multiplier.
- id: rbd-rate-halved
  description: Halves the two-year drop to get the yearly rate.
- id: rbd-multiplier-for-rate
  description: Gives the yearly multiplier as a percentage instead of the rate of depreciation.
- id: rbd-price-from-flat
  description: Adds back the same amount each year to find the price instead of dividing by the multiplier.
- id: rbd-price-multiplies
  description: Multiplies the later value by the multiplier instead of dividing, so the 'price' is smaller than the value.
- id: rbd-wrong-year-amount
  description: Gives the depreciation of the wrong year (the year before or after).
- id: rbd-year-from-first-value
  description: Takes the percentage of the purchase price for the year asked, as if every year lost the same amount.
difficulty_progression:
  easy:
    steps: 2
    demand: Take a percentage off the price once, or twice in turn.
  medium:
    steps: 3
    demand: Apply the yearly multiplier three to five times, read the rule V = P(1 - r)^n, or find the rate from one year's
      value.
  hard:
    steps: 5
    demand: Find the first year below a target, the rate from a two-year value, the price from a later value, or the depreciation
      in one particular year.
  exam:
    steps: 7
    demand: Chain the first-year value, the value after n years, the total depreciation and the first year below a target.
