misconceptions:
- id: divides-by-retained-fraction
  description: Divides the fixed amount added each period by the retained fraction a instead of
    the eliminated fraction (1 - a), reporting b/a instead of b/(1 - a).
- id: reports-added-amount
  description: Reports the fixed amount added each period as if it were itself the long-term
    steady-state value.
- id: one-period-ahead
  description: Reports the value after one application of the recurrence from the given starting
    value, mistaking a single step for the long-term value.
- id: two-periods-ahead
  description: Reports the value after two applications of the recurrence from the given starting
    value, mistaking two steps for the long-term value.
- id: wrong-cycle-point
  description: Reports the steady-state value at the point in the cycle the recurrence's own u(n)
    was given at, when the question asks for the value at the other point in the same cycle.
- id: rate-and-dose-swapped
  description: Recovers the rate and the fixed amount added using the reciprocal of the correct
    ratio of consecutive differences, swapping which recorded difference plays which role.
- id: simple-difference-for-added-amount
  description: Takes the fixed amount added each period to be the plain difference between two
    consecutive recorded values, ignoring the multiplicative loss each period.
- id: mistakes-recorded-value-for-longterm
  description: Reports one of the recorded values itself as the long-term steady-state value,
    instead of computing it from the recurrence's own constants.
