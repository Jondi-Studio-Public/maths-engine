id: flat-rate-depreciation
name: Flat-rate depreciation
domain: financial-discrete
year_level:
- '10'
- '11'
description: Depreciate an asset by the same percentage of its purchase price each year, finding the yearly amount, the value
  after some years, and the years needed to reach a value.
status: active
placement_eligible: false
prerequisites:
- percentage-of-quantity
answer: number
