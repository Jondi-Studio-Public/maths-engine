id: critical-path-from-a-precedence-table
name: Count dummy activities and find the critical time from a precedence table
domain: financial-discrete
year_level: ['12']
description: >-
  Work from a project's precedence table, without drawing the diagram, to count the dummy activities its
  activity-on-arrow network needs (the fewest possible) and to find the critical time. Easy counts the dummies of a
  five or six activity table. Medium finds the critical time of a table whose diagram needs a dummy. Hard counts
  dummies in larger tables, counts all the arrows of the diagram, or finds the critical time with a rival route within
  two days. The exam chain counts the dummies, the arrows (carried forward), the critical time and the new critical
  time after a critical activity is shortened (carried forward). Distinct from the skills that read floats and
  critical paths off a drawn network.
status: active
placement_eligible: false
prerequisites:
- senior-use-the-critical-path-to-determine-the-minimum
answer: number
