id: income-tax-bracket-calculation
name: Calculate income tax from a stated scale of tax brackets
domain: financial-discrete
description: Use a stated resident tax scale and Medicare levy percentage to find the tax payable on a taxable income, the
  average rate, the income left after tax, or the extra tax on a pay rise that crosses a bracket.
status: active
placement_eligible: false
prerequisites:
- percentage-of-quantity
- decimal-arithmetic
answer: number
