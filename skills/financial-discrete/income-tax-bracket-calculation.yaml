misconceptions:
- id: r3e-after-tax-gain-given
  description: Giving the pay rise after tax instead of the extra tax the rise causes.
- id: r3e-average-over-taxed-income
  description: Dividing the tax by the income above the tax-free threshold instead of by the whole taxable income to find
    the average rate.
- id: r3e-band-rates-averaged
  description: Averaging the rates of the bands reached instead of dividing the tax by the taxable income.
- id: r3e-base-tax-ignored
  description: Finding the income above a threshold from the tax bill without first taking off the tax already owed on the
    lower bands.
- id: r3e-deduction-added-to-income
  description: Adding the deductions to the income instead of taking them off to find taxable income.
- id: r3e-deduction-decimal-slip
  description: Taking a tenth of the deductions off the income, a decimal-place slip.
- id: r3e-deduction-taken-as-income
  description: Treating the deductions as the taxable income.
- id: r3e-deductions-ignored
  description: Leaving the deductions out and taxing the full income earned.
- id: r3e-deductions-not-taken-off-first
  description: Working out tax and levy on the full income earned, not on the income left after deductions.
- id: r3e-first-rate-on-whole-income
  description: Charging the whole taxable income at the rate of the first taxed band.
- id: r3e-gave-tax-not-remainder
  description: Giving the amount paid in tax and levy where the amount left over was asked for.
- id: r3e-levy-left-out
  description: Leaving the Medicare levy out of what is taken from the income.
- id: r3e-levy-on-gross
  description: Working the Medicare levy out on the income earned before deductions.
- id: r3e-levy-on-tax
  description: Taking the levy percentage of the income tax instead of the taxable income.
- id: r3e-marginal-rate-given-as-average
  description: Giving the rate on the top slice of income where the average rate of tax was asked for.
- id: r3e-middle-band-left-out
  description: Skipping one of the bands between the tax-free threshold and the band the income reaches.
- id: r3e-new-rate-on-whole-rise
  description: Charging the whole pay rise at the higher rate, though part of it falls in the lower band.
- id: r3e-nil-band-taxed
  description: Charging tax on the tax-free slice of income as well.
- id: r3e-old-rate-on-whole-rise
  description: Charging the whole pay rise at the old rate, though part of it crosses into the higher band.
- id: r3e-percent-decimal-slip
  description: Moving the decimal point one place too far when turning a percentage into dollars.
- id: r3e-rate-not-applied-to-excess
  description: Taking the income above the threshold but never applying the rate to it.
- id: r3e-rate-on-whole-income
  description: Applying the rate of the highest band reached to the whole income instead of only to the slice in that band.
- id: r3e-ratio-not-percentage
  description: Leaving the tax-to-income ratio as a decimal without turning it into a percentage.
- id: r3e-tax-left-out
  description: Leaving the income tax out of what is taken from the income.
- id: r3e-tax-on-gross-income
  description: Working the tax out on the income before deductions instead of on taxable income.
- id: r3e-top-slice-only
  description: Charging only the top slice of income and leaving out the tax owed on the lower bands.
- id: r3e-wrong-band-rate
  description: Dividing the tax by the rate of the wrong band when working back to the income.
- id: r3e-wrong-band-threshold
  description: Using the threshold of the band below when working back to the income.
difficulty_progression:
  easy:
    steps: 1
    demand: Apply the stated rate to the slice of income above the tax-free threshold, in a scale where the income reaches
      only the first taxed bracket.
  medium:
    steps: 3
    demand: Charge each slice of income at its own bracket rate across three or four brackets and add, or take the tax from
      the income.
  hard:
    steps: 4
    demand: Combine deductions, brackets and the levy; or cross a threshold with a pay rise; or run the scale backwards
      from a tax bill to the income; or turn a tax bill into an average rate.
  exam:
    steps: 4
    demand: Taxable income from gross income and deductions, then tax by brackets, then the levy, then what remains, each
      following through.
