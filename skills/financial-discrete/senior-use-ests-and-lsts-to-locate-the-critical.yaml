misconceptions:
- id: swapped-critical-path
  description: Believes the shorter (losing) path is critical instead of the longer path.
- id: counted-other-path
  description: Counts the number of activities on the non-critical path instead of the critical path.
- id: off-by-one-activity-count
  description: Miscounts the critical path's activity count by one (drops or double-counts one activity).
- id: w3el-smallest-float
  description: Chooses the activity with the smallest float that is not zero.
- id: w3el-largest-est
  description: Chooses the activity with the latest earliest start time.
- id: w3el-largest-lst
  description: Chooses the activity with the latest latest start time.
- id: w3el-first-listed
  description: Chooses the first activity in the table.
- id: w3el-longest-activity
  description: Follows the longest single activities instead of the longest path.
- id: w3el-most-activities
  description: Takes the path with the most activities for the critical path.
- id: w3el-one-swap
  description: Swaps one critical activity for a non-critical one.
- id: w3el-est-for-lst
  description: Gives the earliest start time where the latest start time was asked.
- id: w3el-ignores-successors
  description: Finds the latest start time from the project duration alone and ignores the activities that follow.
- id: w3el-forgets-duration
  description: Gives the latest start time of the next activity without taking off the duration.
- id: w3el-finish-for-start
  description: Gives the earliest finish time where the latest start time was asked.
- id: w3el-float-for-lst
  description: Gives the float where the latest start time was asked.
