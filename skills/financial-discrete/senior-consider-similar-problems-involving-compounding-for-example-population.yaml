misconceptions:
- id: simple-growth-not-compound
  description: Treats a compounding rate as simple (linear) growth or decline instead, adding or subtracting a flat percentage of the starting/final value once per period instead of compounding it.
- id: applied-once-not-n-times
  description: Applies the growth or decay multiplier only once regardless of how many periods the question states.
- id: wrong-direction-multiplier
  description: Applies the growth multiplier to a declining quantity instead of the decay multiplier, or vice versa.
- id: multiplied-instead-of-divided
  description: When asked for the original quantity before growth occurred, multiplies the final value by the compounding factor again instead of dividing by it.
