id: graph-adjacency-matrices
name: Use adjacency matrices to describe a network and count walks
domain: financial-discrete
description: >-
  The adjacency matrix of a network has a 1 where two vertices are joined and a 0 otherwise. Read degrees and the number
  of edges from one, and count walks of length 2 and 3 with its powers. easy reads a degree or the edge count from a stated
  matrix, or counts the 1s in the matrix of a stated network; medium counts the walks of length 2 between two vertices
  (an entry of the matrix squared); hard counts walks of length 3 between two vertices, or all the walks of length 2 from one
  vertex; exam is a four-part chain on a stated network whose first part writes the adjacency matrix itself, followed by walks
  of length 2 from one vertex. The answers are whole numbers, and in the exam chain also a matrix.
status: active
placement_eligible: false
prerequisites: [graph-vertex-degrees-handshaking]
answer: number
