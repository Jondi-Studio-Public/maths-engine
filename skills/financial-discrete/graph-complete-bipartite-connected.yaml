id: graph-complete-bipartite-connected
name: Complete, connected and bipartite graphs from a description or an edge list
domain: financial-discrete
year_level:
- '12'
description: Count with the kinds of simple graph. Find the edges of a complete graph, the edges still missing from one, the
  vertices reachable when a network is not connected, the parts of a bipartite network given only as an edge list, and the
  extreme edge counts for a graph with several components or a bipartite graph. Every answer is a whole number.
