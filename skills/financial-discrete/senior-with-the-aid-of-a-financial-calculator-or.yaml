id: senior-with-the-aid-of-a-financial-calculator-or
name: With the aid of a financial calculator or computer-based financial software, solve problems involving
  reducing balance loans; for example, determining the monthly repayments required to pay off a housing
  loan
domain: financial-discrete
description: Given bounded, fully specified inputs, with the aid of a financial calculator or computer-based
  financial software, solve problems involving reducing balance loans; for example, determining the monthly
  repayments required to pay off a housing loan. Return the resulting value, expression, relation, or
  classification. Does not assess unbounded investigations, unstated assumptions, or assessment modes
  outside capability_gate.
status: active
placement_eligible: false
