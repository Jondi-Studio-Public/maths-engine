misconceptions:
- id: flat-not-reducing-interest
  description: Uses flat interest (on the original principal every period) instead of compounding periodic
    interest on the reducing balance, confusing this skill with a flat-loan-repayment shape.
- id: annual-rate-as-periodic
  description: Uses the stated ANNUAL interest rate directly as the periodic (monthly) rate, forgetting to
    divide by the number of compounding periods per year.
- id: years-not-months
  description: Uses the loan term in whole YEARS as the number of repayment periods instead of converting
    to MONTHS, an off-by-one-unit error on n.
