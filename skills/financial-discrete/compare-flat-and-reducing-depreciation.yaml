id: compare-flat-and-reducing-depreciation
name: Compare flat-rate and reducing-balance depreciation
domain: financial-discrete
year_level:
- '11'
- '12'
description: 'Compare the value of an asset under flat-rate and reducing-balance depreciation: the difference after some years,
  the year the methods cross over, and the flat rate that matches a reducing-balance value.'
status: active
placement_eligible: false
prerequisites:
- flat-rate-depreciation
- reducing-balance-depreciation
answer: number
sources:
