misconceptions:
- id: sum-all-source-outgoing
  description: Sums all of the source node's outgoing pipe capacities, ignoring downstream bottlenecks.
- id: sum-all-sink-incoming
  description: Sums all of the sink node's incoming pipe capacities, ignoring upstream bottlenecks.
- id: minimum-pipe-capacity
  description: Chooses the single smallest pipe capacity in the network, over-conservative and ignoring the ability to split flow across independent paths.
