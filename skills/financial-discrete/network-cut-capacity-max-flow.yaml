id: network-cut-capacity-max-flow
name: Cut capacity, minimum cut and maximum flow in a network
domain: financial-discrete
year_level:
- '12'
description: Find the capacity of a cut in a directed network described in words (only links from the source side to the sink
  side count), choose the smallest of several cuts, use the maximum-flow minimum-cut theorem to find the maximum flow, and
  find the new maximum flow when one link is widened. Every answer is a whole number.
status: active
placement_eligible: false
prerequisites:
- senior-solve-small-scale-network-flow-problems-including-the
answer: number
