id: credit-card-interest-statement
name: Calculate credit card interest, minimum payments and time to clear
domain: financial-discrete
description: Use a stated annual rate and minimum-payment rule to find daily interest on a balance, the minimum payment,
  the interest on what is left, and how long a card takes to clear at a fixed monthly payment.
status: active
placement_eligible: false
prerequisites:
- simple-interest
- percentage-of-quantity
answer: number
sources:
