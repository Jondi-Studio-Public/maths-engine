id: future-value-annuity-table
name: Future value of an annuity from a table
domain: financial-discrete
year_level:
- '11'
- '12'
description: Use a table of future value factors for $1 per period to find the future value of equal contributions, the payment
  that reaches a target, and the interest earned.
status: active
placement_eligible: false
prerequisites:
- compound-interest
answer: number
sources:
- topic: w3_annuity_table
  params: {}
  difficulty: easy
  stages:
  - 0
  - 1
  - 2
- topic: w3_annuity_table
  params: {}
  difficulty: medium
  stages:
  - 3
  - 4
- topic: w3_annuity_table
  params: {}
