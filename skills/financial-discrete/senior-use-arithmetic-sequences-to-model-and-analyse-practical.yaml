misconceptions:
- id: assumed-adjacent-periods
  description: Treats the two stated table periods as adjacent (gap = 1) and never divides by the true gap between them when they are not adjacent, so the wrong common difference is used throughout.
- id: extrapolated-backward
  description: Predicts a value before the first stated period rather than forward from the later stated period.
- id: ignored-target-distance
  description: Applies the common difference once regardless of how many periods ahead the target period actually is.
