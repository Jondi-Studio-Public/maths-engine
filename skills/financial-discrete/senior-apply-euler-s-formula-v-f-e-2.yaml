id: senior-apply-euler-s-formula-v-f-e-2
name: Apply Euler’s formula, \(v+f-e=2\), to solve problems relating to planar graphs
domain: financial-discrete
description: >-
  Given the numbers of any two of the vertices, edges and faces of a stated connected planar graph
  (or a convex polyhedron, whose skeleton is one), find the third using Euler's formula v + f - e = 2.
  easy states v and e and asks for f; medium states f and one of v/e and asks for the other; hard
  states a degree list, so the learner must count v from the list and get e from the handshake lemma
  before applying the formula; exam states a face-length list (with the "every edge borders two
  different faces" convention), so the learner counts f and gets e from the face-length sum before
  solving for v. This is not the numerical `explicit-euler` ODE-stepping skills (a different Euler,
  no counting involved) and not a graph-drawing or graph-colouring skill -- every graph here is fully
  described by its counts, and the answer is one whole number.
status: active
placement_eligible: false
