misconceptions:
- id: forgot-outer-face
  description: For a plane graph, forgets that the count of faces includes the outer, unbounded region, so is off by one on whichever quantity is unknown.
- id: forgot-constant
  description: Uses v + f - e = 0 instead of v + f - e = 2, dropping the constant on the right-hand side.
- id: sign-error
  description: Rearranges with a sign error (v - f + e = 2, or e + f - v = 2) instead of v + f - e = 2, giving a different value for the unknown.
- id: degree-sum-as-edges
  description: On the hard tier, uses the sum of the stated degrees directly as the number of edges instead of halving it (the handshake lemma).
- id: face-sum-as-edges
  description: On the exam tier, uses the sum of the stated face lengths directly as the number of edges instead of halving it (each edge borders exactly two faces).
