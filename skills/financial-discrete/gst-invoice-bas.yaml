id: gst-invoice-bas
name: Work with GST on invoices and a business activity statement
domain: financial-discrete
description: Find the GST contained in a GST-inclusive price, the total on an invoice with GST-free lines, the GST in a
  quote that mixes inclusive and exclusive prices, and the net GST payable on a short business activity statement.
status: active
placement_eligible: false
prerequisites:
- percentage-of-quantity
- reverse-percentage
answer: number
