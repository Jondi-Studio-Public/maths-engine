misconceptions:
- id: r3e-credits-added
  description: Adding the GST credits to the GST collected instead of subtracting them.
- id: r3e-credits-left-out
  description: Giving the GST collected without taking off the GST credits on purchases.
- id: r3e-exclusive-price-given-as-gst
  description: Giving the price before GST where the GST itself was asked for.
- id: r3e-gst-added-to-inclusive-price
  description: Adding more GST on to a price that already includes it.
- id: r3e-gst-charged-on-gst-free-items
  description: Charging GST on items that are GST-free.
- id: r3e-gst-free-items-left-out
  description: Leaving the GST-free items out of the invoice total.
- id: r3e-gst-free-sales-left-out
  description: Taking the GST out of the taxable sales but leaving the GST-free sales out of the total.
- id: r3e-gst-free-sales-treated-as-taxable
  description: Taking GST out of the GST-free sales as well.
- id: r3e-gst-left-out
  description: Leaving the GST out of the invoice total.
- id: r3e-gst-not-removed-from-sales
  description: Adding the GST-free sales to the taxable sales without taking the GST out of the taxable sales.
- id: r3e-gst-subtracted-wrong-way
  description: Subtracting the GST collected from the credits instead of the credits from the GST collected.
- id: r3e-gst-taken-of-inclusive-price
  description: Taking 10% of a GST-inclusive price as the GST, instead of one eleventh of it.
- id: r3e-gst-treated-as-inclusive
  description: Treating the prices as if they already included GST and taking one eleventh of them.
- id: r3e-labour-gst-left-out
  description: Counting the GST inside the materials price but forgetting the GST added to the labour.
- id: r3e-labour-treated-as-inclusive
  description: Treating the labour price as if it included GST and taking one eleventh of it.
- id: r3e-materials-gst-left-out
  description: Counting the GST on the labour but forgetting the GST already inside the materials price.
- id: r3e-percent-decimal-slip
  description: Moving the decimal point one place too far when turning a percentage into dollars.
difficulty_progression:
  easy:
    steps: 2
    demand: Take the GST out of a GST-inclusive price.
  medium:
    steps: 3
    demand: Add GST to the taxable lines of an invoice but not to the GST-free lines.
  hard:
    steps: 4
    demand: Combine an inclusive price and an exclusive price in one quote; or subtract GST credits on purchases from GST
      collected on sales.
  exam:
    steps: 4
    demand: GST collected, GST credits, the net GST payable, then total sales excluding GST, each following through.
