misconceptions:
- id: wrong-operation-swap
  description: Applies a different plausible operation than the one the situation calls for (e.g. adds when the situation is multiplicative, or multiplies when it is additive), producing the value that other operation would give.
- id: reversed-order
  description: For a subtraction or division situation, computes with the two operands swapped, which changes the value.
- id: off-by-one-step
  description: On a two-step (medium/hard) situation, applies only one of the two required steps instead of both.
- id: surface-cue-trap
  description: On a hard-tier situation, follows the misleading surface word (an "each"/"more"/"twice"/"shared equally" cue that normally signals a different operation) instead of the operation the situation actually requires.
