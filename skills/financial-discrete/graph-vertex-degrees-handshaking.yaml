id: graph-vertex-degrees-handshaking
name: Find vertex degrees and use the handshaking lemma
domain: financial-discrete
description: >-
  Find the degree of a vertex of a stated network, and use the fact that the degrees add to twice the number of edges
  to find an edge count, a missing degree or the number of odd vertices. easy reads a degree, an edge count or the odd
  vertices from a stated network; medium finds an edge count from a degree list or the one unlisted degree from the edge
  count; hard has no network at all, only the number of vertices and edges and two possible degrees (or a least degree),
  and asks how many vertices have a degree or how many vertices there can be; exam is a four-part chain from the degree
  sum to a missing degree, the odd vertices and the edges left after a vertex is deleted. Every answer is a whole number.
status: active
needs_figure: true
placement_eligible: false
prerequisites: [shortest-network-path]
answer: number
sources:
