misconceptions:
- id: net-degree-sum-as-edges
  description: Takes the sum of the degrees as the number of edges, forgetting that every edge is counted at both of its ends.
- id: net-edges-as-degree-sum
  description: Uses the number of edges where the sum of the degrees belongs, forgetting to double it first.
- id: net-degree-miscount
  description: Miscounts the edges at a vertex, or the odd vertices, so the answer is one too high or one too low.
- id: net-odd-even-swapped
  description: Counts the vertices of even degree when the vertices of odd degree were asked for.
- id: net-hidden-vertex-ignored
  description: Counts only the listed vertices and leaves out the vertex whose degree had to be found first.
- id: net-deleted-edges-kept
  description: Gives the original number of edges after a vertex and its edges have been deleted.
difficulty_progression: Easy reads a degree, an edge count or the odd vertices straight from a stated network or degree
  list. Medium needs the handshaking lemma the other way round, to find the one unlisted degree. Hard drops the network
  and sets up the lemma as an equation for the number of vertices of one degree, or as an inequality for the most vertices
  possible. The exam chain finds the degree sum, the missing degree, the odd vertices (a parity argument) and the edges left
  after deleting a vertex, each using the one before.
tags: [graph-theory, networks, degree, handshaking-lemma]
