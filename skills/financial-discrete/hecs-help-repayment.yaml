id: hecs-help-repayment
name: Calculate student-loan (HELP) repayments, balances and time to clear
domain: financial-discrete
description: Use a stated repayment-income table to find the compulsory repayment on a HELP debt, the balance after repayment
  and indexation, and the number of years to clear a debt.
status: active
placement_eligible: false
prerequisites:
- percentage-of-quantity
- income-tax-bracket-calculation
answer: number
