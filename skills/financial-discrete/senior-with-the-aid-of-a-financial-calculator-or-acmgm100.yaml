misconceptions:
- id: perpetuity-finite-confusion
  description: Applies the perpetuity formula (PV = A/i) to a question about a FINITE-term annuity, or
    applies the finite-annuity formula to a genuine perpetuity -- the two are always distinguishable by
    construction (a perpetuity question never states a term; every finite-annuity question always does),
    but a learner who does not notice which shape is in front of them can still make this substitution.
- id: forgot-to-discount
  description: Computes the present value as an undiscounted total (income multiplied by the number of
    periods, or by one year's worth of income) instead of applying the discounting formula.
- id: annual-rate-as-periodic
  description: Uses the stated ANNUAL interest rate directly as the periodic (monthly) rate, forgetting to
    divide by the number of compounding periods per year.
- id: months-not-years
  description: Reports the number of MONTHS the income lasts instead of converting to whole YEARS, an
    off-by-a-factor-of-12 unit error on the hard tier's own unknown.
