domain: financial-discrete
description: Given bounded, fully specified inputs, with the aid of a financial calculator or computer-based
  financial software, solve problems involving annuities (including perpetuities as a special case); for
  example, determining the amount to be invested in an annuity to provide a regular monthly income of a
  certain amount. Return the resulting value, expression, relation, or classification. Does not assess
  unbounded investigations, unstated assumptions, or assessment modes outside capability_gate.
