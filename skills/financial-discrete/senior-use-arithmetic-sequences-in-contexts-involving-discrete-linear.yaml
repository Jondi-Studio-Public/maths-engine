misconceptions:
- id: off-by-one-nth-term
  description: Uses n instead of (n-1) in the nth-term formula t_n = t1 + (n-1)d, shifting every predicted value by one whole common difference.
- id: sum-formula-for-a-term
  description: Reports the sum of the first n terms when a single nth-term value was asked, or vice versa -- confuses "a value at a point" with "an accumulation".
- id: forgot-first-term
  description: Reports (n-1)d alone, forgetting to add the stated first term t1.
