id: senior-use-arithmetic-sequences-in-contexts-involving-discrete-linear
name: Use arithmetic sequences in contexts involving discrete linear growth or decay
domain: financial-discrete
description: 'Given bounded, fully specified inputs, use arithmetic sequences in contexts involving discrete linear growth or decay, such as simple interest. Return the resulting value, expression, relation, or classification. Every question states the first term and the constant per-period change directly, and the interest amount itself is never asked for (that is the neighbouring skill simple-interest): this skill asks for a term or sum of the arithmetic sequence a discrete-linear scenario generates.'
status: active
placement_eligible: false
prerequisites: [simple-interest]
answer: number
