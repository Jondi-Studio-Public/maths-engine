id: cpi-and-real-value
name: Use the CPI to find inflation and real values
domain: financial-discrete
description: Use stated index numbers to find an inflation rate, an item's later price, the real value of a salary in earlier
  dollars, and the change in real pay.
status: active
placement_eligible: false
prerequisites:
- percentage-change
- decimal-arithmetic
answer: number
