misconceptions:
- id: ignores-frequency-effect
  description: Assumes compounding more often makes no difference to the future value, and reports zero difference between the two compounding frequencies.
- id: sign-flip
  description: Reports the difference the wrong way around (the less-frequently-compounded future value minus the more-frequently-compounded one) as a negative amount.
- id: wrong-reference-scenario
  description: Compares the stated scenario against the wrong number of years of compounding instead of the same number of years used on both sides.
- id: assumes-rate-has-no-effect
  description: Assumes a higher interest rate makes no difference to the future value, and reports zero difference between the two rates.
- id: linear-rate-effect
  description: Treats the effect of the rate change as simple, non-compounding growth applied once over the whole term, rather than compounding it.
- id: wrong-percentage-base
  description: Expresses the percentage difference between the two future values against the wrong base value (the total of both, or the larger value) instead of the smaller future value.
- id: rate-not-divided-by-n
  description: Uses the full annual rate in every compounding period instead of dividing it by the number of periods per year.
- id: periods-not-multiplied-by-n
  description: Compounds once per year for the stated years instead of multiplying the years by the number of periods per year.
- id: simple-interest-instead-of-compound
  description: Adds the same interest every year (principal x rate x time) instead of compounding it on the growing balance.
- id: interest-reported-as-balance
  description: Reports the balance where the interest earned was asked for, or the interest where the balance was asked for.
