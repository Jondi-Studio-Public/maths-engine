id: graph-eulerian-trails-circuits
name: Decide whether a network has an Eulerian trail or circuit
domain: financial-discrete
description: >-
  Use the degrees of a connected network to decide whether it has an Eulerian trail (a trail using every edge once) or
  an Eulerian circuit, and where a trail must start and end. easy decides circuit, trail only or neither for a stated
  network; medium picks the two vertices an Eulerian trail must start and end at; hard picks, from four networks listed by
  their edges, the one with an Eulerian circuit (the others have two odd vertices, four odd vertices, or even degrees but two
  separate pieces); exam is a four-part chain on a network with four odd vertices, counting the odd vertices and the fewest
  new edges for a circuit and for a trail. The answer is a statement or pair of vertices chosen from a list, or a count.
status: active
needs_figure: true
placement_eligible: false
prerequisites: [graph-vertex-degrees-handshaking, graph-walks-trails-paths-cycles]
answer: mcq
