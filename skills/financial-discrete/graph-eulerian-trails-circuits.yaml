misconceptions:
- id: net-euler-circuit-trail-confused
  description: Mixes up an Eulerian trail (two odd vertices, different ends) with an Eulerian circuit (no odd vertices).
- id: net-euler-two-odd-rejected
  description: Rules out an Eulerian trail because there are odd vertices, forgetting that exactly two odd vertices are allowed.
- id: net-euler-odd-vertices-ignored
  description: Does not count the odd vertices, so a network with two or four odd vertices is judged to have an Eulerian circuit.
- id: net-euler-ignores-connectedness
  description: Checks only that every degree is even and not that the network is in one piece.
- id: net-euler-start-highest-degree
  description: Starts an Eulerian trail at the vertices of highest degree instead of the two odd vertices.
- id: net-euler-edge-per-odd-vertex
  description: Adds one new edge for every odd vertex, when each new edge fixes two odd vertices at once.
difficulty_progression: Easy applies the degree rule to one stated network. Medium turns the rule round to locate the two ends
  of a trail. Hard has four networks to compare and adds the connectedness condition, which the degrees alone do not show.
  The exam chain counts the odd vertices, then reasons about repair, pairing odd vertices with new edges to reach a circuit
  and then a trail, and counts the edges of the resulting circuit.
tags: [graph-theory, networks, eulerian-trail, eulerian-circuit]
