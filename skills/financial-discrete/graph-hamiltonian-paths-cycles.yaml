misconceptions:
- id: net-hamilton-skipped-vertex-accepted
  description: Accepts a closed route as a Hamiltonian cycle although it misses a vertex.
- id: net-hamilton-repeat-accepted
  description: Accepts a route as a Hamiltonian cycle although it visits a vertex twice.
- id: net-hamilton-path-counted-as-cycle
  description: Counts a route that visits every vertex once but does not return to its start as a Hamiltonian cycle.
- id: net-hamilton-non-edge-accepted
  description: Accepts a route that moves between two vertices that no edge joins.
- id: net-hamilton-direction-counted
  description: Counts a Hamiltonian cycle and the same cycle travelled in reverse as two different cycles.
- id: net-hamilton-start-counted
  description: Counts the same Hamiltonian cycle once for each vertex it can be started from.
- id: net-spanning-tree-instead-of-tour
  description: Gives the length of a minimum spanning tree for the shortest tour, which must also return to the start.
difficulty_progression: Easy checks four given routes against the definition, so no search is needed. Medium has the learner
  find the cycles, with the added idea that a cycle in reverse or from another start is the same cycle. Hard moves to open
  paths from a fixed start in a six-vertex network, a larger search with a different counting rule. The exam chain counts
  the cycles, multiplies out the counting convention (start and direction), finds the cheapest, and prices it.
tags: [graph-theory, networks, hamiltonian-path, hamiltonian-cycle]
