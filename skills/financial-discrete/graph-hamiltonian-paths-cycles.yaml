id: graph-hamiltonian-paths-cycles
name: Find Hamiltonian paths and cycles in a small network
domain: financial-discrete
description: >-
  A Hamiltonian path visits every vertex of a network exactly once, and a Hamiltonian cycle also returns to its start;
  count them in small networks by trying the orderings of the vertices. easy counts how many of four stated routes are
  Hamiltonian cycles (the others skip or repeat a vertex, do not return, or use a missing edge); medium counts the
  Hamiltonian cycles of a five-vertex network; hard counts the Hamiltonian paths that start at a named vertex of a six-vertex
  network; exam is a four-part chain on a road network with distances: the number of cycles, the number of tours when start and
  direction matter, the shortest tour and its fuel cost. Every answer is a whole number or an amount of money.
status: active
placement_eligible: false
prerequisites: [graph-walks-trails-paths-cycles]
answer: number
