misconceptions:
- id: charges-interest-on-the-original-balance
  description: Charges each period's interest on the amount first borrowed instead of on the current balance, as for a flat-rate loan.
- id: charges-interest-after-taking-off-the-repayment
  description: Takes the repayment off the opening balance before charging the interest, instead of charging the interest on the opening balance.
- id: uses-the-annual-rate-each-period
  description: Charges the whole annual rate in a single month or quarter instead of dividing it by the number of periods in the year.
- id: forgets-the-interest-in-the-closing-balance
  description: Subtracts the repayment from the opening balance but does not add the interest.
- id: adds-the-repayment-to-the-balance
  description: Adds the repayment to the balance with the interest, instead of subtracting it.
- id: forgets-the-repayment-in-the-closing-balance
  description: Adds the interest to the opening balance but does not subtract the repayment.
- id: takes-the-repayment-off-without-adding-interest
  description: Finds the next opening balance by taking the repayment off the previous opening balance, leaving out the interest.
- id: carries-the-previous-opening-balance-forward
  description: Repeats the previous opening balance as the next one, as if the balance had not changed.
- id: finds-the-repayment-without-the-interest
  description: Finds the repayment as the fall from the opening balance to the closing balance, forgetting that the interest was added in the same period.
- id: leaves-out-a-period-from-the-total
  description: Misses one period when adding up the interest or the repayments.
