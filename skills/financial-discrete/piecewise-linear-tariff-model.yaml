id: piecewise-linear-tariff-model
name: Model a two-rate tariff as a piecewise linear function
domain: financial-discrete
year_level: ['11']
description: Work with a tariff that charges a fixed amount plus one rate up to a threshold and a different rate beyond it.
  Easy finds the cost of a usage beyond the threshold. Medium finds the usage that gives a stated cost. Hard finds the break-even
  usage against a flat plan, or recovers the second rate from two costs. The exam chain compares a two-rate plan with a flat
  plan at one usage and at the break-even.
status: active
placement_eligible: false
