misconceptions:
- id: leading-zero-drop
  description: For cents -> dollars, drops the required tenths-place zero (e.g. 45 cents reported as 4.50 instead of 0.45).
- id: forgot-the-dollars
  description: For dollars -> cents, reports only the cents remainder and ignores the whole-dollar part entirely.
- id: off-by-one-dollar
  description: For dollars -> cents, an extra or missing whole dollar (100 cents off the correct total).
- id: regrouping-failure
  description: For dollars -> cents, drops the tens-of-cents zero when the cents part is a single digit (e.g. $3.05 read as 35 cents instead of 305).
- id: bare-digits-as-dollars
  description: For cents -> dollars, reports the raw cents count as if it were already a dollar figure, with no conversion at all.
- id: div-by-ten
  description: For cents -> dollars, moves the decimal point the wrong way (divides by 10 again instead of by 100).
