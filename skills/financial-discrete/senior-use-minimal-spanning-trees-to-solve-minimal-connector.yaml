misconceptions:
- id: sum-all-edges
  description: Sums the cost of all listed cable options instead of finding the minimum spanning tree.
- id: naive-smallest-no-cycle-check
  description: Sums the globally smallest (n_towns-1) edge weights without checking whether they form a connected acyclic subgraph.
- id: minus-max-edge
  description: Subtracts the most expensive edge in the MST from the total, leaving one town unconnected.
