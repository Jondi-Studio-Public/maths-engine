misconceptions:
- id: reports-lst-not-float
  description: Reports the queried activity's raw latest start time (LST) instead of LST minus EST (forgets to subtract).
- id: wrong-branch-zero
  description: Reports 0, as if the queried activity were on the critical path.
- id: omitted-intermediate-duration
  description: Computes the direct path-sum float but drops one intermediate activity's duration along the way to the merge point.
- id: reversed-sign
  description: Computes the two path sums' difference with the operands swapped (the negative of the true float).
