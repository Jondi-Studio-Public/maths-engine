id: utility-bill-tiered-tariff
name: Calculate a utility bill from a tiered tariff
domain: financial-discrete
description: Use a stated tariff with a supply charge, a usage rate that changes after a threshold, GST and a solar feed-in
  credit to find usage charges, whole bills, and the use behind a stated charge.
status: active
placement_eligible: false
prerequisites:
- decimal-arithmetic
- percentage-of-quantity
answer: number
