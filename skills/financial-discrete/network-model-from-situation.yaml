misconceptions:
- id: net-ordered-pairs
  description: Counts each link between two places twice, once from each end, so the number of links is doubled.
- id: net-ring-only
  description: Counts only a ring of links round the places instead of a link between every pair.
- id: net-places-as-links
  description: Gives the number of places where the number of links was asked for.
- id: net-pairs-miscount
  description: Miscounts the pairs of places by adding or leaving out one place's links.
- id: net-lists-not-halved
  description: Adds up everyone's list as the number of friendships, so every friendship is counted twice.
- id: net-count-slip
  description: Miscounts the links or places by one when reading them from the situation.
- id: net-max-degree-as-links
  description: Gives the greatest number of friends one person has where the total number of friendships was asked for.
