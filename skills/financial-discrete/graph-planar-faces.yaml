misconceptions:
- id: planar-forgot-outer
  description: Counts only the regions inside the network and leaves out the unbounded region around the outside.
- id: planar-faces-edges-minus-vertices
  description: Takes the number of edges minus the number of vertices as the number of faces, leaving out the 2 in Euler's formula.
- id: planar-faces-as-edges
  description: Gives the number of edges where the number of faces was asked for.
- id: planar-euler-signs
  description: Puts the signs of Euler's formula in the wrong places, so the face count is wrong by a sum rather than a difference.
- id: planar-bound-as-removals
  description: Gives the largest number of edges a planar network can have where the number that must be removed was asked for.
- id: planar-edges-not-excess
  description: Gives the whole number of edges where only the excess over the planar bound was asked for.
- id: planar-wrong-bound
  description: Uses the 3v - 6 rule on a network with no triangles (or the 2v - 4 rule on one with triangles), so the excess is wrong.
