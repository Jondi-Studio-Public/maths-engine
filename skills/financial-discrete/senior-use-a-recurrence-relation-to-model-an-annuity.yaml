misconceptions:
- id: off-by-one-over
  description: Counts the final withdrawal that could not be paid in full as if it were a full withdrawal, reporting one more than the true count.
- id: off-by-one-under
  description: Stops one withdrawal early, treating the last successful full withdrawal as if it had not been paid.
- id: ignores-compounding-in-count
  description: Estimates the number of withdrawals by dividing the opening balance by the withdrawal amount alone, ignoring that interest is credited every period.
- id: annual-rate-used-per-period
  description: Uses the stated annual (per-annum) rate directly as the per-period rate, without dividing it by the number of compounding periods per year.
- id: effect-reports-one-scenario
  description: Reports the total number of full withdrawals for one of the two compared scenarios instead of the difference between the two durations.
- id: effect-off-by-one
  description: Reports the correct difference between the two durations plus or minus one withdrawal.
- id: exam-ignored-change
  description: Applies the original withdrawal amount or interest rate for the whole life of the annuity, never switching to the changed value stated for later withdrawals.
- id: exam-restarts-at-opening-balance
  description: Treats the phase after the change as if it restarted from the annuity's original opening balance, instead of carrying forward the balance already reduced by the withdrawals made before the change.
