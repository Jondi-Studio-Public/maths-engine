misconceptions:
- id: uses-simple-interest
  description: Adds the same interest amount each year.
- id: w3ci-balance-for-interest
  description: Gives the final balance where the interest earned was asked.
- id: w3ci-simple-instead
  description: Finds simple interest, adding the same amount every year.
- id: w3ci-one-year
  description: Gives one year's interest only.
- id: w3ci-wrong-years
  description: Compounds for one year too many or too few.
- id: w3ci-annual-rate-each-period
  description: Uses the annual rate in every compounding period instead of the rate for one period.
- id: w3ci-periods-as-years
  description: Counts the years instead of the number of compounding periods.
- id: w3ci-annual-compounding
  description: Compounds once a year although the interest is added more often.
- id: w3ci-multiplies-by-amount
  description: Multiplies the target amount by the growth factor instead of dividing.
- id: w3ci-simple-discount
  description: Takes the simple interest off the target amount to find the amount to invest.
- id: w3ci-first-rate-throughout
  description: Uses the first rate for the whole term when the rate changes.
- id: w3ci-average-rate
  description: Uses the average of the two rates for the whole term.
- id: w3ci-difference-reversed
  description: Gives one kind of interest where the difference between the two was asked.
tags:
- expansion-batch-5
