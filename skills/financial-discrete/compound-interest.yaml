difficulty_progression:
  easy:
    steps: 2
    demand: Compound once a year over a few years for a balance.
  medium:
    steps: 3
    demand: Find the interest earned, or compound half-yearly or quarterly.
  hard:
    steps: 5
    demand: Work back to the amount to invest, change the rate part-way, or compare compound with simple interest.
  exam:
    steps: 7
    demand: Chain several compounding steps in one context.
