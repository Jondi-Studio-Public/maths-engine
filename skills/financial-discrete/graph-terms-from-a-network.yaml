id: graph-terms-from-a-network
name: Use the words of graph theory on a network
domain: financial-discrete
description: >-
  Use the vocabulary of graphs on a network that is drawn, and on a multigraph given as an edge list: adjacent vertices,
  degree, connected components, subgraphs, loops, multiple edges and simple graphs. easy counts the edges, the vertices
  adjacent or not adjacent to a vertex, or the greatest degree of a drawn network; medium counts the connected
  components of a network drawn in pieces, the fewest edges that join them, or the vertices and the left-out edges of a
  thick subgraph; hard works on a multigraph written as an edge list (loops, pairs joined by multiple edges, the edges of
  the simple graph left after loops and repeated edges are removed, and the degree of a vertex that carries a loop);
  exam is a chain that finds a degree, lists the adjacent vertices (a typed set), counts the edges, and then the edges
  and the components left when that vertex is deleted (or the same terms on a multigraph).
