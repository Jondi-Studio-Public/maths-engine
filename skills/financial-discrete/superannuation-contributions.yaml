id: superannuation-contributions
name: Calculate super contributions, contributions tax and balances
domain: financial-discrete
description: Find the employer's super contribution at a stated rate, the effect of salary sacrifice and contributions tax,
  the room left under a cap, and an account balance when growth and a yearly contribution are added.
status: active
placement_eligible: false
prerequisites:
- percentage-of-quantity
- compound-interest
answer: number
sources:
- topic: r3e_superannuation
  params: {}
  difficulty: easy
  stages:
  - 0
  - 1
  - 2
- topic: r3e_superannuation
  params: {}
