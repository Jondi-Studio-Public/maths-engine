misconceptions:
- id: bip-rows-columns-swapped
  description: Writes the matrix with the jobs as rows and the workers as columns, which is the transpose of the one asked for.
- id: bip-ones-zeros-swapped
  description: Puts a 1 where the worker cannot do the job and a 0 where the worker can.
- id: bip-entry-slip
  description: Writes one entry of the matrix wrongly, putting a 1 where the worker cannot do the job or a 0 where they can.
- id: bip-row-order-slip
  description: Writes the rows of the matrix in a different order from the order the workers were listed in.
- id: bip-cannot-as-can
  description: Reads a list of jobs a worker cannot do as the jobs they can do, so the 1s and 0s are the wrong way round.
- id: bip-forced-worker-kept
  description: Removes the job that only one worker can do but leaves that worker's row in the matrix of those still unassigned.
- id: bip-forced-job-kept
  description: Removes the worker who has been given a job but leaves that job's column in the matrix of those still unassigned.
