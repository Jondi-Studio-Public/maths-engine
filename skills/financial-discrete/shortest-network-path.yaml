misconceptions:
- id: fewest-edges
  description: Chooses the route with the fewest edges without adding weights.
- id: w3np-fewest-roads
  description: Chooses the route with the fewest roads instead of the shortest total.
- id: w3np-greedy
  description: Always takes the shortest road next and does not compare whole routes.
- id: w3np-longest
  description: Gives the longest route instead of the shortest.
- id: w3np-second-shortest
  description: Gives the second shortest route.
- id: w3np-skips-stop
  description: Ignores that the route must pass through the stated town.
- id: w3np-two-legs-shortest-sum-error
  description: Joins the two shortest legs even when they overlap or share a road.
- id: w3np-closed-ignored
  description: Keeps using the road that has been closed.
- id: w3np-drops-the-detour
  description: Takes the closed road's length off the old shortest route instead of finding a new route.
tags:
- expansion-batch-5
- networks
difficulty_progression:
  easy:
    steps: 2
    demand: Compare a few routes in a small network.
  medium:
    steps: 3
    demand: Find the shortest route in a six-town road list with no direct road.
  hard:
    steps: 5
    demand: Find the shortest route through a stated town, or after a road is closed.
  exam:
    steps: 7
    demand: Chain route lengths with a network closure.
