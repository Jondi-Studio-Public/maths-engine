id: salary-conversion-pay
name: Convert a salary into pay for other periods and compare jobs
domain: financial-discrete
description: Convert an annual salary into weekly, fortnightly, monthly and hourly pay, add allowances and pay rises, work
  out piecework pay, and compare a salary with an hourly job that has overtime.
status: active
placement_eligible: false
prerequisites:
- calculate-wages
- decimal-arithmetic
answer: number
