misconceptions:
- id: r3e-cap-applied-to-each-fee
  description: Applying the cap to each late fee separately instead of to their total.
- id: r3e-cap-ignored
  description: Adding every late fee in full, ignoring the cap on late fees.
- id: r3e-cap-subtracted
  description: Subtracting the cap from the total instead of using it to limit the late fees.
- id: r3e-difference-wrong-way
  description: Subtracting the plan cost from the upfront cost instead of the other way round.
- id: r3e-discount-given-as-upfront-price
  description: Taking the discount off the plan cost instead of off the price to find the upfront price.
- id: r3e-discount-ignored
  description: Comparing the plan with the full price instead of the discounted upfront price.
- id: r3e-dollars-given-as-percentage
  description: Giving the extra cost in dollars where a percentage of the price was asked for.
- id: r3e-fees-subtracted
  description: Taking the late fees off the total instead of adding them.
- id: r3e-late-fees-left-out
  description: Leaving the late fees out of the total cost.
- id: r3e-one-late-fee-only
  description: Counting a single late fee when several instalments were late.
- id: r3e-percent-decimal-slip
  description: Moving the decimal point one place too far when turning a percentage into dollars.
- id: r3e-percentage-of-total-paid
  description: Finding the extra cost as a percentage of the total paid instead of the price.
- id: r3e-ratio-not-percentage
  description: Leaving the tax-to-income ratio as a decimal without turning it into a percentage.
- id: r3e-setup-fee-added-to-each-instalment
  description: Adding the whole set-up fee to every instalment instead of splitting it across them.
- id: r3e-setup-fee-left-out
  description: Leaving the set-up fee out of the cost.
- id: r3e-setup-fee-subtracted
  description: Taking the set-up fee off the price instead of adding it.
- id: r3e-wrong-number-of-instalments
  description: Dividing by the wrong number of instalments.
difficulty_progression:
  easy:
    steps: 2
    demand: Split the price and a set-up fee into four equal instalments.
  medium:
    steps: 4
    demand: Total the price, the set-up fee and the late fees, keeping the late fees within the cap.
  hard:
    steps: 5
    demand: Express the extra cost as a percentage of the price; or compare the whole plan with paying upfront at a discount.
  exam:
    steps: 6
    demand: The instalment, the capped late fees, the total paid and the extra cost as a percentage of the price, each following
      through.
