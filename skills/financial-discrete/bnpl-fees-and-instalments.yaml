id: bnpl-fees-and-instalments
name: Compare the cost of buy-now-pay-later plans with paying upfront
domain: financial-discrete
description: Find instalments when a set-up fee is split in, the late fees under a cap, the total paid, the extra cost as
  a percentage of the price, and how much more a plan costs than paying upfront with a cash discount.
status: active
placement_eligible: false
prerequisites:
- percentage-of-quantity
- decimal-arithmetic
answer: number
sources:
