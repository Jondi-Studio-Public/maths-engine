misconceptions:
- id: swapped-ears
  description: Reports the EAR at frequency 1 for frequency 2 and vice versa.
- id: wrong-compounding-count
  description: Uses the wrong number of compounding periods for a named frequency, for example n=30 for "daily" instead of 365, or n=6 for "six-monthly" instead of 2.
- id: simple-interest-not-compounding
  description: Computes simple (non-compounding) interest -- reports the bare nominal rate itself for both frequencies -- instead of applying the compounding EAR formula.
- id: skips-nominal-rate-recovery
  description: At the exam tier, uses the stated per-period rate directly as if it were already the nominal annual rate, skipping the step of recovering the nominal annual rate before applying it at the second, differently-named frequency.
