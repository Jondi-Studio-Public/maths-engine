id: graph-bridges
name: Find the bridges of a drawn network
domain: financial-discrete
year_level: ['12']
description: >-
  Read a drawn network and find its bridges, the edges whose removal leaves the network in two separate pieces. The
  network is shown only as a diagram. Easy: count the bridges. Medium: a named bridge is removed and the places still reachable
  from A are counted. Hard: each edge carries a cost and two edges are to be removed to save their costs while every place can still
  be reached, so bridges cannot go and the two dearest removable edges may be a pair that cuts the network; find the greatest total saving. The exam chain counts the
  bridges, the pieces left when every bridge is removed (carried forward), the bridges left after a stated new edge is built,
  and the fewest new edges that leave no bridge. Distinct from graph-walks-trails-paths-cycles, which classifies routes, and
  from senior-use-minimal-spanning-trees-to-solve-minimal-connector, which keeps the cheapest set of edges that joins everything.
status: active
placement_eligible: false
prerequisites: [graph-vertex-degrees-handshaking, graph-walks-trails-paths-cycles]
answer: number
