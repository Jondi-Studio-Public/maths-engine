misconceptions:
- id: w4-bridge-counts-leaves
  description: Counts the vertices with only one edge instead of the edges whose removal splits the network.
- id: w4-bridge-counts-cut-vertices
  description: Counts the vertices whose removal splits the network, where the edges whose removal does so were asked for.
- id: w4-bridge-counts-cycle-edges
  description: Counts the edges that lie on a cycle, which are exactly the ones that are not bridges.
- id: w4-bridge-pieces-off-by-one
  description: Gives the number of pieces where the number of bridges was asked for, or the reverse, one out because each bridge adds one piece.
- id: w4-bridge-removal-ignored
  description: Gives every vertex as still reachable after a bridge is removed, as if taking the edge away changed nothing.
- id: w4-bridge-wrong-side
  description: Counts the vertices on the far side of the removed bridge, or one more or fewer than the piece, instead of the piece that holds the start.
- id: w4-bridge-only-endpoint-lost
  description: Thinks only one vertex is cut off when a bridge is removed, so every other vertex can still be reached.
- id: w4-bridge-heaviest-edge
  description: Takes the dearest edges as the ones to remove, without checking that a bridge cannot be removed.
- id: w4-bridge-pair-cuts-network
  description: Takes the two dearest removable edges together, without checking that removing both leaves the network in two pieces.
- id: w4-bridge-one-edge-only
  description: Gives the saving from one edge where the total from two edges was asked for.
- id: w4-bridge-sum-not-max
  description: Adds the costs of every edge that could be removed where the greatest total saving from two edges was asked for.
- id: w4-bridge-sum-of-bridges
  description: Adds the costs of the bridges, which are exactly the edges that cannot be removed.
- id: w4-bridge-lightest-bridge
  description: Takes the cheapest bridge as the saving, though a bridge cannot be removed at all.
- id: w4-bridge-pieces-all-vertices
  description: Counts every vertex as a separate piece once the bridges are removed, though the edges on cycles still hold vertices together.
- id: w4-bridge-new-road-ignored
  description: Leaves the number of bridges unchanged after a new edge is added, though it can put bridges on a cycle.
- id: w4-bridge-new-road-removes-one
  description: Thinks a new edge stops only one bridge being a bridge, instead of every bridge on the path between its ends.
- id: w4-bridge-new-road-clears-all
  description: Thinks one new edge stops every bridge being a bridge, instead of only those on the path between its ends.
- id: w4-bridge-repair-leaves
  description: Gives the number of end pieces where the fewest new edges was asked for; each new edge can join two end pieces at once.
- id: w4-bridge-repair-per-bridge
  description: Builds one new edge for every bridge, when new edges between end pieces cover several bridges each.
difficulty_progression: Easy applies the definition to a whole drawing and counts. Medium removes a named bridge and counts the piece that holds
  A, so the learner has to see which edges lie on cycles and where the split falls. Hard adds costs and a constraint on a pair of removals, so the
  two dearest removable edges can be the trap and the answer needs the best pair that keeps the network in one piece. The exam chain counts the
  bridges, uses them to count the pieces left, reasons about how a new edge covers the bridges on one path, and finally pairs up
  the end pieces to find how few new edges leave no bridge.
tags: [graph-theory, networks, bridges, connectivity, figure]
