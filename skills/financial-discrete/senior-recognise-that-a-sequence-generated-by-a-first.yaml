misconceptions:
- id: judges-from-early-terms
  description: Looks at how much the first few terms move rather than the value of a, missing that 0 < a < 1 always settles to a steady state even when b is large or negative.
- id: assumes-removed-amount-means-decreasing
  description: Sees a periodic amount removed each period and assumes the sequence must decrease, missing that when a > 1 and u(0) is above the fixed point the sequence still increases without bound.
- id: ignores-fixed-point-comparison
  description: Judges purely from the sign of b instead of comparing u(0) to the recurrence's own fixed point b/(1 - a) when a > 1.
