id: senior-recognise-that-a-sequence-generated-by-a-first
name: Recognise that a sequence generated by a first-order linear recurrence relation can have a long
  term increasing, decreasing or steady-state solution
domain: financial-discrete
year_level: ['12']
description: >-
  Given a first-order linear recurrence u(n+1) = a*u(n) + b with a > 0 (no oscillation) and a stated
  starting value u(0), classify its long-term behaviour as increasing without bound, decreasing
  without bound, or settling to a steady state. 0 < a < 1 always settles to a steady state
  regardless of b or u(0). a = 1 settles the sign question purely on b (b > 0 increases, b < 0
  decreases; b = 0 excluded as trivial). a > 1 depends on how u(0) compares to the recurrence's own
  fixed point b/(1-a) -- above it increases, below it decreases, exactly at it (already) settles to
  a steady state. Below the exam tier it never computes or grades the numeric steady-state value
  itself (the exam tier finds the fixed point, the distance of u(0) from it and a later term) --
  that is the sibling skill senior-use-first-order-linear-recurrence-relations-to-model, which is
  restricted to 0 < a < 1 and asks for the value the sequence converges to. This skill reads
  "decreasing when the sequence shrinks toward a limit from above" as long-term behaviour, i.e.
  classified as steady state whenever a fixed value is approached or already reached, never as
  "decreasing" merely because early terms fall towards that limit.
