misconceptions:
- id: stops-one-activity-early
  description: Computes the finish time of a non-sink activity instead of the true sink.
- id: omits-first-activity
  description: Forgets to include the first activity's duration (starts the chain from a later activity).
- id: double-counts-activity
  description: Double-counts an activity's duration in the total.
- id: sums-all-durations
  description: Sums all activities' durations without accounting for parallel paths.
- id: takes-shorter-path
  description: Uses the shorter (non-critical) branch instead of the longer one where paths merge.
- id: forgets-to-add-merge-activity
  description: Omits the duration of an activity that comes after a merge point.
- id: single-path-instead-of-sink
  description: Traces one path to a non-sink activity instead of following all paths to the true project sink.
