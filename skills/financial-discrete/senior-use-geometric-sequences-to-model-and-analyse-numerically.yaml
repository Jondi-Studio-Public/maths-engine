misconceptions:
- id: no-doubling
  description: Sums each rebound's height once (the plain geometric sum of the heights) instead of counting the upward and downward travel of every rebound.
- id: drop-doubled
  description: Counts the initial drop twice as well as every rebound twice, instead of counting the initial drop only once.
- id: one-bounce-too-many
  description: Continues summing one rebound (or one impact) past the stated endpoint.
- id: impact-top-confusion
  description: Reports the total to the top of the rebound when the impact total was asked for, or vice versa.
- id: first-rebound-as-drop-height
  description: Treats the first stated rebound height itself as the original drop height, instead of working back to it using the inferred rebound fraction.
- id: threshold-off-by-one
  description: Sums to one rebound before or after the true first rebound that crosses the stated threshold.
