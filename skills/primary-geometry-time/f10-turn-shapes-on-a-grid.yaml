id: f10-turn-shapes-on-a-grid
name: Turn a shape about a point on a grid
domain: primary-geometry-time
year_level: ['5']
naplan_domain: [space]
description: "Perform a turn of a shape on a square grid by shading its image. Easy is a half turn about a marked point. Medium is a quarter turn clockwise or anticlockwise about the point. Hard shows a shape and its image after one slide or one quarter turn, and asks for the image after the same move again, so the move has to be read from the picture."
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
learner_band: primary
prerequisites: [f10-transformations-invariants]
answer: grid_cells
