misconceptions:
- id: turn-about-the-shapes-middle
  description: Turns the shape about its own middle or one of its own corners, so it stays near where it started, instead of about the marked point.
- id: turn-direction-reversed
  description: Turns the shape the wrong way round, clockwise for anticlockwise or the reverse.
- id: turn-as-flip
  description: Flips the shape over a line through the point, so it is a mirror image, instead of turning it, so it is the same way round.
- id: turn-size-wrong
  description: Gives a quarter turn when a half turn was asked, or a half turn for a quarter turn.
- id: turn-as-slide
  description: Moves the whole shape across the grid without turning it, keeping it the same way up.
- id: repeat-turns-back
  description: Undoes the move instead of repeating it, so the shape lands back where it started.
- id: repeat-slide-wrong-amount
  description: Repeats a slide but leaves out the up or down part, swaps across and up, or slides twice as far.
- id: turn-centre-off-by-one
  description: Turns about a point one line away from the marked point, so every square lands one place out.
tags: [acara-f10-v9, primary-geometry-time, grid_shape_turns, ac9m5sp02, transformations, rotation, drawn-answer, figure]
difficulty_progression:
  easy:
    steps: 1
    demand: "Shade the image of a shape after a half turn about a marked point."
  medium:
    steps: 2
    demand: "Shade the image after a quarter turn clockwise or anticlockwise about a marked point."
  hard:
    steps: 3
    demand: "Read a slide or a quarter turn from a shape and its image, then shade the image after the same move again."
  exam:
    steps: 5
    demand: "Pick, from four pictures, the image after a quarter turn, after a half turn and after two turns one after the other. The shade form is not set in the exam tier."
