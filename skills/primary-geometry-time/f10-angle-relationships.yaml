misconceptions:
- id: uses-180-not-360
  description: Subtracts the given angles from 180 instead of 360 (the angles-at-a-point tiers only; the exact mirror of straight-line-angles's own uses-360 misconception, which subtracts from 360 instead of 180).
- id: drops-one-addend
  description: Omits one of the given angles from the sum before subtracting from 360 (angles-at-a-point tiers; at easy tier, with only 2 given angles, this degenerates to using only one given angle).
- id: reports-x-not-angle
  description: Solves the vertically-opposite equation correctly for x (hard tier only) but reports x itself instead of substituting it back into the angle expression.
