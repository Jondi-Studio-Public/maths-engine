id: f10-draw-cross-sections-of-solids
name: Draw the cross-section of a prism cut parallel to a face
domain: primary-geometry-time
year_level: ['6']
naplan_domain: [space]
description: "Compare parallel cross-sections of a prism and relate them to right prisms by drawing the cut face. A solid made of unit cubes is drawn on isometric dot paper and cut by a flat plane parallel to one of its faces; the learner shades the cut face on a blank grid. Easy cuts a rectangular prism, so the two edges of the named face are read from the picture. Medium cuts a prism with an L-shaped end parallel to that end, where every layer gives the same L. Hard cuts a stepped solid (not a prism), where the cut depends on which column or layer it passes through, or compares two parallel cuts and shades the one with the greater or smaller area."
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
learner_band: primary
prerequisites: [f10-nets-build-solids]
answer: grid_cells
