misconceptions:
- id: cross-section-edges-swapped
  description: Reads the right two edges of the face but draws the rectangle turned, with the across and up measurements the wrong way round.
- id: cross-section-from-wrong-face
  description: Draws the face that is not parallel to the cut, using the edges of a different face of the solid.
- id: cross-section-size-off-by-one
  description: Miscounts the cubes along an edge of the solid in the picture, so the cut face is a cell too long or too short.
- id: cross-section-mirrored-or-flipped
  description: Draws the L-shaped cut face mirrored or upside down, or with the corner cut away from the wrong place.
- id: cross-section-bounding-rectangle
  description: Draws the whole rectangle around the L or stepped end instead of the shape of the cut face.
- id: cross-section-uses-tallest-column
  description: Takes the height of the tallest part of a stepped solid for a cut that goes through a lower column or layer.
- id: cross-section-counted-from-wrong-end
  description: Counts the layer or column to cut through from the wrong end of the solid.
- id: cross-section-varies-in-a-prism
  description: Thinks the cross-section of a prism changes shape for each parallel cut, instead of seeing that cuts parallel to the end are all the same shape and size.
tags: [acara-f10-v9, primary-geometry-time, grid_solid_cross_sections, ac9m6sp01, cross-section, prism, drawn-answer, figure]
difficulty_progression:
  easy:
    steps: 1
    demand: "Read the two edges of a named face of a rectangular prism from the picture and shade the cut face parallel to it."
  medium:
    steps: 2
    demand: "Cut a prism with an L-shaped end parallel to that end and shade the L, seeing that every layer gives the same shape."
  hard:
    steps: 3
    demand: "Cut a stepped solid (not a prism) parallel to a side or the base, or compare two parallel cuts, where the cut face depends on the column or layer it passes through."
