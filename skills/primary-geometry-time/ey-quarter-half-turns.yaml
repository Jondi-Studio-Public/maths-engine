id: ey-quarter-half-turns
name: Find where you face after quarter and half turns
domain: primary-geometry-time
year_level: ['2']
naplan_domain: [measurement]
learner_band: early
description: "Read a picture of a ring marked You with an arrow showing which way it faces, make a quarter turn left or right or a half turn, and say which picture you now face or which turn was made."
status: active
capability_gates: [figure_stimulus]
needs_figure: true
read_aloud: true
placement_eligible: false
prerequisites: [ey-follow-directions-grid]
answer: mcq
sources:
