  params: {tier: easy}
  difficulty: easy
  stages: [0, 1, 2]
- topic: ey_turns
  params: {tier: medium}
  difficulty: medium
  stages: [3, 4]
- topic: ey_turns
  params: {tier: hard}
  difficulty: hard
