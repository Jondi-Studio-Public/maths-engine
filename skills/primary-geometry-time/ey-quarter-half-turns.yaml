difficulty_progression:
  easy: {steps: 1, demand: "Make one quarter turn left or right from facing up the page."}
  medium: {steps: 2, demand: "Make one quarter or half turn from facing any way, so left and right belong to the one turning."}
  hard: {steps: 3, demand: "Join two turns, or name the turn that takes you from facing one picture to facing another."}
misconceptions:
- id: eyp-left-right-swapped
  description: "Turns the wrong way, because left and right are taken from the page and not from the way the ring faces."
- id: eyp-quarter-as-half
  description: "Turns a half turn when told a quarter turn."
- id: eyp-half-as-quarter
  description: "Turns only a quarter turn when told a half turn."
- id: eyp-no-turn
  description: "Stays facing the same way after the turn."
- id: eyp-full-turn
  description: "Says a turn that ends facing the other way is a full turn."
- id: eyp-stops-early
  description: "Does only one of two turns."
