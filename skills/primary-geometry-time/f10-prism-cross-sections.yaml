misconceptions:
- id: wrong-classification-easy
  description: (easy tier) Reads the keyword incorrectly; answers "not a right prism" when the cross-sections are constant and uniform.
- id: ignores-measurements-medium
  description: (medium tier) Focuses only on the shape name but ignores the two stated measurements; answers "a right prism" even when the measurements differ.
- id: partial-comparison-hard
  description: (hard tier) Checks only the first two measurements and misses a mismatch introduced at the third point; fails to verify all three measurements are equal.
