misconceptions:
- id: wrong-classification-easy
  description: (easy tier) Reads the keyword incorrectly; answers "not a right prism" when the cross-sections are constant and uniform.
- id: ignores-measurements-medium
  description: (medium tier) Focuses only on the shape name but ignores the stated measurements; answers "a right prism" even when the measurements differ.
- id: matching-ends-mean-prism
  description: (medium tier) Takes two matching end measurements as proof of a right prism, without asking whether the middle was measured.
- id: partial-comparison-hard
  description: (hard tier) Checks only some of the slices and misses a mismatch in a size or a shape, or treats a measured top and bottom as enough.
