misconceptions:
- id: numeral-as-minutes
  description: Reads the numeral the long hand points at as the number of minutes (a hand at the 5 as 5 minutes past).
- id: nearest-numeral-hour
  description: Takes the hour numeral nearest the short hand as the hour, so a time past the half hour gets the next hour.
- id: swapped-hands
  description: Takes the short hand for the minutes and the long hand for the hour.
- id: counts-to-for-past
  description: Counts the minutes to the next hour and reports them as minutes past.
- id: one-tick-out
  description: Reads the minute mark next to the one the long hand points at.
- id: elapsed-no-regroup
  description: Between two clocks, subtracts the smaller number of minutes from the larger without regrouping an hour.
- id: elapsed-hours-only
  description: Between two clocks, gives only the difference between the hours.
- id: elapsed-minutes-only
  description: Between two clocks, gives only the difference between the minutes.
