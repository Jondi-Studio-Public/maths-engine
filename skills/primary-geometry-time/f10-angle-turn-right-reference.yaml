id: f10-angle-turn-right-reference
name: Express turns as right angles
domain: primary-geometry-time
year_level: ['2', '3']
description: Express a stated everyday turn (quarter, half, three-quarter or full turn) as a number of right angles, then count the turns of a clock hand, a compass pointer or a wheel, whole turns with a part turn, a net turn, and the turn still needed to finish a whole turn.
