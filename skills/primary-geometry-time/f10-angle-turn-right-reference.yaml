misconceptions:
- id: confuses-half-and-quarter
  description: Swaps the half (2) and quarter (1) values when building the answer, mistakenly using one for the other.
- id: off-by-one
  description: States a right-angle count one more or one less than the correct value.
- id: forgets-to-subtract
  description: In the hard (inverse) tier, reports the total T itself instead of the second turn's contribution T minus the first turn.
