misconceptions:
- id: reversed-order
  description: Writes the sequence latest to earliest instead of earliest to latest.
- id: alphabetical-order
  description: Orders the day-parts or day names alphabetically instead of chronologically.
- id: adjacent-swap
  description: Swaps two adjacent periods (e.g. afternoon and evening) as if their order did not matter.
- id: keeps-shuffled-order
  description: Writes the periods back in the order they were shown instead of reordering them chronologically.
