misconceptions:
- id: off-by-one-inclusive
  description: Counts both start and end dates as whole days (adds 1).
- id: off-by-one-exclusive
  description: Counts only days strictly between the two dates, excluding both endpoints (subtracts 1).
- id: ignores-month-boundary
  description: Naively subtracts day-of-month numbers, ignoring month boundaries.
- id: ignores-year-boundary
  description: Treats dates as if in the same year when crossing a year boundary.
