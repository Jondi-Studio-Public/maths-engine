misconceptions:
- id: net-face-wrong-size-for-its-edge
  description: Draws a top or bottom that is not as wide as the side face it is joined to, so the edges would not meet when the net is folded.
- id: net-face-missing
  description: Leaves out the top or the bottom, so the net has five faces and folds into an open box.
- id: net-side-faces-in-wrong-order
  description: Puts two wide faces side by side in the row of side faces, so the row does not go round the box.
- id: net-height-mixed-with-base
  description: Uses the height of the box as one side of the top or bottom, so the top and bottom are the wrong size.
- id: net-faces-joined-to-wrong-face
  description: Joins the top or the bottom to a different side face from the one named, or leaves a gap between them.
- id: net-bottom-copies-top
  description: Copies the top, size and turn, for the bottom, even when the bottom is joined to a side face of the other width.
- id: net-bottom-shifted-along-edge
  description: Slides the bottom along the edge it is joined to, so it does not sit square with the face above it.
