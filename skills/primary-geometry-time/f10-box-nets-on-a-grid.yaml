id: f10-box-nets-on-a-grid
name: Construct the net of a box on a grid
domain: primary-geometry-time
year_level: ['6']
naplan_domain: [space]
description: "Construct the net of a box, a rectangular prism, by shading its faces on a square grid. Easy shades a net with the top and bottom both joined to the first face of a row of four side faces. Medium joins the top and bottom to named side faces, so each one is as wide as the face it meets. Hard shows the row of side faces and the top, and asks for the missing bottom joined to a named face, with its size read from the net."
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
learner_band: primary
prerequisites: [f10-nets-build-solids]
answer: grid_cells
