id: f10-nets-build-solids
name: Connect nets and three-dimensional objects
domain: primary-geometry-time
year_level: ['5']
naplan_domain: [space]
description: "Given a drawn net, name the solid it folds into, decide whether squares joined edge to edge fold into a cube (and why not), and find which corners of a lettered cube net meet when it is folded. Grid questions draw nets on a square grid: name the solid, pick the one net of a cube from four drawings, and name the face opposite a lettered face once the cube is folded. The exam chain works from a drawn net of a closed box with measurements marked, to the area of a side face, then its width, surface area and volume."
