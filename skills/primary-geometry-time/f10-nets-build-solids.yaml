misconceptions:
- id: net-face-count-ignored
  description: Names a solid with the wrong number of faces because the faces of the net were not counted.
- id: net-prism-pyramid-confused
  description: Mixes up a prism and a pyramid; a prism has two matching ends and rectangle sides, a pyramid has one base and triangle sides.
- id: net-face-shape-only
  description: Chooses a solid because one face matches a shape in the net, without checking the other faces.
- id: net-any-six-squares
  description: Believes any six squares joined edge to edge fold into a cube.
- id: net-overlap-seen-in-valid-net
  description: Thinks two squares would land on the same face when a correct cube net is folded.
- id: net-faces-miscounted
  description: Counts the squares of a net wrongly, so the reason given is about the number of faces when the count is right (or the reverse).
- id: net-two-faces-for-one
  description: Doubles a face's area because the box has two faces of that size, when only one face was asked for.
- id: net-neighbours-meet
  description: Thinks the corners next to a corner in the net are the ones that meet it when the net is folded.
- id: net-corner-half-right
  description: Finds one corner that meets the given corner and guesses the other.
- id: net-wrong-corner
  description: Names the corners that meet at a different corner of the cube from the one asked about.
- id: net-strip-not-halved
  description: Uses the whole length of the strip of side faces as one length and one width, forgetting it goes round the box once and holds two of each.
- id: net-strip-length-not-removed
  description: Halves the length of the strip of side faces but does not take away the length that is already known.
- id: net-strip-as-equal-faces
  description: Treats the four side faces in the strip as four equal faces and divides its length by four.
- id: net-one-of-each-face
  description: Adds the areas of three different faces of a box and forgets that each appears twice.
- id: net-sides-counted-once
  description: Counts the four side faces of a box once each as if the box had one end face and one lid-sized strip.
- id: net-volume-for-area
  description: Gives the volume of a box where its surface area was asked for.
- id: net-area-for-volume
  description: Gives the surface area of a box where its volume was asked for.
- id: net-edges-added-for-volume
  description: Adds the three edge lengths of a box instead of multiplying them to get its volume.
- id: net-base-area-for-volume
  description: Gives the area of the base of a box as its volume, leaving out the height.
- id: surface-area-omits-ends
  description: Finds the area of the four side faces of the box and leaves out the top and bottom.
- id: perimeter-for-area
  description: Adds the sides of a rectangle where its area was asked for.
- id: net-face-sides-added
  description: Adds a face's length and height once instead of multiplying them to get its area.
- id: opposite-is-the-neighbour
  description: Names a face that touches the marked face in the net, forgetting that touching faces fold to meet at an edge.
- id: opposite-is-across-the-row
  description: Names the face at the far end of the marked face's row or column, forgetting that faces two apart in a row are the ones that end up opposite.
