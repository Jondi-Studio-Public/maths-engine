misconceptions:
- id: column-and-row-swapped
  description: Reads the number as the column and the letter as the row, so the square or the reference is reflected across the diagonal.
- id: rows-counted-from-the-top
  description: Counts the rows down from the top of the map instead of up from the bottom, so the row is flipped.
- id: off-by-one-square
  description: Starts counting at zero or skips a square, landing one column or row away from the right one.
- id: east-west-confused
  description: Looks west when asked for east, or the reverse, so the answer is the landmark on the opposite side.
- id: north-south-confused
  description: Looks down the page for north, or up for south, so the answer is the landmark on the opposite side.
- id: counts-the-start-square
  description: Counts the square already stood on as the first step of a move, so the finish is short by one square in each direction.
- id: distances-swapped
  description: Applies the first distance to the second direction and the second distance to the first.
tags: [acara-f10-v9, primary, geometry, map, grid-reference, landmarks, ac9m3sp02]
