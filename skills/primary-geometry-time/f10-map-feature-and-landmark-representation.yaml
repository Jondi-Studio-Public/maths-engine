id: f10-map-feature-and-landmark-representation
name: Locate landmarks on a map with grid references
domain: primary-geometry-time
year_level: ['3']
naplan_domain: [space]
description: Given a map of a familiar place on a grid with column letters, row numbers, landmark symbols and a north arrow, say which landmark is in a named square, give the grid reference of a landmark, or follow compass directions from a landmark. Easy names the landmark in a square. Medium gives a landmark's grid reference or names the landmark that lies north, south, east or west of a square. Hard follows two moves from a named landmark to the finishing square.
