id: place-features-on-a-grid-map
name: Place features on a grid map by shading squares
domain: primary-geometry-time
year_level: ['5']
naplan_domain: [space]
description: >-
  On a map drawn on a square grid with column letters, row numbers, landmark symbols and a north arrow, shade the squares
  that answer a position question. easy shades the square with a stated grid reference; medium shades the square a stated
  number of squares east or west and north or south of a named landmark; hard shades a rectangular region from its corner
  references, or the squares strictly between two landmarks in the same row or column; exam is a chain that shades a
  referenced square, counts the squares east-west and north-south between two landmarks, adds them for a walk (following
  through from both counts) and shades a square a move from a third landmark.
status: active
needs_figure: true
capability_gates: [figure_stimulus]
placement_eligible: false
learner_band: primary
prerequisites: [f10-map-feature-and-landmark-representation]
answer: grid_cells
