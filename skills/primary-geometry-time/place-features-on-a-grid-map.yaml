misconceptions:
- id: dg-gm-reference-reversed
  description: "Reads the grid reference the wrong way round, taking the number as the column and the letter as the row."
- id: dg-gm-row-from-top
  description: "Counts the rows from the top of the map instead of from the bottom."
- id: dg-gm-counts-start-square
  description: "Counts the square the move starts from as the first square of the move, ending one square short."
- id: dg-gm-one-square-too-far
  description: "Moves one square too far along the row or column."
- id: dg-gm-direction-reversed
  description: "Moves west when east was asked, or south when north was asked."
- id: dg-gm-moves-swapped
  description: "Swaps the two moves, going the east-west number of squares up and the north-south number across."
- id: dg-gm-region-corners-only
  description: "Shades only the corner squares of the region instead of every square inside the rectangle."
- id: dg-gm-region-edge-left-out
  description: "Shades a rectangle one row or column short, leaving out the squares on the far edge."
- id: dg-gm-between-includes-ends
  description: "Shades the squares of the two landmarks as well as the squares between them."
- id: dg-gm-between-one-short
  description: "Shades one square fewer than lie between the landmarks."
- id: dg-gm-count-includes-start
  description: "Counts the starting square as well as the squares moved, giving one too many."
- id: dg-gm-count-reference-difference
  description: "Subtracts the letters' places and the numbers the wrong way round, mixing up which is the east-west distance."
- id: dg-gm-walk-as-diagonal
  description: "Gives the larger of the two moves as the length of the walk instead of adding them."
- id: dg-gm-walk-product
  description: "Multiplies the east-west and north-south moves instead of adding them."
- {id: dg-near-miss-value, description: 'Reads, counts or works out a value a little way from the right one: out by one or two, with no single method behind the slip.'}
difficulty_progression:
  easy: {steps: 1, demand: "Read a letter-and-number grid reference and shade the square where that column and row meet."}
  medium: {steps: 2, demand: "Find the named landmark's square, then count a move east or west and north or south from it."}
  hard: {steps: 3, demand: "Shade a whole region from two corner references, or the squares strictly between two landmarks, without the squares of the landmarks."}
  exam: {steps: 5, demand: "Chain a shaded reference, the east-west and north-south counts between landmarks, the walk that adds them, and a final shaded move from a third landmark."}
