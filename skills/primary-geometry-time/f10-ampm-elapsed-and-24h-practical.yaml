id: f10-ampm-elapsed-and-24h-practical
name: Work out elapsed time with am, pm and 24-hour times
domain: primary-geometry-time
year_level:
- '4'
- '5'
naplan_domain:
- measurement
description: Find the minutes between two times in one day, across noon, with one time in am or pm and the other in 24-hour
  time, and over a timetable of two journey legs with a wait between them. The exam chain finds each leg, the wait, the total
  and the total in hours and minutes.
status: active
placement_eligible: false
prerequisites:
- elapsed-time
- convert-time-systems
answer: number
