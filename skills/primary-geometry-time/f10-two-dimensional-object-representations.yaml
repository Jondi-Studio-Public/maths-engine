id: f10-two-dimensional-object-representations
name: Represent objects in two dimensions
domain: primary-geometry-time
year_level: ['3', '5']
naplan_domain: [space]
description: Represent a stack of cubes on a grid. Easy shades the plan view (the view from above) of a stack drawn on isometric dot paper. Medium is given a plan with the number of cubes written on each column and shades the front, right or left view. Hard shades a net of a cube on a canvas, any six squares that fold up into the cube, with a tight canvas leaving only a few nets that fit.
