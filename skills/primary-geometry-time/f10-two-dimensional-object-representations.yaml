misconceptions:
- id: plan-front-back-swapped
  description: Draws the plan with the front of the stack at the top of the drawing instead of the bottom.
- id: plan-includes-bare-ground
  description: Shades the whole rectangle the stack stands in, including the empty spots where there are no cubes.
- id: plan-shows-front-view
  description: Draws the front view, standing the columns up, when asked for the view from above.
- id: reads-only-nearest-row
  description: Draws a view using only the row of the plan nearest the viewer instead of the tallest column in each line.
- id: adds-heights-in-a-line
  description: Adds the numbers in a line of the plan instead of taking the tallest, so the view is too tall.
- id: mirrored-view
  description: Draws the view reversed left to right, or the view from the opposite side.
- id: net-has-overlapping-faces
  description: Draws six squares in which two faces would land on the same side of the cube, such as four squares round a corner or two flaps on the same side of a row of four.
- id: net-has-wrong-number-of-faces
  description: Draws five squares, a face missing, or seven squares.
tags: [acara-f10-v9, primary-geometry-time, grid_plan_views, ac9m3sp02, ac9m5sp01, nets, plan-view, drawn-answer]
difficulty_progression:
  easy:
    steps: 1
    demand: "Draw the plan view of a stack of cubes shown on isometric dot paper."
  medium:
    steps: 2
    demand: "Draw the front, right or left view of a stack from a plan with the cubes in each column written on it."
  hard:
    steps: 3
    demand: "Draw a net of a cube on a canvas that leaves only a few placements."
  exam:
    steps: 5
    demand: "Read the cubes in a stack from its plan, then the column heights of its front and right-side views and the squares in the front view. The draw form is not set in the exam tier."
