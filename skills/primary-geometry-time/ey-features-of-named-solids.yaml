  description: "Gives the count for one solid where the total was asked for."
- id: eyz-uses-the-same-count-for-every-solid
  description: "Uses the count of one solid for every solid."
- id: eyz-counts-every-solid-in-the-picture
  description: "Adds in the solids of other names."
- id: eyz-counts-the-solids-not-their-features
  description: "Gives the number of solids instead of their features."
- id: eyz-miscounts-the-solids
  description: "Is one solid out in counting how many there are of that name."
