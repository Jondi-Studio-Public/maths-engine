misconceptions:
- id: swapped-coordinates
  description: Reports the change in x and y coordinates swapped; states dy as the change in x and dx as the change in y.
- id: wrong-direction
  description: Reports the negated change; subtracts the start point from the end point instead, giving (start - end) instead of (end - start).
- id: ignores-first-leg
  description: (hard tier only) Tracks only the second movement and ignores the first; reports the change from the intermediate point to the end instead of the total change from start to end.
