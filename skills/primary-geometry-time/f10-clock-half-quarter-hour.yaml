misconceptions:
- id: swapped-hands
  description: Takes the short hand for the minutes and the long hand for the hour.
- id: hour-hand-passed-numeral
  description: At a quarter to, names the hour numeral the short hand has passed instead of the one it is approaching.
- id: quarter-past-to-confused
  description: Gives a quarter past for a quarter to, or the reverse, by reading the wrong side of the face.
- id: hour-off-by-one
  description: Names the hour numeral next to the one the short hand points at.
- id: half-oclock-confused
  description: Gives a half past for an o'clock time, or the reverse.
