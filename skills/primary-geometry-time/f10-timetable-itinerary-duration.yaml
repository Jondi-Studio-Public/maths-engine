id: f10-timetable-itinerary-duration
name: Timetable itinerary duration lookup
domain: primary-geometry-time
description: Given a stated timetable listing named events or journeys' start and end times, determine the duration of a named event or journey.
status: active
placement_eligible: false
prerequisites:
- convert-time-systems
- elapsed-time
answer: number
sources:
- topic: timetable_itinerary_duration
  params: {tier: easy}
  difficulty: easy
  stages: [0, 1, 2]
- topic: timetable_itinerary_duration
  params: {tier: medium}
  difficulty: medium
  stages: [3, 4]
- topic: timetable_itinerary_duration
  params: {tier: hard}
  difficulty: hard
  stages: [5, 6, maintenance]
misconceptions:
- id: wrong-row
  description: Computes the duration of a different row in the same timetable instead of the asked one.
- id: swapped-times
  description: Reports the negative of the correct duration (treats the journey as running backwards).
- id: minute-only-subtraction
  description: Subtracts only the minute parts and ignores the hour difference.
- id: am-pm-blind
  description: Computes the duration without applying the +12 hour adjustment for pm times.
