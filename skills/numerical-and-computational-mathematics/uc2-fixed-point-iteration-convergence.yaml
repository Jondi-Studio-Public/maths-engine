id: uc2-fixed-point-iteration-convergence
name: Analyse fixed-point iteration convergence
domain: numerical-and-computational-mathematics
year_level:
- university
description: Decide which fixed point an iteration x(n+1) = g(x(n)) is drawn to, find the rate |g'| there, count the iterations
  an a priori bound needs, and choose a constant that makes the convergence quadratic.
