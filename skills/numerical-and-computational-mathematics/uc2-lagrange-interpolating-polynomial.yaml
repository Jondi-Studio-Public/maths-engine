id: uc2-lagrange-interpolating-polynomial
name: Build a Lagrange interpolating polynomial
domain: numerical-and-computational-mathematics
year_level:
- university
description: Write the interpolating polynomial through given data points in expanded form, from the Lagrange basis, and
  use it to evaluate and to find the interpolation error.
