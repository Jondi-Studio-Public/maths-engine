misconceptions:
- id: num2-rk4-euler-step-used
  description: Taking the Euler step y_0 + h k_1 instead of combining all four Runge-Kutta slopes.
- id: num2-rk4-midpoint-slope-used
  description: Stepping with the midpoint slope alone, y_0 + h k_2, instead of the weighted average of four slopes.
- id: num2-rk4-step-size-dropped
  description: Adding the weighted average of the slopes to y_0 without multiplying by the step size h.
- id: num2-rk4-stage-slope-not-updated
  description: Evaluating every stage slope at the starting y-value instead of at the predicted y-value from the previous
    stage.
- id: num2-rk4-weights-equal
  description: Averaging the four slopes with equal weights, (k_1 + k_2 + k_3 + k_4)/4, instead of weights 1, 2, 2, 1 over
    6.
- id: num2-rk4-half-step-forgotten
  description: Using the full step h instead of h/2 when predicting the y-value for the second and third slopes.
- id: num2-rk4-stage-x-not-advanced
  description: Evaluating every slope at the starting x-value instead of at x_0, x_0 + h/2 and x_0 + h.
- id: num2-rk4-first-slope-at-the-midpoint
  description: Evaluating the first slope at the midpoint x_0 + h/2 instead of at the starting point x_0.
- id: num2-rk4-first-slope-at-wrong-point
  description: Evaluating the first slope at the end of the step instead of at the starting point.
- id: num2-rk4-initial-value-for-slope
  description: Giving the initial y-value where the first slope is asked for.
- id: num2-rk4-first-slope-y-shifted
  description: Evaluating the first slope at y_0 + h instead of at y_0.
- id: num2-rk4-first-slope-reused
  description: Repeating the first slope as the second slope instead of re-evaluating the equation at the midpoint.
- id: num2-rk4-second-slope-half-step-forgotten
  description: Using a full step h in the predicted y-value for the second slope instead of h/2.
- id: num2-rk4-second-slope-x-not-advanced
  description: Evaluating the second slope at the start of the step instead of at its midpoint.
- id: num2-rk4-second-slope-y-not-advanced
  description: Evaluating the second slope at the original y-value instead of the value predicted using the first slope.
- id: num2-rk4-stopped-after-one-step
  description: Reporting the value after the first step when the question asks for the value after two steps.
difficulty_progression: Easy takes one step for a right-hand side that is linear in x and y. Medium takes one step for a
  nonlinear right-hand side such as xy or x² + y, where each intermediate slope depends on the last. Hard takes two steps
  for a nonlinear right-hand side, so the second step starts from an inexact first result. The exam chain asks for k₁, then
  k₂, then y₁, then a second step y₂ from the learner's own y₁.
