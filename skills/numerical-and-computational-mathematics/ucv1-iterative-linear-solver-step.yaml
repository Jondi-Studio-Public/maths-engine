id: ucv1-iterative-linear-solver-step
name: Perform one iterative linear-solver step
domain: numerical-and-computational-mathematics
description: Compute one Gauss-Seidel update for a supplied diagonally dominant
  two-variable linear system, starting from a stated point (x0, y0). The second
  equation's update uses the just-computed x1, not x0, which is the boundary
  against the Jacobi update in jacobi-iteration-2x2.
status: active
prerequisites: [jacobi-iteration-2x2]
answer: pair
