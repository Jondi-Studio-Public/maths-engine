misconceptions:
- id: divides-instead-of-multiplies
  description: Reports rel_in / kappa instead of kappa * rel_in.
- id: omits-kappa
  description: Reports rel_in unchanged, ignoring the condition number entirely.
- id: uses-kappa-squared
  description: Reports kappa^2 * rel_in instead of kappa * rel_in.
- id: uses-absolute-not-relative
  description: 'Hard tier only: multiplies kappa by the absolute input error
    directly, skipping the division by the input magnitude that turns it into
    a relative error.'
