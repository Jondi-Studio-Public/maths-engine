id: uc2-richardson-extrapolation
name: Improve an estimate by Richardson extrapolation
domain: numerical-and-computational-mathematics
year_level:
- university
description: Combine a difference quotient (or a trapezoid-rule value) at two step sizes so that the leading error term cancels.
