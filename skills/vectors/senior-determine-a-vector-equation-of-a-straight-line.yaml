misconceptions:
  - id: wrong-direction
    description: Computes A minus B instead of B minus A, reversing the direction vector.
  - id: swapped-components
    description: Swaps the x and y components of the direction vector.
  - id: added-instead-of-subtracted
    description: Adds the coordinates instead of subtracting them.
  - id: used-second-point-not-midpoint
    description: (Hard tier only) Uses C directly as the second point instead of computing the midpoint M.
