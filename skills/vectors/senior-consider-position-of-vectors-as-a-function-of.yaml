misconceptions:
- id: dropped-constant
  description: Forgets to add the constant term when evaluating a linear component (easy tier).
- id: swapped-components
  description: Reports the x and y components in the wrong order (any tier).
- id: sign-error-on-t
  description: Substitutes negative t instead of the stated positive value (any tier).
- id: forgot-square
  description: Forgets to square t in the quadratic term, treating t^2 as just t (medium tier).
- id: reported-position-not-displacement
  description: Reports the position at the end time instead of computing the displacement (hard tier).
- id: wrong-direction
  description: Computes displacement in the opposite direction, subtracting the end time from the start time (hard tier).
