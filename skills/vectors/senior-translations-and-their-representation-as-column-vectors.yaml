misconceptions:
  - id: subtracts-instead-of-adds
    description: Subtracts the column vector instead of adding it; computes P' = (Px - a, Py - b).
  - id: swapped-vector-components
    description: Swaps the x and y components of the column vector; applies (Px + b, Py + a) instead of (Px + a, Py + b).
  - id: one-axis-only
    description: Applies the translation to only one axis; computes P' = (Px + a, Py) and forgets the y-component.
  - id: only-first-translation
    description: (Hard tier only) Applies only the first translation; computes P' = (Px + a1, Py + b1) and ignores the second.
  - id: only-second-translation
    description: (Hard tier only) Applies only the second translation; computes P' = (Px + a2, Py + b2) and ignores the first.
  - id: subtracts-second-translation
    description: (Hard tier only) Subtracts the second translation instead of adding it; computes P' = (Px + a1 - a2, Py + b1 - b2).
