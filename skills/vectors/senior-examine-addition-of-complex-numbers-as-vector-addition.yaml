id: senior-examine-addition-of-complex-numbers-as-vector-addition
name: Examine addition of complex numbers as vector addition
domain: vectors
description: |
  Given bounded, fully specified inputs, examine addition of complex numbers as vector
  addition in the complex plane. Return the resulting value, expression, relation, or
  classification. Every question is framed and computed as vector addition ("vector",
  "resultant" wording throughout), across two-vector sums, three-vector chained sums, and
  solving for a missing vector given the resultant and one addend. Boundary against
  senior-consider-complex-numbers-as-points-in-a-plane (whose own sum variant is a bounded
  1/3 slice of its own three tiers -- two-term add/subtract only, no chaining, no
  inverse-solve, and never framed in vector language at all): this skill's focus is
  the explicit VECTOR-ADDITION framing plus a genuinely different difficulty shape
  (three-term chained addition at medium, inverse/solve-for-the-other-vector reasoning at
  hard) that the existing skill never reaches at any tier.
status: active
placement_eligible: false
prerequisites: [vector-addition]
answer: pair
sources:
  - topic: complex_addition_vector
    params: {variant: two_term}
    difficulty: easy
    stages: [0, 1, 2]
  - topic: complex_addition_vector
    params: {variant: chained}
    difficulty: medium
    stages: [3, 4]
  - topic: complex_addition_vector
    params: {variant: inverse}
    difficulty: hard
    stages: [5, 6, maintenance]
misconceptions:
  - id: subtracted-not-added
    description: Subtracts the second vector instead of adding it.
  - id: swapped-result
    description: Reports the resultant's components in the wrong order (x and y swapped).
  - id: only-first-vector
    description: Forgets to add the second vector at all, reporting only the first vector's coordinates.
  - id: omitted-third
    description: Forgets the third vector in a three-vector chained sum.
  - id: omitted-first
    description: Forgets the first vector in a three-vector chained sum.
  - id: sign-error-third
    description: Subtracts the third vector instead of adding it in a three-vector chained sum.
  - id: added-not-subtracted
    description: Adds the resultant and the known vector instead of subtracting, forgetting to invert the addition when solving for the missing vector.
  - id: swapped-result-components
    description: Reports the solved-for vector's components in the wrong order (x and y swapped).
  - id: reports-z1
    description: Reports the known vector z1 instead of solving for the unknown vector z2.
tags: [complex-numbers, vectors, acara-v8-4, ACMSM072, ACMSM084]
