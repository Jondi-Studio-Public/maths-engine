misconceptions:
- id: sign-error-on-gravity
  description: Treats acceleration as +g instead of -g on any question touching the y-axis.
- id: dropped-initial-component
  description: Drops the initial velocity or displacement term for the axis asked about.
- id: wrong-axis-component
  description: Reports the fully-correct value for the other axis instead of the one asked for.
- id: forgot-position-offset
  description: Omits the stated nonzero initial position from a position answer (hard tier position questions only -- collides with the answer at medium, where the launch is from the origin).
