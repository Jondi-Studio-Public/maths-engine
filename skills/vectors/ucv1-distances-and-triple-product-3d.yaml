id: ucv1-distances-and-triple-product-3d
name: Find distances and volumes in three dimensions
domain: vectors
description: >-
  Find the shortest distance from a point to a plane or a line, the distance between two skew
  lines, and volumes from the scalar triple product (a parallelepiped or a tetrahedron),
  including the height of a vertex above the plane through three others. The four-part exam
  chain goes from a triple product through the volume and a face area to the height of a
  crystal.
status: active
placement_eligible: false
prerequisites: [vector-cross-product, vector-dot-product, vector-magnitude]
answer: number
sources:
- topic: fy1ms_distances_3d
  params: {}
  difficulty: easy
  stages: [0, 1, 2]
- topic: fy1ms_distances_3d
  params: {}
  difficulty: medium
  stages: [3, 4]
- topic: fy1ms_distances_3d
  params: {}
