misconceptions:
- id: assumes-crossing-paths-means-meeting
  description: Sees that the two lines cross at some point in space and concludes the
    particles meet, without checking that each particle is there at the SAME time.
- id: assumes-particles-never-meet-because-directions-differ
  description: Sees the two velocity vectors point in visibly different directions and
    concludes the particles never meet, missing that non-parallel paths always cross
    somewhere in space and may well cross at the same time.
- id: misses-that-parallel-velocities-forbid-any-crossing
  description: Does not recognise that parallel (proportional) velocity vectors mean the
    two paths, if distinct, can never cross at all -- tries to solve for a meeting time
    anyway and mishandles the resulting always-true or always-false equation.
- id: mislabels-a-shared-velocity-component-as-full-parallelism
  description: At the medium/hard tier, sees the two velocity vectors share one coordinate
    (say, equal x-components) and assumes the vectors are fully parallel, missing that the
    OTHER coordinate still differs and the paths are not actually parallel at all.
