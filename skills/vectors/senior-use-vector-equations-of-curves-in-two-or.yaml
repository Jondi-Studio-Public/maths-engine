misconceptions:
- id: adds-instead-of-multiplies
  description: Adds the coefficients instead of multiplying them (reports a + b instead of a*b).
- id: squares-wrong-variable
  description: Squares the wrong coefficient (reports b^2 instead of a*b).
- id: off-by-one-product
  description: Reports the product plus one (a*b + 1 instead of a*b).
- id: sign-dropped
  description: Reports the absolute value of the product, ignoring the sign (medium tier only; only exercisable when a*b < 0).
- id: forgot-offset
  description: Ignores the constant offset in the y component, evaluating only the base rational part (hard tier).
- id: sign-error-offset
  description: Applies the sign of the offset incorrectly (hard tier).
- id: off-by-one-on-m
  description: Reports m+1 instead of m when combining with the offset (hard tier).
