id: relative-velocity-vectors
name: Relative velocity, closest approach and interception
domain: vectors
year_level:
- '12'
description: Find the velocity of one moving object relative to another from components or from speeds on perpendicular bearings,
  then use it for the time of closest approach, the least distance and the time to intercept a moving target.
status: active
placement_eligible: false
prerequisites:
- vector-addition
answer: number
