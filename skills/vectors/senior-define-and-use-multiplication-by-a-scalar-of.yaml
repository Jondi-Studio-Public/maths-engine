misconceptions:
- id: added-instead-of-multiplied
  description: Adds the scalar to the coefficient instead of multiplying (easy/medium tiers).
- id: used-original-vector
  description: Reports the un-scaled coefficient, forgetting to multiply by the scalar (easy/medium tiers).
- id: wrong-axis-scalar
  description: Multiplies the scalar by the other coefficient instead of the one asked for (easy/medium tiers).
- id: added-instead-of-divided
  description: Subtracts the scalar from the product instead of dividing by it (hard tier).
- id: used-product-directly
  description: Reports the scaled product itself, ignoring the scalar (hard tier).
