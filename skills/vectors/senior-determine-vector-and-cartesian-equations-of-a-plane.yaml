misconceptions:
  - id: forgot-last-term
    description: (Easy/medium tier) Omits the last term of the dot product, computing only ax + by.
  - id: sign-error-middle-term
    description: (Easy/medium tier) Negates the middle term instead of adding it.
  - id: sum-not-dot-product
    description: (Easy/medium tier) Adds all components instead of computing the dot product.
  - id: forgot-to-divide
    description: (Hard tier) Computes the numerator but forgets to divide by z0.
  - id: negated-answer
    description: (Hard tier) Reports the negative of the correct value.
  - id: off-by-one
    description: (Hard tier) Reports one more or one less than the correct value.
