id: ucv1-lines-and-planes-3d
name: Work with lines and planes in three dimensions
domain: vectors
description: >-
  Find the equation of the plane through three points from the cross product of two edges, find
  where a line meets a plane, and find the acute angle between two planes or between a line and
  a plane. The four-part exam chain takes a laser beam and a flat mirror from the normal vector
  through the plane's equation to the point where the beam hits it.
status: active
placement_eligible: false
prerequisites: [vector-cross-product, vector-dot-product]
answer: number
