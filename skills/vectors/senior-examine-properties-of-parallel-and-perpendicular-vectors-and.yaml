id: senior-examine-properties-of-parallel-and-perpendicular-vectors-and
name: Examine properties of parallel and perpendicular vectors and determine if two vectors are parallel or perpendicular
domain: vectors
description: Given bounded, fully specified inputs, examine properties of parallel and perpendicular vectors and determine if two vectors are parallel or perpendicular. Return the resulting value, expression, relation, or classification.
status: active
placement_eligible: false
prerequisites:
- vector-addition
answer: number
sources:
- topic: examine_properties_of_parallel_and_perpendicular_vectors_and
  params: {variant: perpendicular}
  difficulty: easy
  stages: [6]
- topic: examine_properties_of_parallel_and_perpendicular_vectors_and
  params: {variant: parallel}
  difficulty: medium
  stages: [6]
