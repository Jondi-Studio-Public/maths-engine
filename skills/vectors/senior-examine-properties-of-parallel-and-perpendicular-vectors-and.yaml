misconceptions:
- id: dropped-the-sign
  description: Reports the missing component without applying the required sign flip (easy tier).
- id: swapped-components-of-u
  description: Uses the wrong coordinate of u in the perpendicular formula (easy tier).
- id: used-given-coordinate-directly
  description: Reports the given coordinate of v itself, ignoring the perpendicular relationship (easy tier).
- id: wrong-component-of-u-used
  description: Scales the wrong coordinate of u instead of the one that corresponds to the missing coordinate (medium tier).
- id: assumed-k-equals-one
  description: Reports the un-scaled coordinate of u, as if the scalar were 1 (medium tier).
- id: used-negative-scale
  description: Reports the negated correct value (medium tier).
- id: subtracted-instead-of-divided
  description: Subtracts instead of dividing to recover the scalar (hard tier).
- id: confused-k-with-a-component
  description: Reports a coordinate of u directly as if it were the scalar (hard tier).
