misconceptions:
- id: reversed-order
  description: Computes the vector from B to A instead of from A to B (or, on the inverse tier, subtracts the given component instead of adding it).
- id: wrong-axis
  description: Reports the other axis's own difference (or, on the inverse tier, adds the given component to the wrong coordinate of A).
- id: endpoint-only
  description: Reports the raw coordinate of the endpoint, ignoring the starting point entirely.
