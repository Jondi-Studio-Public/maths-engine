id: senior-use-ordered-pair-notation-and-column-vector-notation
name: Use ordered pair notation and column vector notation to represent a vector
domain: vectors
description: Given bounded, fully specified inputs, use ordered pair notation and column vector notation to represent a vector. Return the resulting value, expression, relation, or classification.
status: active
placement_eligible: false
prerequisites:
- vector-addition
answer: number
