misconceptions:
- id: centre-sign-flipped
  description: Reports (a, b, c) with every sign kept as printed instead of flipped, e.g. reading
    (x - 2) as centre coordinate -2 instead of 2.
- id: r-squared-for-r
  description: Reports r^2 (the number printed on the right of a centre-radius equation) in place
    of r, skipping the final square root.
- id: coefficient-not-halved
  description: (hard/exam) Reads the expanded equation's D, E, F coefficients straight as the
    centre coordinates without halving them, e.g. reporting 2a instead of a.
- id: constant-sign-error
  description: (hard/exam) Computes r^2 as a^2+b^2+c^2+G instead of a^2+b^2+c^2-G, using the wrong
    sign on the constant term when completing the square.
- id: not-divided-by-k
  description: (exam) Reads the centre and radius straight off an equation with a common leading
    coefficient k without dividing through by k first.
