id: senior-introduce-cartesian-coordinates-for-three-dimensional-space-including
name: Introduce Cartesian coordinates for three-dimensional space, including plotting points and
  the equations of spheres
domain: vectors
year_level: ['12']
description: Given the equation of a sphere in centre-radius form, or in expanded form that needs
  completing the square, state its centre coordinates and radius as the ordered 4-tuple (a, b, c,
  r). easy reads centre-radius form directly (flip the printed signs, take the square root);
  medium first rewrites a common-factor, moved-constant or split-sides variant into standard form;
  hard completes the square from an expanded equation with an integer centre and radius; exam
  divides through by a leading coefficient first, sometimes landing on a half-integer centre.
  Plotting points in three dimensions is not assessed -- no honest two-dimensional drawn answer
  exists for it -- and every sphere's equation is always supplied, never built from a diameter's
  endpoints or a point known to lie on the sphere; this skill is not
  senior-determine-vector-and-cartesian-equations-of-a-plane (a different surface, a different
  equation family) and not f10-three-dimensional-coordinates (which subtracts two given points --
  no equation, no centre, no radius).
status: active
placement_eligible: false
