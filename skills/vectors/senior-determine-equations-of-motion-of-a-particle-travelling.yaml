id: senior-determine-equations-of-motion-of-a-particle-travelling
name: Determine equations of motion of a particle travelling in a straight line with both constant and variable acceleration
domain: vectors
description: Given bounded, fully specified inputs, determine equations of motion of a particle travelling in a straight line with both constant and variable acceleration. Return the resulting value, expression, relation, or classification.
