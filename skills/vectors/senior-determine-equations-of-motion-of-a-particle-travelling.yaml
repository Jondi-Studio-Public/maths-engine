misconceptions:
- id: forgot-initial-scalar-velocity
  description: Drops the initial scalar velocity term when forming the displacement-along-d function, as if the particle started from rest along the line.
- id: forgot-position-offset
  description: Omits the stated initial position vector from the final answer, as if the particle started at the origin (medium/hard tiers only -- collides with the answer at easy, where it does start at the origin).
- id: wrong-axis-component
  description: Reports the fully-correct value for the other axis instead of the one asked for.
- id: power-rule-no-divide
  description: Mis-integrates the variable acceleration H*t, dividing by 2 instead of 6 (hard tier only, where acceleration is variable).
