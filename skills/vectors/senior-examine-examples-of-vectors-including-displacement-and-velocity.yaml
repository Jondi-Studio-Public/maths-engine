misconceptions:
- id: added-instead-of-pythagoras
  description: Adds the two perpendicular legs directly instead of taking the square root of the sum of squares.
- id: forgot-one-leg
  description: Reports a single leg (or leg-total) as if it were the full magnitude.
- id: multiplies-by-the-irrelevant-number
  description: Multiplies the magnitude by an irrelevant stated number (e.g. elapsed time), medium tier only.
- id: dropped-the-second-leg
  description: Computes the magnitude using only the first leg of a two-leg journey, ignoring the second entirely, hard tier only.
