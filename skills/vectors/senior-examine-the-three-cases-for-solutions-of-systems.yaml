misconceptions:
- id: assumes-three-equations-always-gives-a-unique-solution
  description: Treats "three equations, three unknowns" as automatically solvable, missing that a
    dependency between the equations can leave no solution or infinitely many.
- id: confuses-an-all-zero-row-with-a-unique-solution
  description: Sees a fully-reduced echelon form with a bottom row of all zeros and reads it as
    "the system is solved" rather than recognising the row is uninformative (no solution or
    infinitely many, depending on the constant).
- id: misreads-a-nonzero-constant-with-a-zero-row-as-consistent
  description: Sees a bottom echelon row [0 0 0 | c] with c ≠ 0 and calls the system consistent,
    missing that this row states the contradiction 0 = c.
- id: mistakes-a-near-multiple-for-an-exact-dependency
  description: At the medium/hard tier, sees two equations that look similar (close coefficients)
    and assumes a dependency without checking the proportionality is exact.
- id: substitutes-a-single-k-value-instead-of-reasoning-about-the-condition
  description: At the exam tier, tests only one value of k (often the excluded/critical one) rather
    than confirming the classification holds for every k satisfying the stated condition.
