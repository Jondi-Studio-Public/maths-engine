misconceptions:
- id: added-instead-of-multiplied
  description: Adds the scalar to the component instead of multiplying by it (easy/medium tiers).
- id: used-original-vector
  description: Reports the un-scaled component, forgetting to multiply by the scalar (easy/medium tiers).
- id: wrong-axis-scalar
  description: Multiplies the scalar by the other component instead of the one asked for (easy/medium tiers).
- id: added-instead-of-divided
  description: Subtracts the scalar from the product instead of dividing by it (hard tier).
- id: used-product-directly
  description: Reports the scaled product itself, ignoring the scalar, as if it were the original component (hard tier).
