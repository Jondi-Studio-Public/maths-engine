id: ucv1-completeness-cauchy-check
name: Check a finite Cauchy witness
domain: functional-and-linear-analysis
description: For a supplied finite sequence and (epsilon, N) witness table, identify which row's claim is inconsistent with the sequence, or that every row is consistent.
status: active
placement_eligible: false
prerequisites:
- senior-understand-the-limiting-behaviour-as-n-rightarrow-infty
- limit-at-infinity
answer: mcq
sources:
- topic: p15b_completeness_cauchy_check
  params: {}
  difficulty: easy
  stages: [0, 1, 2]
- topic: p15b_completeness_cauchy_check
  params: {}
  difficulty: medium
  stages: [3, 4]
- topic: p15b_completeness_cauchy_check
  params: {}
