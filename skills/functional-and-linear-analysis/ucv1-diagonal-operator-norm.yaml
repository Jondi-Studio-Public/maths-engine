misconceptions:
- id: uses-min-instead-of-max
  description: Reports the smaller |entry| instead of the larger one.
- id: multiplies-the-two-norms
  description: On the hard tier (a composition of two diagonal maps), multiplies the operator norms of the two individual maps instead of multiplying the matching diagonal entries first and then taking the max absolute value.
- id: swaps-the-pairing
  description: On the hard tier, pairs each map's first entry with the other map's second entry (an unmatched index) when composing, instead of multiplying corresponding entries.
- id: forgets-absolute-value-after-power
  description: On the exam tier (a power of a map with a negative fractional entry), compares the raw signed powered values instead of their absolute values, so an odd power of a negative entry is ranked incorrectly.
