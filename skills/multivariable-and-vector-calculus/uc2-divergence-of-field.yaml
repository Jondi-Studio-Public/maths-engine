id: uc2-divergence-of-field
name: Divergence of a vector field
domain: multivariable-and-vector-calculus
year_level: [university]
description: 'Find the divergence of a three-dimensional vector field as an expression, find the constants that make a field solenoidal, evaluate the divergence of radial and exponential fields at a point, and chain a divergence through an evaluation, a cancelling constant and the product rule for a density.'
status: active
placement_eligible: false
prerequisites:
