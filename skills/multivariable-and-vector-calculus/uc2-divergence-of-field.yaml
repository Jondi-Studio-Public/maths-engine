misconceptions:
- id: vc2-chain-factor-dropped
  description: 'Differentiates a function of a function, such as sin(xz) or e^(xy), and leaves out the derivative of the inner function.'
- id: vc2-div-added-term-not-differentiated
  description: 'Does not differentiate the added term kz, so it solves k times z instead of the derivative k.'
- id: vc2-div-chain-factor-dropped
  description: 'Differentiates (x^2 + y^2 + z^2)^n with the power rule and leaves out the factor 2x from the inner function.'
- id: vc2-div-component-dropped
  description: 'Adds only two of the three partial derivatives that make up the divergence.'
- id: vc2-div-confused-with-curl
  description: 'Adds the components of the curl instead of the three partial derivatives that make up the divergence.'
- id: vc2-div-density-factor-dropped
  description: 'Leaves out the scalar factor g when multiplying it by the divergence in the product rule.'
- id: vc2-div-exp-zero-as-zero
  description: 'Evaluates e^0 as 0 instead of 1.'
- id: vc2-div-field-value-not-divergence
  description: 'Adds the values of the components at the point instead of finding the divergence.'
- id: vc2-div-left-as-vector
  description: 'Leaves the three partial derivatives as a vector instead of adding them, so the divergence is not a single expression.'
- id: vc2-div-own-variable-undercounted
  description: 'Counts the derivatives of x, y and z with respect to themselves as 1 in all instead of 3.'
- id: vc2-div-param-factor-dropped
  description: 'Forgets the factor that comes from differentiating a power (y^2 gives 2y) when collecting the terms in the unknown constant.'
- id: vc2-div-param-off-by-one
  description: 'Slips by one in the arithmetic of the final value.'
- id: vc2-div-parameters-swapped
  description: 'Gives the two constants in the wrong order.'
- id: vc2-div-power-factor-not-differentiated
  description: 'Treats (x^2 + y^2 + z^2)^n as a constant when differentiating the radial field, keeping only the 3 from the three variables.'
- id: vc2-div-power-rule-slip
  description: 'Keeps the power n instead of lowering it to n - 1 after differentiating (x^2 + y^2 + z^2)^n.'
- id: vc2-div-product-rule-sign
  description: 'Subtracts the second term of the product rule for the divergence of a scalar times a vector field.'
- id: vc2-div-solve-sign
  description: 'Sets up the condition on the unknown constant correctly but solves it with the wrong sign.'
- id: vc2-div-wrong-variable
  description: 'Differentiates each component with respect to the next variable (P by y, Q by z, R by x) instead of its own variable.'
- id: vc2-product-rule-term-dropped
  description: 'Differentiates only one factor of a product, losing the other product-rule term.'
