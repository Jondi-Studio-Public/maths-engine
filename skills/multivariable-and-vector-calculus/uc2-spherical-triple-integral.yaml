id: uc2-spherical-triple-integral
name: Evaluate a triple integral in spherical coordinates
domain: multivariable-and-vector-calculus
year_level: [university]
description: >-
  Convert a solid described by Cartesian inequalities to spherical coordinates and evaluate a
  triple integral over it, with the volume element rho squared sin phi, exact answers in pi, and
  the volume, mass, centre of mass and average density of a solid with a density. Regions run from
  balls, half balls and shells, through a ball cut by a cone and a shell in the first octant, to a
  ball through the origin whose radius depends on the angle, a spherical cap cut off by a plane,
  and a shell above a cone.
status: active
placement_eligible: false
prerequisites:
- ucv1-triple-integral
answer: expression
