id: uc2-stokes-theorem-circulation
name: Stokes' theorem for circulation
domain: multivariable-and-vector-calculus
year_level:
- university
description: Find the circulation of a vector field round a space curve by choosing a surface the curve bounds and finding
  the flux of the curl through it.
