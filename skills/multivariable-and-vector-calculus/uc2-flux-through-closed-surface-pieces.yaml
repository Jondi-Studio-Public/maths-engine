id: uc2-flux-through-closed-surface-pieces
name: Flux through the pieces of a surface
domain: multivariable-and-vector-calculus
year_level:
- university
description: Find the flux of a vector field through a box face, a cylinder, a hemisphere or a sphere piece by parametrising
  the surface directly, with the outward normal stated.
status: active
