id: uc2-vector-identities
name: Vector calculus identities
domain: multivariable-and-vector-calculus
year_level: [university]
description: 'Apply the product rules and second-derivative identities of vector calculus to concrete fields and evaluate them at a point: curl and divergence of a scalar multiple, divergence of a cross product, the Laplacian of a product and of a power of the radius, Green''s difference, and the double curl.'
status: active
placement_eligible: false
prerequisites:
- uc2-divergence-of-field
- uc2-curl-of-field
answer: expression
