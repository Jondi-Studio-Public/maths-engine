id: uc2-coordinate-conversion-3d
name: Convert between Cartesian, cylindrical and spherical coordinates
domain: multivariable-and-vector-calculus
year_level: [university]
description: >-
  Convert a point between Cartesian, cylindrical and spherical coordinates, giving one coordinate
  exactly with its range stated (theta in 0 to 2 pi, phi from the positive z-axis in 0 to pi), and
  convert a surface from a Cartesian equation to a cylindrical or spherical one, or read the shape
  back from a cylindrical or spherical equation. The exam chain follows a drone's position from
  Cartesian coordinates through r, theta, rho and phi.
status: active
placement_eligible: false
prerequisites:
- ucv1-triple-integral
answer: expression
