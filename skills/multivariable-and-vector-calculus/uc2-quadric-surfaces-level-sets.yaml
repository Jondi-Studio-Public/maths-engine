id: uc2-quadric-surfaces-level-sets
name: Quadric surfaces, level sets and cross-sections
domain: multivariable-and-vector-calculus
year_level:
- university
description: Name a quadric surface (ellipsoid, hyperboloids of one and two sheets, cone, elliptic and hyperbolic paraboloids,
  cylinders) from its equation, by reading signs, completing the square or using the determinant of a cross term; describe
  the level sets f(x, y, z) = c; and find the curve in which a plane cuts a quadric, with its semi-axes or radius.
