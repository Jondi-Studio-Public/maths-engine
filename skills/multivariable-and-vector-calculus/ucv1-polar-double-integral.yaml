id: ucv1-polar-double-integral
name: Evaluate double integrals in polar coordinates
domain: multivariable-and-vector-calculus
description: >-
  Evaluate a double integral over a disc, half or quarter disc, or ring by converting to polar
  coordinates (dA = r dr dθ): radial integrands over whole discs, then angle-dependent
  integrands over sectors and rings, then iterated Cartesian integrals, Gaussian integrals and
  volumes under a paraboloid or a cone. The four-part exam chain finds the area, first moment
  and centroid of a quarter ring.
status: active
placement_eligible: false
prerequisites: [ucv1-double-integral-rectangle]
answer: number
sources:
