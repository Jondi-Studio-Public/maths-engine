misconceptions:
- id: diagonal-swap
  description: Reports the two diagonal entries transposed (f_yy, f_xy, f_yx, f_xx instead of f_xx, f_xy, f_yx, f_yy).
- id: off-diagonal-sign-error
  description: Reports the negation of both off-diagonal entries, a common differentiation sign slip on the mixed partial.
- id: first-derivative-instead-of-second
  description: Reports the JACOBIAN values (f_x, f_x, f_y, f_y) instead of the Hessian's second partial derivatives.
- id: point-ignored
  description: At medium/hard, reports the easy-tier-style constant Hessian as if the cubic term were absent, ignoring the evaluation point's contribution.
