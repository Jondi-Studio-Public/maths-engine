id: uc2-greens-theorem-area
name: Green's theorem for area
domain: multivariable-and-vector-calculus
year_level:
- university
description: Find the area enclosed by a curve by applying Green's theorem to a field whose curl is 1, such as the line
  integral of (x dy - y dx) / 2, using a parametrisation of the boundary.
status: active
placement_eligible: false
prerequisites:
- uc2-greens-theorem-circulation
answer: expression
