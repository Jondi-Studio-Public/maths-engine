id: uc2-multivariable-taylor-hessian
name: Multivariable Taylor polynomial and the Hessian
domain: multivariable-and-vector-calculus
year_level:
- university
description: Build and use the degree-2 Taylor polynomial of a function of two variables about a point, ½[fₓₓ(x−a)² + 2fₓᵧ(x−a)(y−b)
  + fᵧᵧ(y−b)²] added to the linear part, and use the Hessian at a stationary point to classify it, including for which values
  of a parameter the second-derivative test gives each verdict.
