id: uc2-surface-normal-parametrised
name: Normal vector to a parametrised surface
domain: multivariable-and-vector-calculus
year_level: [university]
description: 'Find the normal vector r_u x r_v to a surface given by a position vector in two parameters, from polynomial surfaces to cones, paraboloids, helicoids, spheres and surfaces of revolution, find the unit normal and the tangent plane constant at a point, and chain the normal''s z-component through its value and the z-intercept of the tangent plane.'
status: active
placement_eligible: false
prerequisites:
- vector-cross-product
- ucv1-vector-valued-derivative
answer: expression
