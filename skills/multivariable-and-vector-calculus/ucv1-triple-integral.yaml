id: ucv1-triple-integral
name: Evaluate a triple integral
domain: multivariable-and-vector-calculus
description: Evaluate an exact triple integral over a box, over a solid with a sloping top or a plane face, over a region given by inequalities, and use one for the volume, mass and centre of mass of a solid with a density.
status: active
