id: uc2-flux-through-graph-surface
name: Flux through a graph surface
domain: multivariable-and-vector-calculus
year_level:
- university
description: Find the flux of a vector field through a surface z = f(x, y) over a region of the plane, with the direction
  of the normal stated, by reducing it to a double integral over the base region.
status: active
placement_eligible: false
prerequisites:
- ucv1-double-integral-rectangle
- ucv1-line-integral
answer: expression
