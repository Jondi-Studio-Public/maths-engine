id: uc2-scalar-surface-integral
name: Scalar surface integral
domain: multivariable-and-vector-calculus
year_level: [university]
description: 'Evaluate the surface integral of a scalar function over a parametrised surface as the double integral of g(r(u, v)) times the length of r_u x r_v, over planes, cylinders, cones, spheres and triangular regions, find the mass of a thin sheet, and chain the area element of a spherical shell through its mass, area and average density.'
status: active
placement_eligible: false
