misconceptions:
- id: region-limits-swapped
  description: >-
    Writing the limits of the inner integral the wrong way round, so the answer comes out with the
    wrong sign.
- id: region-limits-swapped-outer
  description: >-
    Reversing the limits on one slice of a split region, so that slice is subtracted instead of
    added.
- id: region-bounding-rectangle
  description: >-
    Integrating over the rectangle that encloses the region instead of between its boundary
    curves.
- id: region-lower-curve-dropped
  description: >-
    Taking the lower boundary of the region as zero instead of the lower curve.
- id: region-limit-variable-confused
  description: >-
    Writing the limits in the wrong variable, so a limit in x is used where one in y is needed.
- id: region-second-slice-dropped
  description: >-
    Integrating over only the first slice of a region whose boundary changes, and leaving out the
    rest.
- id: region-slice-change-ignored
  description: >-
    Using one pair of boundary curves across the whole region although the lower or upper curve
    changes part-way.
- id: region-average-not-divided
  description: >-
    Giving the integral of the quantity over the region as its average value, without dividing by
    the area.
- id: triple-integral-density-term-dropped
  description: >-
    Taking the density as the constant term only, leaving out the variable part, when finding the
    mass.
- id: triple-integral-density-maximum
  description: >-
    Using the greatest density in the solid as if it applied everywhere, mass = (maximum density)
    x volume.
- id: triple-integral-density-midpoint
  description: >-
    Using the density halfway along its range instead of integrating the density over the solid.
- id: triple-integral-centroid-uniform
  description: >-
    Giving the centroid of the solid, as if the density were uniform, for the centre of mass.
- id: triple-integral-mass-not-divided
  description: >-
    Giving the mass where the average density, mass divided by volume, was asked for.
- id: triple-integral-moment-inverted
  description: >-
    Dividing the wrong way round: mass over moment, or volume over mass.
- id: triple-integral-moment-not-divided
  description: >-
    Giving the moment of the solid, the integral of x rho dV, as the centre-of-mass coordinate
    without dividing by the mass.
- id: triple-integral-wrong-coordinate
  description: >-
    Finding a different coordinate of the centre of mass from the one asked for.
