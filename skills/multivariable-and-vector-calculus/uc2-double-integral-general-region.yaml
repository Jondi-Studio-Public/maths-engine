id: uc2-double-integral-general-region
name: Evaluate a double integral over a general region
domain: multivariable-and-vector-calculus
year_level: [university]
description: >-
  Set up and evaluate a double integral over a region bounded by curves, not a rectangle: choose
  the order of integration, write the limits as functions of the outer variable, and split the
  region where the lower or upper boundary changes. Contexts run from the area between a parabola
  and a line, through mass, volume and average value, to a triangle that needs two slices, the
  lens between two parabolas, and a plate with a density whose area, mass, centre of mass and
  average density follow in turn.
status: active
placement_eligible: false
