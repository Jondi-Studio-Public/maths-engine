id: uc2-divergence-theorem-flux
name: The divergence theorem
domain: multivariable-and-vector-calculus
year_level:
- university
description: Find the outward flux of a vector field through a closed surface as the triple integral of its divergence over
  the solid, closing an open surface where needed.
status: active
