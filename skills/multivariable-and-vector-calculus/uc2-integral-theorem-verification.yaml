id: uc2-integral-theorem-verification
name: Verifying an integral theorem
domain: multivariable-and-vector-calculus
year_level:
- university
description: Check Green's, the divergence or Stokes' theorem on an example by working out both sides and giving the number
  on which they agree.
status: active
