misconceptions:
- id: jacobian-omitted
  description: >-
    Leaving out the Jacobian factor, so that dA is replaced by du dv.
- id: jacobian-inverted
  description: >-
    Using the Jacobian where its reciprocal is needed, or the reciprocal where the Jacobian is
    needed, when changing variables.
- id: jacobian-sign-ignored
  description: >-
    Using a negative Jacobian without taking its absolute value, so the area element and the
    answer come out negative.
- id: jacobian-sign-dropped
  description: >-
    Giving the absolute value of the Jacobian when its signed value was asked for.
- id: jacobian-cross-term-dropped
  description: >-
    Taking the Jacobian as the product of the two diagonal partial derivatives and leaving out the
    cross term of the determinant.
- id: jacobian-factor-slip
  description: >-
    Getting a constant in the Jacobian wrong, such as 1/v in place of 1/(2v) for x = √(u/v), y =
    √(uv).
- id: jacobian-variable-swapped
  description: >-
    Writing the Jacobian in terms of the wrong new variable.
- id: cov-integrand-not-substituted
  description: >-
    Changing the limits and the area element but leaving the integrand in x and y, or treating x
    and y as u and v.
- id: cov-limits-from-region
  description: >-
    Using the extent of the original region in x and y as the limits for the new variables u and
    v.
- id: cov-integrand-dropped
  description: >-
    Integrating 1 over the new region instead of the integrand, so the answer is the area.
- id: cov-inversion-slip
  description: >-
    Making a sign error when solving the substitution for x and y in terms of u and v.
- id: cov-triangle-as-rectangle
  description: >-
    Integrating over the square 0 ≤ u, v ≤ k instead of the triangle u + v ≤ k.
- id: triple-integral-density-term-dropped
  description: >-
    Taking the density as the constant term only, leaving out the variable part, when finding the
    mass.
- id: triple-integral-mass-not-divided
  description: >-
    Giving the mass where the average density, mass divided by volume, was asked for.
- id: triple-integral-moment-inverted
  description: >-
    Dividing the wrong way round: mass over moment, or volume over mass.
- id: triple-integral-moment-not-divided
  description: >-
    Giving the moment of the solid, the integral of x rho dV, as the centre-of-mass coordinate
    without dividing by the mass.
