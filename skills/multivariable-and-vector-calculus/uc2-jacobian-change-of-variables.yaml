id: uc2-jacobian-change-of-variables
name: Evaluate a double integral by a change of variables
domain: multivariable-and-vector-calculus
year_level: [university]
description: >-
  Evaluate a double integral over a region of the xy-plane by changing variables: find the
  Jacobian of the substitution or of its inverse, map the region to a rectangle or triangle in the
  uv-plane, rewrite the integrand and integrate, taking the absolute value of the Jacobian. Cases
  run from a linear map that carries a rectangle onto a parallelogram, through regions between
  four lines where only the inverse substitution is given, to hyperbolic coordinates whose
  Jacobian depends on v and whose answer involves a logarithm.
status: active
placement_eligible: false
