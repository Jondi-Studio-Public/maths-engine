id: ucv1-tangent-plane-linear-approximation
name: Find a tangent plane and use it to approximate a function
domain: multivariable-and-vector-calculus
description: >-
  For a surface z = f(x, y) given by a polynomial, a square-root surface or an implicit
  equation, find the tangent plane at a point from the partial derivatives (or the gradient) and
  use it: estimate f near the point, read off the plane's constant term or its intercept. The
  four-part exam chain runs from the two partial derivatives through the plane's equation to a
  numerical estimate.
status: active
placement_eligible: false
prerequisites: [partial-derivative-x, partial-derivative-y]
answer: number
