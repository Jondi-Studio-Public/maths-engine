id: uc2-cylindrical-triple-integral
name: Evaluate a triple integral in cylindrical coordinates
domain: multivariable-and-vector-calculus
year_level: [university]
description: >-
  Convert a solid described by Cartesian inequalities to cylindrical coordinates and evaluate a
  triple integral over it, with the factor r in dV, an exact answer in pi, and the volume, mass,
  centre of mass and average density of a solid with a density. Regions run from cylinders and
  paraboloid bowls, through the gap between a cone and a paraboloid, to a ball cut by a cylinder,
  a cylinder through the origin whose radius depends on the angle, and the space between two
  paraboloids.
status: active
placement_eligible: false
