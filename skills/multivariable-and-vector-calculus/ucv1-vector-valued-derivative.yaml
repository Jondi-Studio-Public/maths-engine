misconceptions:
- id: forgot-to-differentiate
  description: Returns the original function evaluated at t0, (x(t0), y(t0)), instead of the derivative.
- id: swapped-components
  description: Returns the pair in the wrong order, (y'(t0), x'(t0)).
- id: sign-error
  description: Negates one component of the correct derivative pair.
- id: product-rule-forgot-one-factor
  description: At the exam tier, differentiates a product component (t - p1)(t - q1) as if only one factor mattered, reporting (t - q1) alone instead of the full product-rule sum (t - q1) + (t - p1).
