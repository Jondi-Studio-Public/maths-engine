id: uc2-surface-area-parametric
name: Surface area of a parametrised surface
domain: multivariable-and-vector-calculus
year_level: [university]
description: 'Find the exact area of a parametrised surface as the double integral of the length of r_u x r_v, for planes over rectangles and triangles, cylinders, cones, spheres, paraboloids and tori, and chain the area element of a cone through its area to the cost of covering it.'
status: active
placement_eligible: false
prerequisites:
- uc2-surface-normal-parametrised
- ucv1-double-integral-rectangle
answer: expression
