id: uc2-greens-theorem-circulation
name: Green's theorem for circulation
domain: multivariable-and-vector-calculus
year_level:
- university
description: Find the circulation of a plane vector field round a closed curve, with the direction stated, by turning the
  line integral into a double integral of Q_x - P_y over the region inside.
status: active
placement_eligible: false
prerequisites:
- ucv1-double-integral-rectangle
- ucv1-line-integral
answer: expression
