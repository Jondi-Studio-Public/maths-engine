id: uc2-reverse-order-of-integration
name: Reverse the order of integration to evaluate a double integral
domain: multivariable-and-vector-calculus
year_level: [university]
description: >-
  Evaluate an iterated integral whose inner integral has no elementary antiderivative in the order
  given, by sketching the region of integration, reversing the order, and integrating the
  exponential, root or sine integrand after a substitution. Regions are bounded by a line, a
  parabola or a cubic through the origin, some are given as a triangle or a bounded curve instead
  of as limits, and the exam chain asks for the area, the reversed inner integral, the exact value
  and the mean value.
status: active
placement_eligible: false
