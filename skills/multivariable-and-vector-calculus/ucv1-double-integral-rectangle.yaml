misconceptions:
- id: sum-instead-of-product
  description: Adds the two one-variable integrals instead of multiplying them.
- id: forgets-lower-bound
  description: Evaluates each antiderivative only at its upper bound and multiplies
    those two values, never subtracting the lower-bound value.
- id: corner-value-times-area
  description: Treats the double integral as a single Riemann rectangle at one
    corner of the domain times the rectangle's area, instead of actually
    integrating.
- id: integrates-one-variable-only
  description: Integrates one factor correctly but treats the other as constant,
    multiplying by the interval's width instead of integrating it.
- id: drops-half-factor
  description: Skips the one-half from the power rule when integrating a bare
    linear factor, at the easy tier where the rectangle is anchored at the
    origin.
