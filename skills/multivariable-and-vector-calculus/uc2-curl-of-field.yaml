id: uc2-curl-of-field
name: Curl of a vector field
domain: multivariable-and-vector-calculus
year_level: [university]
description: 'Find the curl of a three-dimensional vector field at a point and as a triple of expressions, find unknown constants from the curl at a point, use the fact that a gradient has no curl, and chain the components of a vorticity into its magnitude.'
