misconceptions:
- id: vc2-chain-factor-dropped
  description: 'Differentiates a function of a function, such as sin(xz) or e^(xy), and leaves out the derivative of the inner function.'
- id: vc2-curl-components-shifted
  description: 'Writes the components of the curl in the wrong places, putting the k expression where the i expression belongs.'
- id: vc2-curl-factor-two-dropped
  description: 'Takes the curl of the rotation field ω × r to be ω instead of 2ω.'
- id: vc2-curl-gave-divergence
  description: 'Finds the divergence, a single number, instead of the curl, a vector.'
- id: vc2-curl-j-sign
  description: 'Expands the curl determinant without the minus sign on the j component, so the j component has the wrong sign.'
- id: vc2-curl-magnitude-component-dropped
  description: 'Uses only two of the three components when finding the magnitude.'
- id: vc2-curl-magnitude-not-rooted
  description: 'Gives the sum of the squares of the components as the magnitude, without taking the square root.'
- id: vc2-curl-magnitude-sum
  description: 'Adds the components, or their absolute values, instead of taking the root of the sum of squares.'
- id: vc2-curl-parameters-swapped
  description: 'Gives the two constants in the wrong order.'
- id: vc2-curl-partial-dropped
  description: 'Uses only one partial derivative in a component of the curl instead of the difference of two.'
- id: vc2-curl-partials-added
  description: 'Adds the two partial derivatives in a component of the curl instead of subtracting.'
- id: vc2-curl-reversed-order
  description: 'Subtracts the two partial derivatives in each component of the curl in the wrong order, so every sign is reversed.'
- id: vc2-curl-solve-sign
  description: 'Sets up the equations for the unknown constants correctly but gives a constant with the wrong sign.'
- id: vc2-curl-wrong-variables
  description: 'Differentiates with respect to the wrong variables in a component of the curl, such as R_z - Q_y for R_y - Q_z.'
