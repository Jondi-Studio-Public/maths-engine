id: uc2-conservative-field-potential
name: Conservative fields and potentials in space
domain: multivariable-and-vector-calculus
year_level: [university]
description: 'Use the zero-curl test for a field in three dimensions to find an unknown constant, find the scalar potential, and use the potential for the work between two points or along an awkward curve; the exam chain goes from the constant to the potential to two work values.'
status: active
placement_eligible: false
prerequisites:
- uc2-curl-of-field
- ucv1-line-integral
answer: expression
