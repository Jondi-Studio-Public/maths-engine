misconceptions:
- id: vc2-cons-coefficient-not-scaled
  description: 'Takes the unknown to be the coefficient in the potential, forgetting the factor that differentiating a power brings in.'
- id: vc2-cons-direction-sign
  description: 'Takes the potential difference the wrong way round, so the sign of the work is wrong.'
- id: vc2-cons-endpoint-field
  description: 'Takes the work to be the field at the end point dotted with the displacement.'
- id: vc2-cons-endpoints-added
  description: 'Adds the potential at the two endpoints instead of subtracting.'
- id: vc2-cons-forgot-initial-potential
  description: 'Gives the potential at the end point as the work, without subtracting the potential at the start.'
- id: vc2-cons-half
  description: 'Halves the answer, differentiating a squared factor with the wrong coefficient.'
- id: vc2-cons-off-by-one
  description: 'Slips by one in the arithmetic of the final value.'
- id: vc2-cons-potential-double-counted
  description: 'Adds the integrals of P, Q and R separately, counting every mixed term more than once.'
- id: vc2-cons-potential-one-variable-only
  description: 'Integrates P with respect to x and stops, so the terms in y and z alone are missing.'
- id: vc2-cons-potential-sign
  description: 'Writes the potential with the wrong sign.'
- id: vc2-cons-potential-third-component-ignored
  description: 'Matches the potential to P and Q but never checks R, so the terms in z alone are missing.'
- id: vc2-cons-power-factor-extra
  description: 'Multiplies by the wrong power when matching the mixed partial derivatives of the field.'
- id: vc2-cons-solve-sign
  description: 'Sets up the zero-curl condition correctly but gives the constant with the wrong sign.'
