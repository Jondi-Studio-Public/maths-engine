misconceptions:
- id: series-endpoints-both-included
  description: Including both endpoints in the interval of convergence without testing them.
- id: series-radius-reciprocal
  description: Giving the reciprocal of the radius of convergence, 1/R, as R (the ratio test limit read as the radius).
- id: series-radius-ignores-coefficient
  description: Ignoring the coefficient of x inside the bracket, so the radius is not divided by it.
- id: series-interval-centred-at-zero
  description: Centring the interval of convergence at 0 when the series is a power of (x - a) with a not 0.
- id: series-centre-sign-error
  description: Taking the centre of the series (x - a)ⁿ to be -a instead of a.
- id: series-endpoints-both-excluded
  description: Excluding both endpoints without testing them, or after testing only one of them.
- id: series-endpoints-swapped
  description: Including the wrong endpoint, because the alternating and the harmonic behaviour were attached to
    the wrong ends.
- id: series-radius-as-endpoint
  description: Giving the right-hand endpoint a + R of the interval as the radius of convergence R.
- id: series-geometric-sum-sign
  description: Getting the sign wrong in the common ratio of a geometric series, so the sum has the wrong denominator.
- id: series-geometric-first-term-only
  description: Giving the first term of a geometric series instead of its sum.
- id: series-radius-as-width
  description: Giving the length of the interval of convergence, 2R, as the radius R.
- id: series-geometric-factor-dropped
  description: Summing a geometric series without the factor of its first term (a/(1 - r) taken as 1/(1 - r)).
difficulty_progression: Easy is a geometric-type series centred at 0 where both endpoints fail, so the ratio test
  alone gives the answer. Medium shifts the centre and adds a coefficient on x and a power of n, so the ratio test
  must be solved as an inequality in x. Hard asks for the full interval, so each endpoint has to be tested against
  the harmonic series, an alternating series or the divergence test, and one end can be in while the other is out.
  The exam chain finds the radius, the open interval, the full interval, and a value of the derivative from a geometric
  series.
