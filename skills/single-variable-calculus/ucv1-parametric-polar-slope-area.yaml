id: ucv1-parametric-polar-slope-area
name: 'Parametric and polar curves: gradient and area'
domain: single-variable-calculus
year_level:
- university
description: Find gradients and second derivatives of curves given parametrically, gradients of polar curves, and exact
  areas enclosed by polar curves such as cardioids, lemniscates and rose petals.
