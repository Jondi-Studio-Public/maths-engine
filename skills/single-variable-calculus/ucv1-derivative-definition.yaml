misconceptions:
- id: evaluates-function-not-derivative
  description: Reports f(a) instead of f'(a).
- id: off-by-one-point
  description: Reports the correct derivative formula evaluated at a + 1 instead
    of a.
- id: h-not-taken-to-zero
  description: Uses the difference quotient at h = 1 instead of taking the limit,
    i.e. f(a+1) - f(a) rather than the true derivative.
- id: drops-linear-term
  description: Uses the derivative formula with its own linear coefficient dropped.
