id: ucv1-derivative-definition
name: Evaluate a derivative from its difference quotient
domain: single-variable-calculus
description: Evaluate a supplied polynomial derivative at a supplied point from an
  exact difference-quotient limit. The question states the limit definition
  f'(a) = lim(h->0) [f(a+h) - f(a)] / h directly and asks for the number f'(a);
  never a proof obligation, never the derivative as an expression -- that shape is
  differentiate-polynomial.
status: active
placement_eligible: false
prerequisites: [differentiate-polynomial]
answer: number
