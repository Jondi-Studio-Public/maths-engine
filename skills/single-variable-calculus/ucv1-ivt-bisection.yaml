misconceptions:
- id: fy1ca-ivt-wrong-end
  description: Gives the upper integer of the interval that holds the root when the lower one was asked for.
- id: fy1ca-bisection-wrong-half
  description: Keeps the half of the interval with no sign change, by reading the sign of f at the midpoint the
    wrong way.
- id: fy1ca-bisection-midpoint-reported
  description: Reports the midpoint just computed instead of the endpoint of the interval kept.
- id: fy1ca-bisection-stops-early
  description: Stops one bisection step early and reports that interval.
- id: fy1ca-bisection-off-by-one
  description: Counts the halvings but rounds the number of steps down or up by one.
- id: fy1ca-bisection-count-divided
  description: Divides the interval width by the tolerance instead of halving repeatedly.
- id: fy1ca-bisection-log-base-ten
  description: Counts decimal digits of width over tolerance instead of halvings (log base 10 where base 2 is needed).
- id: fy1ca-ivt-value-at-wrong-point
  description: Evaluates the function at an end of the interval when the midpoint was asked for.
