misconceptions:
- id: ignores-order-mismatch
  description: At easy tier, picks a decoy structure whose own order does not even match the stated |G|, without checking order first.
- id: matches-on-one-count-only
  description: Picks a structure that agrees with the profile on one element order but disagrees on another, instead of requiring the WHOLE profile to match.
- id: mistallies-a-supplied-list
  description: At the exam tier, mistallies the unsorted element-order list, arriving at a profile that does not actually match any offered structure (or matches the wrong one).
