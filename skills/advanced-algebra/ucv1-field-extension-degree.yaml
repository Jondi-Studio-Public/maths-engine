misconceptions:
- id: assumed-irreducible
  description: Reports a factorable polynomial's own full degree instead of the named root's degree, having never tested for a rational root or a hidden quadratic factorisation.
- id: trusts-the-rational-root-test
  description: Since the rational-root test finds nothing, assumes the polynomial is irreducible, missing a quartic that factors into two irreducible quadratics with no rational root at all (the biquadratic disguise).
- id: every-extension-is-quadratic
  description: Defaults to degree 2 for any factor that is not linear, regardless of the actual degree of the irreducible factor the named root belongs to.
- id: picks-the-wrong-named-root
  description: Reports the degree of a different root of the same polynomial than the one the question actually named (the largest real root's degree when asked for the smallest, or vice versa).
- id: assumes-two-independent-radicals-always-multiply-degrees
  description: For [Q(sqrt a, sqrt b):Q] or alpha = sqrt(a) + sqrt(b), always answers 4, missing the case where sqrt(ab) is itself rational and the extension collapses to degree 2.
