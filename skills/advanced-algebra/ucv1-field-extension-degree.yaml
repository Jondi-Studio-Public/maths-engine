id: ucv1-field-extension-degree
name: Compute the degree of a field extension of Q of degree at most 4
domain: advanced-algebra
description: Given a rational polynomial of degree at most 4 and a specified root alpha, or two rational numbers a and b, return [Q(alpha):Q] or [Q(sqrt a, sqrt b):Q] by deciding reducibility over Q.
status: active
placement_eligible: false
prerequisites: []
answer: number
