id: ucv1-ideal-membership
name: Test ideal membership by polynomial remainder
domain: advanced-algebra
year_level: [university]
description: >-
  Given four supplied polynomials, decide which one belongs to the principal ideal generated by a
  supplied monic polynomial, by exact remainder on division. The exam tier gives a polynomial known
  to lie in the ideal, with two unknown coefficients, and finds them by forcing the remainder to be
  zero, then evaluates the polynomial at a point.
status: active
placement_eligible: false
prerequisites:
- integer-polynomial-quotient-remainder
answer: mcq
