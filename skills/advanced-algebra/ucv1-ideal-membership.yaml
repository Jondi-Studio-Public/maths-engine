id: ucv1-ideal-membership
name: Test ideal membership by polynomial remainder
domain: advanced-algebra
description: Given four supplied polynomials, decide which one belongs to the principal ideal generated by a supplied monic polynomial, by exact remainder on division.
status: active
placement_eligible: false
prerequisites:
