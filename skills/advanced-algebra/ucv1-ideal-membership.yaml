misconceptions:
- id: factors-by-eye
  description: Attempts to spot a common factor by inspection instead of computing the exact remainder, missing a membership that is not visually obvious (or claiming one that is not real).
- id: picks-a-plausible-looking-option
  description: Picks the option that "looks like" a multiple of g(x) (e.g. shares an obvious factor) without actually dividing, rather than checking every candidate's remainder.
- id: mis-expands-before-dividing
  description: At the hard tier, expands the product-plus-remainder form incorrectly before dividing, propagating an arithmetic slip into the membership decision.
