misconceptions:
- id: reports-radius-as-diameter
  description: Reports the radius (not doubled) as the diameter answer, skipping the
    x2 step entirely. Always exercisable; the resulting value differs from the true
    diameter by exactly the radius, at least 2 at this skill's radius floor.
- id: circumference-direct-from-area
  description: Computes circumference directly from the DISPLAYED area using the wrong
    formula (circumference = 2 x pi x area) instead of going through the radius/diameter
    at all. Always exercisable and never coincidentally close -- this is dimensionally
    wrong (multiplies an area-scale quantity by 2 x pi rather than a length-scale one),
    so it is always far larger than the true circumference.
- id: diameter-formula-on-radius
  description: Uses the diameter-based circumference formula on the radius instead
    (circumference = pi x radius instead of pi x diameter), exactly half the true
    circumference. Always exercisable; the two never coincide at this skill's radius
    range.
- id: radius-not-square-rooted
  description: Divides the area by pi and stops, reporting r squared as the radius
    (or takes the square root of the area without dividing by pi).
- id: area-formula-as-circumference-formula
  description: Treats the area as 2 x pi x r when finding the radius, so divides the
    area by 2 x pi.
- id: arc-uses-full-circumference
  description: Reports the whole circumference as the arc length, ignoring the sector's
    angle.
- id: arc-angle-as-radians
  description: Multiplies the radius by the angle in degrees as if it were radians
    (arc = angle x r), giving a length far too large.
- id: sector-area-for-arc
  description: Finds the sector's area (angle/360 x pi x r squared) when asked for
    its arc length.
- id: arc-fraction-inverted
  description: Uses 360/angle of the circumference instead of angle/360 of it.
tags: [measurement, multi-part, circle, reverse-from-area]
