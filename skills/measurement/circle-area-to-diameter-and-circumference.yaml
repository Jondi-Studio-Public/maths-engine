id: circle-area-to-diameter-and-circumference
name: Find a circle's diameter and circumference from its area
domain: measurement
description: Given ONE circle's area (stated to 2 decimal places), find two independently
  graded answers in one question -- diameter (2 x radius, always exact) and circumference
  (2 x pi x radius, stated to 1 decimal place) -- working BACKWARDS through a square root
  (radius = sqrt(area / pi)). The radius is drawn directly, from integers 2-20, and every
  canonical quantity is computed from that exact radius using true pi
  (Fraction(math.pi)), never by re-deriving from the rounded displayed area; the round-trip
  from the rounded displayed area back through the square root to the canonical
  diameter/circumference is proved clean for every one of the 19 possible radii
  (an exam-style item).
status: active
placement_eligible: false
