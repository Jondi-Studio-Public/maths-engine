misconceptions:
- id: picks-ten-times-too-large
  description: Selects the option that is exactly ten times the plausible estimate, as if an extra zero had been added during unit conversion.
- id: picks-ten-times-too-small
  description: Selects the option that is exactly one tenth of the plausible estimate, as if a zero had been dropped during unit conversion.
- id: picks-hundred-times-too-large
  description: Selects the option that is exactly a hundred times the plausible estimate, confusing the asked unit with one two metric steps removed (e.g. grams where kilograms was asked, or the reverse).
