misconceptions:
- id: uses_perimeter_for_area
  description: States the perimeter when area is asked (or vice versa).
- id: uses_area_for_perimeter
  description: States the area when perimeter is asked.
- id: adds_notch_instead_of_subtracts
  description: Adds the notch area instead of subtracting it from the bounding rectangle.
- id: ignores_notch
  description: Forgets to account for the notch and uses only the bounding rectangle area.
- id: subtracts_notch_perimeter
  description: Subtracts the notch's perimeter from the bounding rectangle's perimeter, incorrectly assuming the notch reduces the total perimeter.
