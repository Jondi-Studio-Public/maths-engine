misconceptions:
- id: omits-a-component
  description: Drops one of the shape's components entirely from the sum or difference, undercounting (or overcounting in the subtractive case) by exactly that component's area.
- id: wrong-operation
  description: For subtractive decomposition (hard tier), adds the cut-out piece instead of subtracting it.
- id: double-counts-shared-region
  description: In additive decomposition, counts a shared boundary or overlap region twice.
