- topic: compare_capacity_by_cups
  difficulty: hard
  stages: [5, 6, maintenance]
misconceptions:
- id: taller-holds-more
  description: Picks the tallest container instead of counting the cups it filled.
- id: same-height-same-capacity
  description: Says two containers hold the same because they stand equally tall, when they fill different numbers of cups.
- id: reads-least-as-most
  description: Answers the opposite question, giving the container that holds the most when asked for the least or the reverse.
- id: miscounts-the-cups
  description: Counts one cup too many or too few, so two close containers swap places.
