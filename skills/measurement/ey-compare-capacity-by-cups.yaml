id: ey-compare-capacity-by-cups
name: Compare capacity by pouring into small cups
domain: measurement
year_level: ['1']
naplan_domain: [measurement]
learner_band: early
description: Compare containers of different shapes by counting how many small cups each one fills when poured out, saying which holds more, which holds less and which two hold the same.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
read_aloud: true
prerequisites: [f10-compare-measurement-attributes]
answer: mcq
sources:
- topic: compare_capacity_by_cups
  difficulty: easy
  stages: [0, 1, 2]
- topic: compare_capacity_by_cups
  difficulty: medium
