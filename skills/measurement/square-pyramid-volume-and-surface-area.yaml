id: square-pyramid-volume-and-surface-area
name: Find the volume and total surface area of a square-based pyramid from its base side and perpendicular height
domain: measurement
description: Given ONE square-based pyramid's base side and PERPENDICULAR height (never a
  slant height), find two independently graded answers -- volume and total surface area
  (base square plus four congruent lateral triangular faces) -- deriving the slant height
  via Pythagoras internally. DISTINCT from
  senior-find-the-surface-area-of-pyramids-such-as -- that skill is surface-area-only and
  covers general (square/rectangular/right-triangle) base shapes; this skill is a new,
  separate, COMBINED volume-and-surface-area pairing restricted specifically to a square
  base (an exam-style item). The base side and perpendicular height are always drawn
  as the two legs of a curated Pythagorean triple, so the slant height, the volume and the
  surface area are all exact values with zero rounding at every tier.
