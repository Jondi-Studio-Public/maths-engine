misconceptions:
- id: uses-apex-height-as-slant-height
  description: Plugs the given perpendicular (apex) height straight into the surface-area
    formula instead of first deriving the slant height via Pythagoras. Exercisable against
    the surface_area part only; the volume part is unaffected since it uses the
    perpendicular height directly and correctly. Always exercisable -- the slant height is
    always strictly greater than the perpendicular height, so the resulting surface area
    always differs from the true value by construction.
- id: omits-base-square
  description: Sums only the four triangular lateral faces and omits the base square from
    the total surface area. Exercisable against the surface_area part only. Always
    exercisable -- the resulting value is always short of the true surface area by exactly
    the base area, which is always positive.
- id: no-half-factor-on-laterals
  description: Uses side times slant height per triangular face instead of one-half times
    side times slant height, doubling the lateral area. Exercisable against the
    surface_area part only. Always exercisable -- the resulting value always exceeds the
    true surface area by exactly the (positive) lateral area.
- id: no-third-factor-on-volume
  description: Uses base-area times height instead of one-third times base-area times
    height for the volume, treating the pyramid as a prism. Exercisable against the volume
    part only. Always exercisable -- the resulting value is always exactly three times the
    true volume, which is always positive.
- id: uses-slant-height-as-perpendicular-height
  description: Uses the slant height of a triangular face in place of the perpendicular
    height in the volume formula, so finds (1/3) x base area x slant height. Exercisable
    against a volume part only. Always exercisable -- the slant height always exceeds the
    perpendicular height, so the volume is always too large.
- id: uses-half-not-third-on-volume
  description: Uses one half instead of one third as the pyramid volume factor. Exercisable
    against a volume part only. Always exercisable -- the result is always one and a half
    times the true volume.
- id: adds-instead-of-subtracts-in-pythagoras
  description: Adds the squares of the slant height and the half base side to get the
    squared perpendicular height, instead of subtracting, because the slant height is the
    hypotenuse. Exercisable against the h-squared part only. Always exercisable -- the
    sum always exceeds the difference.
- id: uses-whole-base-side-not-half
  description: Subtracts the square of the whole base side, not the half base side, from the
    squared slant height when finding the squared perpendicular height. Exercisable against
    the h-squared part only, whenever the result is positive.
- id: forgets-to-subtract-the-half-base-squared
  description: Gives the squared slant height as the squared perpendicular height, leaving
    out the subtraction of the squared half base side. Exercisable against the h-squared part
    only. Always exercisable -- the half base side is always positive.
- id: scales-volume-by-k
  description: Multiplies the volume by the length scale factor k instead of by k cubed.
    Exercisable against a scaled-volume part only. Always exercisable -- k and k cubed differ
    for k = 2, 3 and 1/2.
- id: scales-volume-by-k-squared
  description: Multiplies the volume by k squared (the area scale factor) instead of k cubed.
    Exercisable against a scaled-volume part only. Always exercisable for k = 2, 3 and 1/2.
- id: forgets-volume-changes-when-scaled
  description: Gives the original volume as the volume of the scaled solid. Exercisable
    against a scaled-volume part only. Always exercisable -- k cubed is never 1 here.
