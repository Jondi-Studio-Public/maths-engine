misconceptions:
- id: adds-instead-of-multiplies
  description: Treats AP + PB as equal to CP + PD instead of applying the product rule.
- id: pairs-the-wrong-two-lengths
  description: Pairs a segment with the wrong chord's segment (e.g. AP with CP) instead of pairing the two intervals on the same chord.
- id: forgets-to-convert
  description: On the medium tier, uses the mismatched-unit length's raw number directly instead of converting it to the other lengths' unit first.
