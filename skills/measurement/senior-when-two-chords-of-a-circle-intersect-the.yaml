id: senior-when-two-chords-of-a-circle-intersect-the
name: When two chords of a circle intersect, the product of the lengths of the intervals on one chord equals the product of the lengths of the intervals on the other chord
domain: measurement
description: Given bounded, fully specified inputs, When two chords of a circle intersect, the product of the lengths of the intervals on one chord equals the product of the lengths of the intervals on the other chord. Return the resulting value, expression, relation, or classification.
status: active
placement_eligible: false
prerequisites: [convert-metric-length]
answer: number
sources:
- topic: when_two_chords_of_a_circle_intersect_the_product
  params: {variant: direct}
  difficulty: easy
  stages: [0, 1, 2]
- topic: when_two_chords_of_a_circle_intersect_the_product
  params: {variant: convert}
  difficulty: medium
