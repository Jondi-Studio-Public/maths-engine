id: f10-measure-uniform-informal-units
name: Measure length with uniform informal units
domain: measurement
year_level: ['1', '2']
naplan_domain: [measurement]
description: Find the length of an object from identical informal units (paper clips, cubes, footprints) laid end to end along it, including a part unit and the difference between two objects, and decide whether a measurement is fair when the units leave gaps, overlap or differ in size.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
read_aloud: true
placement_eligible: false
prerequisites: [f10-compare-order-measure-attributes]
answer: mcq
sources:
- topic: informal_units_measure
  params: {tier: easy}
  difficulty: easy
  stages: [0, 1, 2]
- topic: informal_units_measure
  params: {tier: medium}
  difficulty: medium
  stages: [3, 4]
- topic: informal_units_measure
  params: {tier: hard}
  difficulty: hard
  stages: [5, 6, maintenance]
misconceptions:
- id: ignores-part-unit
  description: Drops the part of a unit at the end of the object and reports the whole units only.
- id: part-unit-as-whole
  description: Counts a unit that is only half covered as a whole unit.
- id: adds-not-subtracts
  description: Adds the two lengths when asked how many more one is than the other.
- id: count-off-by-one
  description: Is one out by counting the end marks, or the gaps between units, instead of the units.
- id: ignores-gaps-overlaps
  description: Counts the units without noticing that gaps or overlaps make the count the wrong length.
