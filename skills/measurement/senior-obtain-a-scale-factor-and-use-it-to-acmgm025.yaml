id: senior-obtain-a-scale-factor-and-use-it-to-acmgm025
name: Obtain a scale factor and use it to solve surface area and volume scaling problems
domain: measurement
year_level: ['11']
description: Given bounded, fully specified inputs, obtain a scale factor and use it to solve scaling problems involving the calculation of surface areas and volumes of similar solids. Return the resulting value, expression, relation, or classification.
status: active
placement_eligible: false
prerequisites: [convert-metric-length]
answer: number
sources:
- topic: scale_factor_similar_solids
  params: {mode: direct_ratio}
  difficulty: easy
  stages: [6]
- topic: scale_factor_similar_solids
  params: {mode: derive_from_lengths}
  difficulty: medium
  stages: [6]
- topic: scale_factor_similar_solids
  params: {mode: cross_exponent}
  difficulty: hard
  stages: [6, maintenance]
- topic: exd_x_m5_scale_model_chain
  params: {tier: exam}
  difficulty: exam
  stages:
  - exam
misconceptions:
- id: uses-wrong-exponent
  description: Applies the wrong exponent to the scale factor, confusing surface area scaling (k²) with volume scaling (k³) or vice versa -- the signature trap this skill tests.
- id: forgets-to-scale
  description: Misinterprets "similar" to mean "equal quantity", assuming Solid B's surface area or volume is the same as Solid A's rather than applying the scale factor.
- id: uses-linear-factor-only
  description: Forgets to raise the scale factor to the required power, applying the linear ratio once instead of squared (for area) or cubed (for volume).
- id: uses-area-exponent-on-volume
  description: In hard tier (areas_to_volume), applies the area exponent (2) to derive volume instead of first getting the linear ratio from areas (square root) then cubing it.
- id: confuses-area-for-volume
  description: Confuses a stated surface area with a volume, or vice versa, treating one as if it were the other (hard tier only).
- id: uses-volume-exponent-on-area
  description: In hard tier (volumes_to_area), applies the volume exponent (3) to derive surface area instead of first getting the linear ratio from volumes (cube root) then squaring it.
- id: confuses-volume-for-area
  description: Confuses a stated volume with a surface area, or vice versa, treating one as if it were the other (hard tier only).
tags: [acara-senior-v8-4, measurement, scale-factor, similar-solids, volume, surface-area, acmgm025]
