misconceptions:
- id: omits-apex-removal
  description: Uses the whole big pyramid's volume, (1/3) x base area x total apex height,
    without subtracting the removed small pyramid at the top -- always strictly greater than the
    true frustum volume.
- id: treats-as-prism
  description: Ignores the taper entirely and multiplies the base area by the frustum height, as
    if the solid were a prism rather than a frustum -- always strictly greater than the true
    volume.
- id: uses-mean-area-slab
  description: Uses the arithmetic mean of the two face areas times the height, h x (A1 + A2) / 2,
    instead of the true h/3 x (A1 + A2 + sqrt(A1*A2)) relation -- close for a shallow frustum but
    always strictly greater than the true volume, since the arithmetic mean of two different areas
    always exceeds their geometric mean.
