id: rectangular-frustum-volume
name: Find the volume of a rectangular frustum
domain: measurement
description: Find the volume of a rectangular frustum (a rectangular pyramid with its apex sliced
  off by a plane parallel to the base) via the removed-apex construction -- the full pyramid's
  volume minus the removed small pyramid's volume, recovered by similar triangles. Four tiers
  escalate the reasoning, not the number range -- easy applies the relation directly from a given
  bottom, top and height; medium derives the top rectangle from a stated linear scale ratio; hard
  derives the frustum height from a given total apex height via similar triangles; the exam tier
  stacks both derivations and states the answer to 2 decimal places.
status: active
placement_eligible: false
prerequisites:
- senior-use-formulas-to-find-the-volume-of-pyramids
answer: number
