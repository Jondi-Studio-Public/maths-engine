  params: {}
  difficulty: easy
  stages: [0, 1, 2]
- topic: grid_scale_materials
  params: {}
  difficulty: medium
  stages: [3, 4]
- topic: grid_scale_materials
  params: {}
  difficulty: hard
  stages: [5, 6, maintenance]
misconceptions:
- id: rounds-down
  description: "Rounds the number of packs down or to the nearest whole, so there is not enough material."
- id: uses-plan-measurements
  description: "Works out the packs from the area or perimeter measured on the plan, or from the linear factor, without squaring it."
- id: wrong-measure
  description: "Uses the perimeter where an area was needed, or leaves out a side of the boundary."
- id: compares-unrounded-cost
  description: "Compares the costs without rounding to whole packs, or gives a total cost or a price difference instead of the saving."
