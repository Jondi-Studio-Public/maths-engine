misconceptions:
- id: conversion-direction
  description: Multiplies when it should divide (or vice versa).
- id: assumes-factor-ten
  description: Applies a factor of 10 (or 10x too small/large) regardless of the actual factor between the two units.
- id: forgets-to-convert
  description: Combines the two stated raw numeric values directly, ignoring the unit mismatch (hard tier only).
- id: converts-wrong-operand
  description: Converts the other operand instead of the one that actually needs converting (hard tier only).
