misconceptions:
- id: dashed-read-as-built
  description: Treats a dashed outline as an ordinary built feature and names a solid-outlined feature instead.
- id: direction-reversed
  description: Gives the direction from the second feature to the first, so north-east becomes south-west.
- id: east-west-swapped
  description: Swaps east and west, or reads left as east, so the horizontal part of the direction is mirrored.
- id: north-south-swapped
  description: Swaps north and south, treating the top of the page as south or ignoring the north arrow.
- id: solid-and-dashed-swapped
  description: Takes the area of the solid outline when the proposed building is asked for, or the dashed one when the existing building is asked for.
- id: perimeter-for-area
  description: Adds the dimensions around the shape instead of multiplying length by width.
- id: mixes-dimensions-of-two-shapes
  description: Multiplies a dimension of one building by a dimension of the other.
- id: counts-squares-not-dimensions
  description: Counts grid squares and ignores the dimension labels and the scale, so the area is in squares, not square metres.
