id: rectangle-area-perimeter-three-units
name: Find a rectangle's perimeter and area in three units from its mm side lengths
domain: measurement
description: Given ONE rectangle whose two side lengths are stated in mm, find three
  independently graded answers in one question -- perimeter_mm (the perimeter, in mm,
  native unit, no conversion), area_cm2 (the area converted mm² -> cm², divide by 100)
  and area_m2 (the area converted mm² -> m², divide by 1,000,000). The phrase "one rectangle in mm -> area and perimeter in mm², cm², m²" is read this way, because a squared-perimeter
  reading is not sensible -- perimeter stays in its native mm unit and only the two area
  answers carry a unit conversion (an exam-style item). Side lengths are drawn
  1200-9000 mm (genuinely metre-scale panel/room dimensions) specifically so the raw
  area_m2 never falls below 1.44 m², clear of the fixed 0.051 pair-answer tolerance.
