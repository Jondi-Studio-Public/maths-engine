misconceptions:
- id: mm2-to-cm2-uses-ten
  description: Divides the mm² area by 10 instead of 100 when converting to cm² -- the
    classic linear-conversion-factor error applied to a squared unit. Always exercisable;
    the resulting value differs from the true area_cm2 by roughly a factor of 10.
- id: perimeter-area-formula-swap
  description: Computes perimeter_mm using the area formula (length x width) instead of
    the perimeter formula (2 x (length + width)). Always exercisable; the two formulas
    never coincide at this skill's side-length range.
- id: mm2-to-m2-linear-factor
  description: Forgets the squared-unit conversion factor for area_m2 entirely and divides
    the mm² area by 1,000 (the LINEAR mm-to-m factor) instead of 1,000,000 (the correct
    SQUARED factor), treating an area conversion as if it were a linear one. Always
    exercisable; the resulting value differs from the true area_m2 by roughly a factor of
    1,000.
