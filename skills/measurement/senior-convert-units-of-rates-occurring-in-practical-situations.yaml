misconceptions:
- id: skips-unit-conversion
  description: Uses the rate in its original unit against a quantity stated in a different unit, without converting first.
- id: wrong-conversion-direction
  description: Multiplies by the conversion factor where dividing was needed, or vice versa.
- id: stops-after-converting
  description: Converts the rate correctly but reports the bare converted rate itself, never completing the further computation (distance/time/consumption/cost) the question actually asks for.
- id: incomplete-compound-reduction
  description: On the hard tier, performs only one of the two required reduction/conversion steps -- drops the internal compound-unit reduction, or drops the cross-unit conversion.
- id: single-rate-only
  description: On the exam tier, uses only one of the two independent rates, omitting the price or the consumption rate entirely from the final computation.
