misconceptions:
- id: ignores_inner_circle
  description: Reports pi times the outer radius squared, dropping the inner circle (the hole) entirely.
- id: subtracts_radii_first
  description: Subtracts the inner radius from the outer radius first, then squares the result, instead of squaring each radius before subtracting.
- id: adds_instead_of_subtracts
  description: Adds the squares of the outer and inner radii instead of subtracting the inner from the outer.
