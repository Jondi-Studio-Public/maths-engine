id: annulus-cross-section-area
name: Calculate the cross-sectional area of an annulus
domain: measurement
description: Given a hollow shaft, pipe or washer's outer and inner radii (or
  diameters, or an outer diameter with a wall thickness), calculate the area
  of its annular cross-section as pi times the outer radius squared minus the
  inner radius squared. Using pi (roughly) 3.14159, answers stated to 1
  decimal place.
status: active
placement_eligible: false
prerequisites: [f10-circle-measures]
answer: number
