id: sector-area-and-arc-from-degrees
name: Find the area and arc of a sector from an angle in degrees
domain: measurement
year_level: ['11', '12']
description: Use a sector's centre angle in degrees. Easy finds the area from the radius and angle. Medium finds the arc length
  or the perimeter. Hard finds the radius from the area, the angle from the arc length, or the area of a curved path between
  two arcs. The exam chain finds the sector's area, arc length and perimeter, and the area of the rest of the circle.
status: active
placement_eligible: false
prerequisites:
- circle-area-to-diameter-and-circumference
- f10-circle-measures
answer: number
