misconceptions:
- id: metre-centimetre-slip
  description: "Slips by a power of ten when converting between metres and centimetres, so 1 cm : 2 m becomes 1 : 20 or 1 : 2000."
- id: reads-label-as-scale
  description: "Gives the labelled actual length, or the length counted on the plan, as the scale."
- id: multiplies-instead-of-divides
  description: "Multiplies the actual length by the scale to get the drawn length instead of dividing."
- id: actual-length-unscaled
  description: "Gives the actual length as the drawn length, or slips a power of ten in the conversion."
tags: [acara-senior-v8-4, measurement, grid_scale_conventions, acmem111, scale-drawings, scale-ratio, dimensions]
difficulty_progression:
  easy:
    steps: 1
    demand: "Convert between a scale written 1 cm : k m and the ratio 1 : n."
  medium:
    steps: 2
    demand: "Find the scale from one wall labelled with its actual length."
  hard:
    steps: 3
    demand: "Find the scale from a labelled wall, then the drawn length of a stated real length."
  exam:
    steps: 5
    demand: "Chain the scale from a labelled wall, the ratio 1 : n, the drawn length of a fence and the actual perimeter."
