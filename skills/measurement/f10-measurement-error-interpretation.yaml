misconceptions:
- id: uses_signed_difference
  description: For absolute error, reports the signed difference instead of the absolute value.
- id: swapped_numerator_denominator
  description: For relative or percentage error, divides by the measured value instead of the true value.
- id: omits_percent_scaling
  description: For percentage error, reports the relative decimal value instead of the percentage integer.
- id: wrong_error_type
  description: For hard tier, computes one of the other error types instead of the one asked for.
