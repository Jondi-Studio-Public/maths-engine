id: senior-use-addition-of-the-area-of-the-faces
name: Use addition of the area of the faces of solids to find the surface area of irregular solids
domain: measurement
description: Given bounded, fully specified inputs, use addition of the area of the faces of solids to find the surface area of irregular solids. Return the resulting value, expression, relation, or classification.
status: active
placement_eligible: false
prerequisites: [convert-metric-length]
answer: number
