id: senior-use-formulas-to-calculate-areas-of-regular-shapes
name: Use formulas to calculate areas of regular shapes
domain: measurement
year_level: ['12']
description: Given bounded, fully specified inputs, use formulas to calculate areas of regular shapes, including triangles, squares, rectangles, parallelograms, trapeziums, circles and sectors. Return the resulting value, expression, relation, or classification.
status: active
placement_eligible: false
prerequisites: [convert-metric-length]
answer: number
sources:
- topic: use_formulas_to_calculate_areas
  params: {mode: rectangle_square}
  difficulty: easy
  stages: [6]
- topic: use_formulas_to_calculate_areas
  params: {mode: triangle_parallelogram}
  difficulty: medium
  stages: [6]
- topic: use_formulas_to_calculate_areas
  params: {mode: trapezium}
  difficulty: hard
  stages: [6, maintenance]
- topic: exd_x_m5_rectangle_semicircle_chain
  params: {tier: exam}
  difficulty: exam
  stages:
  - exam
misconceptions:
- id: uses-perimeter
  description: Sums the dimensions (sides, base, height) instead of applying the area formula.
- id: omits-half-factor
  description: For triangle or trapezium, applies the base and height (or the two parallel sides and height) without the 1/2 factor.
- id: uses-one-parallel-side
  description: For trapezium, uses only one of the two parallel sides instead of their average when computing the area.
