misconceptions:
- id: area-as-derivative
  description: Gives F(x0), the signed area from a to x0, instead of the height f(x0) that is the derivative of the area function.
- id: lower-limit-height
  description: Reads the graph at the lower limit t = a instead of at x = x0.
- id: slope-of-f
  description: Gives the gradient of the graph of f at x0 instead of its height.
- id: sign-dropped
  description: Reads the correct distance from the axis but ignores that the curve lies below the x-axis, giving a positive value.
- id: limit-order
  description: Believes the derivative changes sign or value when the lower limit lies to the right of x0.
- id: other-function
  description: Reads the height of the other curve in the picture instead of the function F is built from.
