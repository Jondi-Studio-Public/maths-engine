id: senior-find-actual-measurements-from-scale-drawings-such-as
name: Find actual measurements from scale drawings, such as lengths, perimeters and areas
domain: measurement
year_level: ['12']
description: 'Given a plan drawn on a square grid (one square is 1 cm) with its scale written as `1 cm : 2 m` or as a ratio `1 : 200`, find the actual measurement. Easy finds one actual length of a rectangle. Medium finds the actual perimeter of an L-shaped or U-shaped room. Hard finds the actual area in square metres, where the area scales by the square of the factor.'
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites: [rectangle-perimeter, rectangle-area, convert-metric-length]
answer: number
sources:
- topic: grid_scale_actual
  params: {}
  difficulty: easy
  stages: [0, 1, 2]
- topic: grid_scale_actual
  params: {}
  difficulty: medium
  stages: [3, 4]
- topic: grid_scale_actual
  params: {}
  difficulty: hard
  stages: [5, 6, maintenance]
- topic: exd_x_w7f_scale_actual_chain
  params: {tier: exam}
  difficulty: exam
  stages: [exam]
misconceptions:
- id: uses-drawn-length
  description: "Gives the length, perimeter or area measured on the plan and never applies the scale."
- id: leaves-out-a-side
  description: "Adds all but one side of the room when finding the perimeter, or treats the perimeter as half of the sum of the sides."
- id: area-times-linear-factor
  description: "Multiplies the area on the plan by the linear scale factor instead of its square."
- id: unit-slip
  description: "Gives the answer in centimetres or square centimetres when metres or square metres were asked for, or reads the ratio as metres."
tags: [acara-senior-v8-4, measurement, grid_scale_actual, acmem109, scale-drawings, scale, perimeter, area]
difficulty_progression:
  easy:
    steps: 2
    demand: "Read one wall of a rectangular plan and multiply by the scale."
  medium:
    steps: 3
    demand: "Add every wall of an L- or U-shaped plan, then apply the scale."
  hard:
    steps: 4
    demand: "Find the area on the plan and scale it by the square of the scale factor."
  exam:
    steps: 6
    demand: "Chain the longest wall, the perimeter, the area and the cost of covering the floor, all from one L- or U-shaped plan."
