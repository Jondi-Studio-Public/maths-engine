id: ey-compare-by-paper-clips
name: Compare lengths by counting paper clips
domain: measurement
year_level: ['1']
naplan_domain: [measurement]
learner_band: early
description: Compare objects that are not lined up by counting the paper clips or blocks laid along each one, saying which is longer or shorter and which two are the same length.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
read_aloud: true
prerequisites: [compare-lengths]
answer: mcq
sources:
