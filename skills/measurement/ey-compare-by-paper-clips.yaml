misconceptions:
- id: judges-by-where-it-ends
  description: Picks the object whose end reaches furthest right instead of counting the units along each one.
- id: same-end-means-same-length
  description: Says two objects are the same length because they stop at the same place, when one started further along.
- id: reads-shortest-as-longest
  description: Answers the opposite question, giving the longest when asked for the shortest or the reverse.
- id: miscounts-a-unit
  description: Counts one unit too many or too few along an object, so two close lengths swap places.
