id: f10-volume-surface-area-prisms-cylinders
name: Calculate volume and surface area of prisms and cylinders
domain: measurement
year_level: ['9', '10']
description: Given a right prism or cylinder's supplied dimensions, calculate its volume or surface area, reporting the result with appropriate units.
status: active
placement_eligible: false
prerequisites:
  - f10-circle-measures
  - f10-triangular-prism-volume
answer: number
sources:
  - topic: volume_surface_area_prisms_cylinders
    params: {}
    difficulty: easy
    stages: [0, 1, 2]
  - topic: volume_surface_area_prisms_cylinders
    params: {}
    difficulty: medium
    stages: [3, 4]
  - topic: volume_surface_area_prisms_cylinders
    params: {}
