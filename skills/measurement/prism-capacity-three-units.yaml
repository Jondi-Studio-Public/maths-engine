id: prism-capacity-three-units
name: Find a rectangular prism's capacity in cubic metres, cubic centimetres and litres
domain: measurement
description: Given ONE rectangular prism's three dimensions in MIXED units (length in
  m, width in cm, height in mm), find its capacity in cubic metres (m3), cubic
  centimetres (cm3) and litres (L) in a single question -- three independently graded
  answers. The learner must convert every dimension to a common unit before
  multiplying; that conversion is the reasoning content of the skill, not incidental
  (an exam-style item).
status: active
placement_eligible: false
prerequisites:
- rectangular-prism-volume
- convert-metric-length
- convert-metric-capacity
answer: pair
