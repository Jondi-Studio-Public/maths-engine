misconceptions:
- id: wrong-order-of-magnitude
  description: Converts cm3 to m3 by dividing by 1000 (the litres factor) instead of
    1,000,000, landing on the same number as the correct litres answer. Always
    exercisable -- the prism is constructed so volume_cm3 is always in the millions,
    keeping this thousands away from the true m3 value.
- id: reports-unconverted-volume
  description: Multiplies the three dimensions' raw stated numbers directly (the
    metre-number, the centimetre-number and the millimetre-number), skipping the
    unit-conversion step entirely, and reports that as the cm3 answer. Always a tenth
    of the true cm3 value by this skill's fixed construction.
- id: confuses-L-and-cm3-factor
  description: Reports the cm3 figure again under the L label, treating the two units
    as numerically interchangeable. Always wrong by roughly a thousandfold, since L is
    always cm3 / 1000.
tags: [measurement, capacity, conversion, multi-part]
