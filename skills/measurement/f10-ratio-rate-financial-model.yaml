misconceptions:
- id: representation-swap
  description: Reads a ratio split as a rate (or a rate as a ratio), computing with the wrong representation's formula.
- id: part-swap
  description: Uses the wrong share of a ratio split (e.g. the smaller share instead of the larger one asked for).
- id: rate-inversion
  description: Divides by the rate instead of multiplying, or vice versa.
- id: decimal-shift
  description: Shifts the decimal point one place too far (a value ten times too large).
- id: ignores-quantity
  description: Reports the stated per-unit rate itself as the total cost, ignoring the quantity entirely.
- id: misapplies-total-parts
  description: Treats only two of a three-way ratio's parts as the whole, ignoring that a third share also exists.
- id: forgets-adjustment
  description: Computes the rate x quantity total correctly but ignores a further flat adjustment (discount or surcharge).
- id: wrong-sign-adjustment
  description: Applies a flat adjustment in the wrong direction (adds a discount instead of subtracting it, or vice versa).
- id: naive-uncorrected
  description: Applies the named representation to the full headline figure without first removing a flat fee or free-unit correction the scenario actually requires.
