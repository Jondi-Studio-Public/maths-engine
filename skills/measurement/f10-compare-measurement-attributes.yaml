id: f10-compare-measurement-attributes
name: Compare mass and capacity directly
domain: measurement
year_level: [F, '1']
naplan_domain: [measurement]
learner_band: early
description: Use a pan balance to say which object is heavier or lighter, and look at containers to say which holds more or less, including when the tall container is not the one that holds most and when the water level misleads.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
read_aloud: true
prerequisites: [compare-lengths]
answer: mcq
sources:
- topic: compare_mass_capacity_picture
  difficulty: easy
  stages: [0, 1, 2]
- topic: compare_mass_capacity_picture
  difficulty: medium
  stages: [3, 4]
- topic: compare_mass_capacity_picture
  difficulty: hard
  stages: [5, 6, maintenance]
misconceptions:
- id: bigger-is-heavier
  description: Says the bigger-looking object is the heavier one, when the balance shows the smaller one is heavier.
- id: more-things-is-heavier
  description: Says the side with more blocks is heavier, without reading which way the balance tips.
- id: taller-holds-more
  description: Says the tallest container holds the most, ignoring how wide the others are.
- id: higher-water-is-more
  description: Says the container where the water stands higher has more water, ignoring how wide the container is.
- id: reads-lighter-as-heavier
  description: Answers the opposite question, giving the heavier side when asked which is lighter or the reverse.
