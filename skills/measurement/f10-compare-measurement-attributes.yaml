id: f10-compare-measurement-attributes
name: Compare measurement attributes
domain: measurement
year_level: ['1']
description: Given two objects or events and a stated attribute (length, mass, capacity or duration), determine which is greater, smaller, or that they are equal using direct comparison methods.
status: active
placement_eligible: false
prerequisites: [compare-lengths]
answer: mcq
sources:
- topic: compare_measurement_attributes
  params: {attr_pool: ["length", "mass"], equal_fraction: 0.0}
  difficulty: easy
  stages: [0, 1, 2]
- topic: compare_measurement_attributes
  params: {attr_pool: ["capacity", "duration"], equal_fraction: 0.0}
  difficulty: medium
  stages: [3, 4]
- topic: compare_measurement_attributes
  params: {attr_pool: ["length", "mass", "capacity", "duration"], equal_fraction: 0.333}
  difficulty: hard
  stages: [5, 6, maintenance]
misconceptions:
- id: swapped-comparison
  description: States the other direction of the comparison (that the second item is greater/smaller than the first, when the opposite is true).
- id: false-equality
  description: Chooses the equality option when the objects/events are not actually equal.
- id: denies-equality
  description: Chooses an inequality option when the objects/events are actually equal.
tags: [f10, measurement, comparison, length, mass, capacity, duration, acara-v9-year-1]
