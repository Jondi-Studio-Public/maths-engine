misconceptions:
- id: wrong-unit-scale
  description: Picks a unit one or more steps away on the metric mass ladder (mg, g, kg, t) from the object's own natural scale.
- id: picks-ten-times-too-large
  description: Selects the option that is exactly ten times the correct relation or equivalence value, as if an extra zero had been added.
- id: picks-ten-times-too-small
  description: Selects the option that is exactly one tenth of the correct relation or equivalence value, as if a zero had been dropped.
- id: picks-hundred-times-too-large
  description: Selects the option that is exactly a hundred times the correct relation or equivalence value, confusing how many ladder steps apart the two units are.
