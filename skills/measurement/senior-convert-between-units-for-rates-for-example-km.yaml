misconceptions:
- id: inverts-factor
  description: Multiplies by the reciprocal of the correct conversion factor.
- id: wrong-constant
  description: Uses 3 instead of 3.6 as the conversion constant.
- id: forgets-time-conversion
  description: Converts distance units but forgets to convert time units.
- id: forgets-distance-conversion
  description: Converts time units but forgets to convert distance units.
