id: senior-convert-between-units-for-rates-for-example-km
name: Convert between units for rates
domain: measurement
description: 'Given bounded, fully specified inputs, convert between units for rates; for example, km/h to m/s. Return the resulting value, expression, relation, or classification.'
status: active
placement_eligible: false
prerequisites: [convert-metric-length]
answer: number
sources:
