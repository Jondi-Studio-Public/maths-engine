id: senior-find-the-surface-area-of-pyramids-such-as
name: Find the surface area of pyramids, such as rectangular- and triangular-based pyramids
domain: measurement
year_level: ['12']
description: Given bounded, fully specified inputs, find the surface area of pyramids, such as rectangular- and triangular-based pyramids. Return the resulting value, expression, relation, or classification.
status: active
placement_eligible: false
prerequisites: [convert-metric-length]
answer: number
sources:
- topic: find_the_surface_area_of_pyramids_such_as
  params: {mode: square_base}
  difficulty: easy
  stages: [6]
- topic: find_the_surface_area_of_pyramids_such_as
  params: {mode: rectangular_base}
  difficulty: medium
  stages: [6]
- topic: find_the_surface_area_of_pyramids_such_as
  params: {mode: right_triangle_base}
  difficulty: hard
  stages: [6, maintenance]
- topic: find_the_surface_area_of_pyramids_such_as
  params: {mode: square_base_from_height}
  difficulty: exam
  stages: [exam]
misconceptions:
- id: omits_base
  description: Omits the base area and computes only the sum of the lateral triangular face areas.
- id: treats_triangle_as_full_rectangle
  description: Forgets the 1/2 factor on one or more triangular faces, treating them as full rectangles instead of triangles.
- id: no_half_factor_on_laterals
  description: Forgets the 1/2 factor when computing the areas of lateral triangular faces (computes base × height for each face instead of 1/2 × base × height).
- id: no_half_factor_on_all_faces
  description: Forgets the 1/2 factor on all faces, including the base when it is triangular (doubles every area).
- id: counts_only_two_of_four_lateral_faces
  description: Counts only two of the four congruent lateral faces when a square base pyramid has four identical triangular faces.
- id: swaps_which_slant_height_goes_with_which_edge
  description: Confuses which slant height corresponds to which pair of base edges (swaps the slant heights when computing lateral areas for different edges).
- id: omits_the_hypotenuse_face
  description: Omits the lateral triangular face corresponding to the hypotenuse edge of a right-triangle base.
- id: uses_apex_height_as_slant_height
  description: Given the pyramid's perpendicular (apex) height instead of a slant height, plugs it straight into the lateral-face formula without first deriving the slant height via Pythagoras (l = sqrt(h^2 + (s/2)^2)).
tags: [acara-senior-v8-4, measurement, surface-area, pyramids, acmem096]
