misconceptions:
- id: ignores_offset
  description: Never adds the time-zone offset when converting between zones.
- id: wrong_offset_direction
  description: Applies the offset in the wrong direction, subtracting twice instead of adding it.
- id: omits_layover
  description: Calculates the flight duration but forgets to add the connecting layover.
- id: forgets_midnight_wrap
  description: Fails to apply the day-boundary correction when arrival crosses midnight.
