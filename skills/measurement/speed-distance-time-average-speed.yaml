id: speed-distance-time-average-speed
name: Work with speed, distance and time and find an average speed
domain: measurement
description: Find a speed, a time or a distance when the time is in hours and minutes, and find the average speed over a journey
  in several legs, with or without a rest stop.
status: active
placement_eligible: false
