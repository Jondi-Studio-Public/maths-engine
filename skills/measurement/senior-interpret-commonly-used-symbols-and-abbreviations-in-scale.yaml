misconceptions:
- id: reads-the-neighbouring-room
  description: Gives the room next to the one that holds the symbol or label, because the symbol sits near a wall.
- id: wet-room-mixed-up
  description: Picks another wet area (bathroom, laundry, ensuite or toilet) when asked which room has the toilets symbol or a window, because they are all water rooms.
- id: fixture-label-paired-with-wrong-room
  description: Gives the room that holds a different fixture label, mixing up which abbreviation (DW, HWS, BIR) sits in which room.
- id: br-read-as-bathroom
  description: Reads BR as bathroom instead of bedroom, so the count is of the wrong rooms.
- id: counts-rooms-without-the-symbol
  description: Counts the rooms that lack the window symbol, or every room of that kind, instead of those that have it.
- id: shared-room-counted-twice
  description: Counts a room once for the toilets symbol and again for the hot water system when both are in the same room.
tags: [acara-senior-v8-4, measurement, grid_plan_symbols, acmem108, scale-drawings, symbols, abbreviations, floor-plans]
difficulty_progression:
  easy:
    steps: 1
    demand: "Find the room that has one symbol, or the one room without a window symbol, and name it in full."
  medium:
    steps: 2
    demand: "Decode a fixture abbreviation and name the room that holds it."
  hard:
    steps: 3
    demand: "Count rooms that need decoded rooms and symbols together, such as wet areas with a window."
  exam:
    steps: 6
    demand: "Chain a room found from two symbol conditions, a fixture room, a count of windows, a plumber's rooms from three fixtures and the charge for them."
