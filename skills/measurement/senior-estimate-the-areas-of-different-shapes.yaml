misconceptions:
- id: picks-ten-times-too-large
  description: Selects the option that is exactly ten times the plausible estimate, as if an extra zero had been added during unit conversion.
- id: picks-ten-times-too-small
  description: Selects the option that is exactly one tenth of the plausible estimate, as if a zero had been dropped during unit conversion.
- id: picks-hundred-times-too-large
  description: Selects the option that is exactly a hundred times the plausible estimate. In the micro-to-square-metres direction (a small object asked in square metres) this exactly matches the error of applying a linear x100 length-conversion factor instead of the correct squared x10 000 area factor; in the macro-to-square-centimetres direction the linear-factor error (x100) is not itself offered as an option, so the x100 distractor there is a plain order-of-magnitude misjudgement rather than that specific slip.
