id: senior-find-the-surface-area-of-familiar-solids-including
name: Find the surface area of familiar solids, including cubes, rectangular and triangular prisms, spheres and cylinders
domain: measurement
year_level: ['12']
description: Given bounded, fully specified inputs, find the surface area of familiar solids, including cubes, rectangular and triangular prisms, spheres and cylinders. Return the resulting value, expression, relation, or classification.
status: active
placement_eligible: false
prerequisites: [convert-metric-length]
answer: number
sources:
- topic: find_surface_area_of_familiar_solids
  params: {mode: cube}
  difficulty: easy
  stages: [6]
- topic: find_surface_area_of_familiar_solids
  params: {mode: rectangular_prism}
  difficulty: medium
  stages: [6]
- topic: find_surface_area_of_familiar_solids
  params: {mode: triangular_prism}
  difficulty: hard
  stages: [6, maintenance]
- topic: exd_x_m5_cylinder_surface_chain
  params: {tier: exam}
  difficulty: exam
  stages:
