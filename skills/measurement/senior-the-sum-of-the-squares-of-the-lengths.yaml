misconceptions:
- id: uses-linear-law
  description: Applies d1 + d2 = 2(a + b) (linear, never squared) instead of the real law d1^2 + d2^2 = 2(a^2 + b^2).
- id: forgets-factor-of-two
  description: Applies d1^2 + d2^2 = a^2 + b^2, dropping the factor of 2 that the real law requires.
- id: uses-sum-then-squares
  description: Computes (d1 + d2)^2 instead of d1^2 + d2^2 when solving for an unknown side.
- id: forgets-unit-conversion
  description: Uses a stated length as if it were already in the target unit, or reports the final answer in the wrong unit's numeral, instead of converting before or after applying the law.
