id: f10-capacity-mass-informal-units
name: Compare and total capacity and mass in informal units
domain: measurement
year_level:
- '2'
naplan_domain:
- measurement
description: 'Compare and combine capacities counted in cups or scoops and masses balanced against blocks or marbles: how
  many more, how many altogether, how many are still needed to fill a container, and, with a big unit that is several small
  ones, the count in the smaller unit.'
status: active
placement_eligible: false
prerequisites:
- f10-compare-order-measure-attributes
answer: number
