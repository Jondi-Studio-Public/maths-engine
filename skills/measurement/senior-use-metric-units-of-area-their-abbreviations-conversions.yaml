misconceptions:
- id: uses-linear-factor
  description: Applies the linear length factor instead of its square (e.g. multiplies/divides by 100 instead of 10,000 when converting cm²<->m²).
- id: conversion-direction
  description: Multiplies when it should divide, or divides when it should multiply, when converting between two area units.
- id: forgets-to-convert
  description: Combines two stated areas given in different units directly, without converting either one first (hard tier only).
- id: converts-wrong-operand
  description: Converts the operand that was already stated in the target unit instead of the one that actually needed converting (hard tier only).
