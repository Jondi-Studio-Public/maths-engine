id: cone-volume
name: Find the volume of a cone
domain: measurement
description: Given bounded, fully specified inputs (radius or diameter, and height or slant height), use V = (1/3) x pi x r^2 x h to find a cone's volume.
status: active
placement_eligible: false
prerequisites: [senior-use-formulas-to-find-the-volume-of-pyramids]
answer: number
