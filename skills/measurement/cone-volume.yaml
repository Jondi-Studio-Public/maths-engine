misconceptions:
- id: omits_one_third_factor
  description: Treats the cone as a cylinder, computing pi x r^2 x h without applying the 1/3 factor.
- id: uses_diameter_as_radius
  description: Uses a given diameter directly in the formula instead of halving it to the radius first. Not applicable to the easy tier, where the radius is already given directly.
- id: squares_wrong_dimension
  description: Squares the height instead of the radius when computing the volume.
- id: uses_slant_height_as_height
  description: Uses the given slant height directly as the height instead of deriving the height via Pythagoras (hard tier only, where the height is not given directly).
tags: [measurement, volume]
