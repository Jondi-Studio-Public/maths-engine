id: whole-units-needed-round-up-down
name: Whole units needed (round up) or made (round down) in real situations
domain: measurement
year_level: ['11', '12']
description: Decide from the situation whether a quotient must be rounded up (whole packs, trips or tickets needed) or down (full groups or items that can be made, carried or fitted), then use the whole-number count to find a cost, a leftover or the cheapest purchase.
status: active
placement_eligible: false
prerequisites:
- f10-division-remainder-context
answer: number
sources:
