misconceptions:
- id: applied-a-tenfold-factor
  description: Multiplies the stated volume by 100 instead of applying the given exact 1:1 relation.
- id: applied-a-litres-style-factor
  description: Multiplies the stated volume by 1000 (a mL-to-L-style factor), where the given relation is exact 1:1.
- id: applied-the-cubic-linear-factor
  description: Multiplies by 1,000,000 (the m^3-to-cm^3 factor) instead of applying the given exact 1:1 relation.
- id: reported-the-intermediate-unit
  description: On the hard tier, reports the value after only the first named equivalence (mL or m^3) instead of continuing the metric-ladder step to reach mL/kL.
- id: used-a-litres-style-ladder-step
  description: On the hard tier, scales by 1000 (a mL-to-L-style factor) instead of the correct 1,000,000 mL-to-kL ladder step.
- id: used-a-hundred-fold-ladder-step
  description: On the hard tier, scales by 10,000 instead of the correct 1,000,000 mL-to-kL ladder step.
- id: used-only-one-container
  description: On the exam tier, reports only one container's own converted capacity instead of the combined total of both containers.
- id: forgot-the-ladder-step-on-one-container
  description: On the exam tier, adds the two containers' raw stated numbers directly, forgetting the metric-ladder scaling step one of them still needs after its own named equivalence is applied.
- id: reported-only-one-quantity-medium
  description: On the medium tier, reports only one of the two separately-stated quantities (the initial figure or the added figure) instead of their combined total.
- id: reported-the-difference-instead-of-the-total-medium
  description: On the medium tier, subtracts the two separately-stated quantities instead of adding them.
