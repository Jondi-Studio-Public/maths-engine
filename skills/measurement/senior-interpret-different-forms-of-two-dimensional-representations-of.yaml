misconceptions:
- id: reads-the-view-from-the-wrong-side
  description: "Reads the columns from the back, the right or the left of the stack instead of the front, so the heights come out in the wrong order or the wrong number."
- id: picks-a-net-by-looks
  description: "Calls any drawing of six joined squares a net, without folding it: a two by two block or a long row cannot fold into a cube."
- id: surface-area-of-some-faces
  description: "Gives the area of the four side faces, or of one face of each pair, as the surface area of the box."
- id: volume-for-surface-area
  description: "Gives the volume where the surface area is asked, or the surface area or a sum of lengths where the volume is asked."
