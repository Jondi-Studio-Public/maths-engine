misconceptions:
- id: mirrored-view
  description: Draws the view reversed left to right, for example by reading the columns from the wrong end when standing at the back or at a side.
- id: wrong-side-view
  description: Draws the view from a different side, such as the left view for the right view or the front view for the back view.
- id: column-cell-missing
  description: Leaves out a cell, for example a cube in the tallest column or a whole column that the view should show.
- id: extra-cell-drawn
  description: Draws a cell too many, counting a cube that is hidden behind another or is not in line with the view.
- id: copies-the-given-view
  description: When given the view from one side, draws that same view instead of the view from the opposite side.
- id: upside-down-view
  description: Draws the columns hanging from the top row instead of standing on the ground row.
tags: [acara-senior-v8-4, measurement, grid_elevation_views, acmem114, elevation-views, cube-stacks, drawn-answer]
difficulty_progression:
  easy:
    steps: 2
    demand: "Draw the front view of a stack of unit cubes from its isometric picture."
  medium:
    steps: 3
    demand: "Draw the right or left view of a stack."
  hard:
    steps: 4
    demand: "Draw the back view, or work back from one view to the view from the opposite side."
  exam:
    steps: 5
    demand: "Read the column heights of the front and right-side views of a stack from its picture, then count the squares in the front view and the view from above. The draw form is not set in the exam tier."
