misconceptions:
- id: omits_half_factor
  description: Treats the triangular prism like a rectangular prism, multiplying base × height × length without halving for the triangle.
- id: uses_slant_side
  description: Uses the slant side of the triangle instead of the perpendicular height in area calculations.
