misconceptions:
- id: uses-linear-or-squared-factor
  description: 'Applies the linear length factor (10, 100) or its square (100, 10,000) instead of the cube (1,000, 1,000,000) when converting between volume units (e.g. multiplies/divides by 10 or 100 instead of 1,000 when converting mm³ and cm³; multiplies/divides by 1,000 or 1,000,000 instead of 1,000,000,000 when converting cm³ and m³ -- note: the mm³ and m³ pair is excluded entirely).'
- id: conversion-direction
  description: Multiplies when it should divide, or divides when it should multiply, when converting between two volume units.
- id: forgets-to-convert
  description: Combines two stated volumes given in different units directly, without converting either one first.
- id: converts-wrong-operand
  description: Converts the operand that was already stated in the target unit instead of the one that actually needed converting.
