id: f10-scale-drawing-floor-plans
name: Find real lengths and areas from a scale floor plan
domain: measurement
description: Given a floor plan drawn to scale with some lengths marked in centimetres and its scale as a ratio, find a real wall length, the real floor area of a room (each length is scaled, so the area grows by the square of the ratio), and, for an L-shaped plan with two sides unmarked, the real floor area or perimeter. The exam chain goes from a marked plan to two real wall lengths, the floor area and a tile count.
status: active
capability_gates: [figure_stimulus]
needs_figure: true
placement_eligible: false
prerequisites:
- f10-direct-proportion-scale-model
- rectangle-area
answer: number
