misconceptions:
- id: counts-the-lengths-not-the-edges
  description: "Gives the number of lengths that match, 1, 2 or 3, instead of the number of edges, which come four to a length."
- id: miscounts-square-faces
  description: "Takes the faces to be squares because the end looks square, or counts the faces of a different type or pair."
- id: forgets-a-base-or-confuses-counts
  description: "Leaves out a base when counting the faces of a prism or pyramid, or gives the number of faces when asked for edges or vertices."
- id: counts-every-pair-as-a-diagonal
  description: "Counts the sides, or every pair of vertices, or forgets that each diagonal joins two vertices, when counting diagonals."
- id: misremembers-eulers-rule
  description: "Adds the faces and vertices and forgets to take away 2, or takes edges from faces and vertices the wrong way round."
- id: misreads-the-base-from-the-count
  description: "Takes the number of edges, faces or vertices of a prism or pyramid to be the number of sides of its base."
tags: [acara-senior-v8-4, measurement, geometric-shapes, solids, faces-edges-vertices, acmem105]
difficulty_progression:
  easy:
    steps: 2
    demand: "Read the three lengths of a cuboid from its picture and count edges or faces by length or area."
  medium:
    steps: 2
    demand: "Count the faces, edges or vertices of a named prism or pyramid, or the diagonals of a polygon."
  hard:
    steps: 3
    demand: "Work back from one count of faces, edges or vertices to another using Euler's rule or the shape of the base."
  exam:
    steps: 6
    demand: "Chain the edges of one length, the volume and the surface area of a cuboid from its picture, then the cost of painting it."
