id: convert-imperial-length
name: Convert between imperial lengths and between imperial and metric
domain: measurement
description: Convert lengths between inches, feet, yards, miles and nautical miles, and between those and metric units, using
  conversion factors that are given in the question.
status: active
placement_eligible: false
prerequisites:
- convert-metric-length
- decimal-arithmetic
answer: number
