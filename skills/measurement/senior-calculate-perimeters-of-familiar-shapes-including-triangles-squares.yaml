misconceptions:
- id: uses-area-formula
  description: Multiplies two of the shape's dimensions together (an area computation) instead of summing every side.
- id: omits-a-side
  description: Drops one side from the polygon or composite sum, undercounting the perimeter.
- id: double-counts-shared-edge
  description: Adds the full perimeter of each sub-shape in a composite separately, counting the internal shared edge between them twice instead of excluding it entirely.
