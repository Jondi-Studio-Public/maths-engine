misconceptions:
- id: mistakes-a-large-bound-for-non-integrable
  description: Picks "the bound is not integrable" when every stated bound value is finite -- on this finite sample space with counting measure a finite list of finite values is always integrable, so this option is never correct.
- id: checks-only-last-term
  description: Compares only the very last function value to the previous one instead of the whole stated tail, missing an earlier instability.
- id: domination-checked-at-one-point-only
  description: Confirms the bound holds at one sample point and assumes it holds everywhere, missing a violation at another stated point.
