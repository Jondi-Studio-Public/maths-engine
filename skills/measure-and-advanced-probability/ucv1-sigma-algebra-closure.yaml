misconceptions:
- id: checks-complement-only
  description: Confirms every set's complement is present but never checks that pairwise unions stay in the family, so a family that fails union is misclassified as closed under both.
- id: checks-union-only
  description: Confirms every pairwise union stays in the family but never checks each set's complement, so a family that fails complement is misclassified as closed under both.
- id: misses-near-miss-complement
  description: On the hard and exam tiers, where the extra set differs from a legitimate family member by exactly one element, assumes that near-identical set is itself present (or its complement is) without checking element by element, so a near-miss failure is missed.
