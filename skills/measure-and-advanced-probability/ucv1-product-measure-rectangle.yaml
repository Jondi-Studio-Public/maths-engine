misconceptions:
- id: sums-instead-of-multiplies
  description: Adds mu(A) and nu(B) instead of multiplying them.
- id: forgets-one-factor
  description: Reports mu(A) or nu(B) alone, forgetting to multiply by the other factor.
- id: uses-whole-spaces
  description: Uses the total measure of X and Y instead of the stated subsets A and B.
- id: double-counts-overlap
  description: On the exam tier, where A is presented as a union of two overlapping index lists, sums the overlapping element's weight twice instead of once.
