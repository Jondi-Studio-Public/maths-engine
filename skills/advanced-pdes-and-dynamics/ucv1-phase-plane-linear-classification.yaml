misconceptions:
- id: stability-flip
  description: Reads the node/spiral TYPE correctly but gets the stability sign wrong (e.g. calls a stable node unstable).
- id: real-complex-confusion
  description: Miscomputes the sign of the discriminant T^2 - 4D, confusing a node for a spiral (or vice versa) while keeping the correct stability sign.
- id: saddle-confusion
  description: Mistakes the sign of the determinant D, calling a saddle a node or a node a saddle.
