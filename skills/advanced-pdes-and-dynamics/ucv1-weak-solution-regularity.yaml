misconceptions:
- id: assumes-no-regularity-gain
  description: Gives the solution the same Sobolev order as the data, as if solving the equation did not gain derivatives.
- id: under-counts-the-regularity-gain
  description: Gains only one derivative for a second-order equation, or fewer than the order of the equation in general.
- id: over-counts-the-regularity-gain
  description: Gains more derivatives than the order of the equation allows.
- id: loses-regularity-when-solving
  description: Gives the solution less regularity than the data, as if solving the equation cost derivatives.
- id: uses-the-second-order-gain-for-the-fourth-order-equation
  description: Gains two derivatives for the fourth-order beam equation, which gains four.
