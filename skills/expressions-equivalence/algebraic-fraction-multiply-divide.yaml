misconceptions:
- id: forgot-to-invert
  description: On a divide question (medium, hard and exam tiers -- not exercisable on the easy tier, which is
    multiply-only), multiplies the second fraction straight through instead of inverting it first, leaving a
    variable at a higher, un-cancelled power instead of the correct combination.
- id: dropped-a-variable-power
  description: Cancels a variable's power fully when it should instead combine/subtract exponents correctly --
    on the single-variable tiers (easy, medium), fails to cancel the shared variable at all and leaves it in
    the answer; on the two-variable tiers (hard, exam), treats the surviving variable as if it also cancelled
    completely instead of combining to its true power.
- id: coefficient-not-reduced
  description: Correct variable part, but the numeric coefficient carries an extra un-cancelled factor left
    over from one fraction's own internal common factor -- a genuinely different rational number from the
    correct coefficient, not merely an unreduced spelling of the same value.
