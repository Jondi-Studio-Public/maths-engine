id: algebraic-fraction-multiply-divide
name: Multiply and divide algebraic fractions
domain: expressions-equivalence
description: Multiply or divide two (exam tier, up to three) algebraic fractions and reduce to a single term.
  Every draw is confined so the fully-cancelled answer is always a monomial numerator (a coefficient and, at
  most, one surviving variable power) over a bare positive integer denominator -- it never itself contains a
  fraction inside a fraction or a leftover bracket (an exam-style item).
