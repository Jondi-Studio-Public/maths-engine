id: simplify-algebraic-fractions
name: Simplify algebraic fractions
domain: expressions-equivalence
description: Cancel a trinomial numerator by one of its own linear factors -- the denominator -- to leave the
  other factor as a bare polynomial. Every draw is confined so the reduced result never itself contains a
  fraction; simplifying to a result that is still a fraction is out of scope.
status: active
placement_eligible: false
prerequisites:
- difference-of-squares
- factor-common-numerical-factor
- solve-quadratics-factorable
answer: expression
