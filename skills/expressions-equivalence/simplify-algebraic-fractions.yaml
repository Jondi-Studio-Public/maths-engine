misconceptions:
- id: sign-error
  description: On an easy difference-of-squares question, states the denominator's own factor back instead of
    the other root's factor -- there are only two linear factors total, so this is the "cancelled to the wrong
    root" confusion.
- id: constant-off-by-one
  description: On an easy difference-of-squares question, keeps the correct sign but states a constant one
    more than the true root, e.g. x - 6 instead of x - 5.
- id: copied-denominator
  description: On a medium monic-trinomial question, states the denominator's own factor as the answer -- a
    "cancelled the whole fraction to 1" confusion.
- id: sign-error-in-constant
  description: On a medium or hard question, flips the sign of the answer's own constant term, e.g. x + 6
    instead of x - 6.
- id: dropped-leading-coefficient
  description: On a hard non-monic-trinomial question, states the correct constant but with leading
    coefficient 1 instead of the true non-unit coefficient, e.g. x + 9 instead of 4x + 9.
