id: recognise-equivalent-expressions
name: Recognise and justify equivalent expressions
domain: expressions-equivalence
year_level:
- '7'
- '8'
description: Decide whether expressions are equivalent by expanding and collecting terms, find the expression that is or
  is not equivalent, and recognise that a match at one value does not prove equivalence.
status: active
placement_eligible: false
prerequisites:
- simplify-multi-operation-expressions
- apply-a-rule-to-inputs
answer: mcq
