misconceptions:
- id: only-multiplied-first-terms
  description: Distributes the binomial's leading x across the second factor but drops the second binomial term's
    own distribution entirely -- a partial expansion.
- id: sign-error-on-one-term
  description: Flips the sign of exactly one of the second factor's original terms before distributing.
- id: dropped-cross-term
  description: At medium tier and above (a binomial x binomial has no cross term to drop), omits the xy monomial
    entirely from the final answer.
