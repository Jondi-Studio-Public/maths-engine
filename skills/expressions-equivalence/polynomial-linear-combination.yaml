id: polynomial-linear-combination
name: Combine polynomials with fixed multipliers
domain: expressions-equivalence
description: Given three single-variable polynomials P, Q and R and three fixed integer multipliers, find
  m1*P + m2*Q - m3*R (the first two additive, the last subtractive, matching the assessment's own worked
  example 2P + 3Q - 5R). The skill is coefficient handling under a nontrivial multiplier on every polynomial,
  escalating to three nontrivial multipliers together with the same degree-alignment trap as
  add-subtract-polynomials. answer_form="expanded" is required on every question. Known, disclosed grading
  gap -- the grader does not currently reject an uncombined-like-terms typed answer, because sympy combines
  terms at parse time; out of scope here. The exam source is
  genuinely two-variable P, Q, R (xy, x^2, y^2 and lower-degree/constant terms), multipliers up to 5, and the
  subtracted slot itself varies across P/Q/R rather than always being fixed -- a real escalation in kind over
  hard (which terms are "like" now depends on BOTH exponents, not one), not just bigger numbers.
