misconceptions:
- id: sign-error-on-subtraction
  description: Does not distribute the minus sign across the subtracted polynomial's terms -- computes
    m1*P + m2*Q + m3*R instead of m1*P + m2*Q - m3*R. At the exam source, "the subtracted polynomial" is
    whichever of P, Q, R the question drew as negative (not always R).
- id: linear-combination-only
  description: Uses multiplier 1 for every polynomial regardless of the drawn multipliers -- computes
    P + Q - R when the question asked for m1*P + m2*Q - m3*R. Exercisable whenever any multiplier is not 1,
    which is every question in this skill (fixed at (2, 1, 1) even at easy tier).
- id: coefficient-drop
  description: At hard tier and the exam source, one polynomial is missing a power (by degree, or -- at the
    exam source's genuinely two-variable P, Q, R -- one specific exponent pair among x^2, xy, y^2) that
    another has. Treats that missing coefficient as if it also carried the nonzero coefficient from a
    neighbouring position, instead of zero, before the multiplier is applied. Only exercisable at hard tier
    and the exam source, where a missing power/monomial is forced on every question.
