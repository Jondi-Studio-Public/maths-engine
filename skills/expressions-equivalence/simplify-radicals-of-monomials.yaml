misconceptions:
- id: wrong-root-index
  description: Applies the wrong root's divisor to a variable's own exponent -- halves the cube-root radicand's
    exponent instead of dividing it by 3, and thirds the square-root radicand's exponent instead of halving it --
    while leaving the coefficient correctly extracted.
- id: forgot-the-divide
  description: Reports the cube-root part's own simplification alone, never applying the square root divisor at
    all -- both the coefficient and every variable's exponent are left at their un-divided cube-root value.
- id: sign-or-placement-error
  description: On a hard or exam question (the only tiers with a denominator variable at all), places the one
    variable that belongs under the fraction bar into the numerator instead.
