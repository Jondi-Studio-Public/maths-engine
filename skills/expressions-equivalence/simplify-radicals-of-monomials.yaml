id: simplify-radicals-of-monomials
name: Simplify a quotient of radicals of monomials
domain: expressions-equivalence
description: Simplify a cube root of a monomial divided by a square root of a monomial (an exam-style item)
  to a bare monomial fraction -- a coefficient, zero or more numerator variable powers, and at most one
  denominator variable power. Every question is constructed so every coefficient is a perfect power and every
  exponent divides its own root index exactly (forward construction, the answer is drawn
  first, then the two radicands are raised from it). Every variable in this skill's questions represents a
  positive quantity -- this scope is required so the cube/square root extraction is unambiguous (the same scope
  simplify-algebraic-fractions' own description discloses for its own reduction step); this skill's grading
  itself never relies on that assumption, since the final canonical answer never contains a root.
