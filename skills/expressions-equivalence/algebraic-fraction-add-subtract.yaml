id: algebraic-fraction-add-subtract
name: Add and subtract algebraic fractions
domain: expressions-equivalence
description: Combine two (exam tier, up to three) algebraic fractions with a single-variable linear numerator
  over an integer denominator into one fraction over a common denominator. Every draw is confined so a
  genuine LCD (not the naive product of the denominators) is required from the hard tier up, and so the
  combined x-coefficient never cancels to zero (an exam-style item).
