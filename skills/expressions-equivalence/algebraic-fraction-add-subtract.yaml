misconceptions:
- id: common-denominator-error
  description: States the answer over the PRODUCT of the denominators instead of the true lowest common
    denominator, keeping the correctly-scaled numerator but the wrong (larger) working denominator. Only
    exercisable on the hard and exam tiers, where the product genuinely exceeds the LCD -- on easy/medium the
    denominators are coprime, so the product already equals the LCD and this would be a coincidental duplicate
    of the correct answer, so it is never offered there.
- id: forgot-to-distribute-the-sign
  description: On a subtraction, applies the "-" to the second (or third) fraction's x-term but not its
    constant term, leaving that constant with the wrong sign. Not exercisable on the easy tier, which is
    addition-only.
- id: added-denominators
  description: States the answer over the SUM of the denominators, d1 + d2 (+ d3), instead of the true common
    denominator -- a genuinely different value on every tier.
