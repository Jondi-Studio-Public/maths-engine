misconceptions:
- id: sign-error-on-subtraction
  description: Does not distribute the minus sign across the subtracted polynomial's terms -- computes
    A + B + C instead of A + B - C. At the exam source's nested-bracket template (P - (Q + R)), the same trap
    is failing to distribute the minus into the bracket at all -- computes P + Q + R.
- id: swapped-subtracted-term
  description: Subtracts the wrong named polynomial -- computes A - B + C instead of A + B - C, as if B
    rather than C were the one being subtracted. At the exam source's nested-bracket template, the same trap
    is distributing the minus onto only the first bracketed term -- computes P - Q + R, as if only Q (not R)
    were part of what is being subtracted.
- id: coefficient-drop
  description: At hard tier and the exam source, one polynomial is missing a power (by degree, or -- at the
    exam source's genuinely two-variable A, B, C / P, Q, R -- one specific exponent pair among x^2, xy, y^2)
    that another has. Treats that missing coefficient as if it also carried the nonzero coefficient from a
    neighbouring position, instead of zero -- a learner who aligns terms by printed POSITION rather than by
    DEGREE (or exponent pair) gets the wrong coefficient there. Only exercisable at hard tier and the exam
    source, where a missing power/monomial is forced on every question.
