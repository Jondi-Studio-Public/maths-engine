id: add-subtract-polynomials
name: Add and subtract polynomials
domain: expressions-equivalence
description: Given three single-variable polynomials A, B and C, find A + B - C by aligning and combining
  coefficients term by term BY DEGREE, not by printed position. The skill is coefficient handling and term
  alignment, never degree itself. answer_form="expanded" is required on every question -- a bracketed or
  uncombined-form answer must be rejected. Known, disclosed grading gap -- the grader does not currently reject
  an uncombined-like-terms typed answer (e.g. "3x^2 + 5x - 3x - 5" for "3x^2 + 2x - 5"), because sympy combines
  terms at parse time; out of scope here. The exam source is
  genuinely two-variable (xy, x^2, y^2 and lower-degree/constant terms), one of two shapes per question --
  P - (Q + R), a NESTED bracket distributing the subtraction across a bracketed sum of two polynomials, or the
  same A + B - C shape in two variables -- a real escalation in kind over hard, not just bigger numbers.
