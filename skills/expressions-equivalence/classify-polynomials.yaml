id: classify-polynomials
name: Classify polynomials by degree and term count
domain: expressions-equivalence
description: Given a polynomial, state its degree and whether it is a monomial, binomial or trinomial; given an expression that may not be a polynomial, identify which of three violations (negative exponent, fractional exponent, variable in the denominator) rules it out.
