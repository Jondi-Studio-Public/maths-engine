id: difference-of-squares
name: Expand or factorise special products
domain: expressions-equivalence
description: Recognise and apply the special products a^2 - b^2, (a + b)^2 and (a - b)^2 by pattern -- both
  expanding and factorising -- without multiplying out term by term or general trinomial factorising.
