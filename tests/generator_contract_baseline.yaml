# Shrink-only baselines for tests/test_generator_contract.py, in the style of skill_contract_baseline.yaml: an entry
# must still apply, so a fixed generator drops off its list (the test fails until it does) and a new violation can
# never join one unnoticed.
#
# unknown_tier   generators with a `tier` parameter that do not raise ValueError for an unknown tier (reason: what
#                they do instead). The shared test holds every other tier-taking generator to ValueError.
# unwired        exd_*/exam_* generators with an exam preset that no skill uses as its exam source.
# answer_space   topic -> [distinct answers at least, commonest answer at most], over 300 exam-tier seeds, for the
#                topics whose composed answer takes fewer than 100 values or repeats more than 5% of the time. Set
#                to 80% of the distinct count and 125% of the commonest count measured by that script, so a
#                regeneration that shuffles a few draws does not trip them but a real narrowing does.
# exam_params_deviations   topic -> params of the exam source of an exd_*/exam_* generator whose params are not
#                {"tier": "exam"} (the generator takes no tier, or the preset supplies it).
#
# Regenerated, never hand-edited: scripts/generator_contract_baseline.py --write (--check says if it is stale).

